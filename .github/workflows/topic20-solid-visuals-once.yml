name: Topic20 solid visuals once

on:
  push:
    branches:
      - topic20-solid-geometry-visuals-v1

permissions:
  contents: write

jobs:
  apply-and-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: topic20-solid-geometry-visuals-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply Topic 20 solid-geometry visuals
        run: python topic20_solid_visuals_apply_temp.py

      - name: Validate six SVG files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = [
              '20-hinh-hop-chu-nhat.svg',
              '20-lang-tru-dung.svg',
              '20-hinh-chop-deu.svg',
              '20-hinh-tru.svg',
              '20-hinh-non.svg',
              '20-hinh-cau.svg',
          ]
          base = Path('docs/assets/geometry/20')
          ns = {'svg': 'http://www.w3.org/2000/svg'}
          for name in files:
              root = ET.parse(base / name).getroot()
              title = root.find('svg:title', ns)
              desc = root.find('svg:desc', ns)
              assert title is not None and (title.text or '').strip(), name
              assert desc is not None and (desc.text or '').strip(), name
          print('6 SVG: XML/title/desc PASS')
          PY

      - name: Verify lesson integration
        shell: bash
        run: |
          for f in 20-hinh-hop-chu-nhat 20-lang-tru-dung 20-hinh-chop-deu 20-hinh-tru 20-hinh-non 20-hinh-cau; do
            grep -q "$f.svg" docs/kien-thuc/20-hinh-hoc-tong-hop/index.md
          done

      - name: Audit structure
        run: python audit_content_structure.py --write

      - name: Validate Practice Banks
        run: python validate_practice_bank.py

      - name: Roadmap dependency and link QA
        run: python check_roadmap_dependencies.py

      - name: SVG integrity QA
        run: python check_svg_integrity.py

      - name: Audit Practice quality
        run: python audit_practice_quality.py

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Strict MkDocs build
        run: mkdocs build --strict

      - name: Commit Topic 20 integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/kien-thuc/20-hinh-hoc-tong-hop/index.md docs/roadmap/audit-noi-dung-25-chuyen-de.md
          if git diff --cached --quiet; then
            echo "No integration changes."
            exit 0
          fi
          git commit -m "Gắn hình minh họa công thức hình khối vào Chuyên đề 20"
          git push origin "HEAD:${GITHUB_REF_NAME}"
