name: Topic21 chart visuals once

on:
  push:
    branches:
      - topic21-chart-visuals-v1
    paths:
      - topic21_chart_visuals_apply_temp.py
      - .github/workflows/topic21-chart-visuals-once.yml

permissions:
  contents: write

jobs:
  apply-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: topic21-chart-visuals-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply Topic 21 chart visuals
        run: python topic21_chart_visuals_apply_temp.py
      - name: Validate five SVG files
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files = [
              '21-bieu-do-cot-cau-truc.svg',
              '21-bieu-do-doan-thang-xu-huong.svg',
              '21-bieu-do-cot-kep.svg',
              '21-bieu-do-quat-tron.svg',
              '21-du-lieu-ghep-nhom.svg',
          ]
          base = Path('docs/assets/statistics/21')
          for name in files:
              root = ET.parse(base / name).getroot()
              tags = {el.tag.split('}')[-1] for el in root.iter()}
              assert 'title' in tags and 'desc' in tags, name
          print('PASS: 5 SVG hợp lệ và có title/desc')
          PY
      - name: Verify lesson integration
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('docs/kien-thuc/21-thong-ke/index.md').read_text(encoding='utf-8')
          refs = [
              '21-bieu-do-cot-cau-truc.svg',
              '21-bieu-do-doan-thang-xu-huong.svg',
              '21-bieu-do-cot-kep.svg',
              '21-bieu-do-quat-tron.svg',
              '21-du-lieu-ghep-nhom.svg',
          ]
          for ref in refs:
              assert text.count(ref) == 1, (ref, text.count(ref))
          print('PASS: 5 hình được gắn đúng một lần vào index.md')
          PY
      - name: Audit structure
        run: python audit_content_structure.py --write
      - name: Validate Practice Banks
        run: python validate_practice_bank.py
      - name: Roadmap dependency and link QA
        run: python check_roadmap_dependencies.py
      - name: SVG integrity QA
        run: python check_svg_integrity.py
      - name: Audit Practice quality
        run: python audit_practice_quality.py
      - name: Install MkDocs
        run: pip install 'mkdocs==1.6.1' 'mkdocs-material==9.7.7'
      - name: Strict MkDocs build
        run: python -m mkdocs build --strict
      - name: Diff check
        run: git diff --check
      - name: Commit Topic 21 integration
        run: |
          git config user.name 'TMA2015'
          git config user.email '143519853+TMA2015@users.noreply.github.com'
          git add docs/kien-thuc/21-thong-ke/index.md
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
          else
            git commit -m 'Gắn hình minh họa biểu đồ vào Chuyên đề 21'
            git push origin HEAD:topic21-chart-visuals-v1
          fi
