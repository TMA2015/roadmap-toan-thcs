name: UX audit apply once

on:
  push:
    branches:
      - ux-audit-site-v1
    paths:
      - ux_audit_apply_temp.py
      - .github/workflows/ux-audit-apply-once.yml

permissions:
  contents: write

jobs:
  apply-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-audit-site-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply UX changes
        run: python ux_audit_apply_temp.py
      - name: Validate Practice Banks
        run: python validate_practice_bank.py
      - name: Audit content structure
        run: python audit_content_structure.py --write
      - name: Roadmap dependency and link QA
        run: python check_roadmap_dependencies.py
      - name: SVG integrity QA
        run: python check_svg_integrity.py
      - name: Visual coverage audit
        run: python audit_visual_coverage.py
      - name: Audit curated Practice quality
        run: python audit_practice_quality.py
      - name: Install MkDocs
        run: pip install 'mkdocs==1.6.1' 'mkdocs-material==9.7.7'
      - name: Strict MkDocs build
        run: python -m mkdocs build --strict
      - name: Diff check
        run: git diff --check
      - name: Verify UX changes
        run: |
          python - <<'PY'
          from pathlib import Path
          yml = Path('mkdocs.yml').read_text(encoding='utf-8')
          idx = Path('docs/kien-thuc/index.md').read_text(encoding='utf-8')
          assert 'navigation.expand' not in yml
          assert '      - Công cụ nội bộ:' in yml
          assert '## Lộ trình học gợi ý' in idx
          assert '## Thứ tự biên soạn ưu tiên' not in idx
          print('UX checks: PASS')
          PY
      - name: Commit product changes
        run: |
          git config user.name 'TMA2015'
          git config user.email '143519853+TMA2015@users.noreply.github.com'
          git add mkdocs.yml docs/kien-thuc/index.md docs/roadmap/audit-noi-dung-25-chuyen-de.md
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
          else
            git commit -m 'Gọn navigation và lộ trình học cho vòng UX'
            git push origin HEAD:ux-audit-site-v1
          fi
