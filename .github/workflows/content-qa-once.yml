name: Content completion QA

on:
  push:
    branches:
      - content-audit-25-topics-v1

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content-audit-25-topics-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Regenerate content audit
        run: python audit_content_structure.py --write

      - name: Validate Practice Banks
        run: python validate_practice_bank.py

      - name: Roadmap dependency and link QA
        run: python check_roadmap_dependencies.py

      - name: Check SVG integrity
        run: python check_svg_integrity.py

      - name: Audit practice quality
        run: python audit_practice_quality.py

      - name: Strict MkDocs build
        run: mkdocs build --strict

      - name: Commit refreshed audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/audit-noi-dung-25-chuyen-de.md
          if git diff --cached --quiet; then
            echo "Audit report unchanged."
            exit 0
          fi
          git commit -m "Cập nhật báo cáo audit sau đợt chuẩn hóa 02-07"
          git push origin "HEAD:${GITHUB_REF_NAME}"
