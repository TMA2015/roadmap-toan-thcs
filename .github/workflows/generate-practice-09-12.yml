name: Generate Practice Banks 09-12

on:
  push:
    branches:
      - feature/topics09-12-practice-banks-v1
    paths:
      - tools/practice-batch-09-12/**
      - .github/workflows/generate-practice-09-12.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Diagnose compressed payloads
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path

          root = Path('tools/practice-batch-09-12')
          expected_lengths = {'09': 6432, '10': 5940, '11': 6404, '12': 6084}
          expected_sha = {'09': 'a5ec4da11253', '10': 'd0aae5c54db8', '11': 'ba2a4834e405', '12': 'effc432a235e'}
          failed = False
          for topic in ('09', '10', '11', '12'):
              text = (root / f'{topic}.json.gz.b64').read_text(encoding='utf-8').strip()
              print(f'{topic}: base64_len={len(text)} expected={expected_lengths[topic]}')
              try:
                  raw = gzip.decompress(base64.b64decode(text, validate=True))
                  digest = hashlib.sha256(raw).hexdigest()[:12]
                  print(f'{topic}: raw_len={len(raw)} sha256={digest} expected_sha={expected_sha[topic]}')
                  if digest != expected_sha[topic]:
                      failed = True
              except Exception as exc:
                  failed = True
                  print(f'{topic}: DECODE ERROR: {type(exc).__name__}: {exc}')
          if failed:
              raise SystemExit('One or more payloads do not match the intended source.')
          PY

      - name: Generate static Practice Banks
        run: python tools/practice-batch-09-12/generate_banks.py

      - name: Validate all Practice Banks
        run: python validate_practice_bank.py

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/data/practice/09-he-phuong-trinh-v1*.json
          git add docs/assets/data/practice/10-ham-so-do-thi-v1*.json
          git add docs/assets/data/practice/11-can-thuc-v1*.json
          git add docs/assets/data/practice/12-phuong-trinh-bac-hai-viete-v1*.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Sinh 480 câu Practice Bank cho Chuyên đề 09-12"
          git push origin "HEAD:${GITHUB_REF_NAME}"
