name: Manual academic audit 02-07 once

on:
  push:
    branches:
      - content-manual-audit-02-07-v1

permissions:
  contents: write

jobs:
  apply-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content-manual-audit-02-07-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply manual audit changes
        run: python manual_audit_02_07_apply_temp.py

      - name: Audit structure
        run: python audit_content_structure.py --write

      - name: Validate Practice Banks
        run: python validate_practice_bank.py

      - name: Roadmap dependency and link QA
        run: python check_roadmap_dependencies.py

      - name: Audit Practice quality
        run: python audit_practice_quality.py

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Strict MkDocs build
        run: mkdocs build --strict

      - name: Commit audited content
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/kien-thuc/02-so-va-phep-tinh/index.md \
            docs/kien-thuc/03-ti-le-ti-le-thuc/index.md \
            docs/kien-thuc/04-bieu-thuc-dai-so/index.md \
            docs/kien-thuc/06-phan-tich-da-thuc/index.md \
            docs/kien-thuc/07-phan-thuc-dai-so/index.md \
            docs/roadmap/audit-hoc-thuat-02-07-v1.md \
            docs/roadmap/audit-noi-dung-25-chuyen-de.md
          if git diff --cached --quiet; then
            echo "No product changes."
            exit 0
          fi
          git commit -m "Audit học thuật 02-07: bổ sung điều kiện và khoảng trống nội dung"
          git push origin "HEAD:${GITHUB_REF_NAME}"
