name: Manual academic audit 08-12 once

on:
  push:
    branches:
      - content-manual-audit-08-12-v1

permissions:
  contents: write

jobs:
  apply-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content-manual-audit-08-12-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply manual audit changes
        run: python manual_audit_08_12_apply_temp.py

      - name: Audit structure
        run: python audit_content_structure.py --write

      - name: Validate Practice Banks
        run: python validate_practice_bank.py

      - name: Roadmap dependency and link QA
        run: python check_roadmap_dependencies.py

      - name: Audit Practice quality
        run: python audit_practice_quality.py

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Strict MkDocs build
        run: mkdocs build --strict

      - name: Commit audited content
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/kien-thuc/08-phuong-trinh-bat-phuong-trinh/index.md \
            docs/kien-thuc/09-he-phuong-trinh/index.md \
            docs/kien-thuc/10-ham-so-do-thi/index.md \
            docs/kien-thuc/11-can-thuc/index.md \
            docs/kien-thuc/12-phuong-trinh-bac-hai-viete/index.md \
            docs/roadmap/audit-hoc-thuat-08-12-v1.md \
            docs/roadmap/audit-noi-dung-25-chuyen-de.md
          if git diff --cached --quiet; then
            echo "No product changes."
            exit 0
          fi
          git commit -m "Audit học thuật 08-12: làm chặt điều kiện và cầu nối nội dung"
          git push origin "HEAD:${GITHUB_REF_NAME}"
