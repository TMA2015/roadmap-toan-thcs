name: Primary skill overlay CĐ04-07 QA

on:
  pull_request:
    paths:
      - 'docs/assets/data/curriculum/primary-skill-overlay-draft-*.json'
      - 'docs/assets/data/practice/04-bieu-thuc-dai-so-v2-*.json'
      - 'scripts/test-cd04-academic-qa.js'
      - 'scripts/test-cd05-academic-qa.js'
      - 'docs/assets/data/practice/05-7-hang-dang-thuc-v1-*.json'
      - 'docs/assets/data/curriculum/cd05-academic-qa-ledger-v1.json'
      - 'docs/roadmap/cd05-academic-qa-v1.md'
      - 'docs/assets/data/practice/06-phan-tich-da-thuc-v1-*.json'
      - 'docs/assets/data/curriculum/cd06-academic-qa-ledger-v1.json'
      - 'docs/roadmap/cd06-academic-qa-v1.md'
      - 'scripts/test-cd06-academic-qa.js'
      - 'scripts/test-cd07-academic-qa.js'
      - 'scripts/test-primary-skill-decision-39.js'
      - 'docs/assets/data/curriculum/primary-skill-decision-register-39-v1.json'
      - 'docs/roadmap/primary-skill-decisions-39-v1.md'
      - 'docs/assets/data/practice/07-phan-thuc-dai-so-v1-*.json'
      - 'docs/assets/data/curriculum/cd07-academic-qa-ledger-v1.json'
      - 'docs/roadmap/cd07-academic-qa-v1.md'
      - 'docs/roadmap/cd04-academic-qa-v1.md'
      - 'docs/roadmap/primary-skill-overlay-review-04-07-v1.md'
      - 'docs/roadmap/primary-skill-overlay-review-cases-04-07-v1.md'
      - 'scripts/test-primary-skill-overlay-04-07.js'
      - '.github/workflows/primary-skill-overlay-04-07-qa.yml'
  push:
    branches:
      - curriculum/primary-skill-cd04-07-audit-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify per-question primary mapping and locked source versions
        run: node scripts/test-primary-skill-overlay-04-07.js
      - name: Verify CĐ04 mathematical answer keys and domain assumptions
        run: node scripts/test-cd04-academic-qa.js
      - name: Verify CĐ05 identities, answer alternatives and proof-skill scope
        run: node scripts/test-cd05-academic-qa.js
      - name: Verify CĐ06 exact polynomial factorization and application scope
        run: node scripts/test-cd06-academic-qa.js
      - name: Verify CĐ07 rational expressions and domain correctness
        run: node scripts/test-cd07-academic-qa.js
      - name: Verify 39 exact question-level skill decisions and source locks
        run: node scripts/test-primary-skill-decision-39.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install static site dependencies
        run: pip install mkdocs-material
      - name: Build documentation strictly without deployment
        run: mkdocs build --strict
