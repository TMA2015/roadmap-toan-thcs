name: Roadmap PR Quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install MkDocs
        run: pip install mkdocs-material
      - name: Validate curriculum dependencies
        run: python check_roadmap_dependencies.py
      - name: Validate new CĐ23 readiness and CĐ24–25 learning
        run: |
          node --check docs/assets/javascripts/topic-workspace-v1.js
          node scripts/test-prob23-ready-001.js
          node scripts/test-cross-topic-learning-24-25.js
          node scripts/test-topic25-academic-exam-v2.js
          node scripts/test-topic25-exam-pack-v1.js
          node scripts/test-topic25-final-answer-quality-v1.js
          node --check docs/assets/javascripts/anchor-library-v1.js
          node --check docs/assets/javascripts/topic25-exam-engine-v1.js
          node scripts/test-topic25-expansion-engine-v1.js
          node scripts/test-topic25-gemini-r2-integration.js
          node scripts/test-prob23-learn-001.js
          node scripts/test-prob23-layer-001.js
          node scripts/test-learning-card-micro-practice.js docs/assets/data/curriculum/topic23-learning-workspace.json docs/assets/data/practice/23-xac-suat-micro-v1.json
      - name: Validate study scene interaction
        run: |
          node --check docs/assets/javascripts/study-scene-v1.js
          node scripts/test-study-scene-v1.js
          node scripts/test-home-style-v1.js
      - name: Validate tutoring depth and evidence integrity
        run: |
          node --check docs/assets/javascripts/tutor-runtime-v1.js
          node --check docs/assets/javascripts/learner-evidence-v1.js
          node --check docs/assets/javascripts/practice-engine-v2.js
          node --check docs/assets/javascripts/topic-workspace-v1.js
          node scripts/test-tutor-help-modes.js
          node --check docs/assets/javascripts/firebase-gemini-config.js
          node --check docs/assets/javascripts/firebase-gemini-v1.js
          node scripts/test-firebase-gemini-stage.js
          node --check docs/assets/javascripts/math-rich-text-v1.js
          node scripts/test-ai-rich-math-v1.js
          node --check docs/assets/javascripts/floating-ai-tutor-v1.js
          node scripts/test-floating-ai-tutor-v1.js
          node --check docs/assets/javascripts/written-self-check-v1.js
      - name: Validate grade-six Topic02 Golden pilot
        run: |
          node scripts/test-topic02-grade6-golden.js
          node scripts/test-learning-card-micro-practice.js docs/assets/data/curriculum/topic02-learning-workspace.json docs/assets/data/practice/02-so-va-phep-tinh-micro-v1.json
      - name: Validate existing learner workflows
        run: |
          node scripts/test-sta21-ready-001.js
          node scripts/test-golden-template.js
          node scripts/test-learning-card-micro-practice.js
      - name: Validate assets and practice
        run: |
          python check_svg_integrity.py
          python audit_practice_quality.py
      - name: Validate navigation and library cards
        run: |
          node --check docs/assets/javascripts/sticky-nav-v1.js
          node scripts/test-site-navigation-v1.js
          node --check docs/assets/javascripts/class-learning-v1.js
          node scripts/test-class-learning-entry.js
          node --check docs/assets/javascripts/knowledge-ui-v1.js
          node scripts/test-knowledge-ui-v1.js
      - name: Build strict static site
        run: mkdocs build --strict
      - name: Browser interaction QA and visual previews
        run: |
          python -m pip install playwright
          mkdir -p previews
          python -m http.server 8765 --directory site >/tmp/roadmap-preview.log 2>&1 &
          for i in {1..25}; do curl --fail --silent http://127.0.0.1:8765/ >/dev/null && break; sleep 0.2; done
          python scripts/capture-ui-previews.py
      - name: Upload visual preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-pr-100-interactive-ui-qa
          path: |
            previews/*.png
            previews/*.json
          if-no-files-found: error

