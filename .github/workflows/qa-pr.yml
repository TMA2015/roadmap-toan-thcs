name: Roadmap PR Quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded checks on the same PR; each final PR head still receives full QA.
concurrency:
  group: math-pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install MkDocs
        run: pip install mkdocs-material
      - name: Validate Math-only GitHub Actions isolation
        run: node scripts/test-math-actions-isolation-r1.js
