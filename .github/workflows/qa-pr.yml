name: Roadmap PR Quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install MkDocs
        run: pip install mkdocs-material
      - name: Validate curriculum dependencies
        run: python check_roadmap_dependencies.py
      - name: Validate KNTT Coverage Matrix 6-9
        run: node scripts/test-kntt-coverage-matrix-6-9-v1.js
      - name: Validate Grade 6 KNTT reconciliation R1
        run: node scripts/test-kntt-grade6-reconciliation-r1.js
      - name: Validate Grade 7 KNTT reconciliation R2
        run: node scripts/test-kntt-grade7-reconciliation-r2.js
      - name: Validate Grade 8 KNTT reconciliation R3
        run: node scripts/test-kntt-grade8-reconciliation-r3.js
      - name: Validate Grade 9 KNTT reconciliation R4
        run: node scripts/test-kntt-grade9-reconciliation-r4.js
      - name: Validate Grade 6 KNTT dimension coverage audit v1
        run: node scripts/test-kntt-dimension-coverage-g6-v1.js
      - name: Validate Grade 6 non-Learn dimension rerank R1
        run: node scripts/test-kntt-g6-nonlearn-rerank-r1.js
      - name: Validate Grade 6 Written placement R1
        run: node scripts/test-kntt-g6-written-placement-r1.js
      - name: Validate Grade 6 Written gap priority R1
        run: node scripts/test-kntt-g6-written-gap-priority-r1.js
      - name: Validate Grade 6 Written Wave 1 R1
        run: node scripts/test-kntt-g6-written-wave1-r1.js
      - name: Validate Grade 6 Written lesson42 R1
        run: node scripts/test-kntt-g6-written-bai42-r1.js
      - name: Validate Grade 6 Topic20 exact placement R1
        run: node scripts/test-kntt-g6-topic20-placement-r1.js
      - name: Validate Grade 6 shared-skill density R1
        run: node scripts/test-kntt-g6-shared-skill-density-r1.js
      - name: Validate new CĐ23 readiness and CĐ24–25 learning
        run: |
          node --check docs/assets/javascripts/topic-workspace-v1.js
          node scripts/test-prob23-ready-001.js
          node scripts/test-cross-topic-learning-24-25.js
          node scripts/test-topic25-academic-exam-v2.js
          node scripts/test-topic25-exam-pack-v1.js
          node scripts/test-topic25-final-answer-quality-v1.js
          node --check docs/assets/javascripts/anchor-library-v1.js
          node --check docs/assets/javascripts/topic25-exam-engine-v1.js
          node scripts/test-topic25-expansion-engine-v1.js
          node scripts/test-topic25-gemini-r2-integration.js
          node scripts/test-topic25-gemini-r3-integration.js
          node scripts/test-prob23-learn-001.js
          node scripts/test-prob23-layer-001.js
          node scripts/test-learning-card-micro-practice.js docs/assets/data/curriculum/topic23-learning-workspace.json docs/assets/data/practice/23-xac-suat-micro-v1.json
      - name: Validate study scene interaction
        run: |
          node --check docs/assets/javascripts/study-scene-v1.js
          node scripts/test-study-scene-v1.js
          node scripts/test-home-style-v1.js
      - name: Validate tutoring depth and evidence integrity
        run: |
          node --check docs/assets/javascripts/tutor-runtime-v1.js
          node --check docs/assets/javascripts/learner-evidence-v1.js
          node --check docs/assets/javascripts/practice-engine-v2.js
          node --check docs/assets/javascripts/topic-workspace-v1.js
          node scripts/test-tutor-help-modes.js
          node --check docs/assets/javascripts/firebase-gemini-config.js
          node --check docs/assets/javascripts/firebase-gemini-v1.js
          node scripts/test-firebase-gemini-stage.js
          node --check docs/assets/javascripts/math-rich-text-v1.js
          node scripts/test-ai-rich-math-v1.js
          node --check docs/assets/javascripts/floating-ai-tutor-v1.js
          node scripts/test-floating-ai-tutor-v1.js
          node --check docs/assets/javascripts/written-self-check-v1.js
      - name: Validate grade-six Topic02 Golden pilot
        run: |
          node scripts/test-topic02-grade6-golden.js
          node scripts/test-learning-card-micro-practice.js docs/assets/data/curriculum/topic02-learning-workspace.json docs/assets/data/practice/02-so-va-phep-tinh-micro-v1.json
          node scripts/test-learning-card-micro-practice.js docs/assets/data/curriculum/topic03-learning-workspace.json docs/assets/data/practice/03-ti-le-ti-le-thuc-micro-v1.json
      - name: Validate existing learner workflows
        run: |
          node scripts/test-sta21-ready-001.js
          node scripts/test-golden-template.js
          node scripts/test-topic07-core-route.js
          node scripts/test-core07-modal-skill-coverage.js
          node scripts/test-core07-plus2-math-and-evidence.js
          node scripts/test-core04-06-teaching-rollout.js
          node scripts/test-core08-12-teaching-rollout.js
          node scripts/test-core13-15-geometry-rollout.js
          node scripts/test-golden-geo13.js
          node scripts/test-golden-geo14-15.js
          node scripts/test-core16-18-geometry-rollout.js
          node scripts/test-core19-r2-release.js
          node scripts/test-core20-v2-release.js
          node --check docs/assets/javascripts/topic-learning-routes-v1.js
          node scripts/test-standalone-learning-batch-a.js
          node scripts/test-core02-23-seven-gap-release.js
          node scripts/test-golden-geo19-20.js
          node scripts/test-geo19-20-visual-v1.js
          node scripts/test-core-soft-card-style.js
          node scripts/test-core07-teaching-coverage.js
          node scripts/test-learning-card-micro-practice.js
      - name: Validate canonical evidence Beta v4
        run: |
          node --check docs/assets/javascripts/canonical-evidence-pilot-v1.js
          node scripts/test-canonical-evidence-pilot-v1.js
      - name: Validate canonical evidence Beta v5
        run: |
          node --check docs/assets/javascripts/canonical-evidence-pilot-v2.js
          node scripts/test-canonical-evidence-pilot-v2.js
      - name: Validate canonical evidence G2 shadow
        run: |
          node --check docs/assets/javascripts/canonical-evidence-observer-v2.js
          node --check docs/assets/javascripts/practice-engine-v2.js
          node scripts/test-canonical-evidence-g1.js
          node scripts/test-canonical-evidence-g2.js
      - name: Validate Skill Taxonomy v2 I0 registry
        run: node scripts/test-skill-taxonomy-v2-registry.js
      - name: Validate Skill Taxonomy v2 I1 topic policies
        run: node scripts/test-skill-taxonomy-v2-i1-policies.js
      - name: Validate Skill Taxonomy v2 I2 historical canary invariants
        run: |
          node --check docs/assets/javascripts/taxonomy-v2-evidence-observer-v1.js
          node --check docs/assets/javascripts/practice-engine-v2.js
          node scripts/test-skill-taxonomy-v2-i2-canary.js
      - name: Validate Skill Taxonomy v2 I3A historical full CT02 shadow
        run: |
          node --check docs/assets/javascripts/taxonomy-v2-evidence-observer-v1.js
          node scripts/test-skill-taxonomy-v2-i3a-full-ct02.js
      - name: Validate Skill Taxonomy v2 I3B CT02-CT03 shadow
        run: |
          node --check docs/assets/javascripts/taxonomy-v2-evidence-observer-v1.js
          node scripts/test-skill-taxonomy-v2-i3b-ct02-03.js
      - name: Validate Skill Taxonomy v2 I3C CT02-CT04 shadow
        run: |
          node --check docs/assets/javascripts/taxonomy-v2-evidence-observer-v1.js
          node scripts/test-skill-taxonomy-v2-i3c-ct02-04.js
      - name: Validate Skill Taxonomy v2 I3D CT02-CT07 shadow
        run: |
          node --check docs/assets/javascripts/taxonomy-v2-evidence-observer-v1.js
          node scripts/test-skill-taxonomy-v2-i3d-ct02-07.js
      - name: Validate Skill Taxonomy v2 I3E CT02-CT12 shadow
        run: |
          node --check docs/assets/javascripts/taxonomy-v2-evidence-observer-v1.js
          node scripts/test-skill-taxonomy-v2-i3e-ct02-12.js
      - name: Validate Skill Taxonomy v2 I3F CT02-CT20 shadow
        run: |
          node --check docs/assets/javascripts/taxonomy-v2-evidence-observer-v1.js
          node scripts/test-skill-taxonomy-v2-i3f-ct02-20.js
      - name: Validate Skill Taxonomy v2 I3G full CT02-CT25 shadow
        run: |
          node --check docs/assets/javascripts/taxonomy-v2-evidence-observer-v1.js
          node scripts/test-skill-taxonomy-v2-i3g-ct02-25.js
      - name: Validate Skill Taxonomy v2 I4 owner preview
        run: |
          node --check docs/assets/javascripts/skill-map-v2-preview.js
          node scripts/test-skill-map-v2-preview.js
      - name: Validate Skill Taxonomy v2 I6 controlled learner release
        run: |
          node scripts/test-skill-map-v2-i6-controlled.js
      - name: Validate Skill Taxonomy v2 I6B public learner release
        run: |
          node scripts/test-skill-map-v2-i6b-public.js
      - name: Validate assets and practice
        run: |
          python check_svg_integrity.py
          python audit_practice_quality.py
      - name: Validate navigation and library cards
        run: |
          node --check docs/assets/javascripts/sticky-nav-v1.js
          node scripts/test-site-navigation-v1.js
          node --check docs/assets/javascripts/class-learning-v1.js
          node scripts/test-class-learning-entry.js
          node --check docs/assets/javascripts/knowledge-ui-v1.js
          node scripts/test-knowledge-ui-v1.js
          python scripts/test-topic-roadmap-navigation.py
          node --check docs/assets/javascripts/written-exercise-library-v1.js
          node scripts/test-written-exercise-library-v1.js
      - name: Validate CT08 Academic Depth P1-A
        run: |
          node --check docs/assets/javascripts/topic-workspace-v1.js
          node scripts/test-topic08-academic-depth-p1a.js
      - name: Validate CT09 Academic Depth P1-A
        run: node scripts/test-topic09-academic-depth-p1a.js
      - name: Validate CT09 Academic Depth P1-C1
        run: |
          node --check docs/assets/javascripts/practice-engine-v2.js
          node scripts/test-topic09-p1c1-variant-groups.js
      - name: Validate CT09 Academic Depth P1-C2
        run: |
          node --check docs/assets/javascripts/taxonomy-v2-evidence-observer-v1.js
          node scripts/test-topic09-p1c2-integration.js
      - name: Validate Topic 22 shared workspace alignment
        run: node scripts/test-topic22-workspace-alignment.js
      - name: Validate official Hanoi exam-frequency seed R1
        run: node scripts/test-exam-frequency-hanoi-seed-r1.js

      - name: Validate Practice Implementation Wave 1 candidate
        run: node scripts/test-practice-implementation-wave1-r1.js

      - name: Validate practice coverage priority R1 review
        run: node scripts/test-practice-coverage-priority-r1.js

      - name: Validate Written implementation Wave 1 R1
        run: node scripts/test-written-implementation-wave1-r1.js

      - name: Validate Written coverage priority R1 review
        run: node scripts/test-written-coverage-priority-r1.js

      - name: Validate Written coverage post-Wave1 reconciliation R1
        run: node scripts/test-written-coverage-post-wave1-r1.js

      - name: Validate Readiness coverage audit R1
        run: node scripts/build-readiness-coverage-audit-r1.js

      - name: Validate Readiness coverage priority R1 review
        run: node scripts/test-readiness-coverage-priority-r1.js

      - name: Validate Readiness implementation Wave 1 R1
        run: node scripts/test-readiness-implementation-wave1-r1.js

      - name: Validate Readiness coverage post-Wave1 reconciliation R1
        run: node scripts/test-readiness-coverage-post-wave1-r1.js

      - name: Validate Skill Priority Matrix R1 review prep
        run: node scripts/test-skill-priority-matrix-r1.js

      - name: Validate priority coverage reconciliation R1
        run: node scripts/test-priority-coverage-reconciliation-r1.js

      - name: Validate Written coverage audit R1
        run: node scripts/build-written-coverage-audit-r1.js /tmp/written-coverage-audit-r1.json

      - name: Validate whole-project practice coverage audit R1
        run: node scripts/build-practice-coverage-audit-r1.js /tmp/practice-coverage-audit-r1.json

      - name: Validate learner-focused skill metadata
        run: node scripts/test-learner-focus-skill-metadata.js
      - name: Validate CĐ25 display math source
        run: node scripts/test-topic25-math-render.js
      - name: Validate CĐ25 student journey
        run: |
          node --check docs/assets/javascripts/topic-workspace-v1.js
          node --check docs/assets/javascripts/practice-auto-loader.js
          node --check docs/assets/javascripts/topic25-exam-engine-v1.js
          node scripts/test-topic25-student-journey.js
          node scripts/test-topic25-paper-exam-v1.js
      - name: Build strict static site
        run: mkdocs build --strict
      - name: Validate CĐ25 built display math
        run: node scripts/test-topic25-math-render.js --built
      - name: Validate built topic navigation
        run: python scripts/test-topic-roadmap-navigation.py --built
      - name: Browser interaction QA and visual previews
        run: |
          python -m pip install playwright
          mkdir -p previews
          python -m http.server 8765 --directory site >/tmp/roadmap-preview.log 2>&1 &
          for i in {1..25}; do curl --fail --silent http://127.0.0.1:8765/ >/dev/null && break; sleep 0.2; done
          python scripts/capture-ui-previews.py
          python scripts/test-topic25-student-browser.py
          python scripts/test-topic25-math-browser.py
          python scripts/test-core19-r2-browser.py
          python scripts/test-core20-v2-browser.py
          python scripts/test-canonical-evidence-pilot-browser.py
          python scripts/test-canonical-evidence-pilot-v2-browser.py
          python scripts/test-canonical-evidence-g1-browser.py
          python scripts/test-skill-taxonomy-v2-i3g-browser.py
          python scripts/test-skill-map-v2-preview-browser.py
          python scripts/test-skill-map-v2-i6-controlled-browser.py
          python scripts/test-skill-map-v2-i6b-public-browser.py
          python scripts/test-help-disclosure-toggle-browser.py
          python scripts/test-topic08-academic-depth-p1a-browser.py
          python scripts/test-topic09-navigation-reading-browser.py
          python scripts/test-topic09-p1c1-variant-browser.py
          python scripts/test-topic09-p1c2-browser.py
          python scripts/test-written-exercise-library-browser.py
      - name: Upload visual preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-pr-100-interactive-ui-qa
          path: |
            previews/*.png
            previews/*.json
          if-no-files-found: error

