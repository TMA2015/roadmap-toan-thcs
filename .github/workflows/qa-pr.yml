name: Roadmap PR Quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install MkDocs
        run: pip install mkdocs-material
      - name: Validate curriculum dependencies
        run: python check_roadmap_dependencies.py
      - name: Validate new CĐ23 readiness and CĐ24–25 learning
        run: |
          node --check docs/assets/javascripts/topic-workspace-v1.js
          node scripts/test-prob23-ready-001.js
          node scripts/test-cross-topic-learning-24-25.js
          node scripts/test-prob23-learn-001.js
          node scripts/test-prob23-layer-001.js
          node scripts/test-learning-card-micro-practice.js docs/assets/data/curriculum/topic23-learning-workspace.json docs/assets/data/practice/23-xac-suat-micro-v1.json
      - name: Validate study scene interaction
        run: |
          node --check docs/assets/javascripts/study-scene-v1.js
          node scripts/test-study-scene-v1.js
          node scripts/test-home-style-v1.js
      - name: Validate existing learner workflows
        run: |
          node scripts/test-sta21-ready-001.js
          node scripts/test-golden-template.js
          node scripts/test-learning-card-micro-practice.js
      - name: Validate assets and practice
        run: |
          python check_svg_integrity.py
          python audit_practice_quality.py
      - name: Validate navigation and library cards
        run: |
          node --check docs/assets/javascripts/sticky-nav-v1.js
          node scripts/test-site-navigation-v1.js
          node --check docs/assets/javascripts/knowledge-ui-v1.js
          node scripts/test-knowledge-ui-v1.js
      - name: Build strict static site
        run: mkdocs build --strict
      - name: Capture visual previews
        run: |
          mkdir -p previews
          python -m http.server 8765 --directory site >/tmp/roadmap-preview.log 2>&1 &
          for i in {1..25}; do curl --fail --silent http://127.0.0.1:8765/ >/dev/null && break; sleep 0.2; done
          CHROME="$(command -v google-chrome || command -v chromium)"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=1440,1000 --screenshot=previews/home-desktop.png http://127.0.0.1:8765/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=820,1080 --screenshot=previews/home-tablet.png http://127.0.0.1:8765/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=390,844 --screenshot=previews/home-phone.png http://127.0.0.1:8765/
          test -s previews/home-desktop.png && test -s previews/home-tablet.png && test -s previews/home-phone.png
      - name: Upload visual preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-pr-100-homepage-desktop-tablet-phone
          path: previews/home-*.png
          if-no-files-found: error

