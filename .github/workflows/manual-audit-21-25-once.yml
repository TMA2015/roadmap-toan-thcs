name: Manual academic audit 21-25 once

on:
  push:
    branches:
      - content-manual-audit-21-25-v1

permissions:
  contents: write

jobs:
  apply-and-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content-manual-audit-21-25-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply manual audit changes
        run: python manual_audit_21_25_apply_temp.py

      - name: Verify new academic coverage
        shell: bash
        run: |
          grep -q "Dữ liệu ghép nhóm, tần số và tần số tương đối ghép nhóm" docs/kien-thuc/21-thong-ke/index.md
          grep -q "Biểu đồ cột kép và biểu đồ hình quạt tròn" docs/kien-thuc/21-thong-ke/index.md
          grep -q "Xác suất thực nghiệm" docs/kien-thuc/23-xac-suat/index.md
          grep -q "rút vật \*\*không hoàn lại\*\*" docs/kien-thuc/23-xac-suat/index.md
          grep -q "Giả định và giới hạn của mô hình" docs/kien-thuc/24-bai-toan-thuc-te/index.md
          grep -q "Thay đổi phần trăm liên tiếp" docs/kien-thuc/24-bai-toan-thuc-te/index.md
          grep -q "dữ liệu ghép nhóm" docs/kien-thuc/25-tong-hop-on-thi-10/index.md

      - name: Audit structure
        run: python audit_content_structure.py --write

      - name: Validate Practice Banks
        run: python validate_practice_bank.py

      - name: Roadmap dependency and link QA
        run: python check_roadmap_dependencies.py

      - name: Audit Practice quality
        run: python audit_practice_quality.py

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Strict MkDocs build
        run: mkdocs build --strict

      - name: Commit audited content
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/kien-thuc/21-thong-ke/index.md \
            docs/kien-thuc/23-xac-suat/index.md \
            docs/kien-thuc/24-bai-toan-thuc-te/index.md \
            docs/kien-thuc/25-tong-hop-on-thi-10/index.md \
            docs/roadmap/audit-hoc-thuat-21-25-v1.md
          if git diff --cached --quiet; then
            echo "No product changes."
            exit 0
          fi
          git commit -m "Audit học thuật 21-25: hoàn thiện thống kê, xác suất và mô hình hóa"
          git push origin "HEAD:${GITHUB_REF_NAME}"
