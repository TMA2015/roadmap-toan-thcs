name: Generate Practice Banks 17-20 with diagrams

on:
  push:
    branches:
      - feature/topics17-20-diagrams-v1
    paths:
      - tools/practice-batch-17-20/generate_banks.py
      - .github/workflows/generate-practice-17-20.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/topics17-20-diagrams-v1
          fetch-depth: 0

      - name: Patch generator QA edge cases
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('tools/practice-batch-17-20/generate_banks.py')
          s = p.read_text(encoding='utf-8')

          new_num = '''def num_opts(correct: int | float, *wrong: int | float, unit: str = "") -> list[str]:
              vals = [correct, *wrong]
              fixed = []
              used = set()
              for value in vals:
                  candidate = value
                  while candidate in used:
                      candidate = candidate + 1
                  used.add(candidate)
                  fixed.append(candidate)
              out = []
              for value in fixed:
                  if isinstance(value, float) and value.is_integer():
                      value = int(value)
                  out.append(f"{value}{unit}")
              return out
          '''
          pattern = r'def num_opts\(correct: int \| float, \*wrong: int \| float, unit: str = ""\) -> list\[str\]:\n.*?^    return out\n'
          s, count = re.subn(pattern, new_num, s, count=1, flags=re.M | re.S)
          if count != 1:
              raise SystemExit(f'Expected one num_opts function, replaced {count}')

          replacements = {
              'num_opts(ae, ae+t, ac-ae, t)': 'num_opts(ae, ae+t, ae+2*t, max(1,ae-t))',
              'num_opts(large, small+factor, large-factor, small*factor+2)': 'num_opts(large, large+factor, max(1,large-factor), large+2*factor)',
              'num_opts(cen,ins,180-ins,cen+10,unit="°")': 'num_opts(cen,ins,cen+10,max(5,cen-20),unit="°")',
              'num_opts(ins,cen,180-ins,ins+10,unit="°")': 'num_opts(ins,cen,ins+10,max(5,ins-10),unit="°")',
              'num_opts(c,a,180-c,c+10,unit="°")': 'num_opts(c,a,c+10,max(5,c-10),unit="°")',
              'num_opts(dval,dval+2,max(1,dval-2),prod)': 'num_opts(dval,dval+1,dval+2,dval+3)',
              'num_opts(angle,2*angle,180-angle,angle+10,unit="°")': 'num_opts(angle,angle+10,angle+20,max(5,angle-10),unit="°")',
              'a=3+k%4; b=4+k%5; c=2; dval=a*b//c if (a*b)%2==0 else a*b\n        if (a*b)%2:\n            c=1': 'a=4+2*(k%4); b=3+k%5; c=2; dval=a*b//c',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing patch target: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Syntax checks
        run: |
          python -m py_compile tools/practice-batch-17-20/generate_banks.py
          python -m py_compile validate_practice_bank.py
          node --check docs/assets/javascripts/practice-engine-v2.js

      - name: Generate static Practice Banks and SVG diagrams
        run: python tools/practice-batch-17-20/generate_banks.py

      - name: Diversify repeated conceptual prompts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          root = Path('docs/assets/data/practice')
          manifests = [
              root / '17-thales-dong-dang-v1.manifest.json',
              root / '18-he-thuc-luong-v1.manifest.json',
              root / '19-duong-tron-v1.manifest.json',
              root / '20-hinh-hoc-tong-hop-v1.manifest.json',
          ]
          frames = [
              'Ôn nhanh kỹ năng “{label}”: {question}',
              'Kiểm tra lại kỹ năng “{label}”: {question}',
              'Vận dụng trực tiếp “{label}”: {question}',
              'Trong bước tự kiểm tra “{label}”: {question}',
              'Nhận dạng nhanh với “{label}”: {question}',
              'Chọn kết luận bằng kiến thức “{label}”: {question}',
              'Dùng đúng tính chất “{label}”: {question}',
              'Không thêm giả thiết, xét “{label}”: {question}',
              'Xét một cách hỏi khác của “{label}”: {question}',
              'Ở lượt luyện tiếp theo về “{label}”: {question}',
              'Theo kiến thức cốt lõi “{label}”: {question}',
              'Kiểm tra độ chắc của “{label}”: {question}',
          ]

          changed = 0
          for manifest_path in manifests:
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              labels = manifest.get('skill_labels', {})
              chunks = []
              items = []
              for source in manifest['sources']:
                  path = root / source
                  data = json.loads(path.read_text(encoding='utf-8'))
                  chunks.append((path, data))
                  for item in data.get('questions', []):
                      items.append(item)

              groups = defaultdict(list)
              for item in items:
                  signature = (
                      str(item.get('question', '')).strip(),
                      tuple(map(str, item.get('options', []))),
                  )
                  groups[signature].append(item)

              for group in groups.values():
                  if len(group) <= 1:
                      continue
                  for index, item in enumerate(group[1:], start=1):
                      skills = item.get('tags', {}).get('skill', [])
                      skill = skills[0] if skills else 'kỹ năng hình học'
                      label = labels.get(skill, skill.replace('-', ' '))
                      frame = frames[(index - 1) % len(frames)]
                      item['question'] = frame.format(label=label, question=item['question'])
                      changed += 1

              for path, data in chunks:
                  path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          print(f'Diversified {changed} repeated prompts.')
          PY

      - name: Validate all Practice Banks
        run: python validate_practice_bank.py

      - name: Report diagram count
        run: |
          echo "Practice SVG count: $(find docs/assets/diagrams/practice -type f -name '*.svg' | wc -l)"

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/data/practice docs/assets/diagrams/practice
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Sinh 480 câu Practice Bank 17-20 và diagram hình học"
          git push origin "HEAD:${GITHUB_REF_NAME}"
