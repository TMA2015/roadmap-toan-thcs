name: THPT R4 MkDocs Preview QA (no deploy)

on:
  pull_request:
    paths:
      - 'mkdocs.thpt-preview.yml'
      - 'mkdocs.yml'
      - 'scripts/test-thpt-static-release.cjs'
      - 'scripts/test-root-program-selector-v1.cjs'
      - 'scripts/test-site-navigation-v1.js'
      - 'docs/assets/javascripts/sticky-nav-v1.js'
      - 'scripts/assemble-thpt-site.cjs'
      - '.github/workflows/deploy.yml'
      - 'docs/index.md'
      - 'docs/thcs/**'
      - 'docs/thpt-preview/**'
      - 'docs/assets/javascripts/thpt-r4-preview.js'
      - 'docs/assets/javascripts/floating-ai-tutor-v1.js'
      - 'docs/assets/javascripts/firebase-gemini-v1.js'
      - 'docs/assets/javascripts/sticky-nav-v1.js'
      - 'docs/assets/javascripts/anchor-library-v1.js'
      - 'docs/assets/javascripts/anchor-topic-related-v1.js'
      - 'docs/assets/javascripts/model-examples-library-v1.js'
      - 'docs/assets/javascripts/written-exercise-library-v1.js'
      - 'docs/assets/javascripts/topic25-exam-engine-v1.js'
      - 'docs/assets/javascripts/route-module-loader-v1.js'
      - 'docs/assets/javascripts/route-module-loader-v2.js'
      - 'scripts/test-self-learning-math-rename-preflight.cjs'
      - 'scripts/test-self-learning-math-rename-browser.cjs'
      - 'docs/assets/stylesheets/thpt-r4-preview.css'
      - 'review-packets/thpt-g10-b16-r4/**'
      - 'scripts/serve-thpt-r4-lan-preview.ps1'
      - 'scripts/test-thpt-r4-preview-browser.js'
      - 'scripts/test-thpt-chvi-math-block-render.cjs'
      - 'scripts/test-thpt-chvi-student-notes.cjs'
      - 'scripts/test-thpt-release-queue.cjs'
      - 'prototypes/thpt/release-queue/**'
      - '.github/workflows/thpt-r4-preview-quality.yml'

permissions:
  contents: read

jobs:
  preview-only:
    name: Build R4 preview without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MkDocs Material
        run: python -m pip install 'mkdocs-material>=9,<10'
      - name: Validate scoped THPT JavaScript syntax
        run: |
          node --check docs/assets/javascripts/thpt-r4-preview.js
          node --check docs/assets/javascripts/floating-ai-tutor-v1.js
          node --check docs/assets/javascripts/firebase-gemini-v1.js
          node --check docs/assets/javascripts/thpt-chvi-reviewed-formative-v1.js
      - name: Verify future Self-Learning Math rename compatibility (no rename/deploy)
        run: |
          node scripts/test-root-program-selector-v1.cjs
          node scripts/test-site-navigation-v1.js
          node scripts/test-self-learning-math-rename-preflight.cjs
          for js in             docs/assets/javascripts/sticky-nav-v1.js             docs/assets/javascripts/anchor-library-v1.js             docs/assets/javascripts/anchor-topic-related-v1.js             docs/assets/javascripts/model-examples-library-v1.js             docs/assets/javascripts/written-exercise-library-v1.js             docs/assets/javascripts/topic25-exam-engine-v1.js             docs/assets/javascripts/route-module-loader-v1.js             docs/assets/javascripts/route-module-loader-v2.js; do node --check "$js"; done
      - name: Validate THPT academic-to-release checklist (no deploy)
        run: node scripts/test-thpt-release-queue.cjs
      - name: Check THPT no-account static release contract
        run: node scripts/test-thpt-static-release.cjs
      - name: Guard Chapter VI academic-snapshot scope and shared canonical items
        run: |
          node scripts/test-thpt-chvi-review-receipt.cjs
          node scripts/test-thpt-chvi-reviewed-formative.cjs
          node scripts/test-thpt-chvi-reviewed-knowledge-parity.cjs
          node scripts/test-thpt-chvi-student-notes.cjs
          node scripts/test-thpt-chvi-math-block-render.cjs
          node scripts/test-thpt-shared-item-placement.cjs
          node scripts/test-floating-ai-tutor-v1.js
      - name: Validate local preview PowerShell script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/serve-thpt-r4-lan-preview.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "PASS: PowerShell LAN preview runner parses"

      - name: Build alternate THPT preview config (never main config)
        run: mkdocs build -f mkdocs.thpt-preview.yml --clean
      - name: Verify R4 preview pages and assets exist
        run: |
          test -f site-thpt-preview/thpt-preview/index.html
          test -f site-thpt-preview/thpt-preview/home/index.html
          test -f site-thpt-preview/thpt-preview/sgk/chuong-vi/bai-16/index.html
          test -f site-thpt-preview/thpt-preview/chuyen-de/ham-so/kien-thuc/index.html
          test -f site-thpt-preview/thpt-preview/thu-vien/index.html
          test -f site-thpt-preview/assets/javascripts/thpt-r4-preview.js
          test -f site-thpt-preview/assets/stylesheets/thpt-r4-preview.css
          echo 'PASS: THPT R4 MkDocs preview paths built. No deployment, academic approval or browser QA implied.'

      - name: Build and verify one-site THCS + THPT candidate (never deploy)
        run: |
          mkdocs build --strict
          node scripts/assemble-thpt-site.cjs
          node scripts/test-thpt-chvi-math-block-render.cjs --built
          node scripts/test-thpt-chvi-student-notes.cjs --built
      - name: Verify combined build has no backend
        run: |
          test -f site/index.html
          test -f site/thcs/index.html
          test -f site/kien-thuc/04-bieu-thuc-dai-so/index.html
          test -f site/thpt-preview/sgk/chuong-vi/bai-16/index.html
          test ! -e site/assets/javascripts/thpt-protected-readiness-v1.js
          test ! -e site/assets/javascripts/thpt-formative-exposure-v1.js
      - name: Install isolated Chromium test dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Browser smoke test · desktop / iPhone / iPad simulation
        run: |
          python -m http.server 8765 --directory site > /tmp/thpt-r4-combined-http.log 2>&1 &
          sleep 2
          node scripts/test-thpt-r4-preview-browser.js
      - name: Emulate old and new GitHub Pages paths, without renaming the repo
        run: |
          mkdir -p rename-path-smoke
          ln -s ../site rename-path-smoke/roadmap-toan-thcs
          ln -s ../site rename-path-smoke/self-learning-math
          python -m http.server 8766 --directory rename-path-smoke > /tmp/self-learning-math-rename-smoke.log 2>&1 &
          sleep 2
          node scripts/test-self-learning-math-rename-browser.cjs
