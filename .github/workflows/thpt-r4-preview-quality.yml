name: THPT R4 MkDocs Preview QA (no deploy)

on:
  pull_request:
    paths:
      - 'mkdocs.thpt-preview.yml'
      - 'mkdocs.yml'
      - 'scripts/test-thpt-static-release.cjs'
      - 'scripts/test-root-program-selector-v1.cjs'
      - 'scripts/test-site-navigation-v1.js'
      - 'docs/assets/javascripts/sticky-nav-v1.js'
      - 'scripts/assemble-thpt-site.cjs'
      - '.github/workflows/deploy.yml'
      - 'docs/index.md'
      - 'docs/thcs/**'
      - 'docs/thpt-preview/**'
      - 'docs/assets/javascripts/thpt-r4-preview.js'
      - 'docs/assets/javascripts/thpt-chvi-d6-reviewed-r01.js'
      - 'docs/assets/stylesheets/thpt-chvi-d6-reviewed-r01.css'
      - 'scripts/test-thpt-chvi-d6-reviewed-r01.cjs'
      - 'scripts/test-thpt-chvi-d6-browser-smoke.cjs'
      - 'docs/assets/javascripts/thpt-self-check-qa-v1.js'
      - 'docs/assets/stylesheets/thpt-self-check-qa-v1.css'
      - 'scripts/test-thpt-self-check-qa-browser.cjs'
      - 'docs/assets/javascripts/floating-ai-tutor-v1.js'
      - 'docs/assets/javascripts/firebase-gemini-v1.js'
      - 'docs/assets/javascripts/sticky-nav-v1.js'
      - 'docs/assets/javascripts/anchor-library-v1.js'
      - 'docs/assets/javascripts/anchor-topic-related-v1.js'
      - 'docs/assets/javascripts/model-examples-library-v1.js'
      - 'docs/assets/javascripts/written-exercise-library-v1.js'
      - 'docs/assets/javascripts/topic25-exam-engine-v1.js'
      - 'docs/assets/javascripts/route-module-loader-v1.js'
      - 'docs/assets/javascripts/route-module-loader-v2.js'
      - 'scripts/test-self-learning-math-rename-preflight.cjs'
      - 'scripts/test-self-learning-math-rename-browser.cjs'
      - 'docs/assets/stylesheets/thpt-r4-preview.css'
      - 'review-packets/thpt-g10-b16-r4/**'
      - 'scripts/serve-thpt-r4-lan-preview.ps1'
      - 'scripts/test-thpt-r4-preview-browser.js'
      - 'scripts/test-thpt-g10-chvii-reviewed-stage1.cjs'
      - 'scripts/test-thpt-g10-chviii-reviewed-stage2.cjs'
      - 'scripts/test-thpt-g10-d6-release-integration.cjs'
      - 'scripts/test-thpt-g10-chix-reviewed-stage3.cjs'
      - 'scripts/test-thpt-g10-chix-release-integration.cjs'
      - 'scripts/test-thpt-g10-chix-browser-smoke.cjs'
      - 'docs/assets/javascripts/thpt-chix-reviewed-formative-v1.js'
      - 'docs/assets/javascripts/thpt-chi-reviewed-formative-v1.js'
      - 'scripts/test-thpt-g10-chi-release-integration.cjs'
      - 'scripts/test-thpt-g10-chi-browser-smoke.cjs'
      - 'docs/assets/javascripts/thpt-chii-reviewed-formative-v1.js'
      - 'scripts/test-thpt-g10-chii-release-integration.cjs'
      - 'scripts/test-thpt-g10-chii-browser-smoke.cjs'
      - 'docs/assets/javascripts/thpt-chiii-reviewed-formative-v1.js'
      - 'scripts/test-thpt-g10-chiii-release-integration.cjs'
      - 'scripts/test-thpt-g10-chiii-browser-smoke.cjs'
      - 'docs/assets/javascripts/thpt-chiv-b07-b08-reviewed-formative-v1.js'
      - 'scripts/test-thpt-g10-chiv-b07-b08-release-integration.cjs'
      - 'scripts/test-thpt-g10-chiv-b07-b08-browser-smoke.cjs'
      - 'docs/assets/javascripts/thpt-chiv-b09-b11-reviewed-formative-v1.js'
      - 'scripts/test-thpt-g10-chiv-b09-b11-release-integration.cjs'
      - 'scripts/test-thpt-g10-chiv-b09-b11-browser-smoke.cjs'
      - 'docs/assets/javascripts/thpt-g11-chi-reviewed-formative-v1.js'
      - 'scripts/test-thpt-g11-chi-b01-b02-release-integration.cjs'
      - 'scripts/test-thpt-g11-chi-b01-b02-browser-smoke.cjs'
      - 'scripts/test-thpt-formative-actions-ui-browser.cjs'
      - 'scripts/test-thpt-interactive-compact-browser.cjs'
      - 'scripts/test-thpt-r4-public-formative-interaction.cjs'
      - 'scripts/test-thpt-r4-search-browser.cjs'
      - 'docs/assets/javascripts/thpt-chvii-reviewed-formative-v1.js'
      - 'docs/assets/javascripts/thpt-chviii-reviewed-formative-v1.js'
      - 'scripts/test-thpt-chvi-math-block-render.cjs'
      - 'scripts/test-thpt-g10-sgk-display-ui.cjs'
      - 'scripts/test-thpt-chvi-student-notes.cjs'
      - 'scripts/test-thpt-release-queue.cjs'
      - 'prototypes/thpt/release-queue/**'
      - '.github/workflows/thpt-r4-preview-quality.yml'

permissions:
  contents: read

jobs:
  preview-only:
    name: Build R4 preview without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MkDocs Material
        run: python -m pip install 'mkdocs-material>=9,<10'
      - name: Validate scoped THPT JavaScript syntax
        run: |
          node --check docs/assets/javascripts/thpt-r4-preview.js
          node --check docs/assets/javascripts/thpt-self-check-qa-v1.js
          node --check docs/assets/javascripts/floating-ai-tutor-v1.js
          node --check docs/assets/javascripts/firebase-gemini-v1.js
          node --check docs/assets/javascripts/thpt-chvi-reviewed-formative-v1.js
          node --check docs/assets/javascripts/thpt-chvi-d6-reviewed-r01.js
          node scripts/test-thpt-chvi-d6-reviewed-r01.cjs
          node --check docs/assets/javascripts/thpt-chvii-reviewed-formative-v1.js
          node --check docs/assets/javascripts/thpt-chviii-reviewed-formative-v1.js
          node --check docs/assets/javascripts/thpt-chix-reviewed-formative-v1.js
          node --check docs/assets/javascripts/thpt-chi-reviewed-formative-v1.js
          node --check docs/assets/javascripts/thpt-chii-reviewed-formative-v1.js
          node --check docs/assets/javascripts/thpt-chiii-reviewed-formative-v1.js
          node --check docs/assets/javascripts/thpt-chiv-b07-b08-reviewed-formative-v1.js
          node --check docs/assets/javascripts/thpt-chiv-b09-b11-reviewed-formative-v1.js
          node --check docs/assets/javascripts/thpt-g11-chi-reviewed-formative-v1.js
      - name: Validate updated interactive THPT browser test syntax
        run: |
          node --check scripts/test-thpt-interactive-compact-browser.cjs
          node --check scripts/test-thpt-formative-actions-ui-browser.cjs
          node --check scripts/test-thpt-r4-public-formative-interaction.cjs
          node --check scripts/test-thpt-self-check-qa-browser.cjs
          node --check scripts/test-thpt-g10-chii-browser-smoke.cjs
          node --check scripts/test-thpt-g10-chiii-browser-smoke.cjs
          node --check scripts/test-thpt-g10-chiv-b07-b08-browser-smoke.cjs
          node --check scripts/test-thpt-g10-chiv-b09-b11-browser-smoke.cjs
      - name: Verify future Self-Learning Math rename compatibility (no rename/deploy)
        run: |
          node scripts/test-root-program-selector-v1.cjs
          node scripts/test-site-navigation-v1.js
          node scripts/test-self-learning-math-rename-preflight.cjs
          for js in             docs/assets/javascripts/sticky-nav-v1.js             docs/assets/javascripts/anchor-library-v1.js             docs/assets/javascripts/anchor-topic-related-v1.js             docs/assets/javascripts/model-examples-library-v1.js             docs/assets/javascripts/written-exercise-library-v1.js             docs/assets/javascripts/topic25-exam-engine-v1.js             docs/assets/javascripts/route-module-loader-v1.js             docs/assets/javascripts/route-module-loader-v2.js; do node --check "$js"; done
      - name: Guard AP presentation pilot source math and teaching content (no deploy)
        run: node scripts/test-thpt-academic-presentation-pilot.cjs
      - name: Guard G11 B01 source-locked Knowledge presentation (no deploy)
        run: node scripts/test-thpt-g11-b01-ap-parity.cjs
      - name: Guard G10 B03 Knowledge AP source parity (no deploy)
        run: node scripts/test-thpt-g10-b03-ap-parity.cjs
      - name: Guard AP vector source lock G10 B07/B08/B10 (no deploy)
        run: node scripts/test-thpt-ap-vector-knowledge-parity.cjs
      - name: Validate THPT academic-to-release checklist (no deploy)
        run: node scripts/test-thpt-release-queue.cjs
      - name: Check THPT no-account static release contract
        run: node scripts/test-thpt-static-release.cjs
      - name: Guard G10 SGK example headings and display math source
        run: node scripts/test-thpt-g10-sgk-display-ui.cjs
      - name: Guard ChVII–VIII scoped public formative bank and reviewed R02 recovery
        run: |
          node scripts/test-thpt-g10-chvii-reviewed-stage1.cjs
          node scripts/test-thpt-g10-chviii-reviewed-stage2.cjs
          node scripts/test-thpt-g10-d6-release-integration.cjs
      - name: Guard G10 ChI B01–B02 reviewed canonical, D5/D6 and private-assessment boundary
        run: node scripts/test-thpt-g10-chi-release-integration.cjs
      - name: Guard G10 ChII original MCQ and D5/D6/Written
        run: |
          node scripts/test-thpt-g10-chii-release-integration.cjs
          node scripts/test-thpt-r4-public-formative-interaction.cjs
      - name: Guard G10 ChIII B05/B06 source-locked MCQ and short-answer, D5/D6/Written
        run: node scripts/test-thpt-g10-chiii-release-integration.cjs
      - name: Guard G10 ChIV B07/B08 source-locked original items, SVG, Written and D6
        run: node scripts/test-thpt-g10-chiv-b07-b08-release-integration.cjs
      - name: Guard G10 ChIV B09–B11 exact source and canonical uniqueness
        run: node scripts/test-thpt-g10-chiv-b09-b11-release-integration.cjs
      - name: Guard G11 ChI original 16 source-locked items, 2 SVG, Written/Anchor and D6
        run: node scripts/test-thpt-g11-chi-b01-b02-release-integration.cjs
      - name: Guard G10 ChIX source-locked public formative and reviewed D5/D6
        run: |
          node scripts/test-thpt-g10-chix-reviewed-stage3.cjs
          node scripts/test-thpt-g10-chix-release-integration.cjs
      - name: Guard Chapter VI academic-snapshot scope and shared canonical items
        run: |
          node scripts/test-thpt-chvi-review-receipt.cjs
          node scripts/test-thpt-chvi-reviewed-formative.cjs
          node scripts/test-thpt-chvi-reviewed-knowledge-parity.cjs
          node scripts/test-thpt-chvi-student-notes.cjs
          node scripts/test-thpt-chvi-math-block-render.cjs
          node scripts/test-thpt-shared-item-placement.cjs
          node scripts/test-floating-ai-tutor-v1.js
      - name: Validate local preview PowerShell script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/serve-thpt-r4-lan-preview.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "PASS: PowerShell LAN preview runner parses"

      - name: Build alternate THPT preview config (never main config)
        run: mkdocs build -f mkdocs.thpt-preview.yml --clean
      - name: Verify R4 preview pages and assets exist
        run: |
          test -f site-thpt-preview/thpt-preview/index.html
          test -f site-thpt-preview/thpt-preview/home/index.html
          test -f site-thpt-preview/thpt-preview/sgk/chuong-vi/bai-16/index.html
          test -f site-thpt-preview/thpt-preview/sgk/chuong-i/bai-1/index.html
          test -f site-thpt-preview/thpt-preview/sgk/chuong-i/bai-2/index.html
          test -f site-thpt-preview/thpt-preview/thu-vien/tu-luan-chuong-i/index.html
          test -f site-thpt-preview/assets/images/thpt/THPT_G10_B01_IMPLICATION_DIVISIBILITY_D5_R01.svg
          test -f site-thpt-preview/thpt-preview/sgk/chuong-ii/bai-3/index.html
          test -f site-thpt-preview/thpt-preview/sgk/chuong-ii/bai-4/index.html
          test -f site-thpt-preview/thpt-preview/thu-vien/tu-luan-chuong-ii/index.html
          test -f site-thpt-preview/assets/images/thpt/THPT_G10_B03_HALFPLANES_D5_R01.svg
          test -f site-thpt-preview/thpt-preview/sgk/chuong-ix/bai-26/index.html
          test -f site-thpt-preview/thpt-preview/sgk/chuong-ix/bai-27/index.html
          test -f site-thpt-preview/assets/images/thpt/THPT_G10_B27_WITHOUT_REPLACEMENT_TREE.svg
          test -f site-thpt-preview/thpt-preview/chuyen-de/ham-so/kien-thuc/index.html
          test -f site-thpt-preview/thpt-preview/thu-vien/index.html
          test -f site-thpt-preview/assets/javascripts/thpt-r4-preview.js
          test -f site-thpt-preview/assets/stylesheets/thpt-r4-preview.css
          echo 'PASS: THPT R4 MkDocs preview paths built. No deployment, academic approval or browser QA implied.'

      - name: Build and verify one-site THCS + THPT candidate (never deploy)
        run: |
          mkdocs build --strict
          node scripts/assemble-thpt-site.cjs
          node scripts/test-thpt-chvi-math-block-render.cjs --built
          node scripts/test-thpt-g10-sgk-display-ui.cjs --built
          node scripts/test-thpt-g10-chiv-b09-b11-release-integration.cjs --built
          node scripts/test-thpt-g11-chi-b01-b02-release-integration.cjs --built
          node scripts/test-thpt-chvi-student-notes.cjs --built
      - name: Verify combined build has no backend
        run: |
          test -f site/index.html
          test -f site/thcs/index.html
          test -f site/kien-thuc/04-bieu-thuc-dai-so/index.html
          test -f site/thpt-preview/sgk/chuong-vi/bai-16/index.html
          test ! -e site/assets/javascripts/thpt-protected-readiness-v1.js
          test ! -e site/assets/javascripts/thpt-formative-exposure-v1.js
      - name: Install isolated Chromium test dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Issue 662 QA-only self-check · Final Submit / formats / no evidence writes
        run: node scripts/test-thpt-self-check-qa-browser.cjs
      - name: Browser smoke test · desktop / iPhone / iPad simulation
        run: |
          python -m http.server 8765 --directory site > /tmp/thpt-r4-combined-http.log 2>&1 &
          sleep 2
          node scripts/test-thpt-r4-preview-browser.js
      - name: SGK and Chuyên đề search QA · class/chapter/lesson · mobile / iPad / desktop
        run: node scripts/test-thpt-r4-search-browser.cjs
      - name: Integrated PR651/652 question-first compact and interactive browser QA
        run: |
          node scripts/test-thpt-formative-actions-ui-browser.cjs
          node scripts/test-thpt-interactive-compact-browser.cjs
      - name: ChVI D6 Academic PASS source lock and formative modal QA · desktop/mobile emulation
        run: node scripts/test-thpt-chvi-d6-browser-smoke.cjs
      - name: ChI B01/B02 original canonical/D6/D5 browser QA · mobile / iPad / desktop
        run: node scripts/test-thpt-g10-chi-browser-smoke.cjs
      - name: ChII B03/B04 browser QA mobile / iPad / desktop
        run: node scripts/test-thpt-g10-chii-browser-smoke.cjs
      - name: ChIII B05/B06 browser QA mobile / iPad / desktop
        run: node scripts/test-thpt-g10-chiii-browser-smoke.cjs
      - name: ChIV B07/B08 browser QA mobile / iPad / desktop
        run: node scripts/test-thpt-g10-chiv-b07-b08-browser-smoke.cjs
      - name: ChIV B09/B10/B11 browser QA mobile / iPad / desktop
        run: node scripts/test-thpt-g10-chiv-b09-b11-browser-smoke.cjs
      - name: G11 ChI B01/B02 browser QA mobile / tablet / desktop
        run: node scripts/test-thpt-g11-chi-b01-b02-browser-smoke.cjs
      - name: Academic Presentation QA pilot · MathJax overflow / 390 820 1440
        run: node scripts/test-thpt-academic-presentation-browser.cjs
      - name: Academic Presentation QA G10 B03 · 390 820 1440
        run: node scripts/test-thpt-g10-b03-ap-browser.cjs
      - name: Academic Presentation QA G10 vectors · 390 820 1440
        run: node scripts/test-thpt-ap-vector-knowledge-browser.cjs
      - name: ChIX reviewed D5/D6 browser smoke · mobile / iPad / desktop
        run: node scripts/test-thpt-g10-chix-browser-smoke.cjs
      - name: Emulate old and new GitHub Pages paths, without renaming the repo
        run: |
          mkdir -p rename-path-smoke
          ln -s ../site rename-path-smoke/roadmap-toan-thcs
          ln -s ../site rename-path-smoke/self-learning-math
          python -m http.server 8766 --directory rename-path-smoke > /tmp/self-learning-math-rename-smoke.log 2>&1 &
          sleep 2
          node scripts/test-self-learning-math-rename-browser.cjs
