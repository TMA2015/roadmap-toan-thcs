name: THPT R4 MkDocs Preview QA (no deploy)

on:
  pull_request:
    paths:
      - 'mkdocs.thpt-preview.yml'
      - 'docs/thpt-preview/**'
      - 'docs/assets/javascripts/thpt-r4-preview.js'
      - 'docs/assets/javascripts/thpt-protected-readiness-v1.js'
      - 'docs/assets/stylesheets/thpt-r4-preview.css'
      - 'review-packets/thpt-g10-b16-r4/**'
      - 'scripts/serve-thpt-r4-lan-preview.ps1'
      - 'scripts/test-thpt-r4-preview-browser.js'
      - 'services/thpt-readiness/**'
      - 'scripts/test-thpt-readiness-secure.mjs'
      - 'scripts/test-thpt-readiness-d1-schema.py'
      - '.github/workflows/thpt-r4-preview-quality.yml'

permissions:
  contents: read

jobs:
  preview-only:
    name: Build R4 preview without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MkDocs Material
        run: python -m pip install 'mkdocs-material>=9,<10'
      - name: Validate scoped THPT JavaScript syntax
        run: |
          node --check docs/assets/javascripts/thpt-r4-preview.js
          node --check docs/assets/javascripts/thpt-protected-readiness-v1.js
      - name: Secure THPT assessment service — source and isolation QA
        run: |
          node --check services/thpt-readiness/assessment-service.mjs
          node --check services/thpt-readiness/worker.mjs
          node scripts/test-thpt-readiness-secure.mjs
          python scripts/test-thpt-readiness-d1-schema.py
      - name: Validate local preview PowerShell script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/serve-thpt-r4-lan-preview.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "PASS: PowerShell LAN preview runner parses"

      - name: Build alternate THPT preview config (never main config)
        run: mkdocs build -f mkdocs.thpt-preview.yml --clean
      - name: Verify R4 preview pages and assets exist
        run: |
          test -f site-thpt-preview/thpt-preview/index.html
          test -f site-thpt-preview/thpt-preview/home/index.html
          test -f site-thpt-preview/thpt-preview/sgk/chuong-vi/bai-16/index.html
          test -f site-thpt-preview/thpt-preview/chuyen-de/ham-so/kien-thuc/index.html
          test -f site-thpt-preview/thpt-preview/thu-vien/index.html
          test -f site-thpt-preview/assets/javascripts/thpt-r4-preview.js
          test -f site-thpt-preview/assets/javascripts/thpt-protected-readiness-v1.js
          test -f site-thpt-preview/assets/stylesheets/thpt-r4-preview.css
          echo 'PASS: THPT R4 MkDocs preview paths built. No deployment, academic approval or browser QA implied.'

      - name: Install isolated Chromium test dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Browser smoke test · desktop / iPhone / iPad simulation
        run: |
          python -m http.server 8765 --directory site-thpt-preview > /tmp/thpt-r4-preview-http.log 2>&1 &
          sleep 2
          node scripts/test-thpt-r4-preview-browser.js
