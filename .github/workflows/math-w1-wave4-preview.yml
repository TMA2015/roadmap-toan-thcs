name: W1 Wave4 isolated owner preview
on:
  push:
    branches:
      - feature/math-w1-wave4-frequency-tables-20261015

permissions:
  contents: write

concurrency:
  group: math-w1-wave4-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build source-locked isolated preview
        run: |
          pip install mkdocs-material
          node scripts/test-math-w1-rich-practice-wave4-v1.js
          mkdocs build --strict
      - name: Publish only PR462 preview subtree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/math-pages origin/gh-pages
          cd /tmp/math-pages
          mkdir -p preview/w1-wave4-462
          rsync -a --delete "$GITHUB_WORKSPACE/site/" preview/w1-wave4-462/
          git add preview/w1-wave4-462
          if ! git diff --cached --quiet; then
            git commit -m "preview(math): isolated PR462 wave4 frequency tables"
            git push origin HEAD:gh-pages
          fi
