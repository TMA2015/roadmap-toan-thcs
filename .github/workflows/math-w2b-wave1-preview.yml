name: W2B Wave1 isolated owner preview
on:
  push:
    branches:
      - feature/math-w2b-wave1-constant-v6-20261016

permissions:
  contents: write

concurrency:
  group: math-w2b-wave1-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify source and build preview
        run: |
          pip install mkdocs-material
          node scripts/audit-math-w2b-live-bank-r1.js
          node scripts/test-math-w2b-rich-practice-wave1-v1.js
          mkdocs build --strict
      - name: Publish isolated owner-preview subtree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/math-pages origin/gh-pages
          cd /tmp/math-pages
          mkdir -p preview/w2b-wave1-468
          rsync -a --delete "$GITHUB_WORKSPACE/site/" preview/w2b-wave1-468/
          git add preview/w2b-wave1-468
          if ! git diff --cached --quiet; then
            git commit -m "preview(math): PR468 W2B algebra owner review"
            git push origin HEAD:gh-pages
          fi
