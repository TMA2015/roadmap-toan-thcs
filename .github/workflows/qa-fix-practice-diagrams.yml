name: QA and fix Practice diagrams

on:
  push:
    branches:
      - feature/topics17-20-diagrams-v1

permissions:
  contents: write

jobs:
  qa-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/topics17-20-diagrams-v1
          fetch-depth: 0

      - name: Rewrite diagram families with exact geometry
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          ROOT = Path('.')
          PRACTICE = ROOT / 'docs/assets/data/practice'
          DIAGRAMS = ROOT / 'docs/assets/diagrams/practice'

          STYLE = '''<style>
            .g{fill:none;stroke:#222;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
            .thin{fill:none;stroke:#555;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
            .dash{fill:none;stroke:#666;stroke-width:1.6;stroke-dasharray:6 5}
            .pt{fill:#222}
            .txt{font:16px system-ui,sans-serif;fill:#222}
            .small{font:14px system-ui,sans-serif;fill:#444}
          </style>'''

          def wrap(body, width=440, height=280):
              return f'<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}" viewBox="0 0 {width} {height}" role="img">\n{STYLE}\n{body}\n</svg>\n'

          def similar_svg():
              return wrap('''
          <path class="g" d="M150 45 L60 215 L240 215 Z"/>
          <path class="g" d="M340 95 L281.5 205.5 L398.5 205.5 Z"/>
          <text class="txt" x="145" y="36">A</text><text class="txt" x="43" y="235">B</text><text class="txt" x="244" y="235">C</text>
          <text class="txt" x="335" y="86">D</text><text class="txt" x="266" y="226">E</text><text class="txt" x="401" y="226">F</text>
          <text class="small" x="117" y="256">Hai tam giác được vẽ đồng dạng; kích thước có thể khác nhau.</text>''')

          def right_altitude_svg():
              return wrap('''
          <path class="g" d="M170 105 L80 225 L330 225 Z"/>
          <path class="g" d="M170 105 L170 225"/>
          <path class="thin" d="M158 121 L174 133 L186 117"/>
          <path class="thin" d="M170 205 L190 205 L190 225"/>
          <circle class="pt" cx="170" cy="225" r="4"/>
          <text class="txt" x="163" y="93">A</text><text class="txt" x="62" y="245">B</text><text class="txt" x="336" y="245">C</text><text class="txt" x="176" y="245">H</text>
          <text class="small" x="198" y="190">AH ⟂ BC</text>''')

          def tangent_radius_svg():
              return wrap('''
          <circle class="g" cx="170" cy="140" r="88"/><circle class="pt" cx="170" cy="140" r="4"/>
          <circle class="pt" cx="258" cy="140" r="4"/><circle class="pt" cx="258" cy="48" r="4"/>
          <path class="g" d="M170 140 L258 140 M258 48 L258 222"/>
          <path class="thin" d="M246 140 L246 128 L258 128"/>
          <text class="txt" x="151" y="160">O</text><text class="txt" x="266" y="145">T</text><text class="txt" x="266" y="54">P</text>
          <text class="small" x="276" y="92">tiếp tuyến PT</text>''')

          def tangent_proof_svg():
              return wrap('''
          <circle class="g" cx="170" cy="140" r="88"/><circle class="pt" cx="170" cy="140" r="4"/>
          <circle class="pt" cx="258" cy="140" r="4"/>
          <path class="g" d="M170 140 L258 140 M258 48 L258 222"/>
          <path class="thin" d="M246 140 L246 128 L258 128"/>
          <text class="txt" x="151" y="160">O</text><text class="txt" x="266" y="145">A</text>
          <text class="small" x="271" y="72">d</text><text class="small" x="190" y="130">OA ⟂ d</text>''')

          def tangent_secant_svg():
              return wrap('''
          <circle class="g" cx="180" cy="150" r="80"/><circle class="pt" cx="180" cy="150" r="4"/>
          <circle class="pt" cx="220" cy="80.718" r="4"/><circle class="pt" cx="340" cy="150" r="4"/>
          <circle class="pt" cx="260" cy="150" r="4"/><circle class="pt" cx="100" cy="150" r="4"/>
          <path class="g" d="M340 150 L220 80.718 M340 150 L100 150"/>
          <path class="thin" d="M228.66 95.72 L213.66 104.38 L205 89.38"/>
          <text class="txt" x="160" y="171">O</text><text class="txt" x="209" y="70">T</text><text class="txt" x="347" y="155">P</text>
          <text class="txt" x="264" y="171">A</text><text class="txt" x="87" y="171">B</text>
          <text class="small" x="256" y="102">PT tiếp tuyến</text><text class="small" x="271" y="139">PAB cát tuyến</text>''')

          def chords_svg():
              return wrap('''
          <circle class="g" cx="220" cy="140" r="105"/>
          <path class="g" d="M136 77 L304 77 M157 224 L283 56"/>
          <circle class="pt" cx="267.25" cy="77" r="4"/>
          <circle class="pt" cx="136" cy="77" r="4"/><circle class="pt" cx="304" cy="77" r="4"/>
          <circle class="pt" cx="157" cy="224" r="4"/><circle class="pt" cx="283" cy="56" r="4"/>
          <text class="txt" x="119" y="70">A</text><text class="txt" x="310" y="72">B</text><text class="txt" x="142" y="244">C</text><text class="txt" x="290" y="53">D</text><text class="txt" x="272" y="96">I</text>''')

          def cyclic_svg():
              return wrap('''
          <circle class="g" cx="220" cy="140" r="105"/>
          <path class="g" d="M136 77 L304 77 L283 224 L157 224 Z"/>
          <circle class="pt" cx="136" cy="77" r="4"/><circle class="pt" cx="304" cy="77" r="4"/>
          <circle class="pt" cx="283" cy="224" r="4"/><circle class="pt" cx="157" cy="224" r="4"/>
          <text class="txt" x="120" y="69">A</text><text class="txt" x="310" y="69">B</text><text class="txt" x="289" y="244">C</text><text class="txt" x="140" y="244">D</text>''')

          def two_right_svg():
              return wrap('''
          <circle class="g" cx="220" cy="140" r="120"/>
          <path class="g" d="M100 140 L220 20 L340 140 M100 140 L220 260 L340 140"/>
          <circle class="pt" cx="100" cy="140" r="4"/><circle class="pt" cx="340" cy="140" r="4"/>
          <circle class="pt" cx="220" cy="20" r="4"/><circle class="pt" cx="220" cy="260" r="4"/>
          <path class="thin" d="M210.1 29.9 L220 39.8 L229.9 29.9"/>
          <path class="thin" d="M210.1 250.1 L220 240.2 L229.9 250.1"/>
          <text class="txt" x="83" y="145">A</text><text class="txt" x="347" y="145">B</text><text class="txt" x="226" y="18">E</text><text class="txt" x="226" y="274">F</text>
          <text class="small" x="167" y="136">AB là đường kính</text>''')

          def median_svg():
              return wrap('''
          <path class="g" d="M220 35 L60 225 L380 225 Z"/><path class="g" d="M220 35 L220 225"/>
          <circle class="pt" cx="220" cy="161.667" r="4"/><circle class="pt" cx="220" cy="225" r="4"/>
          <text class="txt" x="226" y="31">A</text><text class="txt" x="44" y="244">B</text><text class="txt" x="385" y="244">C</text><text class="txt" x="228" y="166">G</text><text class="txt" x="228" y="244">M</text>
          <text class="small" x="238" y="105">AG = 2GM</text>''')

          manifests = sorted(PRACTICE.glob('*.manifest.json'))
          questions = []
          for mp in manifests:
              manifest = json.loads(mp.read_text(encoding='utf-8'))
              for source in manifest.get('sources', []):
                  chunk = json.loads((mp.parent / source).read_text(encoding='utf-8'))
                  questions.extend(chunk.get('questions', []))

          changed = Counter()
          reviewed = 0
          for item in questions:
              diagram = item.get('diagram')
              if not isinstance(diagram, dict):
                  continue
              qid = item.get('id', '')
              tags = item.get('tags', {})
              topic = str(tags.get('topic', ''))
              skills = tags.get('skill', []) or []
              skill = skills[0] if skills else ''
              if not qid or not topic[:2].isdigit():
                  continue
              topic_no = topic[:2]
              path = DIAGRAMS / str(int(topic_no)) / f'{qid}.svg'
              if not path.exists():
                  continue
              reviewed += 1
              replacement = None
              family = None

              if topic_no == '15':
                  replacement, family = median_svg(), 'median-exact'
              elif topic_no == '17' and skill == 'dong-dang-gg':
                  replacement, family = similar_svg(), 'similar-exact'
              elif topic_no == '18' and skill in {'he-thuc-canh','he-thuc-duong-cao','ket-hop-he-thuc'}:
                  replacement, family = right_altitude_svg(), 'right-altitude-exact'
              elif topic_no == '19':
                  if skill == 'tiep-tuyen-ban-kinh':
                      replacement, family = tangent_radius_svg(), 'tangent-radius'
                  elif skill == 'tiep-tuyen-cat-tuyen':
                      replacement, family = tangent_secant_svg(), 'tangent-secant'
                  elif skill == 'chung-minh-tiep-tuyen':
                      replacement, family = tangent_proof_svg(), 'tangent-proof'
                  elif skill == 'hai-day-cat-nhau':
                      replacement, family = chords_svg(), 'chords-on-circle'
                  elif skill in {'tu-giac-noi-tiep','dau-hieu-noi-tiep'}:
                      replacement, family = cyclic_svg(), 'cyclic-on-circle'
              elif topic_no == '20':
                  if skill == 'hai-goc-vuong-noi-tiep':
                      replacement, family = two_right_svg(), 'two-right-diameter'
                  elif skill in {'noi-tiep-dong-dang','bai-toan-tong-hop'}:
                      replacement, family = cyclic_svg(), 'cyclic-on-circle'
                  elif skill == 'tam-giac-vuong-dong-dang':
                      replacement, family = right_altitude_svg(), 'right-altitude-exact'
                  elif skill == 'tiep-tuyen-chung-minh':
                      replacement, family = tangent_proof_svg(), 'tangent-proof'

              if replacement is not None and path.read_text(encoding='utf-8') != replacement:
                  path.write_text(replacement, encoding='utf-8')
                  changed[family] += 1

          # Fail if any known obsolete geometries remain in referenced SVGs.
          obsolete = {
              'old-tangent': 'M170 140 L250 102 L390 102',
              'old-altitude': 'M80 45 L176 225',
              'old-cyclic': 'M135 65 L315 88 L300 205 L120 195',
              'old-chords': 'M115 105 L330 190 M135 215 L310 65',
              'old-similar': 'M45 220 L150 45 L235 220 Z',
          }
          bad = []
          for item in questions:
              d = item.get('diagram')
              if not isinstance(d, dict):
                  continue
              topic = str(item.get('tags', {}).get('topic', ''))
              qid = item.get('id', '')
              if not topic[:2].isdigit() or not qid:
                  continue
              path = DIAGRAMS / str(int(topic[:2])) / f'{qid}.svg'
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              for name, sig in obsolete.items():
                  if sig in text:
                      bad.append(f'{path}: {name}')
          if bad:
              raise SystemExit('Obsolete geometry remains:\n' + '\n'.join(bad))

          print(f'Reviewed referenced diagrams: {reviewed}')
          print('Updated diagram families:')
          for key, value in sorted(changed.items()):
              print(f'  {key}: {value}')
          PY

      - name: Validate Practice Banks
        run: python validate_practice_bank.py

      - name: Commit QA diagram fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/diagrams/practice
          if git diff --cached --quiet; then
            echo "No diagram changes to commit."
            exit 0
          fi
          git commit -m "QA hình học: sửa quan hệ hình vẽ Practice 13-20"
          git push origin "HEAD:${GITHUB_REF_NAME}"
