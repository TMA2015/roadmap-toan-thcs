name: Topic 23 empirical probability visual apply once

on:
  push:
    branches:
      - topic23-empirical-probability-visual-v1
    paths:
      - topic23_empirical_visual_apply_temp.py
      - .github/workflows/topic23-empirical-visual-apply-once.yml

permissions:
  contents: write

jobs:
  apply-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: topic23-empirical-probability-visual-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply Topic 23 empirical visual embed
        run: python topic23_empirical_visual_apply_temp.py
      - name: Validate Practice Banks
        run: python validate_practice_bank.py
      - name: Audit content structure
        run: python audit_content_structure.py --write
      - name: Roadmap dependency and link QA
        run: python check_roadmap_dependencies.py
      - name: SVG integrity QA
        run: python check_svg_integrity.py
      - name: Visual coverage audit
        run: python audit_visual_coverage.py
      - name: Audit curated Practice quality
        run: python audit_practice_quality.py
      - name: Install MkDocs
        run: pip install 'mkdocs==1.6.1' 'mkdocs-material==9.7.7'
      - name: Strict MkDocs build
        run: python -m mkdocs build --strict
      - name: Diff check
        run: git diff --check
      - name: Commit product changes
        run: |
          git config user.name 'TMA2015'
          git config user.email '143519853+TMA2015@users.noreply.github.com'
          git add docs/kien-thuc/23-xac-suat/index.md docs/roadmap/audit-noi-dung-25-chuyen-de.md
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
          else
            git commit -m 'Gắn hình xác suất thực nghiệm vào Chuyên đề 23'
            git push origin HEAD:topic23-empirical-probability-visual-v1
          fi
