name: Practice coverage apply 21-25 once

on:
  push:
    branches:
      - practice-bank-coverage-21-25-v1
    paths:
      - practice_coverage_21_25_apply_temp.py
      - .github/workflows/practice-coverage-apply-21-25-once.yml

permissions:
  contents: write

jobs:
  apply-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practice-bank-coverage-21-25-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply Practice Bank coverage changes
        run: python practice_coverage_21_25_apply_temp.py
      - name: Validate Practice Banks
        run: python validate_practice_bank.py
      - name: Verify targeted coverage and uniqueness
        run: |
          python - <<'PY'
          import json, unicodedata
          from pathlib import Path
          from collections import Counter
          base=Path('docs/assets/data/practice')
          prefixes=['21-thong-ke-v1','22-dai-luong-dac-trung-v1','23-xac-suat-v1','24-bai-toan-thuc-te-v1','25-tong-hop-on-thi-10-v1']
          banks={}
          allq=[]
          for prefix in prefixes:
              qs=[]
              for i in range(1,5):
                  qs += json.loads((base/f'{prefix}-{i:02d}.json').read_text(encoding='utf-8'))['questions']
              banks[prefix]=qs; allq += qs
              assert len(qs)==120, (prefix,len(qs))
          def count_skill(prefix,skill):
              return sum(skill in q['tags']['skill'] for q in banks[prefix])
          assert count_skill('21-thong-ke-v1','doc-bieu-do-cot-kep')==8
          assert count_skill('21-thong-ke-v1','bieu-do-quat-tron')==8
          assert count_skill('21-thong-ke-v1','du-lieu-ghep-nhom')==8
          assert count_skill('23-xac-suat-v1','xac-suat-thuc-nghiem')==10
          ids={q['id'] for q in allq}
          for qid in ['MOD24V1__121','MOD24V1__126','REV25V1_121','REV25V1_130']:
              assert qid in ids, qid
          def norm(s):
              s=unicodedata.normalize('NFD',s.lower())
              return ''.join(c for c in s if unicodedata.category(c)!='Mn').strip()
          prompts=[norm(q['question']) for q in allq]
          assert len(allq)==600
          assert len(set(prompts))==600, (len(allq),len(set(prompts)))
          print('PASS: targeted coverage + 600/600 unique prompts')
          PY
      - name: Audit structure
        run: python audit_content_structure.py --write
      - name: Roadmap dependency and link QA
        run: python check_roadmap_dependencies.py
      - name: SVG integrity QA
        run: python check_svg_integrity.py
      - name: Audit curated Practice quality
        run: python audit_practice_quality.py
      - name: Install MkDocs
        run: pip install 'mkdocs==1.6.1' 'mkdocs-material==9.7.7'
      - name: Strict MkDocs build
        run: python -m mkdocs build --strict
      - name: Diff check
        run: git diff --check
      - name: Commit Practice Bank coverage update
        run: |
          git config user.name 'TMA2015'
          git config user.email '143519853+TMA2015@users.noreply.github.com'
          git add docs/assets/data/practice docs/roadmap/audit-practice-coverage-21-25-v1.md docs/roadmap/audit-noi-dung-25-chuyen-de.md
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
          else
            git commit -m 'Đồng bộ độ phủ Practice Bank 21-25'
            git push origin HEAD:practice-bank-coverage-21-25-v1
          fi
