name: QA duplicate prompts 21-25

on:
  push:
    branches:
      - feature/topics21-25-practice-banks-v1

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/topics21-25-practice-banks-v1
      - name: Scan exact duplicate question prompts
        run: |
          python - <<'PY'
          import json, glob
          from collections import Counter, defaultdict
          for mf in sorted(glob.glob('docs/assets/data/practice/2[1-5]-*.manifest.json')):
              m=json.load(open(mf,encoding='utf-8'))
              rows=[]
              for src in m['sources']:
                  c=json.load(open('docs/assets/data/practice/'+src,encoding='utf-8'))
                  rows += c['questions']
              counts=Counter(q['question'].strip() for q in rows)
              dups={p:n for p,n in counts.items() if n>1}
              by_skill=defaultdict(int)
              for q in rows:
                  if counts[q['question'].strip()]>1:
                      for s in q['tags']['skill']:
                          by_skill[s]+=1
              print('\n',m['bank_id'],m['topic']['title'])
              print('questions=',len(rows),'duplicate_prompt_instances=',sum(dups.values()),'unique_repeated_prompts=',len(dups))
              print('by_skill=',dict(sorted(by_skill.items())))
              for p,n in list(sorted(dups.items(), key=lambda x:(-x[1],x[0])))[:8]:
                  print(f'  x{n}: {p[:140]}')
          PY
