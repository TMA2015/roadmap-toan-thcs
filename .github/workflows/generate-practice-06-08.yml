name: QA and Fix Practice Banks 06-08

on:
  push:
    branches:
      - feature/topics06-08-practice-banks-v1
    paths:
      - tools/practice-batch-06-08/fix_topic06_duplicates.py
      - .github/workflows/generate-practice-06-08.yml

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Replace exact duplicates in Topic 06
        run: python tools/practice-batch-06-08/fix_topic06_duplicates.py

      - name: Validate all Practice Banks
        run: python validate_practice_bank.py

      - name: Ensure no exact duplicates in Topics 06-08
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          root = Path('docs/assets/data/practice')
          total_exact = 0
          for slug in ('06-phan-tich-da-thuc', '07-phan-thuc-dai-so', '08-phuong-trinh-bat-phuong-trinh'):
              manifest = json.loads((root / f'{slug}-v1.manifest.json').read_text(encoding='utf-8'))
              by_content = defaultdict(list)
              for source in manifest['sources']:
                  chunk = json.loads((root / source).read_text(encoding='utf-8'))
                  for q in chunk['questions']:
                      key = (q['question'], tuple(q['options']))
                      by_content[key].append(q['id'])
              dup = {key: ids for key, ids in by_content.items() if len(ids) > 1}
              count = sum(len(ids)-1 for ids in dup.values())
              total_exact += count
              print(f'{slug}: {count} exact duplicate occurrences')
          if total_exact:
              raise SystemExit(f'Found {total_exact} exact duplicate occurrences')
          print('No exact duplicate questions in Topics 06-08.')
          PY

      - name: Commit corrected Topic 06 chunks
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/data/practice/06-phan-tich-da-thuc-v1-*.json
          if git diff --cached --quiet; then
            echo "No corrections to commit."
            exit 0
          fi
          git commit -m "Loại câu trùng trong Practice Bank Chuyên đề 06"
          git push origin "HEAD:${GITHUB_REF_NAME}"
