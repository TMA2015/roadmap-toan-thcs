name: Deploy MkDocs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install mkdocs-material

      - name: Run Roadmap dependency and link QA
        run: python check_roadmap_dependencies.py

      - name: Run Golden Template pilot QA
        run: |
          node scripts/test-golden-template.js
          node scripts/test-topic07-core-route.js
          node scripts/test-core07-modal-skill-coverage.js
          node scripts/test-core07-plus2-math-and-evidence.js
          node scripts/test-core04-06-teaching-rollout.js
          node scripts/test-core08-12-teaching-rollout.js
          node scripts/test-core13-15-geometry-rollout.js
          node scripts/test-core16-18-geometry-rollout.js
          node scripts/test-core19-r2-release.js
          node scripts/test-core20-v2-release.js
          node --check docs/assets/javascripts/topic-learning-routes-v1.js
          node scripts/test-standalone-learning-batch-a.js
          node scripts/test-core02-23-seven-gap-release.js
          node scripts/test-core-soft-card-style.js
          node scripts/test-core07-teaching-coverage.js --release

      - name: Run Learning Card micro-practice QA
        run: node scripts/test-learning-card-micro-practice.js
      - name: Validate CĐ03 reviewed learning cards
        run: node scripts/test-learning-card-micro-practice.js docs/assets/data/curriculum/topic03-learning-workspace.json docs/assets/data/practice/03-ti-le-ti-le-thuc-micro-v1.json

      - name: Run Golden batch CĐ08-CĐ10 QA
        run: node scripts/test-golden-batch-08-10.js

      - name: Run Golden batch CĐ11-CĐ12 QA
        run: node scripts/test-golden-batch-11-12.js

      - name: Build source-locked Gemini review bundle
        run: node scripts/build-gemini-review-bundle-04-11.js docs/assets/data/collaboration/exports/gemini-review-04-11.json

      - name: Run Geometry Architecture v1 QA
        run: node scripts/test-geometry-architecture-v1.js

      - name: Build Geometry Architecture review bundle
        run: node scripts/build-gemini-geometry-architecture-review.js docs/assets/data/collaboration/exports/gemini-geometry-architecture-v1.json

      - name: Run Golden Geometry CĐ13 QA
        run: node scripts/test-golden-geo13.js

      - name: Build CĐ13 Gemini review bundle
        run: node scripts/build-gemini-geo13-review.js docs/assets/data/collaboration/exports/gemini-geo13-review.json

      - name: Run Golden Geometry CĐ14-CĐ15 QA
        run: node scripts/test-golden-geo14-15.js

      - name: Build CĐ14-CĐ15 Gemini review bundle
        run: node scripts/build-gemini-geo14-15-review.js docs/assets/data/collaboration/exports/gemini-geo14-15-review.json

      - name: Run Golden Geometry CĐ16-CĐ18 QA
        run: node scripts/test-golden-geo16-18.js

      - name: Build CĐ16-CĐ18 Gemini review bundle
        run: node scripts/build-gemini-geo16-18-review.js docs/assets/data/collaboration/exports/gemini-geo16-18-review.json

      - name: Run Golden Geometry CĐ19-CĐ20 QA
        run: node scripts/test-golden-geo19-20.js

      - name: Check CĐ18 SVG pilot geometry and links
        run: node scripts/test-geo18-svg-pilot.js

      - name: Check CĐ19–20 internal SVG replacements
        run: node scripts/test-geo19-20-visual-v1.js

      - name: Check CĐ13–17 internal SVG replacements
        run: node scripts/test-geo13-17-visual-v1.js

      - name: Build CĐ19-CĐ20 Gemini review bundle
        run: node scripts/build-gemini-geo19-20-review.js docs/assets/data/collaboration/exports/gemini-geo19-20-review.json

      - name: Build source-locked CĐ21 Gemini author bundle
        run: node scripts/build-sta21-author-bundle.js docs/assets/data/collaboration/exports/sta21-gemini-author-001.json

      - name: Check CĐ21 Practice Bank integration
        run: node scripts/test-sta21-batch-001.js

      - name: Build source-locked CĐ21 Learn Gemini author bundle
        run: node scripts/build-sta21-learn-bundle.js docs/assets/data/collaboration/exports/sta21-learn-gemini-author-001.json

      - name: Verify CĐ21 Learning Cards and micro-practice
        run: |
          node --check docs/assets/javascripts/topic-workspace-v1.js
          node scripts/test-learning-card-micro-practice.js docs/assets/data/curriculum/topic21-learning-workspace.json docs/assets/data/practice/21-thong-ke-micro-v1.json
          node scripts/test-sta21-learn-001.js
          node scripts/test-sta21-responsive-wording-001.js

      - name: Build source-locked CĐ21 Readiness Gemini author bundle
        run: node scripts/build-sta21-ready-bundle.js docs/assets/data/collaboration/exports/sta21-ready-gemini-author-001.json

      - name: Verify CĐ21 Core Readiness academic and schema QA
        run: node scripts/test-sta21-ready-001.js

      - name: Build source-locked CĐ22 curriculum boundary review bundle
        run: node scripts/build-stat22-map-review-bundle.js docs/assets/data/collaboration/exports/stat22-map-gemini-review-001.json

      - name: Verify CĐ22 Bridge classification and non-gating lessons
        run: node scripts/test-stat22-layer-001.js

      - name: Verify CĐ23 boundaries and practice layer labels
        run: |
          node --check docs/assets/javascripts/practice-engine-v2.js
          node scripts/test-prob23-layer-001.js

      - name: Build source-locked CĐ23 Gemini Learn author bundle
        run: node scripts/build-prob23-learn-bundle.js docs/assets/data/collaboration/exports/prob23-learn-gemini-author-001.json

      - name: Verify CĐ23 Learning Cards and micro-practice
        run: |
          node --check docs/assets/javascripts/topic-workspace-v1.js
          node scripts/test-learning-card-micro-practice.js docs/assets/data/curriculum/topic23-learning-workspace.json docs/assets/data/practice/23-xac-suat-micro-v1.json
          node scripts/test-prob23-learn-001.js

      - name: Verify CĐ23 grade-mapped Core Readiness
        run: node scripts/test-prob23-ready-001.js

      - name: Verify CĐ24–25 non-gating learning journeys
        run: |
          node --check docs/assets/javascripts/topic-workspace-v1.js
          node scripts/test-cross-topic-learning-24-25.js

      - name: Normalize SVG viewBox
        run: python normalize_svg_viewbox.py

      - name: Check SVG integrity
        run: python check_svg_integrity.py

      - name: Audit practice quality
        run: python audit_practice_quality.py

      - name: Validate CT09 Academic Depth P1-A
        run: node scripts/test-topic09-academic-depth-p1a.js
      - name: Validate learner-focused skill metadata
        run: node scripts/test-learner-focus-skill-metadata.js

      - name: Validate CĐ25 display math source
        run: node scripts/test-topic25-math-render.js

      - name: Validate CĐ25 student journey
        run: |
          node --check docs/assets/javascripts/topic-workspace-v1.js
          node --check docs/assets/javascripts/practice-auto-loader.js
          node --check docs/assets/javascripts/topic25-exam-engine-v1.js
          node scripts/test-topic25-student-journey.js
          node scripts/test-topic25-paper-exam-v1.js

      - name: Validate learner Skill Map release
        run: |
          node --check docs/assets/javascripts/skill-map-v2-preview.js
          node scripts/test-skill-map-v2-preview.js
          node scripts/test-skill-map-v2-i6-controlled.js
          node scripts/test-skill-map-v2-i6b-public.js

      - name: Build documentation
        run: mkdocs build --strict

      - name: Validate CĐ25 built display math
        run: node scripts/test-topic25-math-render.js --built

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
