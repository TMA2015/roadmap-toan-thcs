name: Apply rewritten Practice Banks 21-25

on:
  push:
    branches:
      - feature/topics21-25-practice-banks-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/topics21-25-practice-banks-v1
          fetch-depth: 0

      - name: Restore rewritten Practice Banks
        shell: bash
        run: |
          cat .tmp/rewrite21-25.payload.01 \
              .tmp/rewrite21-25.payload.02 \
              .tmp/rewrite21-25.payload.03 \
              .tmp/rewrite21-25.payload.04 \
              .tmp/rewrite21-25.payload.05 \
              .tmp/rewrite21-25.payload.06 \
              .tmp/rewrite21-25.payload.07 \
              .tmp/rewrite21-25.payload.08 \
              .tmp/rewrite21-25.payload.09 \
            | tr -d '\r\n' > /tmp/rewrite21-25.b64
          echo "82f09a760198314bf6cb614869b8b0d73cce3bdc3e92c7be0d2321d309079bf1  /tmp/rewrite21-25.b64" | sha256sum -c -
          base64 -d /tmp/rewrite21-25.b64 > /tmp/rewrite21-25.tgz
          tar -xzf /tmp/rewrite21-25.tgz -C .

      - name: Validate all Practice Banks
        run: python validate_practice_bank.py

      - name: Require zero duplicate prompts in 21-25
        shell: bash
        run: |
          python - <<'PY'
          import glob, json
          from collections import Counter
          failed = []
          for mf in sorted(glob.glob('docs/assets/data/practice/2[1-5]-*.manifest.json')):
              with open(mf, encoding='utf-8') as f:
                  m = json.load(f)
              rows = []
              for src in m['sources']:
                  with open('docs/assets/data/practice/' + src, encoding='utf-8') as f:
                      rows.extend(json.load(f)['questions'])
              counts = Counter(q['question'].strip() for q in rows)
              duplicates = {p: n for p, n in counts.items() if n > 1}
              print(f"{m['bank_id']}: questions={len(rows)}, unique_prompts={len(counts)}, duplicate_prompts={len(duplicates)}")
              if len(rows) != 120 or len(counts) != 120 or duplicates:
                  failed.append(m['bank_id'])
          if failed:
              raise SystemExit('Duplicate-prompt QA failed: ' + ', '.join(failed))
          print('✅ 21–25: 600/600 câu có prompt khác nhau.')
          PY

      - name: Check auto-loader JavaScript
        run: node --check docs/assets/javascripts/practice-auto-loader.js

      - name: Commit rewritten banks
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/data/practice/21-* \
                  docs/assets/data/practice/22-* \
                  docs/assets/data/practice/23-* \
                  docs/assets/data/practice/24-* \
                  docs/assets/data/practice/25-*
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "Nâng chất lượng Practice Bank 21-25: 600 câu không lặp prompt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
