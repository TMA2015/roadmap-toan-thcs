name: Content audit 25 topics

on:
  push:
    branches:
      - content-audit-25-topics-v1

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content-audit-25-topics-v1
          fetch-depth: 0

      - name: Generate content audit report
        run: python audit_content_structure.py --write

      - name: Validate Practice Banks
        run: python validate_practice_bank.py

      - name: Commit audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/audit-noi-dung-25-chuyen-de.md
          if git diff --cached --quiet; then
            echo "No audit report changes."
            exit 0
          fi
          git commit -m "Thêm báo cáo audit nội dung 25 chuyên đề"
          git push origin "HEAD:${GITHUB_REF_NAME}"
