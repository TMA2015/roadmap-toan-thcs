name: W1 Wave2 isolated owner preview
on:
  push:
    branches:
      - feature/math-w1-rich-two-item-wave-20261015
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: math-w1-wave2-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build W1 preview
        run: |
          pip install mkdocs-material
          mkdocs build --strict
          node scripts/test-math-w1-rich-practice-pilot-v1.js
          node scripts/test-math-w1-rich-practice-wave2-v1.js
      - name: Publish ONLY isolated preview subdirectory on gh-pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/math-pages origin/gh-pages
          cd /tmp/math-pages
          mkdir -p preview/w1-wave2-459
          rsync -a --delete "$GITHUB_WORKSPACE/site/" preview/w1-wave2-459/
          git add preview/w1-wave2-459
          if ! git diff --cached --quiet; then
            git commit -m "preview(math): isolated PR459 W1 wave2 owner review"
            git push origin HEAD:gh-pages
          fi
