name: UX mobile print apply once

on:
  push:
    branches:
      - ux-mobile-print-v1
    paths:
      - .github/workflows/ux-mobile-print-apply-once.yml

permissions:
  contents: write

jobs:
  apply-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-mobile-print-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Register global UX stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mkdocs.yml')
          text = p.read_text(encoding='utf-8')
          marker = 'extra_javascript:\n'
          block = 'extra_css:\n  - assets/stylesheets/site-ux.css\n\n'
          if 'assets/stylesheets/site-ux.css' not in text:
              if marker not in text:
                  raise SystemExit('Không tìm thấy extra_javascript trong mkdocs.yml')
              text = text.replace(marker, block + marker, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Validate Practice Banks
        run: python validate_practice_bank.py

      - name: Audit content structure
        run: python audit_content_structure.py

      - name: Roadmap dependency and link QA
        run: python check_roadmap_dependencies.py

      - name: SVG integrity QA
        run: python check_svg_integrity.py

      - name: Visual coverage audit
        run: python audit_visual_coverage.py

      - name: Audit curated Practice quality
        run: python audit_practice_quality.py

      - name: Install MkDocs
        run: pip install 'mkdocs==1.6.1' 'mkdocs-material==9.7.7'

      - name: Strict MkDocs build
        run: python -m mkdocs build --strict

      - name: Verify mobile print CSS is loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          yml = Path('mkdocs.yml').read_text(encoding='utf-8')
          css = Path('docs/assets/stylesheets/site-ux.css').read_text(encoding='utf-8')
          html = Path('site/index.html').read_text(encoding='utf-8')
          assert 'assets/stylesheets/site-ux.css' in yml
          assert 'site-ux.css' in html
          assert '@media (max-width: 700px)' in css
          assert '@media print' in css
          assert 'overflow-x: auto' in css
          assert '.practice-toolbar-actions' in css
          print('Mobile/print UX checks: PASS')
          PY

      - name: Diff check
        run: git diff --check

      - name: Commit MkDocs registration
        run: |
          git config user.name 'TMA2015'
          git config user.email '143519853+TMA2015@users.noreply.github.com'
          git add mkdocs.yml
          if git diff --cached --quiet; then
            echo 'No MkDocs change to commit.'
          else
            git commit -m 'Nạp stylesheet UX mobile và print'
            git push origin HEAD:ux-mobile-print-v1
          fi
