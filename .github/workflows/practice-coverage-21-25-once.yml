name: Practice coverage 21-25 once

on:
  push:
    branches:
      - practice-bank-coverage-21-25-v1
    paths:
      - .github/workflows/practice-coverage-21-25-once.yml

permissions:
  contents: read

jobs:
  duplicates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: practice-bank-coverage-21-25-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Report duplicate prompts
        run: |
          python - <<'PY'
          import json, unicodedata
          from pathlib import Path
          from collections import defaultdict

          base=Path('docs/assets/data/practice')
          prefixes=['21-thong-ke-v1','22-dai-luong-dac-trung-v1','23-xac-suat-v1','24-bai-toan-thuc-te-v1','25-tong-hop-on-thi-10-v1']
          def norm(s):
              s=unicodedata.normalize('NFD',s.lower())
              return ''.join(c for c in s if unicodedata.category(c)!='Mn').strip()
          groups=defaultdict(list)
          for prefix in prefixes:
              for i in range(1,5):
                  data=json.loads((base/f'{prefix}-{i:02d}.json').read_text(encoding='utf-8'))
                  for q in data['questions']:
                      groups[norm(q['question'])].append(q)
          dups=[v for v in groups.values() if len(v)>1]
          print('DUPLICATE GROUPS',len(dups))
          for n,g in enumerate(dups,1):
              print('\nGROUP',n)
              for q in g:
                  print(q['id'], '|', q['tags']['topic'], '|', q['tags']['skill'], '|', q['question'])
          PY
