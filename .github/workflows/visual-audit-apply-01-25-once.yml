name: Visual audit apply 01-25 once

on:
  push:
    branches:
      - visual-audit-01-25-v1
    paths:
      - visual_audit_apply_temp.py
      - .github/workflows/visual-audit-apply-01-25-once.yml

permissions:
  contents: write

jobs:
  apply-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-audit-01-25-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply menu and gallery changes
        run: python visual_audit_apply_temp.py
      - name: Audit visual coverage
        run: python audit_visual_coverage.py
      - name: Validate Practice Banks
        run: python validate_practice_bank.py
      - name: Audit content structure
        run: python audit_content_structure.py --write
      - name: Roadmap dependency and link QA
        run: python check_roadmap_dependencies.py
      - name: SVG integrity QA
        run: python check_svg_integrity.py
      - name: Audit curated Practice quality
        run: python audit_practice_quality.py
      - name: Install MkDocs
        run: pip install 'mkdocs==1.6.1' 'mkdocs-material==9.7.7'
      - name: Strict MkDocs build
        run: python -m mkdocs build --strict
      - name: Diff check
        run: git diff --check
      - name: Commit visual audit product changes
        run: |
          git config user.name 'TMA2015'
          git config user.email '143519853+TMA2015@users.noreply.github.com'
          git add mkdocs.yml docs/huong-dan/qa-diagram-practice.md audit_visual_coverage.py docs/roadmap/audit-truc-quan-01-25-v1.md docs/roadmap/audit-noi-dung-25-chuyen-de.md
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
          else
            git commit -m 'Audit trực quan 01-25 và đưa gallery vào menu'
            git push origin HEAD:visual-audit-01-25-v1
          fi
