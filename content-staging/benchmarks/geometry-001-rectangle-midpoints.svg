<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
  <title id="title">Hình chữ nhật ABCD với M, N là trung điểm và E là giao điểm</title>
  <desc id="desc">ABCD là hình chữ nhật, M là trung điểm AB, N là trung điểm BC, MC và DN cắt nhau tại E.</desc>
  <style>
    .line{fill:none;stroke:#1f2937;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    .helper{fill:none;stroke:#374151;stroke-width:2.2}
    .point{fill:#111827}
    .label{fill:#111827;font:600 20px system-ui,-apple-system,"Segoe UI",sans-serif}
  </style>
  <path class="line" d="M80 80 H560 V380 H80 Z"/>
  <path class="helper" d="M320 80 L560 380"/>
  <path class="helper" d="M80 380 L560 230"/>
  <g class="point">
    <circle cx="80" cy="80" r="4"/><circle cx="560" cy="80" r="4"/>
    <circle cx="560" cy="380" r="4"/><circle cx="80" cy="380" r="4"/>
    <circle cx="320" cy="80" r="4"/><circle cx="560" cy="230" r="4"/>
    <circle cx="464" cy="260" r="4"/>
  </g>
  <g class="label">
    <text x="54" y="70">A</text><text x="572" y="70">B</text>
    <text x="572" y="405">C</text><text x="54" y="405">D</text>
    <text x="310" y="62">M</text><text x="574" y="236">N</text>
    <text x="438" y="286">E</text>
  </g>
</svg>
