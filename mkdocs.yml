site_name: Self-Learning Math
site_description: Nền tảng tự học Toán theo lộ trình — kiến thức, luyện tập, AI Tutor và đánh giá tiến độ. Hiện tập trung Toán THCS lớp 6–9.
site_author: Self-Learning Math
copyright: "Self-Learning Math · by G Learning · Learn · Grow · Go"

theme:
  name: material
  language: vi
  logo: assets/branding/math-app-icon.svg
  favicon: assets/branding/math-app-icon.svg
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Chuyển sang giao diện tối
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang giao diện sáng

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

