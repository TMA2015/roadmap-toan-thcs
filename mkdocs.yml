site_name: Roadmap Toán THCS
site_description: Hệ thống kiến thức Toán THCS lớp 6 đến lớp 9 và chuẩn bị thi vào lớp 10
site_author: Roadmap Toán THCS

theme:
  name: material
  language: vi

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

