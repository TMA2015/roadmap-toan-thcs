<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <rect width="100%" height="100%" fill="white"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700">Lộ trình ôn thi 3 giai đoạn</text>

  <g stroke="black" stroke-width="2" fill="none">
    <rect x="80" y="120" width="220" height="250" rx="18"/>
    <rect x="340" y="120" width="220" height="250" rx="18"/>
    <rect x="600" y="120" width="220" height="250" rx="18"/>
    <line x1="300" y1="245" x2="340" y2="245"/>
    <line x1="560" y1="245" x2="600" y2="245"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="190" y="165" font-size="22" font-weight="700">Giai đoạn 1</text>
    <text x="190" y="205" font-size="18">Củng cố nền tảng</text>
    <text x="190" y="245" font-size="16">Ôn công thức</text>
    <text x="190" y="275" font-size="16">Làm dạng cơ bản</text>
    <text x="190" y="305" font-size="16">Sửa lỗ hổng</text>

    <text x="450" y="165" font-size="22" font-weight="700">Giai đoạn 2</text>
    <text x="450" y="205" font-size="18">Luyện theo chuyên đề</text>
    <text x="450" y="245" font-size="16">Dạng trọng tâm</text>
    <text x="450" y="275" font-size="16">Bài tổng hợp</text>
    <text x="450" y="305" font-size="16">Theo dõi lỗi sai</text>

    <text x="710" y="165" font-size="22" font-weight="700">Giai đoạn 3</text>
    <text x="710" y="205" font-size="18">Luyện đề hoàn chỉnh</text>
    <text x="710" y="245" font-size="16">Bấm giờ</text>
    <text x="710" y="275" font-size="16">Chiến lược điểm số</text>
    <text x="710" y="305" font-size="16">Rà soát lỗi cá nhân</text>
  </g>

  <text x="450" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700">Nguyên tắc: học chắc → luyện đúng dạng → luyện đề → sửa lỗi → lặp lại</text>
  <text x="450" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">Không chuyển sang luyện đề dày đặc khi kiến thức nền còn hổng.</text>
</svg>