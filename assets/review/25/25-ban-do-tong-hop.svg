<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660">
  <rect width="100%" height="100%" fill="white"/>

  <text x="490" y="42" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="26" font-weight="700">
    Bản đồ tổng hợp Toán THCS
  </text>

  <!-- Hộp trung tâm -->
  <rect x="355" y="92" width="270" height="72" rx="16"
        fill="none" stroke="black" stroke-width="2"/>
  <text x="490" y="136" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24" font-weight="700">
    TOÁN THCS 6–9
  </text>

  <!-- Các đường nối -->
  <g stroke="black" stroke-width="2" fill="none">
    <line x1="490" y1="164" x2="155" y2="242"/>
    <line x1="490" y1="164" x2="385" y2="242"/>
    <line x1="490" y1="164" x2="595" y2="242"/>
    <line x1="490" y1="164" x2="825" y2="242"/>
  </g>

  <!-- 4 khung nội dung -->
  <g fill="none" stroke="black" stroke-width="2">
    <rect x="60"  y="242" width="190" height="132" rx="14"/>
    <rect x="290" y="242" width="190" height="132" rx="14"/>
    <rect x="500" y="242" width="190" height="132" rx="14"/>
    <rect x="730" y="242" width="190" height="132" rx="14"/>
  </g>

  <!-- Nội dung khung 1 -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="155" y="286" font-size="20" font-weight="700">SỐ &amp; ĐẠI SỐ</text>
    <text x="155" y="316" font-size="17">02–12</text>
    <text x="155" y="344" font-size="14">Biểu thức • PT</text>
    <text x="155" y="364" font-size="14">Hàm số • Hệ PT</text>
  </g>

  <!-- Nội dung khung 2 -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="385" y="286" font-size="20" font-weight="700">HÌNH HỌC</text>
    <text x="385" y="316" font-size="17">13–20</text>
    <text x="385" y="344" font-size="14">Tam giác • Tròn</text>
    <text x="385" y="364" font-size="14">Lượng giác • Tổng hợp</text>
  </g>

  <!-- Nội dung khung 3 -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="595" y="286" font-size="20" font-weight="700">THỐNG KÊ</text>
    <text x="595" y="316" font-size="17">21–22</text>
    <text x="595" y="344" font-size="14">Dữ liệu • Trung bình</text>
    <text x="595" y="364" font-size="14">Trung vị • Mốt</text>
  </g>

  <!-- Nội dung khung 4 -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="825" y="280" font-size="18" font-weight="700">XÁC SUẤT</text>
    <text x="825" y="304" font-size="18" font-weight="700">&amp; THỰC TẾ</text>
    <text x="825" y="328" font-size="17">23–24</text>
    <text x="825" y="352" font-size="14">Xác suất • Mô hình hóa</text>
  </g>

  <!-- Hộp mục tiêu -->
  <rect x="215" y="455" width="550" height="94" rx="16"
        fill="none" stroke="black" stroke-width="2"/>
  <text x="490" y="492" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="22" font-weight="700">
    Mục tiêu cuối: vận dụng liên mạch để giải đề
  </text>
  <text x="490" y="525" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="18">
    Kiến thức nền → dạng bài → bài tổng hợp → chiến lược thi
  </text>
</svg>