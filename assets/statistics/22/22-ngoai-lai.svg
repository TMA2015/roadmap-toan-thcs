<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460">
  <rect width="100%" height="100%" fill="white"/>
  <text x="380" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Ảnh hưởng của giá trị ngoại lai</text>

  <text x="380" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">Bộ dữ liệu A: 7, 8, 8, 9, 9</text>
  <text x="380" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">Trung bình = 8,2 ; Trung vị = 8</text>

  <text x="380" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">Bộ dữ liệu B: 7, 8, 8, 9, 30</text>
  <text x="380" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">Trung bình = 12,4 ; Trung vị = 8</text>

  <g font-family="Arial, sans-serif" font-size="20">
    <text x="380" y="315" text-anchor="middle" font-weight="700">Giá trị 30 kéo số trung bình tăng mạnh</text>
    <text x="380" y="355" text-anchor="middle">Trong khi trung vị gần như không bị ảnh hưởng</text>
  </g>

  <text x="380" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">Khi có ngoại lai, trung vị thường phản ánh “mức điển hình” tốt hơn</text>
</svg>