<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430">
  <rect width="100%" height="100%" fill="white"/>
  <text x="380" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Trung vị và mốt</text>
  <text x="380" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">Dữ liệu đã sắp xếp: 5, 6, 7, 7, 7, 8, 10</text>

  <g font-family="Arial, sans-serif" font-size="22">
    <text x="380" y="145" text-anchor="middle">Giá trị đứng giữa là 7</text>
    <text x="380" y="190" text-anchor="middle" font-weight="700">Trung vị = 7</text>
    <text x="380" y="260" text-anchor="middle">Giá trị xuất hiện nhiều nhất là 7</text>
    <text x="380" y="305" text-anchor="middle" font-weight="700">Mốt = 7</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="19">
    <text x="140" y="370" text-anchor="middle">5</text>
    <text x="220" y="370" text-anchor="middle">6</text>
    <text x="300" y="370" text-anchor="middle">7</text>
    <text x="380" y="370" text-anchor="middle" font-weight="700">7</text>
    <text x="460" y="370" text-anchor="middle">7</text>
    <text x="540" y="370" text-anchor="middle">8</text>
    <text x="620" y="370" text-anchor="middle">10</text>
  </g>
  <line x1="380" y1="330" x2="380" y2="385" stroke="black" stroke-width="3"/>
</svg>