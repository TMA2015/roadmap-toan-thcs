<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
  <rect width="100%" height="100%" fill="white"/>
  <text x="380" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Số trung bình cộng</text>
  <text x="380" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">Dữ liệu: 6, 7, 7, 8, 9, 9, 10</text>

  <g font-family="Arial, sans-serif" font-size="22">
    <text x="380" y="145" text-anchor="middle">Tổng = 6 + 7 + 7 + 8 + 9 + 9 + 10 = 56</text>
    <text x="380" y="200" text-anchor="middle">Có 7 giá trị</text>
    <text x="380" y="270" text-anchor="middle" font-weight="700">Trung bình = 56 / 7 = 8</text>
  </g>

  <line x1="150" y1="325" x2="610" y2="325" stroke="black" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="18">
    <text x="150" y="355" text-anchor="middle">6</text>
    <text x="227" y="355" text-anchor="middle">7</text>
    <text x="304" y="355" text-anchor="middle">7</text>
    <text x="380" y="355" text-anchor="middle" font-weight="700">8</text>
    <text x="456" y="355" text-anchor="middle">9</text>
    <text x="533" y="355" text-anchor="middle">9</text>
    <text x="610" y="355" text-anchor="middle">10</text>
  </g>
</svg>