<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img" aria-labelledby="title desc">
  <title id="title">Biểu đồ hình quạt tròn</title>
  <desc id="desc">Biểu đồ quạt tròn gồm bốn phần 40 phần trăm, 30 phần trăm, 20 phần trăm và 10 phần trăm, minh họa mối liên hệ giữa tỉ lệ phần trăm và góc ở tâm.</desc>
  <rect width="820" height="500" fill="white"/>
  <text x="410" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Biểu đồ hình quạt tròn</text>
  <text x="410" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">Một tổng thể = 100% = 360°</text>
  <g stroke="white" stroke-width="2">
    <path d="M300 250 L300 120 A130 130 0 0 1 376.4 355.2 Z" fill="#bfdbfe"/>
    <path d="M300 250 L376.4 355.2 A130 130 0 0 1 176.4 290.2 Z" fill="#fed7aa"/>
    <path d="M300 250 L176.4 290.2 A130 130 0 0 1 223.6 144.8 Z" fill="#dcfce7"/>
    <path d="M300 250 L223.6 144.8 A130 130 0 0 1 300 120 Z" fill="#e9d5ff"/>
  </g>
  <circle cx="300" cy="250" r="130" fill="none" stroke="#333" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#222">
    <text x="399" y="222" text-anchor="middle">40%</text>
    <text x="275" y="346" text-anchor="middle">30%</text>
    <text x="203" y="220" text-anchor="middle">20%</text>
    <text x="268" y="165" text-anchor="middle">10%</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#222">
    <rect x="500" y="135" width="20" height="16" fill="#bfdbfe" stroke="#333"/>
    <text x="532" y="149">Đọc sách 40% → 144°</text>
    <rect x="500" y="175" width="20" height="16" fill="#fed7aa" stroke="#333"/>
    <text x="532" y="189">Thể thao 30% → 108°</text>
    <rect x="500" y="215" width="20" height="16" fill="#dcfce7" stroke="#333"/>
    <text x="532" y="229">Âm nhạc 20% → 72°</text>
    <rect x="500" y="255" width="20" height="16" fill="#e9d5ff" stroke="#333"/>
    <text x="532" y="269">Khác 10% → 36°</text>
    <text x="500" y="325" font-weight="700">Công thức đổi:</text>
    <text x="500" y="352">góc ở tâm = tỉ lệ × 360°</text>
    <text x="500" y="379">Ví dụ: 40% × 360° = 144°</text>
  </g>
  <text x="410" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Chỉ dùng khi các phần cùng thuộc một tổng thể và tổng tỉ lệ bằng 100%.</text>
</svg>