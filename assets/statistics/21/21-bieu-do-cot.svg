<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460">
  <rect width="100%" height="100%" fill="white"/>
  <text x="380" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Biểu đồ cột</text>
  <text x="380" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Số học sinh theo mức điểm</text>

  <g stroke="black" stroke-width="2" fill="none">
    <line x1="110" y1="360" x2="670" y2="360"/>
    <line x1="110" y1="360" x2="110" y2="100"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" fill="black">
    <text x="90" y="365" text-anchor="end">0</text>
    <text x="90" y="315" text-anchor="end">1</text>
    <text x="90" y="265" text-anchor="end">2</text>
    <text x="90" y="215" text-anchor="end">3</text>
    <text x="90" y="165" text-anchor="end">4</text>
    <text x="90" y="115" text-anchor="end">5</text>
  </g>

  <g stroke="black" stroke-width="1">
    <line x1="105" y1="310" x2="670" y2="310"/>
    <line x1="105" y1="260" x2="670" y2="260"/>
    <line x1="105" y1="210" x2="670" y2="210"/>
    <line x1="105" y1="160" x2="670" y2="160"/>
    <line x1="105" y1="110" x2="670" y2="110"/>
  </g>

  <g fill="none" stroke="black" stroke-width="2">
    <rect x="160" y="260" width="80" height="100"/>
    <rect x="290" y="160" width="80" height="200"/>
    <rect x="420" y="110" width="80" height="250"/>
    <rect x="550" y="210" width="80" height="150"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="17" fill="black">
    <text x="200" y="388" text-anchor="middle">6 điểm</text>
    <text x="330" y="388" text-anchor="middle">7 điểm</text>
    <text x="460" y="388" text-anchor="middle">8 điểm</text>
    <text x="590" y="388" text-anchor="middle">9 điểm</text>

    <text x="200" y="250" text-anchor="middle">2</text>
    <text x="330" y="150" text-anchor="middle">4</text>
    <text x="460" y="100" text-anchor="middle">5</text>
    <text x="590" y="200" text-anchor="middle">3</text>
  </g>

  <text x="380" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">Chiều cao cột biểu diễn tần số của từng giá trị</text>
</svg>