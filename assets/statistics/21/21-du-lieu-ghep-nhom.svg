<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" role="img" aria-labelledby="title desc">
  <title id="title">Dữ liệu ghép nhóm và quy ước đầu mút</title>
  <desc id="desc">Minh họa dữ liệu chiều cao được chia thành các khoảng không chồng lấn, bảng tần số nhóm và cách xác định giá trị ở biên thuộc đúng một nhóm.</desc>
  <rect width="860" height="520" fill="white"/>
  <text x="430" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Dữ liệu ghép nhóm</text>
  <text x="430" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">Ví dụ: chiều cao học sinh (cm)</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#222">
    <text x="70" y="112" font-weight="700">Dữ liệu gốc:</text>
    <text x="175" y="112">142, 145, 149, 150, 153, 157, 159, 162, 165, 168, 171, 174, 176, 178</text>
  </g>
  <text x="70" y="158" font-family="Arial, sans-serif" font-size="16" font-weight="700">Chia thành các khoảng không chồng lấn:</text>
  <g font-family="Arial, sans-serif" font-size="16" text-anchor="middle">
    <rect x="90" y="185" width="160" height="52" rx="7" fill="#dbeafe" stroke="#244b74" stroke-width="2"/>
    <text x="170" y="217" fill="#222">[140; 150)</text>
    <rect x="270" y="185" width="160" height="52" rx="7" fill="#dcfce7" stroke="#2f6d45" stroke-width="2"/>
    <text x="350" y="217" fill="#222">[150; 160)</text>
    <rect x="450" y="185" width="160" height="52" rx="7" fill="#fed7aa" stroke="#9a4d12" stroke-width="2"/>
    <text x="530" y="217" fill="#222">[160; 170)</text>
    <rect x="630" y="185" width="160" height="52" rx="7" fill="#e9d5ff" stroke="#6b3c91" stroke-width="2"/>
    <text x="710" y="217" fill="#222">[170; 180)</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">
    <text x="170" y="260">142, 145, 149</text>
    <text x="350" y="260">150, 153, 157, 159</text>
    <text x="530" y="260">162, 165, 168</text>
    <text x="710" y="260">171, 174, 176, 178</text>
  </g>
  <g transform="translate(105,300)" font-family="Arial, sans-serif" font-size="15" fill="#222">
    <rect x="0" y="0" width="650" height="125" fill="none" stroke="#333" stroke-width="1.5"/>
    <line x1="260" y1="0" x2="260" y2="125" stroke="#333"/>
    <line x1="440" y1="0" x2="440" y2="125" stroke="#333"/>
    <line x1="0" y1="31" x2="650" y2="31" stroke="#333"/>
    <line x1="0" y1="62" x2="650" y2="62" stroke="#333"/>
    <line x1="0" y1="93" x2="650" y2="93" stroke="#333"/>
    <text x="130" y="22" text-anchor="middle" font-weight="700">Nhóm</text>
    <text x="350" y="22" text-anchor="middle" font-weight="700">Tần số</text>
    <text x="545" y="22" text-anchor="middle" font-weight="700">Tần số tương đối</text>
    <text x="130" y="53" text-anchor="middle">[140;150)</text><text x="350" y="53" text-anchor="middle">3</text><text x="545" y="53" text-anchor="middle">3/14</text>
    <text x="130" y="84" text-anchor="middle">[150;160)</text><text x="350" y="84" text-anchor="middle">4</text><text x="545" y="84" text-anchor="middle">4/14</text>
    <text x="130" y="115" text-anchor="middle">[160;170)</text><text x="350" y="115" text-anchor="middle">3</text><text x="545" y="115" text-anchor="middle">3/14</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#8a3b12">
    <text x="70" y="462" font-weight="700">Điểm biên:</text>
    <text x="160" y="462">150 thuộc [150;160), không thuộc [140;150).</text>
    <text x="70" y="490">Quy ước đầu mút nhất quán giúp mỗi giá trị chỉ được đếm đúng một lần.</text>
  </g>
</svg>