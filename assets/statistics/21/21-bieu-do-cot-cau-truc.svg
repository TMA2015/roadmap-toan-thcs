<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img" aria-labelledby="title desc">
  <title id="title">Cấu trúc của biểu đồ cột</title>
  <desc id="desc">Biểu đồ cột minh họa trục ngang, trục dọc, thang chia, chiều cao cột và cách đọc giá trị.</desc>
  <rect width="820" height="500" fill="white"/>
  <text x="410" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Cấu trúc của biểu đồ cột</text>
  <text x="410" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">Ví dụ: số sách đọc trong một tháng</text>
  <g stroke="#222" stroke-width="2" fill="none">
    <line x1="130" y1="395" x2="680" y2="395"/>
    <line x1="130" y1="395" x2="130" y2="105"/>
  </g>
  <g stroke="#d0d0d0" stroke-width="1">
    <line x1="130" y1="335" x2="680" y2="335"/>
    <line x1="130" y1="275" x2="680" y2="275"/>
    <line x1="130" y1="215" x2="680" y2="215"/>
    <line x1="130" y1="155" x2="680" y2="155"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#222">
    <text x="110" y="400" text-anchor="end">0</text>
    <text x="110" y="340" text-anchor="end">2</text>
    <text x="110" y="280" text-anchor="end">4</text>
    <text x="110" y="220" text-anchor="end">6</text>
    <text x="110" y="160" text-anchor="end">8</text>
    <text x="105" y="120" text-anchor="end">Số sách</text>
  </g>
  <g stroke="#244b74" stroke-width="2" fill="#dbeafe">
    <rect x="190" y="275" width="80" height="120"/>
    <rect x="325" y="215" width="80" height="180"/>
    <rect x="460" y="155" width="80" height="240"/>
    <rect x="595" y="245" width="80" height="150"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#222">
    <text x="230" y="425" text-anchor="middle">An</text>
    <text x="365" y="425" text-anchor="middle">Bình</text>
    <text x="500" y="425" text-anchor="middle">Chi</text>
    <text x="635" y="425" text-anchor="middle">Dũng</text>
    <text x="230" y="265" text-anchor="middle">4</text>
    <text x="365" y="205" text-anchor="middle">6</text>
    <text x="500" y="145" text-anchor="middle">8</text>
    <text x="635" y="235" text-anchor="middle">5</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#8a3b12" stroke="#8a3b12" stroke-width="1.5">
    <line x1="70" y1="225" x2="125" y2="225"/>
    <text x="65" y="218" text-anchor="end" stroke="none">Trục dọc + thang chia</text>
    <line x1="315" y1="462" x2="365" y2="405"/>
    <text x="300" y="470" text-anchor="middle" stroke="none">Trục ngang: các nhóm</text>
    <line x1="710" y1="175" x2="540" y2="175"/>
    <text x="715" y="168" stroke="none">Chiều cao cột</text>
    <text x="715" y="188" stroke="none">→ giá trị cần đọc</text>
  </g>
</svg>