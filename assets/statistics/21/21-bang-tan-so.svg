<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
  <rect width="100%" height="100%" fill="white"/>
  <text x="380" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Bảng tần số</text>
  <text x="380" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Ví dụ: điểm kiểm tra Toán của một nhóm học sinh</text>

  <g font-family="Arial, sans-serif" font-size="18" fill="black" stroke="black" stroke-width="1.4">
    <rect x="100" y="110" width="560" height="200" fill="none"/>
    <line x1="100" y1="160" x2="660" y2="160"/>
    <line x1="100" y1="210" x2="660" y2="210"/>
    <line x1="100" y1="260" x2="660" y2="260"/>
    <line x1="240" y1="110" x2="240" y2="310"/>
    <line x1="340" y1="110" x2="340" y2="310"/>
    <line x1="440" y1="110" x2="440" y2="310"/>
    <line x1="540" y1="110" x2="540" y2="310"/>

    <text x="170" y="142" text-anchor="middle" stroke="none">Điểm</text>
    <text x="290" y="142" text-anchor="middle" stroke="none">6</text>
    <text x="390" y="142" text-anchor="middle" stroke="none">7</text>
    <text x="490" y="142" text-anchor="middle" stroke="none">8</text>
    <text x="600" y="142" text-anchor="middle" stroke="none">9</text>

    <text x="170" y="192" text-anchor="middle" stroke="none">Tần số</text>
    <text x="290" y="192" text-anchor="middle" stroke="none">2</text>
    <text x="390" y="192" text-anchor="middle" stroke="none">4</text>
    <text x="490" y="192" text-anchor="middle" stroke="none">5</text>
    <text x="600" y="192" text-anchor="middle" stroke="none">3</text>

    <text x="170" y="242" text-anchor="middle" stroke="none">Tần suất</text>
    <text x="290" y="242" text-anchor="middle" stroke="none">14,3%</text>
    <text x="390" y="242" text-anchor="middle" stroke="none">28,6%</text>
    <text x="490" y="242" text-anchor="middle" stroke="none">35,7%</text>
    <text x="600" y="242" text-anchor="middle" stroke="none">21,4%</text>

    <text x="170" y="292" text-anchor="middle" stroke="none">Tổng</text>
    <text x="290" y="292" text-anchor="middle" stroke="none">14 học sinh</text>
  </g>

  <text x="380" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">Tần số = số lần một giá trị xuất hiện</text>
  <text x="380" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">Tần suất = tần số / tổng số quan sát</text>
</svg>