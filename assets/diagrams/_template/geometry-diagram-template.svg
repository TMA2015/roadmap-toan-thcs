<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Mẫu hình học Roadmap Toán THCS</title>
  <desc id="desc">Mẫu SVG dùng để dựng hình học thống nhất. Thay toàn bộ hình và nhãn bằng cấu hình đã được kiểm định.</desc>
  <style>
    .geo-line { fill: none; stroke: #1f2937; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .geo-helper { fill: none; stroke: #6b7280; stroke-width: 1.7; stroke-dasharray: 7 6; }
    .geo-point { fill: #111827; }
    .geo-label { fill: #111827; font: 600 20px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .geo-mark { fill: none; stroke: #374151; stroke-width: 2; }
  </style>

  <!--
    QUY TẮC:
    1. Dựng tọa độ từ diagram spec, không vẽ ước lượng rồi gắn ký hiệu.
    2. Quan hệ vuông góc/song song/tiếp tuyến/nội tiếp phải đúng về tọa độ.
    3. Xóa các đối tượng mẫu bên dưới trước khi xuất bản.
  -->

  <path class="geo-line" d="M120 320 L320 80 L520 320 Z"/>
  <circle class="geo-point" cx="120" cy="320" r="4"/>
  <circle class="geo-point" cx="320" cy="80" r="4"/>
  <circle class="geo-point" cx="520" cy="320" r="4"/>
  <text class="geo-label" x="92" y="348">A</text>
  <text class="geo-label" x="312" y="58">B</text>
  <text class="geo-label" x="528" y="348">C</text>
</svg>
