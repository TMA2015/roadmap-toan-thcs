<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500">
  <rect width="100%" height="100%" fill="white"/>
  <text x="410" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Mô hình hóa chiều cao bằng lượng giác</text>

  <g stroke="black" stroke-width="2" fill="none">
    <line x1="130" y1="390" x2="690" y2="390"/>
    <line x1="610" y1="390" x2="610" y2="120"/>
    <line x1="170" y1="390" x2="610" y2="120"/>
  </g>

  <path d="M 225 390 A 55 55 0 0 0 205 350" fill="none" stroke="black" stroke-width="2"/>

  <text x="210" y="355" font-family="Arial, sans-serif" font-size="18">α</text>
  <text x="390" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">d</text>
  <text x="635" y="260" font-family="Arial, sans-serif" font-size="18">h</text>

  <g font-family="Arial, sans-serif" font-size="20">
    <text x="410" y="455" text-anchor="middle">tan α = h / d  ⇒  h = d × tan α</text>
  </g>
</svg>