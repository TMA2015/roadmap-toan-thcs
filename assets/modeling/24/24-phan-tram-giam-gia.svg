<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470">
  <rect width="100%" height="100%" fill="white"/>
  <text x="410" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Bài toán phần trăm – giảm giá</text>
  <text x="410" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Giá niêm yết: 1.200.000 đồng</text>
  <text x="410" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Giảm giá: 25%</text>

  <g font-family="Arial, sans-serif" font-size="22">
    <text x="410" y="190" text-anchor="middle">Tiền giảm = 1.200.000 × 25%</text>
    <text x="410" y="240" text-anchor="middle">= 300.000 đồng</text>
    <text x="410" y="310" text-anchor="middle" font-weight="700">Giá phải trả = 900.000 đồng</text>
  </g>

  <rect x="220" y="360" width="380" height="48" fill="none" stroke="black" stroke-width="2"/>
  <rect x="220" y="360" width="95" height="48" fill="none" stroke="black" stroke-width="2"/>
  <text x="268" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">25%</text>
  <text x="458" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">75% còn lại</text>
</svg>