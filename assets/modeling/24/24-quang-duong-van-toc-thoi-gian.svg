<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460">
  <rect width="100%" height="100%" fill="white"/>
  <text x="410" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Quãng đường – vận tốc – thời gian</text>
  <text x="410" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">Ví dụ: một xe đi 120 km với vận tốc 60 km/h</text>

  <g font-family="Arial, sans-serif" font-size="22">
    <text x="410" y="155" text-anchor="middle">s = v × t</text>
    <text x="410" y="205" text-anchor="middle">120 = 60 × t</text>
    <text x="410" y="255" text-anchor="middle" font-weight="700">t = 2 giờ</text>
  </g>

  <g stroke="black" stroke-width="2" fill="none">
    <line x1="130" y1="350" x2="690" y2="350"/>
    <polygon points="690,350 665,338 665,362" fill="black"/>
  </g>

  <text x="130" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">A</text>
  <text x="690" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">B</text>
  <text x="410" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">120 km</text>
</svg>