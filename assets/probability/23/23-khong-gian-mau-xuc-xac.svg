<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440">
  <rect width="100%" height="100%" fill="white"/>
  <text x="380" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Không gian mẫu khi gieo một con xúc xắc</text>
  <text x="380" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">Ω = {1, 2, 3, 4, 5, 6}</text>

  <g fill="none" stroke="black" stroke-width="2">
    <rect x="95" y="130" width="85" height="85" rx="12"/>
    <rect x="195" y="130" width="85" height="85" rx="12"/>
    <rect x="295" y="130" width="85" height="85" rx="12"/>
    <rect x="395" y="130" width="85" height="85" rx="12"/>
    <rect x="495" y="130" width="85" height="85" rx="12"/>
    <rect x="595" y="130" width="85" height="85" rx="12"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="30" font-weight="700">
    <text x="137" y="183" text-anchor="middle">1</text>
    <text x="237" y="183" text-anchor="middle">2</text>
    <text x="337" y="183" text-anchor="middle">3</text>
    <text x="437" y="183" text-anchor="middle">4</text>
    <text x="537" y="183" text-anchor="middle">5</text>
    <text x="637" y="183" text-anchor="middle">6</text>
  </g>

  <text x="380" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Biến cố A: “ra số chẵn” = {2, 4, 6}</text>
  <text x="380" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700">P(A) = 3 / 6 = 1 / 2</text>
  <text x="380" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">Khi các kết quả đồng khả năng: P(A) = số kết quả thuận lợi / tổng số kết quả</text>
</svg>