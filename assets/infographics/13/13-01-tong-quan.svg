<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Chuyên đề 13 – Góc và quan hệ giữa các đường thẳng</title>
<desc id="desc">Infographic tổng quan nền tảng hình học về điểm, tia, góc, vuông góc, song song và chuỗi suy luận.</desc>
<rect width="1200" height="1600" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke="#111" stroke-width="2">
<text x="600" y="80" text-anchor="middle" font-size="42" font-weight="700" stroke="none">CHUYÊN ĐỀ 13 – GÓC &amp; ĐƯỜNG THẲNG</text>
<text x="600" y="125" text-anchor="middle" font-size="25" stroke="none">Infographic 1 – Tổng quan nền tảng hình học</text>
<rect x="70" y="170" width="1060" height="210" rx="18" fill="none"/>
<text x="100" y="215" font-size="28" font-weight="700" stroke="none">1. Ngôn ngữ hình học cơ bản</text>
<text x="100" y="260" font-size="23" stroke="none">• Điểm – đường thẳng – tia – đoạn thẳng</text>
<text x="100" y="300" font-size="23" stroke="none">• Hai tia đối nhau; trung điểm cần: nằm giữa + hai đoạn bằng nhau</text>
<text x="100" y="340" font-size="23" stroke="none">• Góc có đỉnh và hai cạnh là hai tia</text>
<rect x="70" y="420" width="510" height="350" rx="18" fill="none"/>
<text x="100" y="465" font-size="28" font-weight="700" stroke="none">2. Góc</text>
<text x="100" y="510" font-size="22" stroke="none">Nhọn: 0° &lt; α &lt; 90°</text>
<text x="100" y="550" font-size="22" stroke="none">Vuông: α = 90°</text>
<text x="100" y="590" font-size="22" stroke="none">Tù: 90° &lt; α &lt; 180°</text>
<text x="100" y="630" font-size="22" stroke="none">Bẹt: α = 180°</text>
<text x="100" y="690" font-size="22" stroke="none">Phụ nhau → tổng 90°</text>
<text x="100" y="730" font-size="22" stroke="none">Bù nhau → tổng 180°</text>
<rect x="620" y="420" width="510" height="350" rx="18" fill="none"/>
<text x="650" y="465" font-size="28" font-weight="700" stroke="none">3. Quan hệ đặc biệt</text>
<text x="650" y="515" font-size="22" stroke="none">Đối đỉnh → bằng nhau</text>
<text x="650" y="565" font-size="22" stroke="none">Kề bù → tổng 180°</text>
<text x="650" y="615" font-size="22" stroke="none">Phân giác → chia góc thành 2 góc bằng nhau</text>
<text x="650" y="665" font-size="22" stroke="none">Vuông góc: a ⟂ b</text>
<text x="650" y="715" font-size="22" stroke="none">Song song: a ∥ b</text>
<rect x="70" y="810" width="1060" height="300" rx="18" fill="none"/>
<text x="100" y="855" font-size="28" font-weight="700" stroke="none">4. Mạch suy luận cần nhớ</text>
<text x="120" y="920" font-size="24" stroke="none">Biết số đo góc → dùng đối đỉnh / kề bù / phân giác → tính góc còn lại</text>
<text x="120" y="980" font-size="24" stroke="none">Quan hệ góc → dấu hiệu → chứng minh hai đường thẳng song song</text>
<text x="120" y="1040" font-size="24" stroke="none">Hai đường thẳng song song → tính chất → suy ra quan hệ góc</text>
<rect x="70" y="1150" width="1060" height="270" rx="18" fill="none"/>
<text x="100" y="1195" font-size="28" font-weight="700" stroke="none">5. Vai trò trong Roadmap</text>
<text x="100" y="1250" font-size="22" stroke="none">13. Góc &amp; đường thẳng → 14. Tam giác → 16. Tứ giác → 17. Thales &amp; đồng dạng</text>
<text x="100" y="1300" font-size="22" stroke="none">→ 19. Đường tròn → các bài chứng minh hình học tổng hợp</text>
<text x="100" y="1360" font-size="22" font-weight="700" stroke="none">Mục tiêu: biết quan sát hình → nhận quan hệ → nêu căn cứ → suy luận.</text>
<text x="600" y="1510" text-anchor="middle" font-size="22" stroke="none">Học hình học không chỉ “nhìn hình” — phải gọi đúng tên quan hệ và nêu đúng căn cứ.</text>
</g></svg>