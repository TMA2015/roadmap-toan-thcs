<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>Không gian mẫu, biến cố và xác suất cổ điển</title><desc>Tóm tắt cách lập không gian mẫu, xác định biến cố và tính xác suất cổ điển.</desc><rect width="1200" height="1500" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#111"><text x="600" y="80" text-anchor="middle" font-size="42" font-weight="700">KHÔNG GIAN MẪU – BIẾN CỐ – XÁC SUẤT</text><text x="600" y="125" text-anchor="middle" font-size="24">Ba khái niệm phải phân biệt rõ</text><g stroke="#111" fill="none" stroke-width="3"><rect x="80" y="190" width="1040" height="250" rx="20"/><rect x="80" y="485" width="1040" height="250" rx="20"/><rect x="80" y="780" width="1040" height="260" rx="20"/><rect x="80" y="1085" width="1040" height="270" rx="20"/></g><text x="125" y="245" font-size="30" font-weight="700">1. Không gian mẫu Ω</text><text x="125" y="295" font-size="24">Tập hợp tất cả kết quả có thể của phép thử.</text><text x="125" y="345" font-size="24">Gieo một xúc xắc:</text><text x="405" y="345" font-size="27" font-weight="700">Ω = {1, 2, 3, 4, 5, 6}</text><text x="125" y="395" font-size="23">Suy ra n(Ω) = 6.</text><text x="125" y="540" font-size="30" font-weight="700">2. Biến cố A</text><text x="125" y="590" font-size="24">Là tập con của Ω, gồm các kết quả thỏa điều kiện cần xét.</text><text x="125" y="640" font-size="24">A: “ra số chẵn”</text><text x="395" y="640" font-size="27" font-weight="700">A = {2, 4, 6}</text><text x="125" y="690" font-size="23">Suy ra n(A) = 3.</text><text x="125" y="835" font-size="30" font-weight="700">3. Xác suất cổ điển</text><text x="125" y="890" font-size="28" font-weight="700">P(A) = n(A) / n(Ω)</text><text x="125" y="940" font-size="24">Điều kiện: không gian mẫu hữu hạn và các kết quả đồng khả năng.</text><text x="125" y="995" font-size="25">Ví dụ: P(A) = 3/6 = 1/2.</text><text x="125" y="1140" font-size="30" font-weight="700">4. Ba kiểm tra bắt buộc</text><text x="125" y="1195" font-size="24">□ Ω đã đủ kết quả chưa?</text><text x="125" y="1240" font-size="24">□ Có đếm trùng kết quả nào không?</text><text x="125" y="1285" font-size="24">□ Các kết quả có thật sự đồng khả năng không?</text><text x="125" y="1330" font-size="24">□ Kết quả cuối có nằm trong khoảng 0 ≤ P ≤ 1 không?</text><text x="600" y="1430" text-anchor="middle" font-size="25" font-weight="700">Không gian mẫu sai → xác suất sai. Hãy liệt kê có hệ thống trước khi tính.</text></g></svg>