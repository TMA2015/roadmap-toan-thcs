<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Ý nghĩa hình học của hệ phương trình</title>
<desc id="desc">Ba trường hợp cắt nhau, song song, trùng nhau.</desc>
<rect width="1200" height="520" fill="white"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#0f172a">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#475569"/></marker></defs>
<text x="60" y="48" font-size="28" font-weight="700">HỆ PHƯƠNG TRÌNH – NHÌN BẰNG ĐỒ THỊ</text><text x="60" y="78" font-size="18" fill="#475569">Số nghiệm của hệ chính là số giao điểm chung của hai đường thẳng.</text>
<text x="55" y="120" font-size="20" font-weight="700">Cắt nhau → 1 nghiệm</text><text x="430" y="120" font-size="20" font-weight="700">Song song → vô nghiệm</text><text x="805" y="120" font-size="20" font-weight="700">Trùng nhau → vô số nghiệm</text>
<rect x="55" y="140" width="330" height="290" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<g stroke="#e2e8f0"><line x1="55" y1="140" x2="55" y2="430"/><line x1="96.2" y1="140" x2="96.2" y2="430"/><line x1="137.5" y1="140" x2="137.5" y2="430"/><line x1="178.8" y1="140" x2="178.8" y2="430"/><line x1="220" y1="140" x2="220" y2="430"/><line x1="261.2" y1="140" x2="261.2" y2="430"/><line x1="302.5" y1="140" x2="302.5" y2="430"/><line x1="343.8" y1="140" x2="343.8" y2="430"/><line x1="385" y1="140" x2="385" y2="430"/><line x1="55" y1="430" x2="385" y2="430"/><line x1="55" y1="393.8" x2="385" y2="393.8"/><line x1="55" y1="357.5" x2="385" y2="357.5"/><line x1="55" y1="321.2" x2="385" y2="321.2"/><line x1="55" y1="285" x2="385" y2="285"/><line x1="55" y1="248.8" x2="385" y2="248.8"/><line x1="55" y1="212.5" x2="385" y2="212.5"/><line x1="55" y1="176.2" x2="385" y2="176.2"/><line x1="55" y1="140" x2="385" y2="140"/></g>
<line x1="178.8" y1="430" x2="178.8" y2="146" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="186.8" y="158" font-size="16">y</text><line x1="55" y1="357.5" x2="379" y2="357.5" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="367" y="349.5" font-size="16">x</text><text x="184.8" y="375.5" font-size="14" fill="#475569">O</text>
<line x1="55" y1="430" x2="385" y2="140" stroke="#2563eb" stroke-width="3"/><line x1="55" y1="140" x2="385" y2="430" stroke="#dc2626" stroke-width="3"/><circle cx="220" cy="285" r="6" fill="#7c3aed" stroke="#7c3aed" stroke-width="3"/><text x="228" y="275" font-size="17" font-weight="700" fill="#7c3aed">I(1; 2)</text><text x="319" y="190" font-size="16" fill="#2563eb">d₁</text><text x="319" y="364" font-size="16" fill="#dc2626">d₂</text>
<rect x="430" y="140" width="330" height="290" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<g stroke="#e2e8f0"><line x1="430" y1="140" x2="430" y2="430"/><line x1="471.2" y1="140" x2="471.2" y2="430"/><line x1="512.5" y1="140" x2="512.5" y2="430"/><line x1="553.8" y1="140" x2="553.8" y2="430"/><line x1="595" y1="140" x2="595" y2="430"/><line x1="636.2" y1="140" x2="636.2" y2="430"/><line x1="677.5" y1="140" x2="677.5" y2="430"/><line x1="718.8" y1="140" x2="718.8" y2="430"/><line x1="760" y1="140" x2="760" y2="430"/><line x1="430" y1="430" x2="760" y2="430"/><line x1="430" y1="397.8" x2="760" y2="397.8"/><line x1="430" y1="365.6" x2="760" y2="365.6"/><line x1="430" y1="333.3" x2="760" y2="333.3"/><line x1="430" y1="301.1" x2="760" y2="301.1"/><line x1="430" y1="268.9" x2="760" y2="268.9"/><line x1="430" y1="236.7" x2="760" y2="236.7"/><line x1="430" y1="204.4" x2="760" y2="204.4"/><line x1="430" y1="172.2" x2="760" y2="172.2"/><line x1="430" y1="140" x2="760" y2="140"/></g>
<line x1="595" y1="430" x2="595" y2="146" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="603" y="158" font-size="16">y</text><line x1="430" y1="301.1" x2="754" y2="301.1" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="742" y="293.1" font-size="16">x</text><text x="601" y="319.1" font-size="14" fill="#475569">O</text>
<line x1="430" y1="359.1" x2="760" y2="178.7" stroke="#2563eb" stroke-width="3"/><line x1="430" y1="455.8" x2="760" y2="275.3" stroke="#dc2626" stroke-width="3"/><text x="681.6" y="211.5" font-size="16" fill="#2563eb">d₁</text><text x="681.6" y="308.2" font-size="16" fill="#dc2626">d₂</text>
<rect x="805" y="140" width="330" height="290" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<g stroke="#e2e8f0"><line x1="805" y1="140" x2="805" y2="430"/><line x1="846.2" y1="140" x2="846.2" y2="430"/><line x1="887.5" y1="140" x2="887.5" y2="430"/><line x1="928.8" y1="140" x2="928.8" y2="430"/><line x1="970" y1="140" x2="970" y2="430"/><line x1="1011.2" y1="140" x2="1011.2" y2="430"/><line x1="1052.5" y1="140" x2="1052.5" y2="430"/><line x1="1093.8" y1="140" x2="1093.8" y2="430"/><line x1="1135" y1="140" x2="1135" y2="430"/><line x1="805" y1="430" x2="1135" y2="430"/><line x1="805" y1="397.8" x2="1135" y2="397.8"/><line x1="805" y1="365.6" x2="1135" y2="365.6"/><line x1="805" y1="333.3" x2="1135" y2="333.3"/><line x1="805" y1="301.1" x2="1135" y2="301.1"/><line x1="805" y1="268.9" x2="1135" y2="268.9"/><line x1="805" y1="236.7" x2="1135" y2="236.7"/><line x1="805" y1="204.4" x2="1135" y2="204.4"/><line x1="805" y1="172.2" x2="1135" y2="172.2"/><line x1="805" y1="140" x2="1135" y2="140"/></g>
<line x1="970" y1="430" x2="970" y2="146" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="978" y="158" font-size="16">y</text><line x1="805" y1="301.1" x2="1129" y2="301.1" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="1117" y="293.1" font-size="16">x</text><text x="976" y="319.1" font-size="14" fill="#475569">O</text>
<line x1="805" y1="165.8" x2="1135" y2="372" stroke="#7c3aed" stroke-width="5"/><line x1="805" y1="165.8" x2="1135" y2="372" stroke="#2563eb" stroke-width="2" stroke-dasharray="9 7"/><text x="1027.8" y="293" font-size="16" fill="#7c3aed">d₁ ≡ d₂</text>
<text x="60" y="480" font-size="18" fill="#475569">Ghi nhớ: nghiệm (x; y) của hệ là tọa độ điểm nằm trên cả hai đường thẳng.</text>
</g></svg>