<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#111827"><text x="60" y="85" font-size="34" font-weight="700">CHUYÊN ĐỀ 09 – HỆ PHƯƠNG TRÌNH BẬC NHẤT HAI ẨN</text><text x="60" y="130" font-size="24">Infographic 1 – Tổng quan chuyên đề</text><rect x="55" y="175" width="1090" height="210" rx="18" fill="#f8fafc" stroke="#475569"/><text x="85" y="220" font-size="25" font-weight="700">1. Học gì?</text><text x="90" y="265" font-size="21">• Phương trình bậc nhất hai ẩn: ax + by = c</text><text x="90" y="305" font-size="21">• Hệ hai phương trình và nghiệm (x; y)</text><text x="90" y="345" font-size="21">• Một nghiệm – vô nghiệm – vô số nghiệm</text><rect x="55" y="420" width="1090" height="260" rx="18" fill="white" stroke="#475569"/><text x="85" y="465" font-size="25" font-weight="700">2. Hai phương pháp giải chính</text><rect x="90" y="505" width="480" height="125" rx="14" fill="#f8fafc" stroke="#94a3b8"/><text x="120" y="545" font-size="23" font-weight="700">Phương pháp thế</text><text x="120" y="585" font-size="20">Rút một ẩn → thế → giải một ẩn → tìm ẩn còn lại</text><rect x="630" y="505" width="480" height="125" rx="14" fill="#f8fafc" stroke="#94a3b8"/><text x="660" y="545" font-size="23" font-weight="700">Cộng đại số</text><text x="660" y="585" font-size="20">Tạo hệ số đối nhau → cộng/trừ → khử một ẩn</text><rect x="55" y="720" width="1090" height="250" rx="18" fill="#f8fafc" stroke="#475569"/><text x="85" y="765" font-size="25" font-weight="700">3. Ý nghĩa hình học</text><text x="90" y="815" font-size="21">Mỗi phương trình bậc nhất hai ẩn biểu diễn một đường thẳng.</text><text x="90" y="860" font-size="21">• Hai đường cắt nhau → hệ có một nghiệm.</text><text x="90" y="900" font-size="21">• Hai đường song song → hệ vô nghiệm.</text><text x="90" y="940" font-size="21">• Hai đường trùng nhau → hệ có vô số nghiệm.</text><rect x="55" y="1010" width="1090" height="250" rx="18" fill="white" stroke="#475569"/><text x="85" y="1055" font-size="25" font-weight="700">4. Vị trí trong Roadmap</text><text x="90" y="1110" font-size="21">08. Phương trình → 09. Hệ phương trình → 10. Hàm số &amp; đồ thị</text><text x="90" y="1155" font-size="21">                                      ↓</text><text x="90" y="1200" font-size="21">                           24. Bài toán thực tế</text><rect x="55" y="1300" width="1090" height="200" rx="18" fill="#f8fafc" stroke="#475569"/><text x="85" y="1345" font-size="25" font-weight="700">5. Mục tiêu học tập</text><text x="90" y="1390" font-size="21">Chọn đúng phương pháp → giải chính xác → kiểm tra nghiệm → vận dụng vào bài toán.</text><text x="90" y="1435" font-size="21">Học sinh nên đạt ≥ 80% bài cốt lõi trước khi chuyển tiếp.</text></g></svg>