<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>Chuyên đề 25 - Ba giai đoạn và ma trận ưu tiên</title><desc>Lộ trình ba giai đoạn ôn tập và ma trận ưu tiên cá nhân A B C D.</desc><rect width="1200" height="1500" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="black" stroke="black"><text x="600" y="90" text-anchor="middle" font-size="42" font-weight="700" stroke="none">3 GIAI ĐOẠN + MA TRẬN ƯU TIÊN</text><rect x="90" y="170" width="1020" height="250" rx="20" fill="white" stroke-width="3"/><text x="150" y="225" font-size="28" font-weight="700" stroke="none">GIAI ĐOẠN 1 • CỦNG CỐ NỀN</text><text x="150" y="280" font-size="24" stroke="none">• Lấp lỗ hổng • Nhớ công thức • Làm chắc bài cơ bản</text><text x="150" y="330" font-size="24" stroke="none">Mục tiêu: không mất điểm ở phần nền tảng.</text><rect x="90" y="460" width="1020" height="250" rx="20" fill="white" stroke-width="3"/><text x="150" y="515" font-size="28" font-weight="700" stroke="none">GIAI ĐOẠN 2 • LUYỆN CHUYÊN ĐỀ</text><text x="150" y="570" font-size="24" stroke="none">• Nhận dạng nhanh • Tăng tốc • Bài vận dụng vừa</text><text x="150" y="620" font-size="24" stroke="none">Mục tiêu: biết gọi tên dạng và chọn đúng công cụ.</text><rect x="90" y="750" width="1020" height="250" rx="20" fill="white" stroke-width="3"/><text x="150" y="805" font-size="28" font-weight="700" stroke="none">GIAI ĐOẠN 3 • LUYỆN ĐỀ</text><text x="150" y="860" font-size="24" stroke="none">• Làm đúng thời gian • Chữa đề • Ghi lỗi • Tái luyện</text><text x="150" y="910" font-size="24" stroke="none">Mục tiêu: ổn định điểm số và giảm lỗi lặp lại.</text><rect x="90" y="1040" width="1020" height="350" rx="20" fill="white" stroke-width="3"/><text x="600" y="1095" text-anchor="middle" font-size="30" font-weight="700" stroke="none">MA TRẬN ƯU TIÊN CÁ NHÂN</text><line x1="600" y1="1140" x2="600" y2="1340" stroke-width="2"/><line x1="150" y1="1240" x2="1050" y2="1240" stroke-width="2"/><text x="350" y="1195" text-anchor="middle" font-size="26" font-weight="700" stroke="none">A • Đề ưu tiên + đang yếu</text><text x="350" y="1225" text-anchor="middle" font-size="21" stroke="none">Ôn nhiều nhất</text><text x="850" y="1195" text-anchor="middle" font-size="26" font-weight="700" stroke="none">B • Đề ưu tiên + đang khá</text><text x="850" y="1225" text-anchor="middle" font-size="21" stroke="none">Luyện duy trì</text><text x="350" y="1295" text-anchor="middle" font-size="26" font-weight="700" stroke="none">C • Ít ưu tiên + đang yếu</text><text x="350" y="1325" text-anchor="middle" font-size="21" stroke="none">Bổ sung có chọn lọc</text><text x="850" y="1295" text-anchor="middle" font-size="26" font-weight="700" stroke="none">D • Ít ưu tiên + đang chắc</text><text x="850" y="1325" text-anchor="middle" font-size="21" stroke="none">Ôn rà soát</text><text x="600" y="1450" text-anchor="middle" font-size="22" stroke="none">Ma trận phải điều chỉnh theo địa phương và kết quả luyện đề gần nhất.</text></g></svg>