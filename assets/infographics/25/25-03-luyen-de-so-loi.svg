<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>Chuyên đề 25 - Luyện đề và sổ lỗi</title><desc>Chu trình làm đề, phân loại lỗi, sửa lỗi và tái luyện.</desc><rect width="1200" height="1500" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="black" stroke="black"><text x="600" y="90" text-anchor="middle" font-size="42" font-weight="700" stroke="none">LUYỆN ĐỀ → CHỮA → TÁI LUYỆN</text><rect x="110" y="170" width="980" height="170" rx="20" fill="white" stroke-width="3"/><text x="600" y="225" text-anchor="middle" font-size="30" font-weight="700" stroke="none">1. LÀM ĐỀ TRONG THỜI GIAN THẬT</text><text x="600" y="285" text-anchor="middle" font-size="24" stroke="none">Ghi thời gian • Không xem tài liệu • Làm như phòng thi</text><rect x="110" y="390" width="980" height="200" rx="20" fill="white" stroke-width="3"/><text x="600" y="445" text-anchor="middle" font-size="30" font-weight="700" stroke="none">2. CHẤM VÀ PHÂN LOẠI LỖI</text><text x="215" y="515" font-size="24" stroke="none">Kiến thức</text><text x="520" y="515" font-size="24" stroke="none">Kỹ năng</text><text x="820" y="515" font-size="24" stroke="none">Cẩu thả</text><text x="215" y="555" font-size="20" stroke="none">quên / dùng sai</text><text x="520" y="555" font-size="20" stroke="none">chậm / dài / thiếu bước</text><text x="820" y="555" font-size="20" stroke="none">dấu / số / đơn vị</text><rect x="110" y="640" width="980" height="200" rx="20" fill="white" stroke-width="3"/><text x="600" y="695" text-anchor="middle" font-size="30" font-weight="700" stroke="none">3. TÌM CHUYÊN ĐỀ GỐC → ÔN LẠI</text><text x="600" y="755" text-anchor="middle" font-size="24" stroke="none">Không chỉ xem đáp án. Quay lại đúng kiến thức gây lỗi.</text><text x="600" y="800" text-anchor="middle" font-size="24" stroke="none">Sau đó tự làm lại câu sai mà không nhìn lời giải.</text><rect x="110" y="890" width="980" height="300" rx="20" fill="white" stroke-width="3"/><text x="600" y="945" text-anchor="middle" font-size="30" font-weight="700" stroke="none">4. SỔ LỖI CÁ NHÂN</text><text x="160" y="1010" font-size="23" stroke="none">Mỗi lỗi ghi 4 dòng:</text><text x="190" y="1060" font-size="23" stroke="none">• Câu / dạng bài</text><text x="190" y="1110" font-size="23" stroke="none">• Chuyên đề gốc</text><text x="600" y="1060" font-size="23" stroke="none">• Nguyên nhân sai</text><text x="600" y="1110" font-size="23" stroke="none">• Dấu hiệu + cách sửa</text><rect x="110" y="1240" width="980" height="160" rx="20" fill="white" stroke-width="3"/><text x="600" y="1295" text-anchor="middle" font-size="30" font-weight="700" stroke="none">5. KIỂM TRA LẠI SAU VÀI NGÀY</text><text x="600" y="1350" text-anchor="middle" font-size="24" stroke="none">Làm một câu tương tự → nếu còn sai, quay lại chuyên đề lần nữa.</text><text x="600" y="1460" text-anchor="middle" font-size="22" stroke="none">Mục tiêu: giảm lỗi lặp lại, không chỉ tăng số đề đã làm.</text></g></svg>