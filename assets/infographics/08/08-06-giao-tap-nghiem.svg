<text x="55" y="48" font-size="28" font-weight="700">GIAO CÁC TẬP NGHIỆM</text><text x="55" y="80" font-size="18" fill="#475569">Cần thỏa mãn đồng thời → lấy phần chung trên trục số.</text>
