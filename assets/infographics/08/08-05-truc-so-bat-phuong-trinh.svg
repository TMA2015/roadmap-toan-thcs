<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Biểu diễn bất phương trình trên trục số</title>
<desc id="desc">Hai ví dụ x&lt;-3 và x≥2 với điểm rỗng/đặc.</desc>
<rect width="1200" height="470" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#0f172a">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L6,3 z" fill="#475569"/>
  </marker>
  <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L6,3 z" fill="#2563eb"/>
  </marker>
</defs>
<text x="55" y="50" font-size="28" font-weight="700">BẤT PHƯƠNG TRÌNH TRÊN TRỤC SỐ</text>
<text x="55" y="82" font-size="18" fill="#475569">Điểm rỗng: không lấy mốc. Điểm đặc: có lấy mốc.</text>
<text x="85" y="147" font-size="20" font-weight="700">Ví dụ 1:  x &lt; -3</text>
<line x1="100" y1="185" x2="1100" y2="185" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="100.0" y1="177" x2="100.0" y2="193" stroke="#64748b" stroke-width="2"/><text x="92.0" y="215" font-size="15" fill="#475569">-6</text>
<line x1="190.9" y1="177" x2="190.9" y2="193" stroke="#64748b" stroke-width="2"/><text x="182.9" y="215" font-size="15" fill="#475569">-5</text>
<line x1="281.8" y1="177" x2="281.8" y2="193" stroke="#64748b" stroke-width="2"/><text x="273.8" y="215" font-size="15" fill="#475569">-4</text>
<line x1="372.7" y1="177" x2="372.7" y2="193" stroke="#64748b" stroke-width="2"/><text x="364.7" y="215" font-size="15" fill="#475569">-3</text>
<line x1="463.6" y1="177" x2="463.6" y2="193" stroke="#64748b" stroke-width="2"/><text x="455.6" y="215" font-size="15" fill="#475569">-2</text>
<line x1="554.5" y1="177" x2="554.5" y2="193" stroke="#64748b" stroke-width="2"/><text x="546.5" y="215" font-size="15" fill="#475569">-1</text>
<line x1="645.5" y1="177" x2="645.5" y2="193" stroke="#64748b" stroke-width="2"/><text x="637.5" y="215" font-size="15" fill="#475569">0</text>
<line x1="736.4" y1="177" x2="736.4" y2="193" stroke="#64748b" stroke-width="2"/><text x="728.4" y="215" font-size="15" fill="#475569">1</text>
<line x1="827.3" y1="177" x2="827.3" y2="193" stroke="#64748b" stroke-width="2"/><text x="819.3" y="215" font-size="15" fill="#475569">2</text>
<line x1="918.2" y1="177" x2="918.2" y2="193" stroke="#64748b" stroke-width="2"/><text x="910.2" y="215" font-size="15" fill="#475569">3</text>
<line x1="1009.1" y1="177" x2="1009.1" y2="193" stroke="#64748b" stroke-width="2"/><text x="1001.1" y="215" font-size="15" fill="#475569">4</text>
<line x1="1100.0" y1="177" x2="1100.0" y2="193" stroke="#64748b" stroke-width="2"/><text x="1092.0" y="215" font-size="15" fill="#475569">5</text>
<circle cx="372.7" cy="185" r="8" fill="white" stroke="#2563eb" stroke-width="4"/>
<line x1="362.7" y1="185" x2="108" y2="185" stroke="#2563eb" stroke-width="8"/><polygon points="108,185 128,175 128,195" fill="#2563eb"/>
<text x="85" y="312" font-size="20" font-weight="700">Ví dụ 2:  x ≥ 2</text>
<line x1="100" y1="350" x2="1100" y2="350" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="100.0" y1="342" x2="100.0" y2="358" stroke="#64748b" stroke-width="2"/><text x="92.0" y="380" font-size="15" fill="#475569">-5</text>
<line x1="190.9" y1="342" x2="190.9" y2="358" stroke="#64748b" stroke-width="2"/><text x="182.9" y="380" font-size="15" fill="#475569">-4</text>
<line x1="281.8" y1="342" x2="281.8" y2="358" stroke="#64748b" stroke-width="2"/><text x="273.8" y="380" font-size="15" fill="#475569">-3</text>
<line x1="372.7" y1="342" x2="372.7" y2="358" stroke="#64748b" stroke-width="2"/><text x="364.7" y="380" font-size="15" fill="#475569">-2</text>
<line x1="463.6" y1="342" x2="463.6" y2="358" stroke="#64748b" stroke-width="2"/><text x="455.6" y="380" font-size="15" fill="#475569">-1</text>
<line x1="554.5" y1="342" x2="554.5" y2="358" stroke="#64748b" stroke-width="2"/><text x="546.5" y="380" font-size="15" fill="#475569">0</text>
<line x1="645.5" y1="342" x2="645.5" y2="358" stroke="#64748b" stroke-width="2"/><text x="637.5" y="380" font-size="15" fill="#475569">1</text>
<line x1="736.4" y1="342" x2="736.4" y2="358" stroke="#64748b" stroke-width="2"/><text x="728.4" y="380" font-size="15" fill="#475569">2</text>
<line x1="827.3" y1="342" x2="827.3" y2="358" stroke="#64748b" stroke-width="2"/><text x="819.3" y="380" font-size="15" fill="#475569">3</text>
<line x1="918.2" y1="342" x2="918.2" y2="358" stroke="#64748b" stroke-width="2"/><text x="910.2" y="380" font-size="15" fill="#475569">4</text>
<line x1="1009.1" y1="342" x2="1009.1" y2="358" stroke="#64748b" stroke-width="2"/><text x="1001.1" y="380" font-size="15" fill="#475569">5</text>
<line x1="1100.0" y1="342" x2="1100.0" y2="358" stroke="#64748b" stroke-width="2"/><text x="1092.0" y="380" font-size="15" fill="#475569">6</text>
<circle cx="736.4" cy="350" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="4"/>
<line x1="746.4" y1="350" x2="1080" y2="350" stroke="#2563eb" stroke-width="8"/><polygon points="1092,350 1072,340 1072,360" fill="#2563eb"/>
<text x="55" y="445" font-size="17" fill="#475569">Khi viết khoảng: x &lt; -3 tương ứng (-∞; -3), còn x ≥ 2 tương ứng [2; +∞).</text>
</g></svg>