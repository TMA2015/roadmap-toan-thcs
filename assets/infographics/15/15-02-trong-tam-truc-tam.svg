<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Chuyên đề 15 - Trọng tâm và trực tâm</title><desc id="desc">Infographic trắng đen phân biệt trung tuyến, trọng tâm, đường cao và trực tâm.</desc><rect width="1200" height="1500" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#111" stroke="#111" stroke-width="2"><text x="600" y="72" text-anchor="middle" font-size="40" font-weight="700" stroke="none">TRỌNG TÂM G &amp; TRỰC TÂM H</text><text x="600" y="114" text-anchor="middle" font-size="24" stroke="none">Infographic 2 – Trung tuyến và đường cao</text><rect x="70" y="165" width="500" height="430" rx="18" fill="none"/><text x="105" y="215" font-size="30" font-weight="700" stroke="none">TRUNG TUYẾN → G</text><text x="105" y="267" font-size="24" stroke="none">Định nghĩa</text><text x="105" y="307" font-size="22" stroke="none">Từ một đỉnh đến trung điểm cạnh đối diện.</text><text x="105" y="362" font-size="24" font-weight="700" stroke="none">Tính chất trọng tâm</text><text x="105" y="404" font-size="22" stroke="none">Ba trung tuyến đồng quy tại G.</text><text x="105" y="446" font-size="22" stroke="none">Nếu AM là trung tuyến:</text><text x="105" y="490" font-size="26" font-weight="700" stroke="none">AG = 2GM</text><text x="105" y="532" font-size="24" stroke="none">AG = 2/3 AM ; GM = 1/3 AM</text><rect x="630" y="165" width="500" height="430" rx="18" fill="none"/><text x="665" y="215" font-size="30" font-weight="700" stroke="none">ĐƯỜNG CAO → H</text><text x="665" y="267" font-size="24" stroke="none">Định nghĩa</text><text x="665" y="307" font-size="22" stroke="none">Qua đỉnh, vuông góc với cạnh đối diện</text><text x="665" y="345" font-size="22" stroke="none">hoặc đường thẳng chứa cạnh đối diện.</text><text x="665" y="400" font-size="24" font-weight="700" stroke="none">Tính chất trực tâm</text><text x="665" y="442" font-size="22" stroke="none">Ba đường cao đồng quy tại H.</text><text x="665" y="486" font-size="22" stroke="none">Nhọn: H ở trong tam giác.</text><text x="665" y="526" font-size="22" stroke="none">Vuông: H tại đỉnh góc vuông.</text><text x="665" y="566" font-size="22" stroke="none">Tù: H ở ngoài tam giác.</text><rect x="70" y="640" width="1060" height="250" rx="18" fill="none"/><text x="105" y="690" font-size="28" font-weight="700" stroke="none">Nhìn dữ kiện → chọn đúng đường</text><text x="105" y="744" font-size="23" stroke="none">Có “trung điểm cạnh” và đường đi từ đỉnh → nghĩ tới trung tuyến.</text><text x="105" y="790" font-size="23" stroke="none">Có “vuông góc từ đỉnh” → nghĩ tới đường cao.</text><text x="105" y="836" font-size="23" stroke="none">Có tỉ số 2 : 1 trên trung tuyến → gần như chắc chắn liên quan trọng tâm.</text><rect x="70" y="930" width="1060" height="300" rx="18" fill="none"/><text x="105" y="980" font-size="28" font-weight="700" stroke="none">Ví dụ nhanh</text><text x="105" y="1032" font-size="23" stroke="none">AM = 15 cm, G là trọng tâm:</text><text x="105" y="1075" font-size="26" font-weight="700" stroke="none">AG = 10 cm ; GM = 5 cm</text><text x="105" y="1130" font-size="23" stroke="none">Tam giác ABC vuông tại A:</text><text x="105" y="1173" font-size="26" font-weight="700" stroke="none">H ≡ A</text><text x="105" y="1215" font-size="22" stroke="none">Không cần dựng thêm để xác định trực tâm trong trường hợp này.</text><rect x="70" y="1270" width="1060" height="165" rx="18" fill="none"/><text x="105" y="1320" font-size="27" font-weight="700" stroke="none">Lỗi hay gặp</text><text x="105" y="1364" font-size="22" stroke="none">• Nhầm trung tuyến với trung trực.</text><text x="105" y="1404" font-size="22" stroke="none">• Viết ngược tỉ số: từ đỉnh đến G là đoạn dài hơn.</text></g></svg>