<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450"><title>Chuyên đề 16 - Hình thang và hình bình hành</title><desc>Tóm tắt tính chất, dấu hiệu nhận biết và đường chéo của hình thang, hình bình hành.</desc><rect width="1200" height="1450" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#111" stroke="#111"><text x="600" y="75" text-anchor="middle" font-size="42" font-weight="700" stroke="none">HÌNH THANG &amp; HÌNH BÌNH HÀNH</text><text x="600" y="120" text-anchor="middle" font-size="24" stroke="none">Hai lớp hình nền để “nâng cấp” thành hình đặc biệt</text><rect x="70" y="165" width="500" height="510" rx="18" fill="none" stroke-width="3"/><text x="105" y="215" font-size="29" font-weight="700" stroke="none">HÌNH THANG</text><text x="105" y="270" font-size="24" stroke="none">Định nghĩa:</text><text x="125" y="310" font-size="23" stroke="none">Có ít nhất 1 cặp cạnh đối song song.</text><text x="105" y="365" font-size="24" font-weight="700" stroke="none">Hình thang cân</text><text x="125" y="410" font-size="23" stroke="none">• Hai góc kề một đáy bằng nhau.</text><text x="125" y="450" font-size="23" stroke="none">• Hai cạnh bên bằng nhau.</text><text x="125" y="490" font-size="23" stroke="none">• Hai đường chéo bằng nhau.</text><text x="105" y="550" font-size="24" font-weight="700" stroke="none">Gợi ý nhận dạng</text><text x="125" y="595" font-size="23" stroke="none">Thấy song song → kiểm tra “thang”.</text><text x="125" y="635" font-size="23" stroke="none">Có thêm tính đối xứng → nghĩ “thang cân”.</text><rect x="630" y="165" width="500" height="510" rx="18" fill="none" stroke-width="3"/><text x="665" y="215" font-size="29" font-weight="700" stroke="none">HÌNH BÌNH HÀNH</text><text x="665" y="270" font-size="24" font-weight="700" stroke="none">Tính chất</text><text x="685" y="315" font-size="23" stroke="none">• Cạnh đối song song và bằng nhau.</text><text x="685" y="355" font-size="23" stroke="none">• Góc đối bằng nhau.</text><text x="685" y="395" font-size="23" stroke="none">• Hai góc kề bù nhau.</text><text x="685" y="435" font-size="23" stroke="none">• Đường chéo cắt nhau tại trung điểm.</text><text x="665" y="500" font-size="24" font-weight="700" stroke="none">Dấu hiệu thường dùng</text><text x="685" y="545" font-size="22" stroke="none">1) 2 cặp cạnh đối song song.</text><text x="685" y="583" font-size="22" stroke="none">2) 2 cặp cạnh đối bằng nhau.</text><text x="685" y="621" font-size="22" stroke="none">3) 1 cặp cạnh đối vừa // vừa bằng.</text><rect x="70" y="715" width="1060" height="290" rx="18" fill="none" stroke-width="3"/><text x="105" y="765" font-size="28" font-weight="700" stroke="none">ĐƯỜNG CHÉO – DẤU HIỆU “VÀNG” CỦA HÌNH BÌNH HÀNH</text><text x="115" y="825" font-size="24" stroke="none">Nếu hai đường chéo của một tứ giác cắt nhau tại trung điểm của mỗi đường</text><text x="115" y="865" font-size="24" stroke="none">→ có thể kết luận tứ giác là hình bình hành.</text><text x="115" y="930" font-size="23" stroke="none">Đây là cách rất hay khi đề cho trung điểm, đoạn bằng nhau hoặc hai đường chéo.</text><rect x="70" y="1045" width="1060" height="315" rx="18" fill="none" stroke-width="3"/><text x="105" y="1095" font-size="28" font-weight="700" stroke="none">QUY TRÌNH CHỨNG MINH NGẮN</text><text x="115" y="1150" font-size="24" stroke="none">Bước 1: tìm dữ kiện “song song / bằng nhau / trung điểm”.</text><text x="115" y="1195" font-size="24" stroke="none">Bước 2: chọn đúng một dấu hiệu của hình bình hành.</text><text x="115" y="1240" font-size="24" stroke="none">Bước 3: kết luận hình → mới dùng tiếp các tính chất cạnh, góc, đường chéo.</text><text x="115" y="1305" font-size="22" font-weight="700" stroke="none">Tránh: chỉ thấy 1 cặp cạnh song song rồi kết luận hình bình hành.</text></g></svg>