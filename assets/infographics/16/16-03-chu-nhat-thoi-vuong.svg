<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450"><title>Chuyên đề 16 - Hình chữ nhật, hình thoi, hình vuông</title><desc>So sánh ba hình đặc biệt theo góc, cạnh và đường chéo.</desc><rect width="1200" height="1450" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#111" stroke="#111"><text x="600" y="75" text-anchor="middle" font-size="40" font-weight="700" stroke="none">CHỮ NHẬT – THOI – VUÔNG</text><text x="600" y="120" text-anchor="middle" font-size="24" stroke="none">Phân biệt nhanh bằng góc, cạnh và đường chéo</text><rect x="60" y="165" width="340" height="610" rx="18" fill="none" stroke-width="3"/><text x="230" y="215" text-anchor="middle" font-size="28" font-weight="700" stroke="none">HÌNH CHỮ NHẬT</text><text x="90" y="270" font-size="22" stroke="none">Nền: hình bình hành</text><text x="90" y="315" font-size="22" stroke="none">Đặc trưng: 4 góc vuông</text><text x="90" y="375" font-size="23" font-weight="700" stroke="none">Đường chéo</text><text x="100" y="420" font-size="22" stroke="none">• Bằng nhau</text><text x="100" y="458" font-size="22" stroke="none">• Cắt nhau tại trung điểm</text><text x="90" y="520" font-size="23" font-weight="700" stroke="none">Dấu hiệu</text><text x="100" y="565" font-size="21" stroke="none">• Bình hành + 1 góc vuông</text><text x="100" y="603" font-size="21" stroke="none">• Bình hành + 2 chéo bằng</text><text x="100" y="641" font-size="21" stroke="none">• Tứ giác có 3 góc vuông</text><text x="90" y="710" font-size="20" font-weight="700" stroke="none">Không mặc định chéo vuông góc.</text><rect x="430" y="165" width="340" height="610" rx="18" fill="none" stroke-width="3"/><text x="600" y="215" text-anchor="middle" font-size="28" font-weight="700" stroke="none">HÌNH THOI</text><text x="460" y="270" font-size="22" stroke="none">Nền: hình bình hành</text><text x="460" y="315" font-size="22" stroke="none">Đặc trưng: 4 cạnh bằng nhau</text><text x="460" y="375" font-size="23" font-weight="700" stroke="none">Đường chéo</text><text x="470" y="420" font-size="22" stroke="none">• Vuông góc</text><text x="470" y="458" font-size="22" stroke="none">• Cắt nhau tại trung điểm</text><text x="470" y="496" font-size="22" stroke="none">• Phân giác các góc đối</text><text x="460" y="555" font-size="23" font-weight="700" stroke="none">Dấu hiệu</text><text x="470" y="600" font-size="21" stroke="none">• Bình hành + 2 cạnh kề bằng</text><text x="470" y="638" font-size="21" stroke="none">• Bình hành + chéo vuông</text><text x="470" y="676" font-size="21" stroke="none">• 4 cạnh bằng nhau</text><text x="460" y="730" font-size="20" font-weight="700" stroke="none">Không mặc định chéo bằng nhau.</text><rect x="800" y="165" width="340" height="610" rx="18" fill="none" stroke-width="3"/><text x="970" y="215" text-anchor="middle" font-size="28" font-weight="700" stroke="none">HÌNH VUÔNG</text><text x="830" y="270" font-size="22" stroke="none">Vừa chữ nhật, vừa hình thoi</text><text x="830" y="315" font-size="22" stroke="none">4 góc vuông + 4 cạnh bằng</text><text x="830" y="375" font-size="23" font-weight="700" stroke="none">Đường chéo</text><text x="840" y="420" font-size="22" stroke="none">• Bằng nhau</text><text x="840" y="458" font-size="22" stroke="none">• Vuông góc</text><text x="840" y="496" font-size="22" stroke="none">• Cắt nhau tại trung điểm</text><text x="840" y="534" font-size="22" stroke="none">• Phân giác các góc</text><text x="830" y="595" font-size="23" font-weight="700" stroke="none">Dấu hiệu</text><text x="840" y="640" font-size="21" stroke="none">• Chữ nhật + 2 cạnh kề bằng</text><text x="840" y="678" font-size="21" stroke="none">• Thoi + 1 góc vuông</text><text x="840" y="716" font-size="21" stroke="none">• Thoi + 2 chéo bằng</text><rect x="70" y="825" width="1060" height="250" rx="18" fill="none" stroke-width="3"/><text x="105" y="875" font-size="28" font-weight="700" stroke="none">MẸO NHỚ ĐƯỜNG CHÉO</text><text x="115" y="930" font-size="24" stroke="none">Chữ nhật → “bằng nhau”. &nbsp;&nbsp; Thoi → “vuông góc + phân giác”.</text><text x="115" y="975" font-size="24" stroke="none">Vuông → có cả hai nhóm tính chất trên.</text><text x="115" y="1020" font-size="22" stroke="none">Cả ba đều kế thừa: hai đường chéo cắt nhau tại trung điểm.</text><rect x="70" y="1115" width="1060" height="250" rx="18" fill="none" stroke-width="3"/><text x="105" y="1165" font-size="28" font-weight="700" stroke="none">CÁCH “NÂNG CẤP” HÌNH</text><text x="115" y="1220" font-size="24" stroke="none">Bình hành + vuông → chữ nhật.</text><text x="115" y="1260" font-size="24" stroke="none">Bình hành + cạnh bằng / chéo vuông → thoi.</text><text x="115" y="1300" font-size="24" stroke="none">Chứng minh đồng thời chữ nhật + thoi → hình vuông.</text></g></svg>