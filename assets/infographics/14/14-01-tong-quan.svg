<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>Chuyên đề 14 – Tam giác: Tổng quan</title><desc>Infographic tổng quan về thành phần, góc, cạnh, tam giác đặc biệt và hai tam giác bằng nhau.</desc><rect width="1200" height="1500" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#111" stroke="#111" stroke-width="2"><text x="600" y="80" text-anchor="middle" font-size="42" font-weight="700" stroke="none">CHUYÊN ĐỀ 14 – TAM GIÁC</text><text x="600" y="125" text-anchor="middle" font-size="26" stroke="none">Infographic 1 – Tổng quan chuyên đề</text><rect x="70" y="180" width="500" height="260" rx="18" fill="none"/><text x="100" y="225" font-size="28" font-weight="700" stroke="none">1. Thành phần cơ bản</text><text x="105" y="275" font-size="24" stroke="none">• Đỉnh – cạnh – góc</text><text x="105" y="315" font-size="24" stroke="none">• Chu vi: P = a + b + c</text><text x="105" y="355" font-size="24" stroke="none">• Diện tích: S = 1/2 · a · h</text><text x="105" y="395" font-size="24" stroke="none">• Phân loại theo cạnh và góc</text><rect x="630" y="180" width="500" height="260" rx="18" fill="none"/><text x="660" y="225" font-size="28" font-weight="700" stroke="none">2. Quan hệ góc</text><text x="665" y="275" font-size="24" stroke="none">• ∠A + ∠B + ∠C = 180°</text><text x="665" y="315" font-size="24" stroke="none">• Góc ngoài = tổng 2 góc trong không kề</text><text x="665" y="355" font-size="24" stroke="none">• Góc lớn ↔ cạnh đối diện lớn</text><rect x="70" y="490" width="500" height="260" rx="18" fill="none"/><text x="100" y="535" font-size="28" font-weight="700" stroke="none">3. Quan hệ cạnh</text><text x="105" y="585" font-size="24" stroke="none">• a + b &gt; c</text><text x="105" y="625" font-size="24" stroke="none">• |a − b| &lt; c &lt; a + b</text><text x="105" y="665" font-size="24" stroke="none">• Dùng để kiểm tra tam giác có tồn tại</text><rect x="630" y="490" width="500" height="260" rx="18" fill="none"/><text x="660" y="535" font-size="28" font-weight="700" stroke="none">4. Tam giác đặc biệt</text><text x="665" y="585" font-size="24" stroke="none">• Cân → 2 góc đáy bằng nhau</text><text x="665" y="625" font-size="24" stroke="none">• Đều → 3 cạnh bằng nhau, mỗi góc 60°</text><text x="665" y="665" font-size="24" stroke="none">• Vuông → dùng định lý Pythagore</text><rect x="70" y="800" width="1060" height="300" rx="18" fill="none"/><text x="100" y="850" font-size="28" font-weight="700" stroke="none">5. Hai tam giác bằng nhau</text><text x="110" y="910" font-size="25" stroke="none">c.c.c</text><text x="350" y="910" font-size="25" stroke="none">c.g.c</text><text x="590" y="910" font-size="25" stroke="none">g.c.g</text><text x="830" y="910" font-size="25" stroke="none">Vuông: cạnh huyền + cạnh góc vuông</text><text x="100" y="980" font-size="24" stroke="none">Mục đích thường gặp:</text><text x="310" y="980" font-size="24" stroke="none">chứng minh cạnh bằng nhau • góc bằng nhau • trung điểm • phân giác • vuông góc</text><rect x="70" y="1150" width="1060" height="220" rx="18" fill="none"/><text x="100" y="1200" font-size="28" font-weight="700" stroke="none">Mạch suy luận cần hình thành</text><text x="120" y="1270" font-size="25" stroke="none">Dữ kiện → nhận dạng cấu hình → chọn định lý / trường hợp bằng nhau → suy ra yếu tố cần chứng minh</text><text x="600" y="1430" text-anchor="middle" font-size="22" stroke="none">Nền tảng trực tiếp cho Topic 15, 17, 18 và 19</text></g></svg>