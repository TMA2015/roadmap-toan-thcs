<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>Chuyên đề 14 – Tam giác đặc biệt và Pythagore</title><desc>Infographic tóm tắt tam giác cân, đều, vuông và định lý Pythagore.</desc><rect width="1200" height="1500" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#111" stroke="#111" stroke-width="2"><text x="600" y="80" text-anchor="middle" font-size="40" font-weight="700" stroke="none">TAM GIÁC ĐẶC BIỆT &amp; PYTHAGORE</text><text x="600" y="125" text-anchor="middle" font-size="25" stroke="none">Infographic 3 – Nhận dạng, tính chất và dấu hiệu</text><rect x="70" y="180" width="500" height="320" rx="18" fill="none"/><text x="100" y="230" font-size="28" font-weight="700" stroke="none">1. Tam giác cân</text><text x="110" y="285" font-size="24" stroke="none">AB = AC  ⇒  ∠B = ∠C</text><text x="110" y="335" font-size="23" stroke="none">Dấu hiệu ngược:</text><text x="110" y="375" font-size="23" stroke="none">∠B = ∠C  ⇒  AB = AC</text><text x="110" y="430" font-size="22" stroke="none">Trung tuyến từ đỉnh cân đồng thời là</text><text x="110" y="465" font-size="22" stroke="none">đường cao và phân giác.</text><rect x="630" y="180" width="500" height="320" rx="18" fill="none"/><text x="660" y="230" font-size="28" font-weight="700" stroke="none">2. Tam giác đều</text><text x="665" y="285" font-size="24" stroke="none">AB = BC = CA</text><text x="665" y="335" font-size="24" stroke="none">∠A = ∠B = ∠C = 60°</text><text x="665" y="390" font-size="23" stroke="none">Nhận biết nhanh:</text><text x="665" y="430" font-size="23" stroke="none">• 3 cạnh bằng nhau</text><text x="665" y="465" font-size="23" stroke="none">• tam giác cân + một góc 60°</text><rect x="70" y="550" width="1060" height="430" rx="18" fill="none"/><text x="100" y="600" font-size="28" font-weight="700" stroke="none">3. Tam giác vuông và định lý Pythagore</text><text x="120" y="665" font-size="24" stroke="none">Nếu ∠A = 90° thì BC là cạnh huyền.</text><text x="120" y="720" font-size="30" font-weight="700" stroke="none">BC² = AB² + AC²</text><text x="120" y="775" font-size="23" stroke="none">Dùng để tính cạnh khi đã biết hai cạnh còn lại.</text><text x="120" y="835" font-size="25" font-weight="700" stroke="none">Pythagore đảo</text><text x="120" y="885" font-size="24" stroke="none">Nếu cạnh lớn nhất c thỏa c² = a² + b²</text><text x="120" y="925" font-size="24" stroke="none">⇒ tam giác là tam giác vuông.</text><rect x="70" y="1030" width="1060" height="280" rx="18" fill="none"/><text x="100" y="1080" font-size="28" font-weight="700" stroke="none">Quy trình chọn công cụ</text><text x="120" y="1140" font-size="23" stroke="none">Có 2 cạnh bằng nhau? → nghĩ tới tam giác cân.</text><text x="120" y="1185" font-size="23" stroke="none">Có góc 60° + tam giác cân? → nghĩ tới tam giác đều.</text><text x="120" y="1230" font-size="23" stroke="none">Có góc 90° hoặc bộ ba cạnh? → kiểm tra Pythagore.</text><text x="600" y="1420" text-anchor="middle" font-size="22" stroke="none">Không suy luận từ hình vẽ; luôn dựa vào giả thiết hoặc điều đã chứng minh.</text></g></svg>