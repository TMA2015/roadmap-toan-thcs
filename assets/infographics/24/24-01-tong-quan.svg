<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>Chuyên đề 24 - Tổng quan mô hình hóa</title><desc>Sơ đồ quy trình giải bài toán thực tế từ tình huống đến kết luận.</desc><rect width="1200" height="1500" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#111" stroke="#111"><text x="600" y="80" text-anchor="middle" font-size="42" font-weight="700" stroke="none">CHUYÊN ĐỀ 24 — BÀI TOÁN THỰC TẾ</text><text x="600" y="125" text-anchor="middle" font-size="25" stroke="none">Tình huống thực tế → mô hình toán học → lời giải → kiểm tra → kết luận</text><g fill="none" stroke-width="3"><rect x="90" y="190" width="1020" height="150" rx="20"/><rect x="90" y="390" width="1020" height="150" rx="20"/><rect x="90" y="590" width="1020" height="150" rx="20"/><rect x="90" y="790" width="1020" height="150" rx="20"/><rect x="90" y="990" width="1020" height="150" rx="20"/></g><g stroke="none" text-anchor="middle"><text x="600" y="240" font-size="30" font-weight="700">1. ĐỌC VÀ TÓM TẮT</text><text x="600" y="285" font-size="24">Đã biết gì? Cần tìm gì? Đơn vị nào? Có điều kiện gì?</text><text x="600" y="440" font-size="30" font-weight="700">2. CHỌN MÔ HÌNH</text><text x="600" y="485" font-size="24">Công thức • phương trình/hệ • hình học/lượng giác • dữ liệu/xác suất</text><text x="600" y="640" font-size="30" font-weight="700">3. GIẢI MÔ HÌNH</text><text x="600" y="685" font-size="24">Biến đổi, tính toán, giữ đủ số đến bước cuối</text><text x="600" y="840" font-size="30" font-weight="700">4. KIỂM TRA</text><text x="600" y="885" font-size="24">Điều kiện nghiệm • đơn vị • độ lớn • yêu cầu làm tròn</text><text x="600" y="1040" font-size="30" font-weight="700">5. KẾT LUẬN THỰC TẾ</text><text x="600" y="1085" font-size="24">Trả lời đúng đại lượng đề hỏi, kèm đơn vị</text></g><path d="M600 345v35M600 545v35M600 745v35M600 945v35" fill="none" stroke-width="4"/><g stroke="none"><text x="120" y="1230" font-size="28" font-weight="700">3 câu hỏi tự kiểm tra trước khi nộp bài</text><text x="150" y="1280" font-size="24">• Mình đã đổi về cùng hệ đơn vị chưa?</text><text x="150" y="1325" font-size="24">• Nghiệm có thỏa điều kiện và hợp lý trong thực tế không?</text><text x="150" y="1370" font-size="24">• Câu kết luận có trả lời đúng điều đề hỏi không?</text></g></g></svg>