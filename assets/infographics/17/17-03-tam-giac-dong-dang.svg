<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450"><title>Chuyên đề 17 – Tam giác đồng dạng</title><desc>Tóm tắt ba trường hợp đồng dạng và cách ghép đúng các đỉnh, cạnh tương ứng.</desc><rect width="1200" height="1450" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke="#111"><text x="600" y="80" text-anchor="middle" font-size="38" font-weight="700" stroke="none">TAM GIÁC ĐỒNG DẠNG</text><text x="600" y="125" text-anchor="middle" font-size="21" stroke="none">Chứng minh đúng tiêu chuẩn trước, lập tỉ lệ sau</text><rect x="80" y="180" width="1040" height="210" rx="18" fill="none" stroke-width="3"/><text x="120" y="230" font-size="27" font-weight="700" stroke="none">1. GÓC – GÓC (g-g)</text><text x="120" y="280" font-size="22" stroke="none">Hai góc của tam giác này bằng hai góc tương ứng của tam giác kia.</text><text x="120" y="330" font-size="21" stroke="none">Rất hay xuất hiện khi có song song, góc đối đỉnh hoặc góc chung.</text><rect x="80" y="430" width="1040" height="210" rx="18" fill="none" stroke-width="3"/><text x="120" y="480" font-size="27" font-weight="700" stroke="none">2. CẠNH – GÓC – CẠNH (c-g-c)</text><text x="120" y="530" font-size="22" stroke="none">Hai cặp cạnh tương ứng tỉ lệ + góc xen giữa bằng nhau.</text><text x="120" y="580" font-size="21" stroke="none">Từ khóa: góc phải nằm giữa đúng hai cạnh đang xét.</text><rect x="80" y="680" width="1040" height="210" rx="18" fill="none" stroke-width="3"/><text x="120" y="730" font-size="27" font-weight="700" stroke="none">3. CẠNH – CẠNH – CẠNH (c-c-c)</text><text x="120" y="780" font-size="22" stroke="none">Ba cặp cạnh tương ứng tỉ lệ.</text><text x="120" y="830" font-size="21" stroke="none">Phải ghép đúng các cạnh tương ứng trước khi so sánh tỉ số.</text><rect x="80" y="930" width="1040" height="260" rx="18" fill="none" stroke-width="3"/><text x="120" y="980" font-size="27" font-weight="700" stroke="none">THỨ TỰ ĐỈNH LÀ BƯỚC BẮT BUỘC</text><text x="120" y="1030" font-size="23" font-weight="700" stroke="none">△ABC ∼ △DEF  ⇒  A↔D, B↔E, C↔F</text><text x="120" y="1080" font-size="22" stroke="none">AB/DE = BC/EF = AC/DF</text><text x="120" y="1130" font-size="21" stroke="none">Sai thứ tự đỉnh → sai cạnh tương ứng → sai toàn bộ tỉ lệ phía sau.</text><rect x="80" y="1230" width="1040" height="130" rx="18" fill="none" stroke-width="3"/><text x="120" y="1275" font-size="24" font-weight="700" stroke="none">QUY TRÌNH 4 BƯỚC</text><text x="120" y="1320" font-size="21" stroke="none">Ghép đỉnh → chọn tiêu chuẩn → kết luận đồng dạng → lập tỉ lệ cần dùng.</text></g></svg>