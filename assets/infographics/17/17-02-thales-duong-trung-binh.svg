<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450"><title>Chuyên đề 17 – Thales và đường trung bình</title><desc>Tóm tắt định lý Thales thuận, đảo và đường trung bình của tam giác.</desc><rect width="1200" height="1450" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke="#111"><text x="600" y="80" text-anchor="middle" font-size="38" font-weight="700" stroke="none">THALES &amp; ĐƯỜNG TRUNG BÌNH</text><text x="600" y="125" text-anchor="middle" font-size="21" stroke="none">Nhìn cấu hình song song trước, rồi mới viết tỉ lệ</text><rect x="80" y="180" width="1040" height="300" rx="18" fill="none" stroke-width="3"/><text x="120" y="230" font-size="27" font-weight="700" stroke="none">THALES THUẬN</text><text x="120" y="280" font-size="22" stroke="none">Trong △ABC, D∈AB, E∈AC và DE ∥ BC</text><text x="120" y="330" font-size="24" font-weight="700" stroke="none">AD/AB = AE/AC = DE/BC</text><text x="120" y="375" font-size="24" font-weight="700" stroke="none">AD/DB = AE/EC</text><text x="120" y="430" font-size="21" stroke="none">Dùng để tính độ dài hoặc lập tỉ lệ giữa các đoạn tương ứng.</text><rect x="80" y="520" width="1040" height="270" rx="18" fill="none" stroke-width="3"/><text x="120" y="570" font-size="27" font-weight="700" stroke="none">THALES ĐẢO</text><text x="120" y="620" font-size="22" stroke="none">D∈AB, E∈AC và AD/DB = AE/EC</text><text x="120" y="670" font-size="26" font-weight="700" stroke="none">⇒ DE ∥ BC</text><text x="120" y="725" font-size="21" stroke="none">Công cụ mạnh để chứng minh song song khi đề cho các tỉ số đoạn thẳng.</text><rect x="80" y="830" width="1040" height="300" rx="18" fill="none" stroke-width="3"/><text x="120" y="880" font-size="27" font-weight="700" stroke="none">ĐƯỜNG TRUNG BÌNH</text><text x="120" y="930" font-size="22" stroke="none">M, N là trung điểm của AB, AC</text><text x="120" y="980" font-size="26" font-weight="700" stroke="none">MN ∥ BC</text><text x="120" y="1025" font-size="26" font-weight="700" stroke="none">MN = 1/2 BC</text><text x="120" y="1080" font-size="21" stroke="none">Đảo thường dùng: qua trung điểm một cạnh, kẻ song song cạnh thứ hai → cắt cạnh còn lại tại trung điểm.</text><rect x="80" y="1170" width="1040" height="170" rx="18" fill="none" stroke-width="3"/><text x="120" y="1215" font-size="25" font-weight="700" stroke="none">CHECK NHANH TRƯỚC KHI LẬP TỈ LỆ</text><text x="120" y="1260" font-size="21" stroke="none">1. Có thật sự song song không?  2. Các điểm nằm đúng trên hai cạnh chưa?</text><text x="120" y="1300" font-size="21" stroke="none">3. Các đoạn trong hai tỉ số có tương ứng cùng vị trí không?</text></g></svg>