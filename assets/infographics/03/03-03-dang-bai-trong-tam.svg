<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Chuyên đề 03 – Dạng bài trọng tâm</title><desc id="desc">Các dạng bài tỉ lệ thức, chia theo tỉ lệ, tỉ lệ thuận nghịch, phần trăm và bản đồ.</desc><rect width="1200" height="1500" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif" fill="#111" stroke="#111"><text x="600" y="72" text-anchor="middle" font-size="38" font-weight="700" stroke="none">CHUYÊN ĐỀ 03</text><text x="600" y="120" text-anchor="middle" font-size="34" font-weight="700" stroke="none">TỈ LỆ – TỈ LỆ THỨC</text><text x="600" y="158" text-anchor="middle" font-size="22" stroke="none">Dạng bài trọng tâm</text>
<text x="75" y="225" font-size="28" font-weight="700" stroke="none">1. Nhận dạng dạng bài</text><g fill="none" stroke-width="3"><rect x="75" y="260" width="245" height="180" rx="16"/><rect x="345" y="260" width="245" height="180" rx="16"/><rect x="615" y="260" width="245" height="180" rx="16"/><rect x="885" y="260" width="245" height="180" rx="16"/></g><g stroke="none" text-anchor="middle"><text x="198" y="310" font-size="22" font-weight="700">TỈ LỆ THỨC</text><text x="198" y="350" font-size="19">Tìm x / kiểm tra</text><text x="198" y="385" font-size="19">→ nhân chéo</text><text x="468" y="310" font-size="22" font-weight="700">CHIA THEO TỈ LỆ</text><text x="468" y="350" font-size="19">Tổng đã biết</text><text x="468" y="385" font-size="19">→ tổng số phần</text><text x="738" y="310" font-size="22" font-weight="700">TỈ LỆ THUẬN</text><text x="738" y="350" font-size="19">Cùng tăng / giảm</text><text x="738" y="385" font-size="19">→ y = kx</text><text x="1008" y="310" font-size="22" font-weight="700">TỈ LỆ NGHỊCH</text><text x="1008" y="350" font-size="19">Một tăng – một giảm</text><text x="1008" y="385" font-size="19">→ xy = a</text></g>
<text x="75" y="515" font-size="28" font-weight="700" stroke="none">2. Quy trình giải</text><rect x="75" y="550" width="1050" height="225" rx="18" fill="none" stroke-width="3"/><g stroke="none" text-anchor="middle"><text x="190" y="625" font-size="22" font-weight="700">1. ĐỌC KỸ</text><text x="190" y="665" font-size="18">Xác định đại lượng</text><text x="420" y="625" font-size="22" font-weight="700">2. ĐỔI ĐƠN VỊ</text><text x="420" y="665" font-size="18">Nếu cần so sánh</text><text x="660" y="625" font-size="22" font-weight="700">3. CHỌN MÔ HÌNH</text><text x="660" y="665" font-size="18">Thuận / nghịch / tỉ lệ thức</text><text x="935" y="625" font-size="22" font-weight="700">4. KIỂM TRA</text><text x="935" y="665" font-size="18">Đơn vị và tính hợp lí</text><text x="305" y="725" font-size="32">→</text><text x="540" y="725" font-size="32">→</text><text x="800" y="725" font-size="32">→</text></g>
<text x="75" y="855" font-size="28" font-weight="700" stroke="none">3. Ví dụ nhanh</text><g fill="none" stroke-width="3"><rect x="75" y="890" width="500" height="240" rx="18"/><rect x="625" y="890" width="500" height="240" rx="18"/></g><g stroke="none"><text x="115" y="940" font-size="22" font-weight="700">Chia 180 theo tỉ lệ 2:3:4</text><text x="115" y="985" font-size="20">Tổng phần = 9 → mỗi phần = 20</text><text x="115" y="1030" font-size="20">Kết quả: 40; 60; 80</text><text x="665" y="940" font-size="22" font-weight="700">6 máy làm 15 giờ; 10 máy?</text><text x="665" y="985" font-size="20">Cùng công việc, cùng năng suất</text><text x="665" y="1030" font-size="20">6·15 = 10·t → t = 9 giờ</text></g>
<text x="75" y="1210" font-size="28" font-weight="700" stroke="none">4. Lỗi thường gặp</text><rect x="75" y="1245" width="1050" height="175" rx="18" fill="none" stroke-width="3"/><g stroke="none"><text x="115" y="1295" font-size="20">• Lập tỉ số khi hai đại lượng chưa cùng đơn vị.</text><text x="115" y="1335" font-size="20">• Nhầm tỉ lệ thuận với tỉ lệ nghịch chỉ vì “một đại lượng thay đổi”.</text><text x="115" y="1375" font-size="20">• Dùng tỉ lệ nghịch cho bài năng suất khi năng suất mỗi người/máy không như nhau.</text><text x="600" y="1460" text-anchor="middle" font-size="20" font-weight="700">Nhận đúng mô hình quan trọng hơn thuộc nhiều công thức.</text></g></g></svg>