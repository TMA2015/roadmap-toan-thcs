<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1414" viewBox="0 0 1000 1414"><rect width="1000" height="1414" fill="#fff"/><style>.t{font-family:Arial,sans-serif;fill:#111}.h{font-size:38px;font-weight:700}.s{font-size:24px;font-weight:700}.b{font-size:20px}.box{fill:#fff;stroke:#333;stroke-width:2;rx:18}.muted{fill:#f5f5f5}</style><text x="500" y="70" text-anchor="middle" class="t h">CHUYÊN ĐỀ 10 – HÀM SỐ VÀ ĐỒ THỊ</text><text x="500" y="108" text-anchor="middle" class="t s">Infographic 1 – Tổng quan chuyên đề</text><rect x="55" y="145" width="890" height="180" class="box muted"/><text x="85" y="190" class="t s">1. Học gì?</text><text x="85" y="230" class="t b">• Khái niệm hàm số, bảng giá trị, tọa độ điểm</text><text x="85" y="265" class="t b">• Hàm số bậc nhất y = ax + b và đồ thị đường thẳng</text><text x="85" y="300" class="t b">• Giao điểm, vị trí hai đường thẳng, mở rộng y = ax²</text><rect x="55" y="355" width="890" height="260" class="box"/><text x="85" y="400" class="t s">2. Mạch kiến thức</text><text x="100" y="465" class="t b">03. Tỉ lệ</text><text x="275" y="465" class="t b">→</text><text x="325" y="465" class="t b">09. Hệ phương trình</text><text x="565" y="465" class="t b">→</text><text x="615" y="465" class="t b">10. Hàm số &amp; đồ thị</text><text x="250" y="535" class="t b">↓</text><text x="315" y="535" class="t b">12. Bậc hai &amp; Viète</text><text x="590" y="535" class="t b">→</text><text x="720" y="535" class="t b">24. Mô hình hóa</text><rect x="55" y="645" width="425" height="275" class="box muted"/><text x="85" y="690" class="t s">3. Ý tưởng cốt lõi</text><text x="85" y="735" class="t b">• Công thức ↔ bảng giá trị ↔ điểm</text><text x="85" y="775" class="t b">• Đồ thị biểu diễn quan hệ giữa x và y</text><text x="85" y="815" class="t b">• Giao điểm = nghiệm chung</text><text x="85" y="855" class="t b">• Hệ số góc quyết định</text><text x="105" y="885" class="t b">hướng của đường thẳng</text><rect x="520" y="645" width="425" height="275" class="box"/><text x="550" y="690" class="t s">4. Kỹ năng cần đạt</text><text x="550" y="735" class="t b">• Tính f(x), lập bảng giá trị</text><text x="550" y="775" class="t b">• Biểu diễn điểm M(x; y)</text><text x="550" y="815" class="t b">• Vẽ đường thẳng bằng hai điểm</text><text x="550" y="855" class="t b">• Tìm giao điểm và nhận biết</text><text x="570" y="885" class="t b">song song</text><rect x="55" y="950" width="890" height="250" class="box muted"/><text x="85" y="995" class="t s">5. Lỗi thường gặp</text><text x="85" y="1040" class="t b">• Đảo hoành độ và tung độ khi biểu diễn điểm</text><text x="85" y="1080" class="t b">• Chọn hai điểm sai vì tính nhầm giá trị y</text><text x="85" y="1120" class="t b">• Nhầm hệ số góc a với tung độ gốc b</text><text x="85" y="1160" class="t b">• Tìm giao điểm nhưng quên thay lại để lấy cả x và y</text><rect x="55" y="1235" width="890" height="105" class="box"/><text x="500" y="1280" text-anchor="middle" class="t s">Công thức → Bảng giá trị → Điểm → Đồ thị → Giao điểm</text><text x="500" y="1320" text-anchor="middle" class="t b">Roadmap Toán THCS</text></svg>