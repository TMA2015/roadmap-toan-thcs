<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Giao điểm của hai đường thẳng</title><desc id="desc">y=2x+1 và y=-x+4 cắt tại I(1;3).</desc><rect width="1000" height="650" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#0f172a"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#475569"/></marker></defs>
<text x="50" y="45" font-size="28" font-weight="700">GIAO ĐIỂM HAI ĐƯỜNG THẲNG</text><text x="50" y="76" font-size="18" fill="#475569">d₁: y = 2x + 1   và   d₂: y = -x + 4</text><rect x="110" y="110" width="760" height="470" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<g stroke="#e2e8f0"><line x1="110" y1="110" x2="110" y2="580"/><line x1="205" y1="110" x2="205" y2="580"/><line x1="300" y1="110" x2="300" y2="580"/><line x1="395" y1="110" x2="395" y2="580"/><line x1="490" y1="110" x2="490" y2="580"/><line x1="585" y1="110" x2="585" y2="580"/><line x1="680" y1="110" x2="680" y2="580"/><line x1="775" y1="110" x2="775" y2="580"/><line x1="870" y1="110" x2="870" y2="580"/><line x1="110" y1="580" x2="870" y2="580"/><line x1="110" y1="533" x2="870" y2="533"/><line x1="110" y1="486" x2="870" y2="486"/><line x1="110" y1="439" x2="870" y2="439"/><line x1="110" y1="392" x2="870" y2="392"/><line x1="110" y1="345" x2="870" y2="345"/><line x1="110" y1="298" x2="870" y2="298"/><line x1="110" y1="251" x2="870" y2="251"/><line x1="110" y1="204" x2="870" y2="204"/><line x1="110" y1="157" x2="870" y2="157"/><line x1="110" y1="110" x2="870" y2="110"/></g>
<line x1="395" y1="580" x2="395" y2="116" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="403" y="128" font-size="16">y</text><line x1="110" y1="439" x2="864" y2="439" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="852" y="431" font-size="16">x</text><text x="401" y="457" font-size="14" fill="#475569">O</text><line x1="157.5" y1="627" x2="680" y2="110" stroke="#2563eb" stroke-width="4"/><line x1="110" y1="110" x2="870" y2="486" stroke="#dc2626" stroke-width="4"/><circle cx="490" cy="298" r="6" fill="#7c3aed" stroke="#7c3aed" stroke-width="3"/><text x="502" y="286" font-size="17" font-weight="700" fill="#7c3aed">I(1; 3)</text><line x1="490" y1="298" x2="490" y2="439" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="490" y1="298" x2="395" y2="298" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/><text x="610" y="175.2" font-size="17" fill="#2563eb">d₁</text><text x="743" y="410.2" font-size="17" fill="#dc2626">d₂</text>
<rect x="750" y="460" width="205" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="770" y="493" font-size="16">2x + 1 = -x + 4</text><text x="770" y="522" font-size="16">⇒ x = 1</text><text x="770" y="551" font-size="16">⇒ y = 3</text><text x="110" y="625" font-size="18" fill="#475569">Nghiệm của hệ chính là tọa độ giao điểm của hai đồ thị.</text></g></svg>