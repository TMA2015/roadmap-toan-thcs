<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Mặt phẳng tọa độ và điểm thuộc đồ thị</title><desc id="desc">Bốn góc phần tư và kiểm tra điểm thuộc đường thẳng.</desc><rect width="1000" height="650" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#0f172a"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#475569"/></marker></defs>
<text x="50" y="45" font-size="28" font-weight="700">MẶT PHẲNG TỌA ĐỘ – ĐIỂM THUỘC ĐỒ THỊ</text><text x="50" y="76" font-size="18" fill="#475569">Ví dụ với đường thẳng y = x + 1.</text><rect x="90" y="110" width="720" height="480" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<g stroke="#e2e8f0"><line x1="90" y1="110" x2="90" y2="590"/><line x1="170" y1="110" x2="170" y2="590"/><line x1="250" y1="110" x2="250" y2="590"/><line x1="330" y1="110" x2="330" y2="590"/><line x1="410" y1="110" x2="410" y2="590"/><line x1="490" y1="110" x2="490" y2="590"/><line x1="570" y1="110" x2="570" y2="590"/><line x1="650" y1="110" x2="650" y2="590"/><line x1="730" y1="110" x2="730" y2="590"/><line x1="810" y1="110" x2="810" y2="590"/><line x1="90" y1="590" x2="810" y2="590"/><line x1="90" y1="536.7" x2="810" y2="536.7"/><line x1="90" y1="483.3" x2="810" y2="483.3"/><line x1="90" y1="430" x2="810" y2="430"/><line x1="90" y1="376.7" x2="810" y2="376.7"/><line x1="90" y1="323.3" x2="810" y2="323.3"/><line x1="90" y1="270" x2="810" y2="270"/><line x1="90" y1="216.7" x2="810" y2="216.7"/><line x1="90" y1="163.3" x2="810" y2="163.3"/><line x1="90" y1="110" x2="810" y2="110"/></g>
<line x1="410" y1="590" x2="410" y2="116" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="418" y="128" font-size="16">y</text><line x1="90" y1="376.7" x2="804" y2="376.7" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="792" y="368.7" font-size="16">x</text><text x="416" y="394.7" font-size="14" fill="#475569">O</text>
<line x1="90" y1="536.7" x2="730" y2="110" stroke="#2563eb" stroke-width="4"/><circle cx="570" cy="216.7" r="6" fill="#059669" stroke="#059669" stroke-width="3"/><text x="580" y="204.7" font-size="17" font-weight="700" fill="#059669">A(2; 3) ✓</text><circle cx="570" cy="270" r="6" fill="white" stroke="#dc2626" stroke-width="3"/><text x="580" y="294" font-size="17" font-weight="700" fill="#dc2626">B(2; 2) ✗</text>
<text x="634" y="152.7" font-size="18" fill="#64748b">I</text><text x="154" y="152.7" font-size="18" fill="#64748b">II</text><text x="154" y="547.3" font-size="18" fill="#64748b">III</text><text x="666" y="547.3" font-size="18" fill="#64748b">IV</text><text x="658" y="148" font-size="17" fill="#2563eb">y = x + 1</text>
<rect x="830" y="150" width="140" height="220" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="848" y="185" font-size="18" font-weight="700">Kiểm tra</text><text x="848" y="220" font-size="16">A: 3 = 2 + 1</text><text x="848" y="250" font-size="16" fill="#059669">→ thuộc</text><text x="848" y="305" font-size="16">B: 2 ≠ 2 + 1</text><text x="848" y="335" font-size="16" fill="#dc2626">→ không thuộc</text><text x="90" y="625" font-size="18" fill="#475569">Một điểm M(x₀; y₀) thuộc đồ thị khi và chỉ khi y₀ = f(x₀).</text></g></svg>