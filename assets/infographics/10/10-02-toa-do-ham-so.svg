<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1414" viewBox="0 0 1000 1414"><rect width="1000" height="1414" fill="#fff"/><style>.t{font-family:Arial,sans-serif;fill:#111}.h{font-size:36px;font-weight:700}.s{font-size:23px;font-weight:700}.b{font-size:19px}.box{fill:#fff;stroke:#333;stroke-width:2;rx:18}.m{fill:#f5f5f5}</style><text x="500" y="68" text-anchor="middle" class="t h">CHUYÊN ĐỀ 10 – HÀM SỐ VÀ ĐỒ THỊ</text><text x="500" y="106" text-anchor="middle" class="t s">Infographic 2 – Tọa độ và khái niệm hàm số</text><rect x="55" y="145" width="890" height="200" class="box m"/><text x="85" y="190" class="t s">1. Hàm số là gì?</text><text x="85" y="235" class="t b">• Mỗi giá trị x trong tập xác định cho duy nhất một giá trị y.</text><text x="85" y="275" class="t b">• Có thể viết y = f(x).</text><text x="85" y="315" class="t b">Ví dụ: f(x)=2x+3 ⇒ f(1)=5.</text><rect x="55" y="375" width="425" height="300" class="box"/><text x="85" y="420" class="t s">2. Bảng giá trị</text><text x="85" y="465" class="t b">Với y = 2x − 1:</text><text x="110" y="515" class="t b">x:  −1     0     1     2</text><text x="110" y="555" class="t b">y:  −3    −1     1     3</text><text x="85" y="610" class="t b">Bảng giá trị giúp chuyển</text><text x="85" y="645" class="t b">công thức → các điểm trên đồ thị.</text><rect x="520" y="375" width="425" height="300" class="box m"/><text x="550" y="420" class="t s">3. Tọa độ điểm M(x; y)</text><text x="550" y="465" class="t b">• x: hoành độ</text><text x="550" y="505" class="t b">• y: tung độ</text><text x="550" y="550" class="t b">A(2;3): sang phải 2, lên 3.</text><text x="550" y="595" class="t b">Không đảo thứ tự (x; y).</text><text x="550" y="635" class="t b">Điểm thuộc đồ thị khi y = f(x).</text><rect x="55" y="705" width="890" height="260" class="box"/><text x="85" y="750" class="t s">4. Bốn góc phần tư</text><text x="100" y="810" class="t b">I: x &gt; 0, y &gt; 0</text><text x="540" y="810" class="t b">II: x &lt; 0, y &gt; 0</text><text x="100" y="865" class="t b">III: x &lt; 0, y &lt; 0</text><text x="540" y="865" class="t b">IV: x &gt; 0, y &lt; 0</text><text x="85" y="925" class="t b">Trên trục Ox: y = 0. Trên trục Oy: x = 0.</text><rect x="55" y="995" width="890" height="245" class="box m"/><text x="85" y="1040" class="t s">5. Kiểm tra điểm có thuộc đồ thị không</text><text x="85" y="1090" class="t b">Bước 1: lấy hoành độ x₀ của điểm.</text><text x="85" y="1130" class="t b">Bước 2: tính f(x₀).</text><text x="85" y="1170" class="t b">Bước 3: so sánh với tung độ y₀.</text><text x="85" y="1210" class="t b">Nếu y₀ = f(x₀) thì điểm thuộc đồ thị.</text><rect x="55" y="1270" width="890" height="80" class="box"/><text x="500" y="1320" text-anchor="middle" class="t s">Hàm số = quy tắc gắn x với đúng một y</text></svg>