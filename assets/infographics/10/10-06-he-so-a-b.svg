<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Vai trò của hệ số a và b</title><desc id="desc">So sánh ảnh hưởng của a và b trong y=ax+b.</desc><rect width="1200" height="560" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#0f172a"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#475569"/></marker></defs>
<text x="55" y="46" font-size="28" font-weight="700">HỆ SỐ a VÀ b THAY ĐỔI ĐỒ THỊ THẾ NÀO?</text><text x="55" y="78" font-size="18" fill="#475569">Cùng hệ trục và cùng tỉ lệ để so sánh trực quan.</text><text x="90" y="120" font-size="20" font-weight="700">Thay đổi a, giữ b = 1</text><text x="650" y="120" font-size="20" font-weight="700">Thay đổi b, giữ a = 1</text>
<rect x="60" y="145" width="500" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><g stroke="#e2e8f0"><line x1="60" y1="145" x2="60" y2="475"/><line x1="122.5" y1="145" x2="122.5" y2="475"/><line x1="185" y1="145" x2="185" y2="475"/><line x1="247.5" y1="145" x2="247.5" y2="475"/><line x1="310" y1="145" x2="310" y2="475"/><line x1="372.5" y1="145" x2="372.5" y2="475"/><line x1="435" y1="145" x2="435" y2="475"/><line x1="497.5" y1="145" x2="497.5" y2="475"/><line x1="560" y1="145" x2="560" y2="475"/><line x1="60" y1="475" x2="560" y2="475"/><line x1="60" y1="445" x2="560" y2="445"/><line x1="60" y1="415" x2="560" y2="415"/><line x1="60" y1="385" x2="560" y2="385"/><line x1="60" y1="355" x2="560" y2="355"/><line x1="60" y1="325" x2="560" y2="325"/><line x1="60" y1="295" x2="560" y2="295"/><line x1="60" y1="265" x2="560" y2="265"/><line x1="60" y1="235" x2="560" y2="235"/><line x1="60" y1="205" x2="560" y2="205"/><line x1="60" y1="175" x2="560" y2="175"/><line x1="60" y1="145" x2="560" y2="145"/></g>
<line x1="310" y1="475" x2="310" y2="151" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="318" y="163" font-size="16">y</text><line x1="60" y1="325" x2="554" y2="325" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="542" y="317" font-size="16">x</text><text x="316" y="343" font-size="14" fill="#475569">O</text>
<line x1="60" y1="535" x2="560" y2="55" stroke="#2563eb" stroke-width="3"/><text x="411.8" y="197" font-size="15" fill="#2563eb">y = 2x + 1</text><line x1="60" y1="355" x2="560" y2="235" stroke="#059669" stroke-width="3"/><text x="474.2" y="249.5" font-size="15" fill="#059669">y = 0,5x + 1</text><line x1="60" y1="175" x2="560" y2="415" stroke="#dc2626" stroke-width="3"/><text x="443" y="347" font-size="15" fill="#dc2626">y = -x + 1</text><circle cx="310" cy="295" r="6" fill="#7c3aed" stroke="#7c3aed" stroke-width="3"/><text x="318" y="285" font-size="17" font-weight="700" fill="#7c3aed">cùng b = 1</text>
<rect x="640" y="145" width="500" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><g stroke="#e2e8f0"><line x1="640" y1="145" x2="640" y2="475"/><line x1="702.5" y1="145" x2="702.5" y2="475"/><line x1="765" y1="145" x2="765" y2="475"/><line x1="827.5" y1="145" x2="827.5" y2="475"/><line x1="890" y1="145" x2="890" y2="475"/><line x1="952.5" y1="145" x2="952.5" y2="475"/><line x1="1015" y1="145" x2="1015" y2="475"/><line x1="1077.5" y1="145" x2="1077.5" y2="475"/><line x1="1140" y1="145" x2="1140" y2="475"/><line x1="640" y1="475" x2="1140" y2="475"/><line x1="640" y1="445" x2="1140" y2="445"/><line x1="640" y1="415" x2="1140" y2="415"/><line x1="640" y1="385" x2="1140" y2="385"/><line x1="640" y1="355" x2="1140" y2="355"/><line x1="640" y1="325" x2="1140" y2="325"/><line x1="640" y1="295" x2="1140" y2="295"/><line x1="640" y1="265" x2="1140" y2="265"/><line x1="640" y1="235" x2="1140" y2="235"/><line x1="640" y1="205" x2="1140" y2="205"/><line x1="640" y1="175" x2="1140" y2="175"/><line x1="640" y1="145" x2="1140" y2="145"/></g>
<line x1="890" y1="475" x2="890" y2="151" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="898" y="163" font-size="16">y</text><line x1="640" y1="325" x2="1134" y2="325" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="1122" y="317" font-size="16">x</text><text x="896" y="343" font-size="14" fill="#475569">O</text><line x1="640" y1="355" x2="1140" y2="115" stroke="#2563eb" stroke-width="3"/><text x="1004.2" y="176" font-size="15" fill="#2563eb">y = x + 3</text><line x1="640" y1="445" x2="1140" y2="205" stroke="#059669" stroke-width="3"/><text x="1004.2" y="266" font-size="15" fill="#059669">y = x</text><line x1="640" y1="535" x2="1140" y2="295" stroke="#dc2626" stroke-width="3"/><text x="1004.2" y="356" font-size="15" fill="#dc2626">y = x - 3</text><text x="60" y="525" font-size="17" fill="#475569">a quyết định độ dốc và chiều tăng/giảm; b quyết định điểm cắt trục Oy tại (0; b).</text></g></svg>