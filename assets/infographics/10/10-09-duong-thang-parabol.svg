<rect x="715" y="455" width="240" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="735" y="487" font-size="16">x² = x + 2</text><text x="735" y="516" font-size="16">⇔ (x - 2)(x + 1) = 0</text><text x="735" y="545" font-size="16">⇒ x = -1 hoặc x = 2</text><text x="110" y="625" font-size="18" fill="#475569">Số nghiệm thực của phương trình bằng số giao điểm của hai đồ thị.</text></g></svg>