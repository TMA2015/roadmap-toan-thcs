<title id="title">Giao điểm đường thẳng và parabol</title><desc id="desc">y=x² và y=x+2 cắt nhau tại hai điểm.</desc><rect width="1000" height="650" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#0f172a"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#475569"/></marker></defs>
