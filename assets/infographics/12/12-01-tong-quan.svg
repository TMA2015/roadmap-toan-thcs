<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Chuyên đề 12 – Phương trình bậc hai và Viète – Tổng quan</title><desc id="desc">Infographic tổng quan phương trình bậc hai, biệt thức, công thức nghiệm và hệ thức Viète.</desc><rect width="1200" height="1500" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#111"><text x="600" y="75" text-anchor="middle" font-size="34" font-weight="700">CHUYÊN ĐỀ 12</text><text x="600" y="122" text-anchor="middle" font-size="42" font-weight="700">PHƯƠNG TRÌNH BẬC HAI &amp; VIÈTE</text><text x="600" y="160" text-anchor="middle" font-size="23">Tổng quan chuyên đề</text><rect x="70" y="205" width="1060" height="185" rx="20" fill="#fafafa" stroke="#222" stroke-width="2"/><text x="105" y="250" font-size="27" font-weight="700">1. HỌC GÌ?</text><text x="105" y="295" font-size="22">• Phương trình ax² + bx + c = 0, a ≠ 0</text><text x="105" y="332" font-size="22">• Biệt thức Δ, Δ' và số nghiệm</text><text x="610" y="295" font-size="22">• Công thức nghiệm</text><text x="610" y="332" font-size="22">• Viète: tổng – tích hai nghiệm</text><rect x="70" y="420" width="1060" height="235" rx="20" fill="white" stroke="#222" stroke-width="2"/><text x="105" y="465" font-size="27" font-weight="700">2. MẠCH TƯ DUY</text><g font-size="22" text-anchor="middle"><rect x="110" y="510" width="210" height="78" rx="14" fill="#f7f7f7" stroke="#333"/><text x="215" y="544">Chuẩn hóa</text><text x="215" y="573">ax²+bx+c=0</text><rect x="365" y="510" width="210" height="78" rx="14" fill="#f7f7f7" stroke="#333"/><text x="470" y="544">Tính Δ / Δ'</text><text x="470" y="573">xét số nghiệm</text><rect x="620" y="510" width="210" height="78" rx="14" fill="#f7f7f7" stroke="#333"/><text x="725" y="544">Giải nghiệm</text><text x="725" y="573">nếu cần</text><rect x="875" y="510" width="210" height="78" rx="14" fill="#f7f7f7" stroke="#333"/><text x="980" y="544">Dùng Viète</text><text x="980" y="573">nếu hỏi S, P</text></g><g stroke="#333" stroke-width="3"><path d="M320 549h45"/><path d="M575 549h45"/><path d="M830 549h45"/></g><rect x="70" y="685" width="510" height="285" rx="20" fill="#fafafa" stroke="#222" stroke-width="2"/><text x="105" y="730" font-size="27" font-weight="700">3. CÔNG THỨC LÕI</text><text x="105" y="785" font-size="25">Δ = b² − 4ac</text><text x="105" y="835" font-size="23">Δ &gt; 0 → 2 nghiệm phân biệt</text><text x="105" y="875" font-size="23">Δ = 0 → nghiệm kép</text><text x="105" y="915" font-size="23">Δ &lt; 0 → vô nghiệm trong R</text><rect x="620" y="685" width="510" height="285" rx="20" fill="white" stroke="#222" stroke-width="2"/><text x="655" y="730" font-size="27" font-weight="700">4. VIÈTE</text><text x="655" y="790" font-size="26">S = x₁ + x₂ = −b/a</text><text x="655" y="840" font-size="26">P = x₁x₂ = c/a</text><text x="655" y="900" font-size="22">Ưu tiên Viète khi đề chỉ hỏi</text><text x="655" y="935" font-size="22">tổng, tích, biểu thức đối xứng.</text><rect x="70" y="1000" width="1060" height="270" rx="20" fill="#fafafa" stroke="#222" stroke-width="2"/><text x="105" y="1045" font-size="27" font-weight="700">5. LIÊN KẾT ROADMAP</text><text x="105" y="1100" font-size="23">10. Hàm số &amp; đồ thị → 11. Căn thức → 12. PHƯƠNG TRÌNH BẬC HAI &amp; VIÈTE</text><text x="105" y="1150" font-size="23">→ 25. Tổng hợp ôn thi vào 10 → Đại số THPT</text><text x="105" y="1210" font-size="22">Mục tiêu: không chỉ biết giải phương trình, mà biết chọn công cụ ngắn nhất.</text><rect x="70" y="1300" width="1060" height="120" rx="20" fill="white" stroke="#222" stroke-width="2"/><text x="600" y="1350" text-anchor="middle" font-size="25" font-weight="700">Học bài → Luyện tập → Tự kiểm tra</text><text x="600" y="1390" text-anchor="middle" font-size="22">Đạt ≥ 80% phần cốt lõi trước khi chuyển tiếp</text></g></svg>