<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Chuyên đề 12 – Delta và công thức nghiệm</title><desc id="desc">Infographic về biệt thức, công thức nghiệm và công thức nghiệm thu gọn của phương trình bậc hai.</desc><rect width="1200" height="1500" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#111"><text x="600" y="78" text-anchor="middle" font-size="34" font-weight="700">CHUYÊN ĐỀ 12</text><text x="600" y="125" text-anchor="middle" font-size="40" font-weight="700">Δ – Δ' – CÔNG THỨC NGHIỆM</text><rect x="70" y="190" width="1060" height="190" rx="20" fill="#fafafa" stroke="#222" stroke-width="2"/><text x="105" y="238" font-size="27" font-weight="700">1. NHẬN DẠNG</text><text x="105" y="292" font-size="26">ax² + bx + c = 0,  a ≠ 0</text><text x="105" y="338" font-size="22">Đọc đúng dấu của a, b, c trước khi tính.</text><rect x="70" y="410" width="1060" height="310" rx="20" fill="white" stroke="#222" stroke-width="2"/><text x="105" y="458" font-size="27" font-weight="700">2. BIỆT THỨC Δ</text><text x="105" y="520" font-size="32" font-weight="700">Δ = b² − 4ac</text><g font-size="23"><text x="105" y="580">Δ &gt; 0  →  hai nghiệm phân biệt</text><text x="105" y="625">Δ = 0  →  nghiệm kép</text><text x="105" y="670">Δ &lt; 0  →  vô nghiệm trong R</text></g><rect x="70" y="750" width="510" height="330" rx="20" fill="#fafafa" stroke="#222" stroke-width="2"/><text x="105" y="798" font-size="27" font-weight="700">3. CÔNG THỨC NGHIỆM</text><text x="105" y="860" font-size="24">x₁ = (−b + √Δ)/(2a)</text><text x="105" y="910" font-size="24">x₂ = (−b − √Δ)/(2a)</text><text x="105" y="970" font-size="22">Nếu Δ = 0:</text><text x="105" y="1012" font-size="24">x₁ = x₂ = −b/(2a)</text><rect x="620" y="750" width="510" height="330" rx="20" fill="white" stroke="#222" stroke-width="2"/><text x="655" y="798" font-size="27" font-weight="700">4. CÔNG THỨC THU GỌN</text><text x="655" y="852" font-size="22">Khi b = 2b', dùng:</text><text x="655" y="902" font-size="28" font-weight="700">Δ' = b'² − ac</text><text x="655" y="955" font-size="22">x = (−b' ± √Δ')/a</text><text x="655" y="1010" font-size="21">Hữu ích khi b chẵn.</text><rect x="70" y="1110" width="1060" height="245" rx="20" fill="#fafafa" stroke="#222" stroke-width="2"/><text x="105" y="1155" font-size="27" font-weight="700">5. CHECKLIST TRƯỚC KHI KẾT LUẬN</text><text x="105" y="1208" font-size="22">□ Phương trình thật sự bậc hai?  a ≠ 0</text><text x="105" y="1250" font-size="22">□ Tính đúng b² − 4ac?  □ Mẫu là 2a?</text><text x="105" y="1292" font-size="22">□ Nếu có tham số, đã xét giá trị làm a = 0 chưa?</text><text x="600" y="1420" text-anchor="middle" font-size="23">Roadmap Toán THCS • Topic 12</text></g></svg>