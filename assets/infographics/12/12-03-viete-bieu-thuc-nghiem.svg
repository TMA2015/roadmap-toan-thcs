<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Chuyên đề 12 – Hệ thức Viète</title><desc id="desc">Infographic về hệ thức Viète, tổng tích hai nghiệm và các biểu thức đối xứng thường gặp.</desc><rect width="1200" height="1500" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#111"><text x="600" y="78" text-anchor="middle" font-size="34" font-weight="700">CHUYÊN ĐỀ 12</text><text x="600" y="125" text-anchor="middle" font-size="40" font-weight="700">HỆ THỨC VIÈTE</text><text x="600" y="162" text-anchor="middle" font-size="23">Tổng – tích hai nghiệm và biểu thức đối xứng</text><rect x="70" y="205" width="1060" height="205" rx="20" fill="#fafafa" stroke="#222" stroke-width="2"/><text x="105" y="252" font-size="27" font-weight="700">1. CÔNG THỨC CỐT LÕI</text><text x="105" y="312" font-size="27">Nếu ax² + bx + c = 0 có hai nghiệm thực x₁, x₂:</text><text x="180" y="365" font-size="30" font-weight="700">S = x₁ + x₂ = −b/a</text><text x="690" y="365" font-size="30" font-weight="700">P = x₁x₂ = c/a</text><rect x="70" y="445" width="510" height="335" rx="20" fill="white" stroke="#222" stroke-width="2"/><text x="105" y="493" font-size="27" font-weight="700">2. BIỂU THỨC THƯỜNG GẶP</text><text x="105" y="552" font-size="23">x₁² + x₂² = S² − 2P</text><text x="105" y="602" font-size="23">(x₁ − x₂)² = S² − 4P</text><text x="105" y="652" font-size="23">1/x₁ + 1/x₂ = S/P</text><text x="105" y="702" font-size="23">x₁³ + x₂³ = S³ − 3PS</text><text x="105" y="750" font-size="20">Điều kiện P ≠ 0 khi có nghịch đảo.</text><rect x="620" y="445" width="510" height="335" rx="20" fill="#fafafa" stroke="#222" stroke-width="2"/><text x="655" y="493" font-size="27" font-weight="700">3. KHI NÀO NÊN DÙNG VIÈTE?</text><text x="655" y="550" font-size="22">• Đề không yêu cầu tìm từng nghiệm.</text><text x="655" y="595" font-size="22">• Cần tổng, tích hoặc biểu thức đối xứng.</text><text x="655" y="640" font-size="22">• Cần tìm tham số từ quan hệ nghiệm.</text><text x="655" y="685" font-size="22">• Cần xét dấu hai nghiệm.</text><text x="655" y="735" font-size="21">→ Tránh giải nghiệm dài nếu S, P đã đủ.</text><rect x="70" y="815" width="1060" height="250" rx="20" fill="white" stroke="#222" stroke-width="2"/><text x="105" y="862" font-size="27" font-weight="700">4. LẬP PHƯƠNG TRÌNH KHI BIẾT HAI NGHIỆM</text><text x="105" y="925" font-size="25">Biết S = x₁+x₂ và P = x₁x₂</text><text x="105" y="980" font-size="29" font-weight="700">→ x² − Sx + P = 0</text><text x="650" y="925" font-size="22">Ví dụ nghiệm 2 và −3:</text><text x="650" y="970" font-size="22">S = −1, P = −6</text><text x="650" y="1015" font-size="24">→ x² + x − 6 = 0</text><rect x="70" y="1100" width="1060" height="255" rx="20" fill="#fafafa" stroke="#222" stroke-width="2"/><text x="105" y="1147" font-size="27" font-weight="700">5. QUY TRÌNH LÀM BÀI VIÈTE</text><text x="105" y="1203" font-size="22">1. Bảo đảm phương trình có nghiệm thực phù hợp.</text><text x="105" y="1245" font-size="22">2. Tính S = −b/a và P = c/a.</text><text x="105" y="1287" font-size="22">3. Biến đổi yêu cầu về S, P rồi tính.</text><text x="105" y="1329" font-size="22">4. Kiểm tra điều kiện phụ trước khi kết luận.</text><text x="600" y="1430" text-anchor="middle" font-size="23">Roadmap Toán THCS • Topic 12</text></g></svg>