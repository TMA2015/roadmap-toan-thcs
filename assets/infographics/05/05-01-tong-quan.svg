<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450" role="img" aria-labelledby="t d"><title id="t">Chuyên đề 05 – 7 Hằng đẳng thức đáng nhớ – Tổng quan</title><desc id="d">Tổng quan nhóm bình phương, nhóm lập phương, hai chiều sử dụng và liên kết Roadmap.</desc><rect width="1200" height="1450" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif" fill="#111" stroke="#111"><text x="600" y="70" text-anchor="middle" font-size="38" font-weight="700" stroke="none">CHUYÊN ĐỀ 05</text><text x="600" y="120" text-anchor="middle" font-size="34" font-weight="700" stroke="none">7 HẰNG ĐẲNG THỨC ĐÁNG NHỚ</text><text x="600" y="158" text-anchor="middle" font-size="22" stroke="none">Tổng quan chuyên đề</text><rect x="60" y="200" width="1080" height="190" rx="18" fill="none" stroke-width="3"/><text x="90" y="245" font-size="25" font-weight="700" stroke="none">1. Ý tưởng chính</text><text x="95" y="290" font-size="21" stroke="none">• Không học 7 công thức rời rạc — học theo cấu trúc.</text><text x="95" y="330" font-size="21" stroke="none">• Mỗi công thức dùng theo hai chiều: khai triển ↔ nhận dạng.</text><text x="95" y="370" font-size="21" stroke="none">• Bước đầu tiên luôn là xác định đúng A và B.</text><rect x="60" y="430" width="520" height="350" rx="18" fill="none" stroke-width="3"/><text x="90" y="475" font-size="25" font-weight="700" stroke="none">2. Nhóm bình phương</text><text x="95" y="535" font-size="23" stroke="none">(A+B)²</text><text x="95" y="580" font-size="21" stroke="none">→ A² + 2AB + B²</text><text x="95" y="640" font-size="23" stroke="none">(A−B)²</text><text x="95" y="685" font-size="21" stroke="none">→ A² − 2AB + B²</text><text x="95" y="745" font-size="23" stroke="none">A²−B² → (A−B)(A+B)</text><rect x="620" y="430" width="520" height="350" rx="18" fill="none" stroke-width="3"/><text x="650" y="475" font-size="25" font-weight="700" stroke="none">3. Nhóm lập phương</text><text x="655" y="535" font-size="22" stroke="none">(A±B)³</text><text x="655" y="580" font-size="20" stroke="none">→ hệ số 1 – 3 – 3 – 1</text><text x="655" y="640" font-size="22" stroke="none">A³+B³</text><text x="655" y="685" font-size="20" stroke="none">→ (A+B)(A²−AB+B²)</text><text x="655" y="745" font-size="22" stroke="none">A³−B³ → (A−B)(A²+AB+B²)</text><rect x="60" y="820" width="1080" height="235" rx="18" fill="none" stroke-width="3"/><text x="90" y="865" font-size="25" font-weight="700" stroke="none">4. Dùng để làm gì?</text><text x="95" y="915" font-size="21" stroke="none">• Khai triển nhanh biểu thức</text><text x="450" y="915" font-size="21" stroke="none">• Nhận dạng và đưa về dạng tích</text><text x="95" y="960" font-size="21" stroke="none">• Tính nhanh</text><text x="450" y="960" font-size="21" stroke="none">• Rút gọn / chứng minh</text><text x="95" y="1005" font-size="21" stroke="none">• Chuẩn bị phân tích đa thức và giải phương trình</text><rect x="60" y="1095" width="1080" height="210" rx="18" fill="none" stroke-width="3"/><text x="90" y="1140" font-size="25" font-weight="700" stroke="none">5. Vị trí trong Roadmap</text><text x="600" y="1205" text-anchor="middle" font-size="23" stroke="none">04. Biểu thức → 05. Hằng đẳng thức → 06. Phân tích đa thức → 08. Phương trình</text><text x="600" y="1260" text-anchor="middle" font-size="20" stroke="none">Mục tiêu: nhìn ra cấu trúc trước khi tính.</text><text x="600" y="1385" text-anchor="middle" font-size="20" font-weight="700" stroke="none">Roadmap Toán THCS</text></g></svg>