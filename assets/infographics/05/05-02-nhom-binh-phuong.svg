<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450" role="img" aria-labelledby="t d"><title id="t">Chuyên đề 05 – Nhóm bình phương</title><desc id="d">Ba hằng đẳng thức nhóm bình phương, cách nhận dạng và lỗi thường gặp.</desc><rect width="1200" height="1450" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif" fill="#111" stroke="#111"><text x="600" y="70" text-anchor="middle" font-size="38" font-weight="700" stroke="none">CHUYÊN ĐỀ 05</text><text x="600" y="120" text-anchor="middle" font-size="34" font-weight="700" stroke="none">NHÓM BÌNH PHƯƠNG</text><text x="600" y="158" text-anchor="middle" font-size="22" stroke="none">3 công thức cần nhận dạng thật chắc</text><rect x="70" y="210" width="1060" height="230" rx="18" fill="none" stroke-width="3"/><text x="100" y="255" font-size="25" font-weight="700" stroke="none">1. Bình phương của một tổng</text><text x="600" y="320" text-anchor="middle" font-size="32" font-weight="700" stroke="none">(A+B)² = A² + 2AB + B²</text><text x="100" y="385" font-size="21" stroke="none">Nhận biết: 3 hạng tử; đầu và cuối là bình phương; giữa là +2AB.</text><rect x="70" y="475" width="1060" height="230" rx="18" fill="none" stroke-width="3"/><text x="100" y="520" font-size="25" font-weight="700" stroke="none">2. Bình phương của một hiệu</text><text x="600" y="585" text-anchor="middle" font-size="32" font-weight="700" stroke="none">(A−B)² = A² − 2AB + B²</text><text x="100" y="650" font-size="21" stroke="none">Ghi nhớ: hạng tử cuối vẫn là +B²; chỉ hạng tử giữa đổi dấu.</text><rect x="70" y="740" width="1060" height="230" rx="18" fill="none" stroke-width="3"/><text x="100" y="785" font-size="25" font-weight="700" stroke="none">3. Hiệu hai bình phương</text><text x="600" y="850" text-anchor="middle" font-size="32" font-weight="700" stroke="none">A² − B² = (A−B)(A+B)</text><text x="100" y="915" font-size="21" stroke="none">Dấu hiệu: chỉ 2 hạng tử, cả hai là bình phương, ở giữa là dấu trừ.</text><rect x="70" y="1005" width="1060" height="245" rx="18" fill="none" stroke-width="3"/><text x="100" y="1050" font-size="25" font-weight="700" stroke="none">4. Kiểm tra nhanh trước khi dùng</text><text x="100" y="1100" font-size="21" stroke="none">① Xác định A và B.</text><text x="100" y="1140" font-size="21" stroke="none">② Kiểm tra dấu ở hạng tử giữa.</text><text x="100" y="1180" font-size="21" stroke="none">③ Không được viết (A+B)² = A²+B².</text><text x="100" y="1220" font-size="21" stroke="none">④ A²+B² không có công thức phân tích tương tự trong 7 HĐT.</text><text x="600" y="1385" text-anchor="middle" font-size="20" font-weight="700" stroke="none">Roadmap Toán THCS</text></g></svg>