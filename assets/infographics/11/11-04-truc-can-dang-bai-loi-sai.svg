<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <rect width="1200" height="1600" fill="#fff"/>
  <style>.t{font:700 42px Arial,sans-serif;fill:#111}.s{font:600 27px Arial,sans-serif;fill:#222}.h{font:700 29px Arial,sans-serif;fill:#111}.b{font:23px Arial,sans-serif;fill:#222}.box{fill:#fff;stroke:#333;stroke-width:2}.muted{fill:#f5f5f5}.small{font:20px Arial,sans-serif;fill:#333}</style>
  <text x="600" y="80" text-anchor="middle" class="t">TRỤC CĂN • DẠNG BÀI • LỖI SAI</text>
  <text x="600" y="125" text-anchor="middle" class="s">Chuyên đề 11 – Bản thực hành</text>

  <rect x="70" y="175" width="500" height="300" rx="18" class="box"/>
  <text x="100" y="225" class="h">1. Mẫu dạng √a</text>
  <text x="100" y="285" class="b">1/√a → nhân cả tử và mẫu với √a</text>
  <text x="100" y="350" class="b">1/√3 = √3/3</text>
  <text x="100" y="410" class="small">Mục tiêu: mẫu không còn căn.</text>

  <rect x="630" y="175" width="500" height="300" rx="18" class="box"/>
  <text x="660" y="225" class="h">2. Mẫu dạng a + √b</text>
  <text x="660" y="285" class="b">Nhân với liên hợp: a − √b</text>
  <text x="660" y="350" class="b">1/(√5+2) = √5−2</text>
  <text x="660" y="410" class="small">Dùng (a+b)(a−b)=a²−b².</text>

  <rect x="70" y="525" width="1060" height="320" rx="18" class="box muted"/>
  <text x="100" y="575" class="h">3. Các dạng bài trọng tâm</text>
  <text x="100" y="630" class="b">• Tìm điều kiện xác định</text>
  <text x="100" y="675" class="b">• Rút gọn căn số và căn có biến</text>
  <text x="100" y="720" class="b">• Cộng – trừ – nhân – chia căn thức</text>
  <text x="610" y="630" class="b">• Trục căn ở mẫu</text>
  <text x="610" y="675" class="b">• Rút gọn biểu thức nhiều bước</text>
  <text x="610" y="720" class="b">• Tính giá trị, tìm x, xét tham số</text>
  <text x="100" y="790" class="small">Thứ tự nên dùng: điều kiện → rút gọn → trục căn → quy đồng → kết luận.</text>

  <rect x="70" y="895" width="1060" height="400" rx="18" class="box"/>
  <text x="100" y="945" class="h">4. Lỗi thường gặp</text>
  <text x="100" y="1000" class="b">1. Viết √(A²)=A thay vì |A|</text>
  <text x="100" y="1045" class="b">2. Tách sai: √(a+b)=√a+√b</text>
  <text x="100" y="1090" class="b">3. Cộng căn không đồng dạng</text>
  <text x="100" y="1135" class="b">4. Quên điều kiện khi căn nằm ở mẫu</text>
  <text x="100" y="1180" class="b">5. Dùng sai biểu thức liên hợp</text>
  <text x="100" y="1225" class="b">6. Bình phương hai vế nhưng không kiểm tra nghiệm</text>

  <rect x="70" y="1345" width="1060" height="160" rx="18" class="box muted"/>
  <text x="100" y="1395" class="h">Checklist trước khi kết luận</text>
  <text x="100" y="1450" class="b">Điều kiện đúng? • Căn đã tối giản? • Mẫu còn căn? • Có cần kiểm tra nghiệm?</text>

  <text x="600" y="1560" text-anchor="middle" class="s">Căn thức: đúng điều kiện trước, biến đổi sau</text>
</svg>