<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <rect width="1200" height="1600" fill="#fff"/>
  <style>.t{font:700 44px Arial,sans-serif;fill:#111}.s{font:600 27px Arial,sans-serif;fill:#222}.h{font:700 29px Arial,sans-serif;fill:#111}.b{font:24px Arial,sans-serif;fill:#222}.box{fill:#fff;stroke:#333;stroke-width:2}.muted{fill:#f5f5f5}.small{font:21px Arial,sans-serif;fill:#333}</style>
  <text x="600" y="80" text-anchor="middle" class="t">BIẾN ĐỔI &amp; RÚT GỌN CĂN THỨC</text>
  <text x="600" y="125" text-anchor="middle" class="s">Chuyên đề 11 – Quy tắc và ví dụ</text>

  <rect x="70" y="175" width="500" height="310" rx="18" class="box"/>
  <text x="100" y="225" class="h">1. Khai phương một tích</text>
  <text x="100" y="285" class="b">√(AB)=√A·√B</text>
  <text x="100" y="335" class="small">Điều kiện: A ≥ 0, B ≥ 0</text>
  <text x="100" y="395" class="b">√72 = √(36·2) = 6√2</text>

  <rect x="630" y="175" width="500" height="310" rx="18" class="box"/>
  <text x="660" y="225" class="h">2. Khai phương một thương</text>
  <text x="660" y="285" class="b">√(A/B)=√A/√B</text>
  <text x="660" y="335" class="small">Điều kiện: A ≥ 0, B &gt; 0</text>
  <text x="660" y="395" class="b">√(9/16)=3/4</text>

  <rect x="70" y="535" width="500" height="320" rx="18" class="box muted"/>
  <text x="100" y="585" class="h">3. Đưa thừa số ra ngoài</text>
  <text x="100" y="645" class="b">Tìm bình phương hoàn chỉnh dưới căn.</text>
  <text x="100" y="705" class="b">√48 = √(16·3) = 4√3</text>
  <text x="100" y="765" class="b">√(50x²)=5|x|√2</text>
  <text x="100" y="815" class="small">Chú ý giá trị tuyệt đối khi có biến.</text>

  <rect x="630" y="535" width="500" height="320" rx="18" class="box muted"/>
  <text x="660" y="585" class="h">4. Đưa thừa số vào trong</text>
  <text x="660" y="645" class="b">A√B = √(A²B), với A ≥ 0</text>
  <text x="660" y="705" class="b">3√5 = √45</text>
  <text x="660" y="765" class="b">−3√5 = −√45</text>
  <text x="660" y="815" class="small">Nếu hệ số âm, giữ dấu âm ở ngoài căn.</text>

  <rect x="70" y="905" width="1060" height="300" rx="18" class="box"/>
  <text x="100" y="955" class="h">5. Cộng – trừ căn đồng dạng</text>
  <text x="100" y="1015" class="b">Chỉ cộng/trừ sau khi đã đưa về cùng phần căn.</text>
  <text x="100" y="1075" class="b">2√3 + 5√3 − √3 = 6√3</text>
  <text x="100" y="1135" class="b">√12 + √27 = 2√3 + 3√3 = 5√3</text>
  <text x="100" y="1180" class="small">Không viết √2 + √3 = √5.</text>

  <rect x="70" y="1255" width="1060" height="230" rx="18" class="box muted"/>
  <text x="100" y="1305" class="h">Quy trình rút gọn</text>
  <text x="100" y="1365" class="b">Điều kiện → Tách bình phương → Rút gọn từng căn</text>
  <text x="100" y="1420" class="b">→ Gom căn đồng dạng → Thực hiện phép tính → Kiểm tra</text>

  <text x="600" y="1540" text-anchor="middle" class="s">Ưu tiên giữ cấu trúc gọn, không khai triển máy móc</text>
</svg>