<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1414" viewBox="0 0 1000 1414"><rect width="1000" height="1414" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#000" stroke="#000"><text x="500" y="72" font-size="29" font-weight="700" text-anchor="middle" stroke="none">CHUYÊN ĐỀ 22 – ĐẠI LƯỢNG ĐẶC TRƯNG CỦA DỮ LIỆU</text><text x="500" y="112" font-size="20" text-anchor="middle" stroke="none">Tóm tắt cách chọn đại lượng phù hợp để mô tả dữ liệu</text><rect x="70" y="160" width="860" height="180" rx="18" fill="none" stroke-width="2"/><text x="100" y="205" font-size="24" font-weight="700" stroke="none">Mạch tư duy</text><text x="100" y="248" font-size="21" stroke="none">Sắp xếp dữ liệu → Tính đúng đại lượng → So sánh → Chọn đại lượng phù hợp</text><text x="100" y="288" font-size="21" stroke="none">→ Giải thích kết quả theo ngữ cảnh.</text><rect x="70" y="380" width="400" height="250" rx="18" fill="none" stroke-width="2"/><text x="100" y="425" font-size="24" font-weight="700" stroke="none">TRUNG BÌNH</text><text x="100" y="470" font-size="21" stroke="none">• Mô tả mức chung của dữ liệu.</text><text x="100" y="510" font-size="21" stroke="none">• Dùng tất cả các giá trị.</text><text x="100" y="550" font-size="21" stroke="none">• Nhạy với giá trị ngoại lai.</text><text x="100" y="590" font-size="21" stroke="none">Ưu tiên khi dữ liệu khá ổn định.</text><rect x="530" y="380" width="400" height="250" rx="18" fill="none" stroke-width="2"/><text x="560" y="425" font-size="24" font-weight="700" stroke="none">TRUNG VỊ</text><text x="560" y="470" font-size="21" stroke="none">• Giá trị ở giữa sau khi sắp xếp.</text><text x="560" y="510" font-size="21" stroke="none">• Ít bị ngoại lai kéo lệch.</text><text x="560" y="550" font-size="21" stroke="none">• Phù hợp để mô tả mức điển hình.</text><text x="560" y="590" font-size="21" stroke="none">Ưu tiên khi có ngoại lai rõ rệt.</text><rect x="70" y="670" width="400" height="230" rx="18" fill="none" stroke-width="2"/><text x="100" y="715" font-size="24" font-weight="700" stroke="none">MỐT</text><text x="100" y="760" font-size="21" stroke="none">• Giá trị có tần số lớn nhất.</text><text x="100" y="800" font-size="21" stroke="none">• Cho biết giá trị phổ biến nhất.</text><text x="100" y="840" font-size="21" stroke="none">• Có thể có nhiều mốt.</text><rect x="530" y="670" width="400" height="230" rx="18" fill="none" stroke-width="2"/><text x="560" y="715" font-size="24" font-weight="700" stroke="none">KHOẢNG BIẾN THIÊN</text><text x="560" y="760" font-size="21" stroke="none">R = max − min</text><text x="560" y="800" font-size="21" stroke="none">• Mô tả mức trải rộng đơn giản.</text><text x="560" y="840" font-size="21" stroke="none">• R lớn → dữ liệu phân tán hơn.</text><rect x="70" y="945" width="860" height="300" rx="18" fill="none" stroke-width="2"/><text x="100" y="995" font-size="24" font-weight="700" stroke="none">CHỌN NHANH</text><text x="100" y="1040" font-size="21" stroke="none">Mức chung, dữ liệu ổn định → Trung bình</text><text x="100" y="1082" font-size="21" stroke="none">Có ngoại lai, cần mức điển hình → Trung vị</text><text x="100" y="1124" font-size="21" stroke="none">Cần giá trị phổ biến nhất → Mốt</text><text x="100" y="1166" font-size="21" stroke="none">Cần mô tả độ trải rộng đơn giản → Khoảng biến thiên</text><text x="100" y="1210" font-size="20" font-weight="700" stroke="none">Không chỉ tính số: luôn giải thích vì sao đại lượng đó phù hợp.</text><text x="500" y="1345" font-size="18" text-anchor="middle" stroke="none">Roadmap Toán THCS • Bản in đen trắng</text></g></svg>