<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1414" viewBox="0 0 1000 1414"><rect width="1000" height="1414" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#000" stroke="#000"><text x="500" y="72" font-size="34" font-weight="700" text-anchor="middle" stroke="none">TRUNG BÌNH – TRUNG VỊ – MỐT</text><text x="500" y="112" font-size="20" text-anchor="middle" stroke="none">Ba đại lượng mô tả vị trí trung tâm của dữ liệu</text><rect x="70" y="155" width="860" height="250" rx="18" fill="none" stroke-width="2"/><text x="100" y="202" font-size="25" font-weight="700" stroke="none">1. SỐ TRUNG BÌNH CỘNG</text><text x="100" y="250" font-size="22" stroke="none">x̄ = (x₁ + x₂ + ... + xₙ) / n</text><text x="100" y="294" font-size="21" stroke="none">Nếu có bảng tần số:</text><text x="100" y="336" font-size="21" stroke="none">x̄ = (x₁n₁ + x₂n₂ + ... + xₖnₖ) / (n₁ + ... + nₖ)</text><text x="100" y="376" font-size="20" font-weight="700" stroke="none">Nhớ: giá trị × tần số trước khi cộng.</text><rect x="70" y="445" width="860" height="300" rx="18" fill="none" stroke-width="2"/><text x="100" y="492" font-size="25" font-weight="700" stroke="none">2. TRUNG VỊ</text><text x="100" y="540" font-size="21" stroke="none">Bước 1: Sắp xếp dữ liệu theo thứ tự.</text><text x="100" y="582" font-size="21" stroke="none">Số phần tử lẻ → lấy đúng giá trị ở giữa.</text><text x="100" y="624" font-size="21" stroke="none">Số phần tử chẵn → lấy trung bình của hai giá trị ở giữa.</text><text x="100" y="676" font-size="20" stroke="none">Ví dụ: 4, 6, 7, 8, 10 → trung vị = 7</text><text x="100" y="714" font-size="20" stroke="none">4, 6, 7, 8, 10, 12 → trung vị = (7 + 8)/2 = 7,5</text><rect x="70" y="785" width="860" height="245" rx="18" fill="none" stroke-width="2"/><text x="100" y="832" font-size="25" font-weight="700" stroke="none">3. MỐT</text><text x="100" y="880" font-size="21" stroke="none">Mốt = giá trị có tần số lớn nhất.</text><text x="100" y="922" font-size="21" stroke="none">Một bộ dữ liệu có thể có một mốt hoặc nhiều mốt.</text><text x="100" y="964" font-size="21" stroke="none">Nếu mọi giá trị có cùng tần số, không có giá trị phổ biến nổi bật.</text><rect x="70" y="1070" width="860" height="200" rx="18" fill="none" stroke-width="2"/><text x="100" y="1115" font-size="24" font-weight="700" stroke="none">CHECKLIST TRƯỚC KHI KẾT LUẬN</text><text x="100" y="1160" font-size="20" stroke="none">□ Trung bình: đã chia đúng số quan sát / tổng tần số?</text><text x="100" y="1200" font-size="20" stroke="none">□ Trung vị: đã sắp xếp dữ liệu?  □ Mốt: đã so đúng tần số?</text><text x="100" y="1240" font-size="20" stroke="none">□ Có ngoại lai không? Nếu có, hãy so sánh trung bình với trung vị.</text><text x="500" y="1345" font-size="18" text-anchor="middle" stroke="none">Roadmap Toán THCS • Bản in đen trắng</text></g></svg>