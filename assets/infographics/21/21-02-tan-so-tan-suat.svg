<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><rect width="1200" height="1500" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#111" stroke="#111"><text x="600" y="85" text-anchor="middle" font-size="42" font-weight="700" stroke="none">TẦN SỐ – TẦN SUẤT</text><text x="600" y="128" text-anchor="middle" font-size="24" stroke="none">Đếm đúng trước, chia sau</text><rect x="90" y="185" width="1020" height="245" rx="18" fill="none" stroke-width="3"/><text x="130" y="245" font-size="30" font-weight="700" stroke="none">1. TẦN SỐ LÀ GÌ?</text><text x="130" y="300" font-size="24" stroke="none">Tần số = số lần một giá trị xuất hiện trong dữ liệu.</text><text x="130" y="355" font-size="24" stroke="none">Ví dụ: điểm 8 xuất hiện 5 lần → tần số của 8 là 5.</text><text x="130" y="405" font-size="23" font-weight="700" stroke="none">Kiểm tra: tổng các tần số = tổng số quan sát.</text><rect x="90" y="475" width="1020" height="285" rx="18" fill="none" stroke-width="3"/><text x="130" y="535" font-size="30" font-weight="700" stroke="none">2. TẦN SUẤT</text><text x="130" y="600" font-size="28" font-weight="700" stroke="none">tần suất = tần số / tổng số quan sát</text><text x="130" y="665" font-size="28" font-weight="700" stroke="none">tần suất (%) = tần số / tổng số quan sát × 100%</text><text x="130" y="725" font-size="23" stroke="none">Tần suất cho biết một giá trị chiếm bao nhiêu phần trong toàn bộ dữ liệu.</text><rect x="90" y="805" width="1020" height="360" rx="18" fill="none" stroke-width="3"/><text x="130" y="865" font-size="30" font-weight="700" stroke="none">3. QUY TRÌNH LẬP BẢNG</text><text x="150" y="925" font-size="24" stroke="none">① Liệt kê các giá trị khác nhau</text><text x="150" y="975" font-size="24" stroke="none">② Đếm số lần xuất hiện → tần số</text><text x="150" y="1025" font-size="24" stroke="none">③ Cộng toàn bộ tần số để kiểm tra</text><text x="150" y="1075" font-size="24" stroke="none">④ Chia cho tổng số quan sát → tần suất</text><text x="150" y="1125" font-size="24" stroke="none">⑤ Nếu cần phần trăm, nhân 100%</text><rect x="90" y="1210" width="1020" height="175" rx="18" fill="none" stroke-width="3"/><text x="130" y="1265" font-size="28" font-weight="700" stroke="none">LỖI CẦN TRÁNH</text><text x="130" y="1320" font-size="23" stroke="none">Đếm thiếu/trùng • tổng tần số sai • quên ×100% • nhầm tần số với tần suất</text></g></svg>