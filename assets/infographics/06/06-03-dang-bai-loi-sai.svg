<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="white"/><g fill="none" stroke="#111" stroke-width="3"><rect x="24" y="24" width="1152" height="852" rx="18"/><rect x="55" y="145" width="525" height="480" rx="14"/><rect x="620" y="145" width="525" height="480" rx="14"/><rect x="55" y="660" width="1090" height="155" rx="14"/></g><g font-family="Arial, sans-serif" fill="#111"><text x="600" y="72" text-anchor="middle" font-size="38" font-weight="700">DẠNG BÀI TRỌNG TÂM &amp; LỖI SAI</text><text x="600" y="110" text-anchor="middle" font-size="22">Chuyên đề 06 · Phân tích đa thức thành nhân tử</text><text x="315" y="190" text-anchor="middle" font-size="27" font-weight="700">Dạng bài trọng tâm</text><text x="85" y="240" font-size="22">1. Đặt nhân tử chung</text><text x="85" y="285" font-size="22">2. Đổi dấu rồi đặt chung</text><text x="85" y="330" font-size="22">3. Dùng hằng đẳng thức</text><text x="85" y="375" font-size="22">4. Nhóm hạng tử</text><text x="85" y="420" font-size="22">5. Phối hợp nhiều phương pháp</text><text x="85" y="465" font-size="22">6. Tính nhanh / chứng minh chia hết</text><text x="85" y="510" font-size="22">7. Đưa phương trình về dạng tích</text><text x="85" y="565" font-size="20" font-weight="700">Quy trình: nhận dạng → phân tích → kiểm tra</text><text x="882" y="190" text-anchor="middle" font-size="27" font-weight="700">Lỗi sai thường gặp</text><text x="650" y="240" font-size="22">• Không lấy hết nhân tử chung</text><text x="650" y="285" font-size="22">• Dừng quá sớm</text><text x="650" y="330" font-size="22">• Nhầm tổng với hiệu hai bình phương</text><text x="650" y="375" font-size="22">• Nhóm hạng tử không tạo nhân tử chung</text><text x="650" y="420" font-size="22">• Đổi dấu sai: a − b = −(b − a)</text><text x="650" y="465" font-size="22">• Phân tích xong nhưng không nhân lại kiểm tra</text><text x="650" y="525" font-size="20" font-weight="700">Tự hỏi: “còn phân tích tiếp được không?”</text><text x="600" y="705" text-anchor="middle" font-size="25" font-weight="700">Ví dụ mẫu</text><text x="600" y="750" text-anchor="middle" font-size="25">3x³ − 12x = 3x(x² − 4) = 3x(x − 2)(x + 2)</text><text x="600" y="790" text-anchor="middle" font-size="20">Đặt nhân tử chung trước → nhận ra hiệu hai bình phương → phân tích tiếp.</text><text x="600" y="850" text-anchor="middle" font-size="18">Roadmap Toán THCS</text></g></svg>