<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" fill="white"/><g fill="none" stroke="#111" stroke-width="3"><rect x="24" y="24" width="1152" height="772" rx="18"/><rect x="55" y="155" width="1090" height="150" rx="14"/><rect x="55" y="330" width="250" height="250" rx="14"/><rect x="325" y="330" width="250" height="250" rx="14"/><rect x="595" y="330" width="250" height="250" rx="14"/><rect x="865" y="330" width="280" height="250" rx="14"/><rect x="55" y="610" width="1090" height="140" rx="14"/></g><g font-family="Arial, sans-serif" fill="#111"><text x="600" y="75" text-anchor="middle" font-size="28" font-weight="700">CHUYÊN ĐỀ 06</text><text x="600" y="122" text-anchor="middle" font-size="42" font-weight="700">PHÂN TÍCH ĐA THỨC THÀNH NHÂN TỬ</text><text x="600" y="190" text-anchor="middle" font-size="27" font-weight="700">Tư duy cốt lõi</text><text x="600" y="235" text-anchor="middle" font-size="29">TỔNG / HIỆU  →  TÍCH</text><text x="600" y="272" text-anchor="middle" font-size="23">Dạng tích giúp rút gọn, giải phương trình, tính nhanh và chứng minh chia hết.</text><text x="180" y="375" text-anchor="middle" font-size="25" font-weight="700">1. Nhân tử chung</text><text x="180" y="425" text-anchor="middle" font-size="23">AB + AC</text><text x="180" y="460" text-anchor="middle" font-size="23">= A(B + C)</text><text x="180" y="505" text-anchor="middle" font-size="21">Ưu tiên kiểm tra</text><text x="180" y="535" text-anchor="middle" font-size="21">đầu tiên</text><text x="450" y="375" text-anchor="middle" font-size="25" font-weight="700">2. Hằng đẳng thức</text><text x="450" y="425" text-anchor="middle" font-size="22">A² − B²</text><text x="450" y="460" text-anchor="middle" font-size="22">A² ± 2AB + B²</text><text x="450" y="495" text-anchor="middle" font-size="22">A³ ± B³</text><text x="720" y="375" text-anchor="middle" font-size="25" font-weight="700">3. Nhóm hạng tử</text><text x="720" y="425" text-anchor="middle" font-size="21">Nhóm để xuất hiện</text><text x="720" y="458" text-anchor="middle" font-size="21">cùng một nhân tử</text><text x="720" y="500" text-anchor="middle" font-size="21">Có thể đổi thứ tự</text><text x="720" y="532" text-anchor="middle" font-size="21">trước khi nhóm</text><text x="1005" y="375" text-anchor="middle" font-size="25" font-weight="700">4. Phối hợp</text><text x="1005" y="420" text-anchor="middle" font-size="21">Đặt chung → HĐT</text><text x="1005" y="453" text-anchor="middle" font-size="21">→ Nhóm → kiểm tra</text><text x="1005" y="495" text-anchor="middle" font-size="21">Không dừng quá sớm</text><text x="600" y="650" text-anchor="middle" font-size="25" font-weight="700">Liên hệ Roadmap</text><text x="600" y="695" text-anchor="middle" font-size="23">04 Biểu thức → 05 Hằng đẳng thức → 06 Phân tích đa thức → 07 Phân thức / 08 Phương trình</text><text x="600" y="775" text-anchor="middle" font-size="18">Roadmap Toán THCS</text></g></svg>