<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Số đối và giá trị tuyệt đối trên trục số</title>
  <desc id="desc">Trục số từ âm sáu đến sáu, đánh dấu âm năm, không và năm. Hai đoạn từ âm năm đến không và từ không đến năm có cùng độ dài năm đơn vị, minh họa rằng âm năm và năm là hai số đối nhau và đều có giá trị tuyệt đối bằng năm.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="420" rx="24" fill="#ffffff"/>
  <text x="500" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2937">Số đối và giá trị tuyệt đối trên trục số</text>
  <text x="500" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">Giá trị tuyệt đối là khoảng cách từ điểm biểu diễn số đó đến 0</text>

  <g font-family="Arial, sans-serif" fill="#1f2937">
    <line x1="90" y1="215" x2="910" y2="215" stroke="#374151" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <g stroke="#374151" stroke-width="3">
      <line x1="130" y1="200" x2="130" y2="230"/><line x1="195" y1="200" x2="195" y2="230"/>
      <line x1="260" y1="200" x2="260" y2="230"/><line x1="325" y1="200" x2="325" y2="230"/>
      <line x1="390" y1="200" x2="390" y2="230"/><line x1="455" y1="200" x2="455" y2="230"/>
      <line x1="520" y1="197" x2="520" y2="233"/><line x1="585" y1="200" x2="585" y2="230"/>
      <line x1="650" y1="200" x2="650" y2="230"/><line x1="715" y1="200" x2="715" y2="230"/>
      <line x1="780" y1="200" x2="780" y2="230"/><line x1="845" y1="200" x2="845" y2="230"/>
      <line x1="910" y1="200" x2="910" y2="230"/>
    </g>
    <g font-size="17" text-anchor="middle">
      <text x="130" y="258">−6</text><text x="195" y="258">−5</text><text x="260" y="258">−4</text>
      <text x="325" y="258">−3</text><text x="390" y="258">−2</text><text x="455" y="258">−1</text>
      <text x="520" y="258" font-weight="700">0</text><text x="585" y="258">1</text><text x="650" y="258">2</text>
      <text x="715" y="258">3</text><text x="780" y="258">4</text><text x="845" y="258">5</text><text x="910" y="258">6</text>
    </g>

    <circle cx="195" cy="215" r="10" fill="#2563eb"/><circle cx="520" cy="215" r="9" fill="#111827"/><circle cx="845" cy="215" r="10" fill="#dc2626"/>
    <text x="195" y="185" text-anchor="middle" font-size="21" font-weight="700" fill="#2563eb">−5</text>
    <text x="845" y="185" text-anchor="middle" font-size="21" font-weight="700" fill="#dc2626">5</text>

    <line x1="205" y1="145" x2="510" y2="145" stroke="#2563eb" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)" style="color:#2563eb"/>
    <line x1="530" y1="145" x2="835" y2="145" stroke="#dc2626" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)" style="color:#dc2626"/>
    <text x="357" y="128" text-anchor="middle" font-size="19" font-weight="700" fill="#2563eb">5 đơn vị</text>
    <text x="682" y="128" text-anchor="middle" font-size="19" font-weight="700" fill="#dc2626">5 đơn vị</text>

    <rect x="125" y="302" width="750" height="82" rx="14" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="500" y="332" text-anchor="middle" font-size="20" font-weight="700">−5 và 5 là hai số đối nhau</text>
    <text x="500" y="363" text-anchor="middle" font-size="21">|−5| = 5     và     |5| = 5</text>
  </g>
</svg>
