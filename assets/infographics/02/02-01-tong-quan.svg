<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Chuyên đề 02 – Số và phép tính – Tổng quan</title>
  <desc id="desc">Infographic tổng quan về các loại số, phép tính, ước bội, phần trăm, vị trí trong Roadmap và lỗi thường gặp.</desc>
  <rect width="1200" height="1600" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke="#111">
    <text x="600" y="62" text-anchor="middle" font-size="34" font-weight="700" stroke="none">CHUYÊN ĐỀ 02</text>
    <text x="600" y="118" text-anchor="middle" font-size="48" font-weight="700" stroke="none">SỐ VÀ PHÉP TÍNH</text>
    <text x="600" y="158" text-anchor="middle" font-size="25" font-weight="700" stroke="none">TỔNG QUAN CHUYÊN ĐỀ</text>
    <rect x="55" y="185" width="1090" height="70" rx="14" fill="none" stroke-width="2"/>
    <text x="170" y="228" text-anchor="middle" font-size="20" stroke="none">Lớp trọng tâm: 6–9</text>
    <line x1="330" y1="200" x2="330" y2="240" stroke-width="2"/>
    <text x="575" y="228" text-anchor="middle" font-size="20" stroke="none">Mạch: Số &amp; Đại số</text>
    <line x1="810" y1="200" x2="810" y2="240" stroke-width="2"/>
    <text x="975" y="228" text-anchor="middle" font-size="20" stroke="none">Ưu tiên: ★★★★★</text>
    <text x="70" y="305" font-size="27" font-weight="700" stroke="none">1. Chuyên đề này học gì?</text>
    <g fill="none" stroke-width="2"><rect x="70" y="335" width="190" height="190" rx="14"/><rect x="285" y="335" width="190" height="190" rx="14"/><rect x="500" y="335" width="190" height="190" rx="14"/><rect x="715" y="335" width="190" height="190" rx="14"/><rect x="930" y="335" width="190" height="190" rx="14"/></g>
    <g stroke="none" text-anchor="middle">
      <text x="165" y="380" font-size="29" font-weight="700">N • Z • Q</text><text x="165" y="420" font-size="19">Số tự nhiên</text><text x="165" y="450" font-size="19">số nguyên</text><text x="165" y="480" font-size="19">phân số, thập phân</text>
      <text x="380" y="380" font-size="30" font-weight="700">+ − × ÷</text><text x="380" y="420" font-size="19">Phép tính</text><text x="380" y="450" font-size="19">lũy thừa</text><text x="380" y="480" font-size="19">thứ tự thực hiện</text>
      <text x="595" y="380" font-size="30" font-weight="700">a | b</text><text x="595" y="420" font-size="19">Chia hết</text><text x="595" y="450" font-size="19">số nguyên tố</text><text x="595" y="480" font-size="19">phân tích thừa số</text>
      <text x="810" y="380" font-size="28" font-weight="700">ƯCLN</text><text x="810" y="420" font-size="28" font-weight="700">BCNN</text><text x="810" y="465" font-size="19">chia nhóm</text><text x="810" y="495" font-size="19">chu kỳ chung</text>
      <text x="1025" y="385" font-size="38" font-weight="700">%</text><text x="1025" y="430" font-size="19">Tỉ số</text><text x="1025" y="460" font-size="19">phần trăm</text><text x="1025" y="490" font-size="19">bài toán thực tế</text>
    </g>
    <text x="70" y="585" font-size="27" font-weight="700" stroke="none">2. Vị trí trong Roadmap</text>
    <g fill="none" stroke-width="2"><rect x="85" y="615" width="220" height="100" rx="14"/><rect x="355" y="615" width="220" height="100" rx="14"/><rect x="625" y="615" width="220" height="100" rx="14"/><rect x="895" y="615" width="220" height="100" rx="14"/></g>
    <g stroke="none" text-anchor="middle" font-size="21"><text x="195" y="655" font-weight="700">02. Số &amp; phép tính</text><text x="195" y="686">NỀN TẢNG</text><text x="465" y="655" font-weight="700">03. Tỉ lệ</text><text x="465" y="686">Tỉ lệ thức</text><text x="735" y="655" font-weight="700">04. Biểu thức</text><text x="735" y="686">Đại số</text><text x="1005" y="655" font-weight="700">08. Phương trình</text><text x="1005" y="686">Ứng dụng nền số</text></g>
    <g stroke="none" font-size="36"><text x="318" y="673">→</text><text x="588" y="673">→</text><text x="858" y="673">→</text></g>
    <text x="600" y="752" text-anchor="middle" font-size="20" font-weight="700" stroke="none">Nếu phép tính cơ bản còn sai nhiều, chưa nên vội chuyển sang các chuyên đề đại số sau.</text>
    <text x="70" y="815" font-size="27" font-weight="700" stroke="none">3. Kiến thức cần nhớ nhất</text>
    <g fill="none" stroke-width="2" stroke-dasharray="7 5"><rect x="70" y="845" width="165" height="170" rx="12"/><rect x="250" y="845" width="165" height="170" rx="12"/><rect x="430" y="845" width="165" height="170" rx="12"/><rect x="610" y="845" width="165" height="170" rx="12"/><rect x="790" y="845" width="165" height="170" rx="12"/><rect x="970" y="845" width="165" height="170" rx="12"/></g>
    <g stroke="none" text-anchor="middle"><text x="152" y="890" font-size="30">( ) → aⁿ</text><text x="152" y="930" font-size="18">Thứ tự</text><text x="152" y="960" font-size="18">phép tính</text><text x="332" y="890" font-size="30">+ × −</text><text x="332" y="930" font-size="18">Quy tắc dấu</text><text x="332" y="960" font-size="18">với số âm</text><text x="512" y="890" font-size="30">a/b</text><text x="512" y="930" font-size="18">Rút gọn</text><text x="512" y="960" font-size="18">quy đồng</text><text x="692" y="890" font-size="30">a | b</text><text x="692" y="930" font-size="18">Ước • bội</text><text x="692" y="960" font-size="18">chia hết</text><text x="872" y="890" font-size="25" font-weight="700">ƯCLN</text><text x="872" y="925" font-size="25" font-weight="700">BCNN</text><text x="872" y="965" font-size="18">đúng mục đích</text><text x="1052" y="895" font-size="34">%</text><text x="1052" y="935" font-size="18">Tăng • giảm</text><text x="1052" y="965" font-size="18">phần trăm</text></g>
    <text x="70" y="1080" font-size="27" font-weight="700" stroke="none">4. Lỗi thường gặp</text>
    <rect x="70" y="1110" width="1060" height="245" rx="14" fill="none" stroke-width="2"/>
    <line x1="70" y1="1160" x2="1130" y2="1160"/><line x1="420" y1="1110" x2="420" y2="1355"/><line x1="70" y1="1210" x2="1130" y2="1210"/><line x1="70" y1="1260" x2="1130" y2="1260"/><line x1="70" y1="1310" x2="1130" y2="1310"/>
    <g stroke="none" font-size="18"><text x="245" y="1142" text-anchor="middle" font-weight="700">Lỗi</text><text x="775" y="1142" text-anchor="middle" font-weight="700">Cách tránh</text><text x="90" y="1192">Quên thứ tự phép tính</text><text x="445" y="1192">Ngoặc → lũy thừa → nhân/chia → cộng/trừ</text><text x="90" y="1242">Sai dấu với số âm</text><text x="445" y="1242">Viết từng bước; kiểm tra dấu trước khi tính</text><text x="90" y="1292">Nhầm ƯCLN và BCNN</text><text x="445" y="1292">Chia nhóm lớn nhất → ƯCLN; chu kỳ nhỏ nhất → BCNN</text><text x="90" y="1342">Đọc sai phần trăm</text><text x="445" y="1342">Đổi về phân số/thập phân hoặc dùng hệ số tăng giảm</text></g>
    <text x="70" y="1415" font-size="27" font-weight="700" stroke="none">5. Cách học</text>
    <g fill="none" stroke-width="2"><rect x="75" y="1440" width="190" height="90" rx="14"/><rect x="290" y="1440" width="190" height="90" rx="14"/><rect x="505" y="1440" width="190" height="90" rx="14"/><rect x="720" y="1440" width="190" height="90" rx="14"/><rect x="935" y="1440" width="190" height="90" rx="14"/></g>
    <g stroke="none" text-anchor="middle" font-size="18"><text x="170" y="1475" font-weight="700">1. Hiểu số</text><text x="170" y="1505">và phép tính</text><text x="385" y="1475" font-weight="700">2. Nắm quy tắc</text><text x="385" y="1505">dấu • thứ tự</text><text x="600" y="1475" font-weight="700">3. Làm cơ bản</text><text x="600" y="1505">đúng trước</text><text x="815" y="1475" font-weight="700">4. Vận dụng</text><text x="815" y="1505">thực tế</text><text x="1030" y="1475" font-weight="700">5. Tự kiểm tra</text><text x="1030" y="1505">đạt ≥ 80%</text></g>
  </g>
</svg>