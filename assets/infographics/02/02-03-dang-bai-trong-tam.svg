<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Chuyên đề 02 – Số và phép tính – Dạng bài trọng tâm</title>
  <desc id="desc">Infographic các dạng bài tính toán, phân số, ước bội, ƯCLN BCNN, phần trăm và chiến lược làm bài.</desc>
  <rect width="1200" height="1600" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke="#111">
    <text x="600" y="65" text-anchor="middle" font-size="34" font-weight="700" stroke="none">CHUYÊN ĐỀ 02</text>
    <text x="600" y="120" text-anchor="middle" font-size="48" font-weight="700" stroke="none">SỐ VÀ PHÉP TÍNH</text>
    <text x="600" y="160" text-anchor="middle" font-size="25" font-weight="700" stroke="none">DẠNG BÀI TRỌNG TÂM</text>
    <text x="65" y="225" font-size="27" font-weight="700" stroke="none">1. Các nhóm bài cần nắm</text>
    <g fill="none" stroke-width="2"><rect x="70" y="255" width="200" height="185" rx="14"/><rect x="285" y="255" width="200" height="185" rx="14"/><rect x="500" y="255" width="200" height="185" rx="14"/><rect x="715" y="255" width="200" height="185" rx="14"/><rect x="930" y="255" width="200" height="185" rx="14"/></g>
    <g stroke="none" text-anchor="middle"><text x="170" y="305" font-size="31" font-weight="700">+ − × ÷</text><text x="170" y="350" font-size="19">Tính toán</text><text x="170" y="380" font-size="19">thứ tự phép tính</text><text x="385" y="305" font-size="31" font-weight="700">a/b</text><text x="385" y="350" font-size="19">Phân số</text><text x="385" y="380" font-size="19">số thập phân</text><text x="600" y="305" font-size="31" font-weight="700">a | b</text><text x="600" y="350" font-size="19">Ước • bội</text><text x="600" y="380" font-size="19">số nguyên tố</text><text x="815" y="305" font-size="28" font-weight="700">ƯCLN</text><text x="815" y="340" font-size="28" font-weight="700">BCNN</text><text x="815" y="385" font-size="18">bài toán chia nhóm</text><text x="1030" y="305" font-size="36" font-weight="700">%</text><text x="1030" y="350" font-size="19">Tỉ số • phần trăm</text><text x="1030" y="380" font-size="19">bài toán thực tế</text></g>
    <text x="65" y="510" font-size="27" font-weight="700" stroke="none">2. Dạng 1 – Tính toán và thứ tự phép tính</text>
    <rect x="70" y="540" width="510" height="220" rx="14" fill="none" stroke-width="2"/>
    <rect x="610" y="540" width="520" height="220" rx="14" fill="none" stroke-width="2" stroke-dasharray="7 5"/>
    <g stroke="none"><text x="95" y="580" font-size="22" font-weight="700">Dấu hiệu</text><text x="105" y="620" font-size="19">• Biểu thức có nhiều phép tính</text><text x="105" y="655" font-size="19">• Có ngoặc, lũy thừa hoặc số âm</text><text x="105" y="690" font-size="19">• Cần tính chính xác từng bước</text><text x="95" y="730" font-size="22" font-weight="700">Hướng làm: đúng thứ tự → kiểm tra dấu → ước lượng kết quả.</text><text x="650" y="590" font-size="22" font-weight="700">Ví dụ</text><text x="870" y="660" text-anchor="middle" font-size="34" font-weight="700">48 − 73 + 25 = 0</text><text x="870" y="710" text-anchor="middle" font-size="18">Đừng bỏ qua dấu âm ở bước giữa.</text></g>
    <text x="65" y="825" font-size="27" font-weight="700" stroke="none">3. Dạng 2 – Phân số, ước bội, ƯCLN – BCNN</text>
    <g fill="none" stroke-width="2"><rect x="70" y="855" width="335" height="260" rx="14"/><rect x="432" y="855" width="335" height="260" rx="14"/><rect x="795" y="855" width="335" height="260" rx="14"/></g>
    <g stroke="none"><text x="100" y="900" font-size="22" font-weight="700">A. Phân số</text><text x="110" y="945" font-size="19">• Rút gọn trước khi tính</text><text x="110" y="980" font-size="19">• Quy đồng khi cộng/trừ</text><text x="110" y="1015" font-size="19">• Chia = nhân nghịch đảo</text><text x="110" y="1050" font-size="19">• Kiểm tra dấu và mẫu ≠ 0</text><text x="462" y="900" font-size="22" font-weight="700">B. Ước – bội</text><text x="472" y="945" font-size="19">• Tìm ước / bội theo yêu cầu</text><text x="472" y="980" font-size="19">• Phân tích ra thừa số nguyên tố</text><text x="472" y="1015" font-size="19">• Nhận biết số nguyên tố</text><text x="825" y="900" font-size="22" font-weight="700">C. ƯCLN – BCNN</text><text x="835" y="945" font-size="19">• Chia nhóm lớn nhất → ƯCLN</text><text x="835" y="980" font-size="19">• Chu kỳ chung nhỏ nhất → BCNN</text><text x="835" y="1015" font-size="19">• Phân tích thừa số giúp làm nhanh</text></g>
    <text x="65" y="1180" font-size="27" font-weight="700" stroke="none">4. Dạng 3 – Tỉ số, phần trăm, bài toán thực tế</text>
    <g fill="none" stroke-width="2"><rect x="70" y="1210" width="245" height="175" rx="14"/><rect x="335" y="1210" width="245" height="175" rx="14"/><rect x="600" y="1210" width="245" height="175" rx="14"/><rect x="865" y="1210" width="265" height="175" rx="14"/></g>
    <g stroke="none" text-anchor="middle"><text x="192" y="1260" font-size="22" font-weight="700">Tìm tỉ số</text><text x="192" y="1300" font-size="18">hai đại lượng</text><text x="457" y="1260" font-size="22" font-weight="700">Tính p%</text><text x="457" y="1300" font-size="18">p/100 của giá trị</text><text x="722" y="1260" font-size="22" font-weight="700">Tăng / giảm</text><text x="722" y="1300" font-size="18">dùng hệ số</text><text x="997" y="1260" font-size="22" font-weight="700">Bài thực tế</text><text x="997" y="1300" font-size="18">giá tiền • giảm giá</text><text x="997" y="1330" font-size="18">năng suất đơn giản</text></g>
    <text x="600" y="1425" text-anchor="middle" font-size="20" font-weight="700" stroke="none">p% = p/100  |  Tăng p% → ×(1 + p/100)  |  Giảm p% → ×(1 − p/100)</text>
    <text x="65" y="1490" font-size="27" font-weight="700" stroke="none">5. Chiến lược làm bài</text>
    <text x="600" y="1535" text-anchor="middle" font-size="21" font-weight="700" stroke="none">Đọc kỹ → Nhận dạng dạng bài → Chọn quy tắc phù hợp → Làm từng bước → Kiểm tra kết quả</text>
    <text x="600" y="1575" text-anchor="middle" font-size="18" stroke="none">Lỗi hay gặp: sai thứ tự • sai dấu • quy đồng sai • nhầm ƯCLN/BCNN • đổi phần trăm sai</text>
  </g>
</svg>