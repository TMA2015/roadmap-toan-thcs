<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Chuyên đề 02 – Số và phép tính – Kiến thức cốt lõi</title>
  <desc id="desc">Infographic về các loại số, thứ tự phép tính, quy tắc dấu, phân số, ước bội, ƯCLN BCNN và phần trăm.</desc>
  <rect width="1200" height="1600" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke="#111">
    <text x="600" y="65" text-anchor="middle" font-size="34" font-weight="700" stroke="none">CHUYÊN ĐỀ 02</text>
    <text x="600" y="120" text-anchor="middle" font-size="48" font-weight="700" stroke="none">SỐ VÀ PHÉP TÍNH</text>
    <text x="600" y="160" text-anchor="middle" font-size="25" font-weight="700" stroke="none">KIẾN THỨC CỐT LÕI</text>
    <text x="65" y="225" font-size="27" font-weight="700" stroke="none">1. Các loại số thường gặp</text>
    <g fill="none" stroke-width="2"><rect x="70" y="250" width="245" height="175" rx="14"/><rect x="335" y="250" width="245" height="175" rx="14"/><rect x="600" y="250" width="245" height="175" rx="14"/><rect x="865" y="250" width="265" height="175" rx="14"/></g>
    <g stroke="none" text-anchor="middle"><text x="192" y="300" font-size="30" font-weight="700">N</text><text x="192" y="340" font-size="21">Số tự nhiên</text><text x="192" y="378" font-size="18">0, 1, 2, 3, ...</text><text x="457" y="300" font-size="30" font-weight="700">Z</text><text x="457" y="340" font-size="21">Số nguyên</text><text x="457" y="378" font-size="18">..., −2, −1, 0, 1, 2, ...</text><text x="722" y="300" font-size="30" font-weight="700">a/b</text><text x="722" y="340" font-size="21">Số hữu tỉ</text><text x="722" y="378" font-size="18">b ≠ 0</text><text x="997" y="300" font-size="30" font-weight="700">0,25</text><text x="997" y="340" font-size="21">Số thập phân</text><text x="997" y="378" font-size="18">0,25 ; 1,5 ; −2,75</text></g>
    <text x="65" y="485" font-size="27" font-weight="700" stroke="none">2. Thứ tự thực hiện phép tính</text>
    <g fill="none" stroke-width="2"><rect x="80" y="515" width="210" height="105" rx="14"/><rect x="350" y="515" width="210" height="105" rx="14"/><rect x="620" y="515" width="210" height="105" rx="14"/><rect x="890" y="515" width="210" height="105" rx="14"/></g>
    <g stroke="none" text-anchor="middle"><text x="185" y="555" font-size="34">( )</text><text x="185" y="592" font-size="20">Ngoặc</text><text x="455" y="555" font-size="34">aⁿ</text><text x="455" y="592" font-size="20">Lũy thừa</text><text x="725" y="555" font-size="34">× ÷</text><text x="725" y="592" font-size="20">Nhân / Chia</text><text x="995" y="555" font-size="34">+ −</text><text x="995" y="592" font-size="20">Cộng / Trừ</text></g>
    <g stroke="none" font-size="34"><text x="305" y="578">→</text><text x="575" y="578">→</text><text x="845" y="578">→</text></g>
    <text x="600" y="655" text-anchor="middle" font-size="19" font-weight="700" stroke="none">Cùng mức ưu tiên: tính từ trái sang phải.</text>
    <text x="65" y="720" font-size="27" font-weight="700" stroke="none">3. Quy tắc dấu cần nhớ</text>
    <g fill="none" stroke-width="2" stroke-dasharray="7 5"><rect x="75" y="750" width="195" height="125" rx="12"/><rect x="290" y="750" width="195" height="125" rx="12"/><rect x="505" y="750" width="195" height="125" rx="12"/><rect x="720" y="750" width="195" height="125" rx="12"/><rect x="935" y="750" width="195" height="125" rx="12"/></g>
    <g stroke="none" text-anchor="middle"><text x="172" y="800" font-size="25">+ × + = +</text><text x="387" y="800" font-size="25">+ × − = −</text><text x="602" y="800" font-size="25">− × + = −</text><text x="817" y="800" font-size="25">− × − = +</text><text x="1032" y="795" font-size="20" font-weight="700">Trừ số âm</text><text x="1032" y="830" font-size="18">= cộng số đối</text></g>
    <text x="65" y="940" font-size="27" font-weight="700" stroke="none">4. Phân số và phép tính</text>
    <g fill="none" stroke-width="2"><rect x="70" y="970" width="200" height="165" rx="14"/><rect x="285" y="970" width="200" height="165" rx="14"/><rect x="500" y="970" width="200" height="165" rx="14"/><rect x="715" y="970" width="200" height="165" rx="14"/><rect x="930" y="970" width="200" height="165" rx="14"/></g>
    <g stroke="none" text-anchor="middle"><text x="170" y="1015" font-size="22" font-weight="700">Rút gọn</text><text x="170" y="1055" font-size="18">chia cả tử và mẫu</text><text x="170" y="1085" font-size="18">cho cùng ước ≠ 0</text><text x="385" y="1015" font-size="22" font-weight="700">Quy đồng</text><text x="385" y="1055" font-size="18">đưa về cùng mẫu</text><text x="600" y="1015" font-size="22" font-weight="700">Cộng / Trừ</text><text x="600" y="1055" font-size="18">quy đồng trước</text><text x="815" y="1015" font-size="22" font-weight="700">Nhân</text><text x="815" y="1055" font-size="18">tử × tử</text><text x="815" y="1085" font-size="18">mẫu × mẫu</text><text x="1030" y="1015" font-size="22" font-weight="700">Chia</text><text x="1030" y="1055" font-size="18">nhân với phân số</text><text x="1030" y="1085" font-size="18">nghịch đảo</text></g>
    <text x="600" y="1170" text-anchor="middle" font-size="20" stroke="none">Ví dụ: 3/4 + 5/6 = 9/12 + 10/12 = 19/12</text>
    <text x="65" y="1235" font-size="27" font-weight="700" stroke="none">5. Ước – bội – số nguyên tố – ƯCLN – BCNN</text>
    <g fill="none" stroke-width="2"><rect x="70" y="1265" width="160" height="160" rx="14"/><rect x="245" y="1265" width="160" height="160" rx="14"/><rect x="420" y="1265" width="160" height="160" rx="14"/><rect x="595" y="1265" width="160" height="160" rx="14"/><rect x="770" y="1265" width="160" height="160" rx="14"/><rect x="945" y="1265" width="185" height="160" rx="14"/></g>
    <g stroke="none" text-anchor="middle"><text x="150" y="1310" font-size="22" font-weight="700">Ước</text><text x="150" y="1345" font-size="17">b | a</text><text x="150" y="1375" font-size="17">→ b là ước của a</text><text x="325" y="1310" font-size="22" font-weight="700">Bội</text><text x="325" y="1345" font-size="17">a = b·k</text><text x="325" y="1375" font-size="17">→ a là bội của b</text><text x="500" y="1310" font-size="22" font-weight="700">Nguyên tố</text><text x="500" y="1345" font-size="17">&gt; 1</text><text x="500" y="1375" font-size="17">đúng 2 ước dương</text><text x="675" y="1310" font-size="22" font-weight="700">Phân tích</text><text x="675" y="1345" font-size="17">thành thừa số</text><text x="675" y="1375" font-size="17">nguyên tố</text><text x="850" y="1310" font-size="22" font-weight="700">ƯCLN</text><text x="850" y="1345" font-size="17">ước chung</text><text x="850" y="1375" font-size="17">lớn nhất</text><text x="1037" y="1310" font-size="22" font-weight="700">BCNN</text><text x="1037" y="1345" font-size="17">bội chung</text><text x="1037" y="1375" font-size="17">nhỏ nhất khác 0</text></g>
    <text x="600" y="1465" text-anchor="middle" font-size="19" font-weight="700" stroke="none">Chia nhóm nhiều nhất → nghĩ ƯCLN  |  Chu kỳ chung nhỏ nhất → nghĩ BCNN</text>
    <text x="65" y="1530" font-size="27" font-weight="700" stroke="none">6. Tỉ số và phần trăm</text>
    <text x="600" y="1570" text-anchor="middle" font-size="20" stroke="none">p% = p/100  •  Tăng p% → ×(1 + p/100)  •  Giảm p% → ×(1 − p/100)</text>
  </g>
</svg>