<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820"><style>.t{font:700 40px Arial}.h{font:700 27px Arial}.b{font:21px Arial}.s{fill:#fff;stroke:#111;stroke-width:2}.w{fill:#f7f7f7;stroke:#111;stroke-width:2}</style><rect width="1200" height="820" fill="#fff"/><text x="600" y="58" text-anchor="middle" class="t">07. ĐIỀU KIỆN XÁC ĐỊNH &amp; RÚT GỌN</text><rect x="45" y="95" width="535" height="610" rx="16" class="s"/><text x="80" y="140" class="h">A. Điều kiện xác định</text><text x="80" y="185" class="b">Phân thức A/B xác định khi B ≠ 0.</text><rect x="80" y="220" width="465" height="120" rx="12" class="w"/><text x="105" y="258" class="b">Ví dụ: (x+2)/(x²−9)</text><text x="105" y="298" class="b">x²−9=(x−3)(x+3)</text><text x="105" y="330" class="b">⇒ x ≠ 3 và x ≠ −3</text><text x="80" y="395" class="h">Quy tắc bắt buộc</text><text x="95" y="438" class="b">1. Tìm ĐKXĐ trước khi biến đổi.</text><text x="95" y="478" class="b">2. Sau khi rút gọn vẫn giữ ĐK ban đầu.</text><text x="95" y="518" class="b">3. Giá trị bị loại không được “quay lại”.</text><rect x="620" y="95" width="535" height="610" rx="16" class="s"/><text x="655" y="140" class="h">B. Rút gọn phân thức</text><text x="655" y="185" class="b">Phân tích tử, mẫu thành tích trước.</text><rect x="655" y="220" width="465" height="160" rx="12" class="w"/><text x="680" y="258" class="b">(x²−9)/(x²−3x)</text><text x="680" y="298" class="b">=[(x−3)(x+3)]/[x(x−3)]</text><text x="680" y="338" class="b">=(x+3)/x</text><text x="680" y="370" class="b">với x ≠ 0, x ≠ 3</text><text x="655" y="435" class="h">Chỉ rút nhân tử chung</text><text x="670" y="478" class="b">Đúng: x(x+1)/x → x+1 (x ≠ 0)</text><text x="670" y="518" class="b">Sai: (x+1)/x → “rút x”</text><text x="655" y="575" class="h">Đổi dấu</text><text x="670" y="618" class="b">a−x = −(x−a)</text><text x="670" y="658" class="b">1/(a−x) = −1/(x−a)</text><text x="600" y="770" text-anchor="middle" class="b">ĐKXĐ → phân tích nhân tử → rút gọn → giữ điều kiện ban đầu</text></svg>