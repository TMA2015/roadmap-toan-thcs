<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860"><style>.t{font:700 40px Arial}.h{font:700 26px Arial}.b{font:21px Arial}.s{fill:#fff;stroke:#111;stroke-width:2}.w{fill:#f7f7f7;stroke:#111;stroke-width:2}</style><rect width="1200" height="860" fill="#fff"/><text x="600" y="58" text-anchor="middle" class="t">07. QUY ĐỒNG &amp; CÁC PHÉP TÍNH</text><rect x="45" y="95" width="1110" height="190" rx="16" class="s"/><text x="80" y="140" class="h">1. Quy đồng mẫu thức</text><text x="90" y="185" class="b">Phân tích mẫu → chọn mẫu thức chung → tìm nhân tử phụ → nhân cả tử và mẫu.</text><text x="90" y="230" class="b">Ví dụ: 1/[x(x−1)] và 1/[x(x+1)] → MTC = x(x−1)(x+1)</text><rect x="45" y="315" width="535" height="390" rx="16" class="s"/><text x="80" y="360" class="h">2. Cộng – trừ</text><text x="90" y="405" class="b">Cùng mẫu: cộng/trừ tử, giữ mẫu.</text><text x="90" y="445" class="b">Khác mẫu: quy đồng trước.</text><rect x="80" y="485" width="465" height="120" rx="12" class="w"/><text x="105" y="525" class="b">1/x + 1/(x+1)</text><text x="105" y="565" class="b">=(2x+1)/[x(x+1)]</text><text x="90" y="650" class="b">Luôn giữ điều kiện x ≠ 0, x ≠ −1.</text><rect x="620" y="315" width="535" height="390" rx="16" class="s"/><text x="655" y="360" class="h">3. Nhân – chia</text><text x="665" y="405" class="b">Nhân: nhân tử với tử, mẫu với mẫu.</text><text x="665" y="445" class="b">Nên phân tích và rút gọn trước khi nhân.</text><text x="665" y="495" class="b">Chia: A/B : C/D = A/B × D/C</text><text x="665" y="535" class="b">Ngoài mẫu ≠ 0, cần C ≠ 0.</text><rect x="655" y="575" width="465" height="85" rx="12" class="w"/><text x="680" y="610" class="b">Mẹo: đừng khai triển sớm;</text><text x="680" y="642" class="b">hãy triệt tiêu nhân tử trước.</text><rect x="45" y="735" width="1110" height="70" rx="14" class="w"/><text x="600" y="780" text-anchor="middle" class="h">Thứ tự: ĐKXĐ → Ngoặc → Nhân/Chia → Cộng/Trừ → Rút gọn cuối</text></svg>