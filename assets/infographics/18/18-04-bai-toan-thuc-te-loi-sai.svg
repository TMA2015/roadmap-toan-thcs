<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1414" viewBox="0 0 1000 1414"><rect width="1000" height="1414" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke="#111"><rect x="45" y="45" width="910" height="1324" rx="20" fill="none" stroke-width="3"/><text x="500" y="105" text-anchor="middle" font-size="36" font-weight="700" stroke="none">BÀI TOÁN THỰC TẾ &amp; LỖI SAI</text><text x="500" y="145" text-anchor="middle" font-size="23" stroke="none">Góc nâng – góc hạ – chiều cao – khoảng cách</text><rect x="90" y="195" width="820" height="260" rx="16" fill="none" stroke-width="2"/><text x="120" y="240" font-size="28" font-weight="700" stroke="none">QUY TRÌNH 5 BƯỚC</text><text x="120" y="285" font-size="21" stroke="none">1. Vẽ tình huống thành tam giác vuông.</text><text x="120" y="325" font-size="21" stroke="none">2. Đánh dấu góc và phương ngang.</text><text x="120" y="365" font-size="21" stroke="none">3. Xác định cạnh đối – kề – huyền.</text><text x="120" y="405" font-size="21" stroke="none">4. Chọn sin, cos hoặc tan.</text><text x="120" y="445" font-size="21" stroke="none">5. Kiểm tra đơn vị và chế độ DEG.</text><rect x="90" y="490" width="820" height="205" rx="16" fill="none" stroke-width="2"/><text x="120" y="535" font-size="28" font-weight="700" stroke="none">MÔ HÌNH THƯỜNG GẶP</text><text x="120" y="585" font-size="22" stroke="none">Khoảng cách ngang d, chiều cao h, góc nâng α:</text><text x="120" y="635" font-size="28" font-weight="700" stroke="none">tan α = h / d   ⇒   h = d · tan α</text><text x="120" y="675" font-size="20" stroke="none">Có chiều cao mắt: cộng hoặc trừ theo mô hình.</text><rect x="90" y="730" width="820" height="230" rx="16" fill="none" stroke-width="2"/><text x="120" y="775" font-size="28" font-weight="700" stroke="none">CHỌN CÔNG CỤ NHANH</text><text x="120" y="825" font-size="22" stroke="none">• Biết 2 cạnh → Pythagore.</text><text x="120" y="870" font-size="22" stroke="none">• Có đường cao xuống cạnh huyền → hệ thức lượng.</text><text x="120" y="915" font-size="22" stroke="none">• Biết góc + 1 cạnh → sin / cos / tan.</text><rect x="90" y="995" width="820" height="305" rx="16" fill="none" stroke-width="2"/><text x="120" y="1040" font-size="28" font-weight="700" stroke="none">LỖI CẦN TRÁNH</text><text x="120" y="1090" font-size="21" stroke="none">• Nhầm cạnh đối và cạnh kề.</text><text x="120" y="1130" font-size="21" stroke="none">• Dùng cạnh huyền trong tan.</text><text x="120" y="1170" font-size="21" stroke="none">• Gắn sai cạnh với hình chiếu.</text><text x="120" y="1210" font-size="21" stroke="none">• Máy tính để RAD.</text><text x="120" y="1250" font-size="21" stroke="none">• Làm tròn quá sớm.</text><text x="120" y="1290" font-size="21" stroke="none">• Quên chiều cao mắt trong bài thực tế.</text></g></svg>