<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1414" viewBox="0 0 1000 1414">
  <rect width="1000" height="1414" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke="#111">
    <rect x="45" y="45" width="910" height="1324" rx="20" fill="none" stroke-width="3"/>
    <text x="500" y="105" text-anchor="middle" font-size="38" font-weight="700" stroke="none">HỆ THỨC ĐƯỜNG CAO</text>
    <text x="500" y="145" text-anchor="middle" font-size="24" stroke="none">△ABC vuông tại A, AH ⟂ BC</text>

    <path d="M190 390 L500 190 L820 390 Z" fill="none" stroke-width="3"/>
    <line x1="500" y1="190" x2="505" y2="390" stroke-width="3"/>
    <text x="485" y="178" font-size="24" stroke="none">A</text>
    <text x="160" y="420" font-size="24" stroke="none">B</text>
    <text x="825" y="420" font-size="24" stroke="none">C</text>
    <text x="495" y="420" font-size="24" stroke="none">H</text>
    <rect x="505" y="365" width="24" height="24" fill="none" stroke-width="2"/>

    <rect x="90" y="470" width="820" height="270" rx="16" fill="none" stroke-width="2"/>
    <text x="120" y="515" font-size="29" font-weight="700" stroke="none">4 HỆ THỨC CỐT LÕI</text>
    <text x="120" y="565" font-size="25" stroke="none">AB² = BH · BC</text>
    <text x="120" y="610" font-size="25" stroke="none">AC² = CH · BC</text>
    <text x="120" y="655" font-size="25" stroke="none">AH² = BH · CH</text>
    <text x="120" y="700" font-size="25" stroke="none">AB · AC = AH · BC</text>

    <rect x="90" y="775" width="820" height="180" rx="16" fill="none" stroke-width="2"/>
    <text x="120" y="820" font-size="28" font-weight="700" stroke="none">LIÊN HỆ ĐOẠN TRÊN CẠNH HUYỀN</text>
    <text x="120" y="875" font-size="26" stroke="none">BH + CH = BC</text>
    <text x="120" y="920" font-size="21" stroke="none">Muốn tìm một hình chiếu, thường kết hợp công thức này với một hệ thức phía trên.</text>

    <rect x="90" y="990" width="820" height="275" rx="16" fill="none" stroke-width="2"/>
    <text x="120" y="1035" font-size="28" font-weight="700" stroke="none">CÁCH CHỌN CÔNG THỨC</text>
    <text x="120" y="1085" font-size="22" stroke="none">• Có cạnh góc vuông và hình chiếu của chính cạnh đó → AB² hoặc AC².</text>
    <text x="120" y="1130" font-size="22" stroke="none">• Có hai hình chiếu BH, CH → nghĩ tới AH² = BH·CH.</text>
    <text x="120" y="1175" font-size="22" stroke="none">• Có hai cạnh góc vuông và cạnh huyền → AB·AC = AH·BC.</text>
    <text x="120" y="1220" font-size="22" stroke="none">• Luôn gắn đúng cạnh với đúng hình chiếu của nó.</text>
  </g>
</svg>