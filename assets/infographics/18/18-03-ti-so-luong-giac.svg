<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1414" viewBox="0 0 1000 1414">
  <rect width="1000" height="1414" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke="#111">
    <rect x="45" y="45" width="910" height="1324" rx="20" fill="none" stroke-width="3"/>
    <text x="500" y="105" text-anchor="middle" font-size="38" font-weight="700" stroke="none">SIN – COS – TAN</text>
    <text x="500" y="145" text-anchor="middle" font-size="24" stroke="none">Luôn xác định cạnh theo góc đang xét</text>

    <path d="M180 430 L180 210 L760 430 Z" fill="none" stroke-width="3"/>
    <rect x="180" y="405" width="25" height="25" fill="none" stroke-width="2"/>
    <text x="155" y="200" font-size="24" stroke="none">A</text>
    <text x="145" y="465" font-size="24" stroke="none">B</text>
    <text x="770" y="465" font-size="24" stroke="none">C</text>
    <text x="700" y="415" font-size="24" stroke="none">α</text>
    <text x="430" y="470" font-size="22" stroke="none">cạnh kề với α</text>
    <text x="205" y="315" font-size="22" stroke="none">cạnh đối</text>
    <text x="475" y="285" font-size="22" stroke="none">cạnh huyền</text>

    <rect x="90" y="515" width="820" height="300" rx="16" fill="none" stroke-width="2"/>
    <text x="120" y="560" font-size="29" font-weight="700" stroke="none">3 TỈ SỐ CẦN NHỚ</text>
    <text x="120" y="620" font-size="27" stroke="none">sin α = cạnh đối / cạnh huyền</text>
    <text x="120" y="680" font-size="27" stroke="none">cos α = cạnh kề / cạnh huyền</text>
    <text x="120" y="740" font-size="27" stroke="none">tan α = cạnh đối / cạnh kề</text>
    <text x="120" y="785" font-size="20" stroke="none">Mẹo: sin = đối/huyền | cos = kề/huyền | tan = đối/kề</text>

    <rect x="90" y="850" width="820" height="225" rx="16" fill="none" stroke-width="2"/>
    <text x="120" y="895" font-size="28" font-weight="700" stroke="none">CHỌN TỈ SỐ NÀO?</text>
    <text x="120" y="945" font-size="22" stroke="none">• Biết góc + cạnh đối/huyền → dùng sin.</text>
    <text x="120" y="990" font-size="22" stroke="none">• Biết góc + cạnh kề/huyền → dùng cos.</text>
    <text x="120" y="1035" font-size="22" stroke="none">• Biết góc + cạnh đối/kề → dùng tan.</text>

    <rect x="90" y="1110" width="820" height="190" rx="16" fill="none" stroke-width="2"/>
    <text x="120" y="1155" font-size="28" font-weight="700" stroke="none">TÌM GÓC</text>
    <text x="120" y="1205" font-size="22" stroke="none">Lập tỉ số trước, rồi dùng sin⁻¹ / cos⁻¹ / tan⁻¹.</text>
    <text x="120" y="1250" font-size="22" stroke="none">Máy tính phải ở chế độ DEG khi góc tính theo độ.</text>
  </g>
</svg>