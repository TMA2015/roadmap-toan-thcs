<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1414" viewBox="0 0 1000 1414">
  <rect width="1000" height="1414" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke="#111">
    <rect x="45" y="45" width="910" height="1324" rx="20" fill="none" stroke-width="3"/>
    <text x="500" y="105" text-anchor="middle" font-size="38" font-weight="700" stroke="none">CHUYÊN ĐỀ 18 – HỆ THỨC LƯỢNG</text>
    <text x="500" y="145" text-anchor="middle" font-size="24" stroke="none">Tam giác vuông: nhận dạng → chọn công cụ → tính toán → kiểm tra</text>

    <rect x="90" y="200" width="820" height="190" rx="16" fill="none" stroke-width="2"/>
    <text x="120" y="245" font-size="28" font-weight="700" stroke="none">1. PYTHAGORE</text>
    <text x="120" y="292" font-size="24" stroke="none">a² + b² = c²</text>
    <text x="120" y="332" font-size="22" stroke="none">Dùng khi biết 2 cạnh của tam giác vuông hoặc cần kiểm tra tam giác vuông.</text>

    <rect x="90" y="425" width="820" height="235" rx="16" fill="none" stroke-width="2"/>
    <text x="120" y="470" font-size="28" font-weight="700" stroke="none">2. ĐƯỜNG CAO XUỐNG CẠNH HUYỀN</text>
    <text x="120" y="515" font-size="22" stroke="none">AB² = BH·BC      AC² = CH·BC</text>
    <text x="120" y="555" font-size="22" stroke="none">AH² = BH·CH      AB·AC = AH·BC</text>
    <text x="120" y="595" font-size="22" stroke="none">BH + CH = BC</text>
    <text x="120" y="630" font-size="20" stroke="none">Dấu hiệu: có tam giác vuông và đường cao từ đỉnh góc vuông xuống cạnh huyền.</text>

    <rect x="90" y="695" width="820" height="235" rx="16" fill="none" stroke-width="2"/>
    <text x="120" y="740" font-size="28" font-weight="700" stroke="none">3. TỈ SỐ LƯỢNG GIÁC</text>
    <text x="120" y="785" font-size="22" stroke="none">sin α = đối / huyền</text>
    <text x="120" y="825" font-size="22" stroke="none">cos α = kề / huyền</text>
    <text x="120" y="865" font-size="22" stroke="none">tan α = đối / kề</text>
    <text x="120" y="905" font-size="20" stroke="none">Dùng khi biết góc + một cạnh, hoặc biết hai cạnh và cần tìm góc.</text>

    <rect x="90" y="965" width="820" height="210" rx="16" fill="none" stroke-width="2"/>
    <text x="120" y="1010" font-size="28" font-weight="700" stroke="none">4. BÀI TOÁN THỰC TẾ</text>
    <text x="120" y="1055" font-size="22" stroke="none">Góc nâng / góc hạ → dựng tam giác vuông → chọn sin, cos hoặc tan.</text>
    <text x="120" y="1095" font-size="22" stroke="none">Ví dụ: tan α = h/d  ⇒  h = d·tan α</text>
    <text x="120" y="1135" font-size="20" stroke="none">Nhớ xử lý chiều cao mắt người quan sát nếu đề có cho.</text>

    <rect x="90" y="1210" width="820" height="115" rx="16" fill="none" stroke-width="2"/>
    <text x="120" y="1252" font-size="25" font-weight="700" stroke="none">MẸO CHỌN NHANH</text>
    <text x="120" y="1292" font-size="20" stroke="none">2 cạnh → Pythagore | đường cao → hệ thức lượng | góc + cạnh → lượng giác</text>
  </g>
</svg>