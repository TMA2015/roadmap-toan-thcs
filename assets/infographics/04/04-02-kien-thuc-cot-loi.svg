<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450" role="img" aria-labelledby="title desc"><title id="title">Chuyên đề 04 – Biểu thức đại số – Kiến thức cốt lõi</title><desc id="desc">Khái niệm đơn thức, đa thức, bậc, giá trị biểu thức và quy tắc thu gọn.</desc><rect width="1200" height="1450" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif" fill="#111" stroke="#111"><rect x="28" y="28" width="1144" height="1394" rx="24" fill="none" stroke-width="3"/><text x="600" y="86" text-anchor="middle" font-size="34" font-weight="700" stroke="none">CHUYÊN ĐỀ 04</text><text x="600" y="140" text-anchor="middle" font-size="46" font-weight="700" stroke="none">BIỂU THỨC ĐẠI SỐ</text><text x="600" y="184" text-anchor="middle" font-size="24" stroke="none">Infographic 2 • Kiến thức cốt lõi</text><g fill="none" stroke-width="2"><rect x="65" y="225" width="510" height="340" rx="18"/><rect x="625" y="225" width="510" height="340" rx="18"/><rect x="65" y="600" width="510" height="285" rx="18"/><rect x="625" y="600" width="510" height="285" rx="18"/><rect x="65" y="920" width="1070" height="330" rx="18"/><rect x="65" y="1280" width="1070" height="90" rx="18"/></g><g stroke="none"><text x="95" y="275" font-size="27" font-weight="700">1. Khái niệm</text><text x="95" y="325" font-size="21" font-weight="700">Biểu thức đại số</text><text x="95" y="360" font-size="20">Gồm số, biến và các phép tính.</text><text x="95" y="410" font-size="21" font-weight="700">Hệ số</text><text x="95" y="445" font-size="20">Phần số của một hạng tử.</text><text x="95" y="495" font-size="21" font-weight="700">Phần biến</text><text x="95" y="530" font-size="20">Phần chứa biến và số mũ.</text><text x="655" y="275" font-size="27" font-weight="700">2. Đơn thức & đa thức</text><text x="655" y="325" font-size="21" font-weight="700">Đơn thức</text><text x="655" y="360" font-size="20">Một tích của số với các biến.</text><text x="655" y="410" font-size="21" font-weight="700">Đa thức</text><text x="655" y="445" font-size="20">Tổng của các đơn thức.</text><text x="655" y="495" font-size="21" font-weight="700">Hạng tử đồng dạng</text><text x="655" y="530" font-size="20">Có cùng phần biến.</text><text x="95" y="650" font-size="27" font-weight="700">3. Bậc</text><text x="95" y="705" font-size="20">• Bậc đơn thức = tổng số mũ của các biến.</text><text x="95" y="750" font-size="20">• Bậc đa thức = bậc lớn nhất sau khi thu gọn.</text><text x="95" y="805" font-size="20">Ví dụ: 3x²y có bậc 3.</text><text x="655" y="650" font-size="27" font-weight="700">4. Giá trị biểu thức</text><text x="655" y="705" font-size="20">• Thay đúng giá trị của biến.</text><text x="655" y="750" font-size="20">• Dùng ngoặc khi thay số âm.</text><text x="655" y="805" font-size="20">• Thực hiện theo đúng thứ tự phép tính.</text><text x="95" y="975" font-size="27" font-weight="700">5. Thu gọn & biến đổi</text><text x="95" y="1030" font-size="20">1) Bỏ ngoặc đúng dấu.</text><text x="95" y="1070" font-size="20">2) Nhân phân phối nếu cần.</text><text x="95" y="1110" font-size="20">3) Chỉ gộp các hạng tử đồng dạng.</text><text x="95" y="1150" font-size="20">4) Sắp xếp kết quả theo bậc giảm dần khi phù hợp.</text><text x="650" y="1030" font-size="20" font-weight="700">Ví dụ:</text><text x="650" y="1075" font-size="23">3x + 2x − 5 = 5x − 5</text><text x="650" y="1125" font-size="23">2a(a + 3) = 2a² + 6a</text><text x="650" y="1180" font-size="20">−(a − b) = −a + b</text><text x="95" y="1335" font-size="21" font-weight="700">Ghi nhớ:</text><text x="220" y="1335" font-size="20">x và x² không đồng dạng • phải thu gọn trước khi xác định bậc</text></g></g></svg>