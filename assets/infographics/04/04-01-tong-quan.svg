<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450" role="img" aria-labelledby="title desc"><title id="title">Chuyên đề 04 – Biểu thức đại số – Tổng quan</title><desc id="desc">Tổng quan về biến, hệ số, hạng tử, đơn thức, đa thức, giá trị biểu thức và vị trí trong Roadmap.</desc><rect width="1200" height="1450" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif" fill="#111" stroke="#111"><rect x="28" y="28" width="1144" height="1394" rx="24" fill="none" stroke-width="3"/><text x="600" y="86" text-anchor="middle" font-size="34" font-weight="700" stroke="none">CHUYÊN ĐỀ 04</text><text x="600" y="142" text-anchor="middle" font-size="48" font-weight="700" stroke="none">BIỂU THỨC ĐẠI SỐ</text><text x="600" y="184" text-anchor="middle" font-size="24" stroke="none">Infographic 1 • Tổng quan chuyên đề</text><rect x="65" y="220" width="1070" height="74" rx="14" fill="none" stroke-width="2"/><text x="125" y="266" font-size="20" stroke="none">Lớp trọng tâm: 7–8</text><text x="455" y="266" font-size="20" stroke="none">Mạch: Đại số</text><text x="780" y="266" font-size="20" stroke="none">Ưu tiên: ★★★★★</text><text x="70" y="345" font-size="28" font-weight="700" stroke="none">1. Học gì trong chuyên đề này?</text><g fill="none" stroke-width="2"><rect x="70" y="375" width="205" height="170" rx="15"/><rect x="290" y="375" width="205" height="170" rx="15"/><rect x="510" y="375" width="205" height="170" rx="15"/><rect x="730" y="375" width="205" height="170" rx="15"/><rect x="950" y="375" width="180" height="170" rx="15"/></g><g stroke="none" text-anchor="middle"><text x="172" y="425" font-size="34" font-weight="700">x</text><text x="172" y="468" font-size="20">Biến, hằng số,</text><text x="172" y="496" font-size="20">hệ số</text><text x="392" y="425" font-size="28" font-weight="700">3x²</text><text x="392" y="468" font-size="20">Hạng tử, đơn thức,</text><text x="392" y="496" font-size="20">đa thức</text><text x="612" y="425" font-size="27" font-weight="700">bậc</text><text x="612" y="468" font-size="20">Bậc đơn thức</text><text x="612" y="496" font-size="20">và đa thức</text><text x="832" y="425" font-size="27" font-weight="700">A(x)</text><text x="832" y="468" font-size="20">Giá trị</text><text x="832" y="496" font-size="20">biểu thức</text><text x="1040" y="425" font-size="32" font-weight="700">→</text><text x="1040" y="468" font-size="19">Thu gọn và</text><text x="1040" y="496" font-size="19">biến đổi</text></g><text x="70" y="610" font-size="28" font-weight="700" stroke="none">2. Ý tưởng chính</text><rect x="70" y="640" width="1060" height="245" rx="16" fill="none" stroke-width="2"/><g stroke="none"><text x="105" y="695" font-size="22" font-weight="700">Biểu thức đại số</text><text x="105" y="730" font-size="20">Dùng chữ để đại diện cho số và mô tả quan hệ.</text><text x="105" y="780" font-size="22" font-weight="700">Hạng tử đồng dạng</text><text x="105" y="815" font-size="20">Chỉ được cộng/trừ khi có cùng phần biến.</text><text x="620" y="695" font-size="22" font-weight="700">Mỗi hạng tử có cấu trúc</text><text x="620" y="730" font-size="20">Hệ số × phần biến; bậc là tổng số mũ của biến.</text><text x="620" y="780" font-size="22" font-weight="700">Vai trò nền tảng</text><text x="620" y="815" font-size="20">Chuẩn bị cho hằng đẳng thức, nhân tử và phương trình.</text></g><text x="70" y="945" font-size="28" font-weight="700" stroke="none">3. Vị trí trong Roadmap</text><g fill="none" stroke-width="2"><rect x="75" y="985" width="180" height="100" rx="15"/><rect x="285" y="985" width="180" height="100" rx="15"/><rect x="495" y="970" width="210" height="130" rx="15" stroke-width="4"/><rect x="735" y="985" width="180" height="100" rx="15"/><rect x="945" y="985" width="180" height="100" rx="15"/></g><g stroke="none" text-anchor="middle"><text x="165" y="1025" font-size="20" font-weight="700">02</text><text x="165" y="1058" font-size="18">Số & phép tính</text><text x="375" y="1025" font-size="20" font-weight="700">03</text><text x="375" y="1058" font-size="18">Tỉ lệ</text><text x="600" y="1018" font-size="23" font-weight="700">04</text><text x="600" y="1052" font-size="20">Biểu thức</text><text x="600" y="1080" font-size="20">đại số</text><text x="825" y="1025" font-size="20" font-weight="700">05–06</text><text x="825" y="1058" font-size="18">HĐT • Nhân tử</text><text x="1035" y="1025" font-size="20" font-weight="700">08</text><text x="1035" y="1058" font-size="18">Phương trình</text><text x="268" y="1045" font-size="30">→</text><text x="478" y="1045" font-size="30">→</text><text x="718" y="1045" font-size="30">→</text><text x="928" y="1045" font-size="30">→</text></g><text x="70" y="1170" font-size="28" font-weight="700" stroke="none">4. Lỗi hay gặp</text><rect x="70" y="1200" width="1060" height="145" rx="16" fill="none" stroke-width="2"/><g stroke="none"><text x="105" y="1250" font-size="20">• Nhầm hệ số với biến</text><text x="105" y="1290" font-size="20">• Gộp hạng tử không đồng dạng</text><text x="600" y="1250" font-size="20">• Sai dấu khi bỏ ngoặc</text><text x="600" y="1290" font-size="20">• Xác định bậc trước khi thu gọn</text></g><text x="600" y="1390" text-anchor="middle" font-size="21" font-weight="700" stroke="none">HỌC BÀI → LUYỆN TẬP → TỰ KIỂM TRA → ĐẠT ≥ 80% → CHUYỂN TIẾP</text></g></svg>