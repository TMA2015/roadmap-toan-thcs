<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 390" role="img" aria-labelledby="ttl desc">
<title id="ttl">Hai tiếp tuyến AB, AC và cát tuyến ADE của đường tròn tâm O</title>
<desc id="desc">A nằm ngoài đường tròn, B và C là tiếp điểm, D và E là giao của cát tuyến qua A với đường tròn theo thứ tự A D E. OB vuông góc AB, OC vuông góc AC. AB bình phương bằng AD nhân AE.</desc>
<rect width="670" height="390" rx="18" fill="#f4f8ff"/>
<circle cx="365" cy="190" r="125" fill="#e7f5fa" stroke="#29739a" stroke-width="3"/>
<path d="M90 190L308.182 78.658M90 190L308.182 301.342" fill="none" stroke="#304bac" stroke-width="3.3"/>
<path d="M90 190H490" stroke="#d17f2c" stroke-width="3" stroke-dasharray="10 6"/>
<path d="M365 190L308.182 78.658M365 190L308.182 301.342" stroke="#28778f" stroke-width="2.4"/>
<path d="M308.182 78.658L314.542 91.119L302.081 97.479" stroke="#28778f" stroke-width="2.3" fill="none"/>
<path d="M308.182 301.342L314.542 288.881L302.081 282.521" stroke="#28778f" stroke-width="2.3" fill="none"/>
<g fill="#1d2e61"><circle cx="90" cy="190" r="4.5"/><circle cx="308.182" cy="78.658" r="4.5"/><circle cx="308.182" cy="301.342" r="4.5"/><circle cx="240" cy="190" r="4.5"/><circle cx="365" cy="190" r="4.5"/><circle cx="490" cy="190" r="4.5"/></g>
<g font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#182b50"><text x="69" y="181">A</text><text x="300" y="60">B</text><text x="302" y="328">C</text><text x="230" y="181">D</text><text x="357" y="181">O</text><text x="494" y="181">E</text></g>
<g font-family="Arial,sans-serif" fill="#ad6020" font-size="17"><text x="145" y="215">AD</text><text x="426" y="215">DE</text></g>
<text x="335" y="358" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#1f367e" font-weight="700">AB² = AD · AE</text>
</svg>