<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 360" role="img" aria-labelledby="ttl desc">
<title id="ttl">Tam giác ABC vuông tại A, đường cao AH xuống BC</title>
<desc id="desc">B, H, C thẳng hàng, BH bằng 9 và HC bằng 16; A nằm trên đường thẳng vuông góc BC tại H. Góc BAC và góc AHB là góc vuông. Ba tam giác ABH, AHC và ABC đồng dạng.</desc>
<rect width="650" height="360" rx="18" fill="#f4f8ff"/>
<path d="M70 285L250 45L570 285Z" fill="#e5f0ff" stroke="#233b88" stroke-width="3.5" stroke-linejoin="round"/>
<path d="M250 45V285" stroke="#d17f2c" stroke-width="3" stroke-dasharray="9 7"/>
<path d="M240.4 57.8L253.2 67.4L262.8 54.6" fill="none" stroke="#233b88" stroke-width="2.2"/>
<path d="M250 269L266 269L266 285" fill="none" stroke="#d17f2c" stroke-width="2.4"/>
<g fill="#233b88"><circle cx="250" cy="45" r="4.5"/><circle cx="70" cy="285" r="4.5"/><circle cx="250" cy="285" r="4.5"/><circle cx="570" cy="285" r="4.5"/></g>
<g font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#182b50"><text x="241" y="29">A</text><text x="52" y="311">B</text><text x="244" y="312">H</text><text x="573" y="311">C</text></g>
<g font-family="Arial,sans-serif" font-size="17" fill="#374968"><text x="145" y="306">9</text><text x="405" y="306">16</text><text x="263" y="166" fill="#ad6020">AH = 12</text><text x="128" y="167">AB = 15</text><text x="433" y="170">AC = 20</text></g>
<text x="325" y="343" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#52627d">Hình dựng theo tỉ lệ 9 : 12 : 16; chỉ dùng quan hệ hình học để chứng minh.</text>
</svg>