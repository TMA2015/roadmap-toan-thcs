<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Trọng tâm của tam giác</title><desc id="desc">Ba đường trung tuyến của tam giác ABC gặp nhau tại G. M, N, P lần lượt là trung điểm BC, CA, AB.</desc><style>.g{fill:none;stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:#1565c0;stroke-width:1.9;stroke-linecap:round}.f{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round}.d{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.p{fill:#111827}.t{font:19px Arial,Helvetica,sans-serif;fill:#111827}.s{font:16px Arial,Helvetica,sans-serif;fill:#374151}.b{font:18px Arial,Helvetica,sans-serif;fill:#1565c0}.r{font:18px Arial,Helvetica,sans-serif;fill:#c62828}</style><path class="g" d="M320 90 L120 330 H520 Z"/><circle class="p" cx="320" cy="90" r="3"/><text class="t" x="313" y="79">A</text><circle class="p" cx="120" cy="330" r="3"/><text class="t" x="95" y="348">B</text><circle class="p" cx="520" cy="330" r="3"/><text class="t" x="529" y="348">C</text><path class="a" d="M320 90 V330 M120 330 L420 210 M520 330 L220 210"/><circle class="p" cx="320" cy="330" r="3"/><text class="t" x="328" y="350">M</text><circle class="p" cx="420" cy="210" r="3"/><text class="t" x="429" y="202">N</text><circle class="p" cx="220" cy="210" r="3"/><text class="t" x="195" y="202">P</text><circle class="p" cx="320" cy="250" r="3"/><text class="t" x="330" y="243">G</text><text class="s" x="320" y="394" text-anchor="middle">AG = 2GM; G là giao điểm ba trung tuyến.</text></svg>
