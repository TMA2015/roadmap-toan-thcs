<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Tâm đường tròn nội tiếp tam giác</title><desc id="desc">Tam giác ABC có đường tròn nội tiếp tâm I, tiếp xúc cả ba cạnh; I là giao điểm ba đường phân giác trong.</desc><style>.g{fill:none;stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:#1565c0;stroke-width:1.9;stroke-linecap:round}.f{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round}.d{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.p{fill:#111827}.t{font:19px Arial,Helvetica,sans-serif;fill:#111827}.s{font:16px Arial,Helvetica,sans-serif;fill:#374151}.b{font:18px Arial,Helvetica,sans-serif;fill:#1565c0}.r{font:18px Arial,Helvetica,sans-serif;fill:#c62828}</style><path class="g" d="M320 90 L120 330 H520 Z"/><circle class="p" cx="320" cy="90" r="3"/><text class="t" x="313" y="79">A</text><circle class="p" cx="120" cy="330" r="3"/><text class="t" x="95" y="348">B</text><circle class="p" cx="520" cy="330" r="3"/><text class="t" x="529" y="348">C</text><circle class="f" cx="320" cy="236.322" r="93.678"/><path class="a" d="M320 236.322 V330"/><circle class="p" cx="320" cy="236.322" r="3"/><text class="t" x="331" y="226.322">I</text><text class="s" x="320" y="394" text-anchor="middle">I cách đều ba cạnh của tam giác.</text></svg>
