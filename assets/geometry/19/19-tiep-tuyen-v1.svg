<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Tiếp tuyến của đường tròn</title><desc id="desc">Đường tròn tâm O bán kính OT. Đường thẳng d đi qua T và vuông góc bán kính OT, do đó d tiếp xúc đường tròn tại T.</desc><style>.g{fill:none;stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.aux{fill:none;stroke:#1565c0;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.focus{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.pt{fill:#111827}.t{fill:#111827;font:19px Arial,Helvetica,sans-serif}.n{fill:#374151;font:16px Arial,Helvetica,sans-serif}.r{fill:#c62828;font:18px Arial,Helvetica,sans-serif}.b{fill:#1565c0;font:18px Arial,Helvetica,sans-serif}</style><circle class="g" cx="290" cy="205" r="130"/><path class="aux" d="M290 205 H420"/><path class="focus" d="M420 52 V358"/><path class="g" d="M402 205 V187 H420"/><circle class="pt" cx="290" cy="205" r="3"/><text class="t" x="270" y="232">O</text><circle class="pt" cx="420" cy="205" r="3"/><text class="t" x="429" y="213">T</text><text class="r" x="437" y="70">d</text><text class="b" x="344" y="193">r</text><text class="n" x="320" y="397" text-anchor="middle">OT ⟂ d tại T; d là tiếp tuyến tại T.</text></svg>
