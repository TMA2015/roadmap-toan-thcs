<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Hình thoi ABCD</title><desc id="desc">Tứ giác ABCD có bốn cạnh bằng nhau; hai đường chéo AC và BD vuông góc.</desc><style>.g{fill:none;stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:#1565c0;stroke-width:1.9;stroke-linecap:round}.f{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round}.d{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.p{fill:#111827}.t{font:19px Arial,Helvetica,sans-serif;fill:#111827}.s{font:16px Arial,Helvetica,sans-serif;fill:#374151}.b{font:18px Arial,Helvetica,sans-serif;fill:#1565c0}.r{font:18px Arial,Helvetica,sans-serif;fill:#c62828}</style><path class="g" d="M320 70 L490 205 L320 340 L150 205 Z"/><circle class="p" cx="320" cy="70" r="3"/><text class="t" x="330" y="58">A</text><circle class="p" cx="490" cy="205" r="3"/><text class="t" x="500" y="193">B</text><circle class="p" cx="320" cy="340" r="3"/><text class="t" x="330" y="360">C</text><circle class="p" cx="150" cy="205" r="3"/><text class="t" x="125" y="193">D</text><path class="a" d="M320 70 V340 M150 205 H490 M320 187 H338 V205"/><text class="s" x="320" y="394" text-anchor="middle">AB = BC = CD = DA; AC ⟂ BD.</text></svg>
