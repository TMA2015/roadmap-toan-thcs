<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Hình chữ nhật ABCD</title><desc id="desc">Tứ giác ABCD có bốn góc vuông. AB song song CD và AD song song BC.</desc><style>.g{fill:none;stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:#1565c0;stroke-width:1.9;stroke-linecap:round}.f{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round}.d{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.p{fill:#111827}.t{font:19px Arial,Helvetica,sans-serif;fill:#111827}.s{font:16px Arial,Helvetica,sans-serif;fill:#374151}.b{font:18px Arial,Helvetica,sans-serif;fill:#1565c0}.r{font:18px Arial,Helvetica,sans-serif;fill:#c62828}</style><path class="g" d="M170 100 L470 100 L470 305 L170 305 Z"/><circle class="p" cx="170" cy="100" r="3"/><text class="t" x="145" y="88">A</text><circle class="p" cx="470" cy="100" r="3"/><text class="t" x="480" y="88">B</text><circle class="p" cx="470" cy="305" r="3"/><text class="t" x="480" y="325">C</text><circle class="p" cx="170" cy="305" r="3"/><text class="t" x="145" y="325">D</text><path class="a" d="M170 118 H188 V100 M452 100 V118 H470 M470 287 H452 V305 M188 305 V287 H170"/><text class="s" x="320" y="394" text-anchor="middle">Bốn góc đều bằng 90°.</text></svg>
