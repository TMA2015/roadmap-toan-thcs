<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Hai góc so le trong bằng nhau</title><desc id="desc">Hai đường thẳng a, b song song và bị cắt bởi c tại M, N. Hai góc so le trong nằm giữa a và b ở hai phía c, có số đo bằng nhau.</desc><style>.g{fill:none;stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:#1565c0;stroke-width:1.9;stroke-linecap:round}.f{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round}.d{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.p{fill:#111827}.t{font:19px Arial,Helvetica,sans-serif;fill:#111827}.s{font:16px Arial,Helvetica,sans-serif;fill:#374151}.b{font:18px Arial,Helvetica,sans-serif;fill:#1565c0}.r{font:18px Arial,Helvetica,sans-serif;fill:#c62828}</style><path class="g" d="M95 140 H545 M95 280 H545"/><path class="f" d="M220 80 L420 340"/><path class="a" d="M308 140 A42 42 0 0 1 291.6 173.3 M332 280 A42 42 0 0 0 348.4 246.7"/><circle class="p" cx="266.154" cy="140" r="3"/><text class="t" x="241.154" y="130">M</text><circle class="p" cx="373.846" cy="280" r="3"/><text class="t" x="383.846" y="301">N</text><text class="t" x="548" y="146">a</text><text class="t" x="548" y="286">b</text><text class="r" x="427" y="347">c</text><text class="s" x="320" y="394" text-anchor="middle">Hai góc so le trong bằng nhau khi a ∥ b.</text></svg>
