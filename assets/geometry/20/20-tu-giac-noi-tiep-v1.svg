<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Tứ giác nội tiếp đường tròn</title><desc id="desc">Bốn đỉnh A, B, C, D nằm trên cùng đường tròn tâm O. Hai góc đối A và C của tứ giác nội tiếp có tổng 180 độ.</desc><style>.g{fill:none;stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.aux{fill:none;stroke:#1565c0;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.focus{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.pt{fill:#111827}.t{fill:#111827;font:19px Arial,Helvetica,sans-serif}.n{fill:#374151;font:16px Arial,Helvetica,sans-serif}.r{fill:#c62828;font:18px Arial,Helvetica,sans-serif}.b{fill:#1565c0;font:18px Arial,Helvetica,sans-serif}</style><circle class="g" cx="320" cy="210" r="150"/><path class="focus" d="M320 60 L470 210 L320 360 L170 210 Z"/><path class="aux" d="M320 60 V360 M170 210 H470"/><circle class="pt" cx="320" cy="60" r="3"/><text class="t" x="312" y="48">A</text><circle class="pt" cx="470" cy="210" r="3"/><text class="t" x="480" y="202">B</text><circle class="pt" cx="320" cy="360" r="3"/><text class="t" x="312" y="383">C</text><circle class="pt" cx="170" cy="210" r="3"/><text class="t" x="145" y="202">D</text><circle class="pt" cx="320" cy="210" r="3"/><text class="t" x="329" y="201">O</text><text class="n" x="320" y="402" text-anchor="middle">∠A + ∠C = 180°; ∠B + ∠D = 180°.</text></svg>
