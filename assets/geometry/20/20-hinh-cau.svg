<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Hình cầu với tâm O và bán kính r</title>
  <desc id="desc">Hình cầu được biểu diễn bằng đường tròn lớn và đường xích đạo elip; đoạn từ tâm O đến mặt cầu được ký hiệu là bán kính r.</desc>
  <rect width="640" height="420" fill="white"/>
  <circle cx="320" cy="210" r="145" fill="#eef4fb" stroke="#1f2937" stroke-width="4"/>
  <ellipse cx="320" cy="210" rx="145" ry="48" fill="none" stroke="#1f2937" stroke-width="3.5"/>
  <path d="M175 210 C195 165 445 165 465 210" fill="none" stroke="#1f2937" stroke-width="3" stroke-dasharray="9 8"/>
  <path d="M320 65 C280 95 280 325 320 355" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <path d="M320 65 C360 95 360 325 320 355" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <g stroke="#2563eb" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M320 210 L425 130"/>
  </g>
  <g fill="#111827" font-family="Arial, sans-serif">
    <circle cx="320" cy="210" r="6"/>
    <text x="332" y="225" font-size="24">O</text>
    <text x="385" y="158" font-size="30" font-weight="700" fill="#2563eb">r</text>
  </g>
</svg>