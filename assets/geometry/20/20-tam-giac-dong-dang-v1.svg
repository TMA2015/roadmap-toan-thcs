<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Hai tam giác đồng dạng</title><desc id="desc">Hai tam giác ABC và DEF có các cạnh tương ứng song song theo cặp và tỉ số độ dài 3 phần 2; thứ tự tương ứng A với D, B với E, C với F.</desc><style>.g{fill:none;stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.aux{fill:none;stroke:#1565c0;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.focus{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.pt{fill:#111827}.t{fill:#111827;font:19px Arial,Helvetica,sans-serif}.n{fill:#374151;font:16px Arial,Helvetica,sans-serif}.r{fill:#c62828;font:18px Arial,Helvetica,sans-serif}.b{fill:#1565c0;font:18px Arial,Helvetica,sans-serif}</style><path class="g" d="M70 280 L70 160 L230 280 Z"/><path class="focus" d="M334 280 L334 100 L574 280 Z"/><path class="aux" d="M70 160 V280 H230 M334 100 V280 H574"/><circle class="pt" cx="70" cy="160" r="3"/><text class="t" x="60" y="149">A</text><circle class="pt" cx="70" cy="280" r="3"/><text class="t" x="48" y="300">B</text><circle class="pt" cx="230" cy="280" r="3"/><text class="t" x="238" y="300">C</text><circle class="pt" cx="334" cy="100" r="3"/><text class="t" x="326" y="88">D</text><circle class="pt" cx="334" cy="280" r="3"/><text class="t" x="312" y="300">E</text><circle class="pt" cx="574" cy="280" r="3"/><text class="t" x="582" y="300">F</text><text class="n" x="320" y="370" text-anchor="middle">△ABC ∼ △DEF (A ↔ D; B ↔ E; C ↔ F).</text></svg>
