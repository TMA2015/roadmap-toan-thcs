<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Tam giác cân tại A</title><desc id="desc">Tam giác ABC cân tại A, hai cạnh AB và AC bằng nhau, hai góc ở đáy B và C bằng nhau.</desc><style>.g{fill:none;stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:#1565c0;stroke-width:1.9;stroke-linecap:round}.f{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round}.d{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.p{fill:#111827}.t{font:19px Arial,Helvetica,sans-serif;fill:#111827}.s{font:16px Arial,Helvetica,sans-serif;fill:#374151}.b{font:18px Arial,Helvetica,sans-serif;fill:#1565c0}.r{font:18px Arial,Helvetica,sans-serif;fill:#c62828}</style><path class="g" d="M320 88 L135 315 H505 Z"/><path class="a" d="M220 194 L229 201 M420 194 L411 201"/><circle class="p" cx="320" cy="88" r="3"/><text class="t" x="313" y="76">A</text><circle class="p" cx="135" cy="315" r="3"/><text class="t" x="112" y="335">B</text><circle class="p" cx="505" cy="315" r="3"/><text class="t" x="515" y="335">C</text><text class="s" x="320" y="394" text-anchor="middle">AB = AC; ∠ABC = ∠BCA.</text></svg>
