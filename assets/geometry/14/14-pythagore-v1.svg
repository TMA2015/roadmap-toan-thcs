<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Định lý Pythagore</title><desc id="desc">Tam giác ABC vuông tại A, hai cạnh góc vuông AB và AC, cạnh huyền BC; AB bình phương cộng AC bình phương bằng BC bình phương.</desc><style>.g{fill:none;stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:#1565c0;stroke-width:1.9;stroke-linecap:round}.f{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round}.d{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.p{fill:#111827}.t{font:19px Arial,Helvetica,sans-serif;fill:#111827}.s{font:16px Arial,Helvetica,sans-serif;fill:#374151}.b{font:18px Arial,Helvetica,sans-serif;fill:#1565c0}.r{font:18px Arial,Helvetica,sans-serif;fill:#c62828}</style><path class="g" d="M160 300 V110 L480 300 Z M160 279 H181 V300"/><circle class="p" cx="160" cy="300" r="3"/><text class="t" x="136" y="319">A</text><circle class="p" cx="160" cy="110" r="3"/><text class="t" x="136" y="99">B</text><circle class="p" cx="480" cy="300" r="3"/><text class="t" x="489" y="319">C</text><text class="b" x="106" y="214">a</text><text class="b" x="310" y="327">b</text><text class="r" x="337" y="170">c</text><text class="s" x="320" y="394" text-anchor="middle">a² + b² = c² (c là cạnh huyền).</text></svg>
