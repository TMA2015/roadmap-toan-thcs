<svg xmlns="http://www.w3.org/2000/svg" width="560" height="370" viewBox="0 0 560 370">
  <rect width="100%" height="100%" fill="white"/>

  <text x="280" y="34"
        text-anchor="middle"
        font-size="24"
        font-family="Arial, sans-serif"
        font-weight="bold">
    Định lý Pythagore
  </text>

  <polygon points="125,295 125,105 390,295"
           fill="none"
           stroke="#222"
           stroke-width="3"/>

  <rect x="125" y="282" width="13" height="13"
        fill="none"
        stroke="#222"
        stroke-width="2"/>

  <circle cx="125" cy="295" r="4" fill="#222"/>
  <circle cx="125" cy="105" r="4" fill="#222"/>
  <circle cx="390" cy="295" r="4" fill="#222"/>

  <text x="105" y="320" font-size="18" font-family="Arial, sans-serif">A</text>
  <text x="105" y="97" font-size="18" font-family="Arial, sans-serif">B</text>
  <text x="397" y="320" font-size="18" font-family="Arial, sans-serif">C</text>

  <text x="91" y="205"
        font-size="21"
        font-family="Arial, sans-serif"
        fill="#1565c0">3</text>

  <text x="250" y="321"
        font-size="21"
        font-family="Arial, sans-serif"
        fill="#188038">4</text>

  <text x="252" y="193"
        font-size="21"
        font-family="Arial, sans-serif"
        fill="#d32f2f">5</text>

  <text x="400" y="154"
        font-size="19"
        font-family="Arial, sans-serif">
    BC² = AB² + AC²
  </text>

  <text x="400" y="190"
        font-size="18"
        font-family="Arial, sans-serif">
    5² = 3² + 4²
  </text>
</svg>
