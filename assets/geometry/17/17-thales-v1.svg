<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Định lý Thales trong tam giác</title><desc id="desc">Trong tam giác ABC, D thuộc AB, E thuộc AC và DE song song BC; AD trên AB bằng AE trên AC.</desc><style>.g{fill:none;stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:#1565c0;stroke-width:1.9;stroke-linecap:round}.f{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round}.d{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.p{fill:#111827}.t{font:19px Arial,Helvetica,sans-serif;fill:#111827}.s{font:16px Arial,Helvetica,sans-serif;fill:#374151}.b{font:18px Arial,Helvetica,sans-serif;fill:#1565c0}.r{font:18px Arial,Helvetica,sans-serif;fill:#c62828}</style><path class="g" d="M320 75 L100 345 H540 Z"/><path class="f" d="M210 210 H430"/><circle class="p" cx="320" cy="75" r="3"/><text class="t" x="313" y="64">A</text><circle class="p" cx="100" cy="345" r="3"/><text class="t" x="75" y="364">B</text><circle class="p" cx="540" cy="345" r="3"/><text class="t" x="549" y="364">C</text><circle class="p" cx="210" cy="210" r="3"/><text class="t" x="186" y="201">D</text><circle class="p" cx="430" cy="210" r="3"/><text class="t" x="440" y="201">E</text><text class="s" x="320" y="394" text-anchor="middle">DE ∥ BC ⇒ AD/AB = AE/AC.</text></svg>
