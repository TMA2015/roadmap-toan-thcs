<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Hai tam giác đồng dạng</title><desc id="desc">Hai tam giác ABC và DEF đồng dạng với A tương ứng D, B tương ứng E và C tương ứng F; tỉ số cạnh tương ứng là 2 trên 3.</desc><style>.g{fill:none;stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:#1565c0;stroke-width:1.9;stroke-linecap:round}.f{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round}.d{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.p{fill:#111827}.t{font:19px Arial,Helvetica,sans-serif;fill:#111827}.s{font:16px Arial,Helvetica,sans-serif;fill:#374151}.b{font:18px Arial,Helvetica,sans-serif;fill:#1565c0}.r{font:18px Arial,Helvetica,sans-serif;fill:#c62828}</style><path class="g" d="M70 280 L70 160 L230 280 Z"/><path class="f" d="M334 280 L334 100 L574 280 Z"/><circle class="p" cx="70" cy="160" r="3"/><text class="t" x="58" y="149">A</text><circle class="p" cx="70" cy="280" r="3"/><text class="t" x="48" y="300">B</text><circle class="p" cx="230" cy="280" r="3"/><text class="t" x="239" y="300">C</text><circle class="p" cx="334" cy="100" r="3"/><text class="t" x="322" y="89">D</text><circle class="p" cx="334" cy="280" r="3"/><text class="t" x="312" y="300">E</text><circle class="p" cx="574" cy="280" r="3"/><text class="t" x="583" y="300">F</text><text class="s" x="320" y="394" text-anchor="middle">△ABC ∼ △DEF; AB/DE = BC/EF = AC/DF.</text></svg>
