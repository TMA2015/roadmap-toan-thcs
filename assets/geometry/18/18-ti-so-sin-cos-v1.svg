<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Sin và cos của góc nhọn</title><desc id="desc">Tam giác ABC vuông tại A, xét góc alpha tại C. Cạnh đối là AB, cạnh kề AC, cạnh huyền BC; sin alpha bằng AB trên BC và cos alpha bằng AC trên BC.</desc>
<style>.edge{fill:none;stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.red-line{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round}.blue-line{fill:none;stroke:#1565c0;stroke-width:2.2;stroke-linecap:round}.mark{fill:none;stroke:#1f2937;stroke-width:1.7}.point{fill:#111827}.label{fill:#111827;font:19px Arial,Helvetica,sans-serif}.focus{fill:#c62828;font:19px Arial,Helvetica,sans-serif}.blue{fill:#1565c0;font:19px Arial,Helvetica,sans-serif}.note{fill:#374151;font:17px Arial,Helvetica,sans-serif}</style>
<path class="edge" d="M160 295 V105 L465 295 Z"/><path class="red-line" d="M160 105 V295"/><path class="blue-line" d="M160 295 H465"/><path class="mark" d="M160 274 H181 V295"/><path class="mark" d="M425 295 A40 40 0 0 0 431.17 272.53"/>
<circle class="point" cx="160" cy="295" r="3"/><circle class="point" cx="160" cy="105" r="3"/><circle class="point" cx="465" cy="295" r="3"/>
<text class="label" x="137" y="315">A</text><text class="label" x="139" y="91">B</text><text class="label" x="472" y="316">C</text><text class="focus" x="399" y="267">α</text>
<text class="focus" x="82" y="202" text-anchor="middle">đối: AB</text><text class="blue" x="313" y="325" text-anchor="middle">kề: AC</text><text class="label" x="329" y="164" text-anchor="middle">huyền: BC</text>
<text class="note" x="320" y="56" text-anchor="middle">Xét góc α tại C</text>
<text class="focus" x="166" y="382" text-anchor="middle">sin α = AB / BC</text><text class="blue" x="465" y="382" text-anchor="middle">cos α = AC / BC</text></svg>
