<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Hệ thức cạnh góc vuông và hình chiếu</title><desc id="desc">Tam giác ABC vuông tại A, đường cao AH vuông góc BC tại H nằm giữa B và C. AB bình phương bằng BH nhân BC, AC bình phương bằng CH nhân BC.</desc>
<style>.edge{fill:none;stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.red-line{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round}.blue-line{fill:none;stroke:#1565c0;stroke-width:2.2;stroke-linecap:round}.mark{fill:none;stroke:#1f2937;stroke-width:1.7}.point{fill:#111827}.label{fill:#111827;font:19px Arial,Helvetica,sans-serif}.focus{fill:#c62828;font:19px Arial,Helvetica,sans-serif}.blue{fill:#1565c0;font:19px Arial,Helvetica,sans-serif}.note{fill:#374151;font:17px Arial,Helvetica,sans-serif}</style>
<path class="edge" d="M100 294 L244 102 L500 294 Z"/><path class="red-line" d="M100 294 L244 102"/><path class="blue-line" d="M244 102 L500 294"/><path class="edge" d="M244 102 V294"/><path class="mark" d="M235 114 L247 123 L256 111"/><path class="mark" d="M244 276 H262 V294"/>
<circle class="point" cx="100" cy="294" r="3"/><circle class="point" cx="244" cy="102" r="3"/><circle class="point" cx="500" cy="294" r="3"/><circle class="point" cx="244" cy="294" r="3"/>
<text class="label" x="238" y="82">A</text><text class="label" x="79" y="316">B</text><text class="label" x="505" y="316">C</text><text class="label" x="236" y="320">H</text>
<text class="focus" x="147" y="189" text-anchor="middle">AB</text><text class="blue" x="389" y="184" text-anchor="middle">AC</text>
<text class="note" x="164" y="321" text-anchor="middle">BH</text><text class="note" x="372" y="321" text-anchor="middle">CH</text>
<text class="focus" x="175" y="372" text-anchor="middle">AB² = BH × BC</text><text class="blue" x="468" y="372" text-anchor="middle">AC² = CH × BC</text></svg>
