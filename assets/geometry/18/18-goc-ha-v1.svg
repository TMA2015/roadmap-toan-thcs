<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Góc hạ so với phương ngang</title><desc id="desc">Người quan sát O nhìn xuống vật P. Phương ngang từ O sang phải được vẽ nét đứt, tia OP đi xuống. Góc beta giữa phương ngang tại O và tia OP là góc hạ. Đường đứng từ O và đường ngang qua P chỉ hỗ trợ hình dung độ chênh cao.</desc>
<style>.line{fill:none;stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.horizontal{fill:none;stroke:#1565c0;stroke-width:1.8;stroke-dasharray:7 5}.up{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round}.down{fill:none;stroke:#1565c0;stroke-width:2.2;stroke-linecap:round}.arc-up{fill:none;stroke:#c62828;stroke-width:1.8}.arc-down{fill:none;stroke:#1565c0;stroke-width:1.8}.point{fill:#111827}.label{fill:#111827;font:19px Arial,Helvetica,sans-serif}.small{fill:#374151;font:17px Arial,Helvetica,sans-serif}.red{fill:#c62828;font:19px Arial,Helvetica,sans-serif}.blue{fill:#1565c0;font:19px Arial,Helvetica,sans-serif}</style>
<path class="horizontal" d="M110 122 H523"/><path class="down" d="M110 122 L492 304"/>
<path class="line" d="M492 122 V304"/><path class="line" d="M475 122 V139 H492"/>
<path class="arc-down" d="M158 122 A48 48 0 0 1 153.32 142.70"/>
<circle class="point" cx="110" cy="122" r="3.2"/><circle class="point" cx="492" cy="304" r="3.2"/>
<text class="label" x="83" y="115">O</text><text class="label" x="501" y="312">P</text>
<text class="blue" x="181" y="166">β · góc hạ</text>
<text class="small" x="333" y="110">Phương ngang</text>
<text class="small" x="320" y="353" text-anchor="middle">β đo tại O, giữa tia nhìn xuống và phương ngang.</text>
</svg>
