<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Tam giác vuông: đối, kề, huyền</title><desc id="desc">Tam giác ABC vuông tại A. Xét góc alpha tại C: AB là cạnh đối, AC là cạnh kề, BC là cạnh huyền.</desc>
<style>.edge{stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}.aux{stroke:#c62828;stroke-width:2.2;stroke-linecap:round;fill:none}.mark{stroke:#1f2937;stroke-width:1.7;fill:none}.label{fill:#111827;font:19px Arial,Helvetica,sans-serif}.small{fill:#111827;font:17px Arial,Helvetica,sans-serif}.focus{fill:#c62828;font:19px Arial,Helvetica,sans-serif}.blue{fill:#1565c0;font:19px Arial,Helvetica,sans-serif}.note{fill:#374151;font:17px Arial,Helvetica,sans-serif}</style>
<path class="edge" d="M160 295 V105 L465 295 Z"/><path class="mark" d="M160 274 H181 V295"/><path class="mark" d="M423 295 Q425 276 431 273"/><circle cx="160" cy="295" r="3" fill="#111827"/><circle cx="160" cy="105" r="3" fill="#111827"/><circle cx="465" cy="295" r="3" fill="#111827"/>
<text class="label" x="137" y="315">A</text><text class="label" x="139" y="91">B</text><text class="label" x="472" y="316">C</text><text class="focus" x="402" y="265">α</text>
<text class="blue" x="80" y="205" text-anchor="middle">đối</text><text class="blue" x="302" y="326" text-anchor="middle">kề</text><text class="label" x="333" y="164" text-anchor="middle">huyền</text>
<text class="note" x="320" y="373" text-anchor="middle">Xét góc α tại C; cạnh đối và cạnh kề phụ thuộc góc đang xét.</text>
</svg>
