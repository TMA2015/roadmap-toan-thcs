<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Hệ thức đường cao h bình phương bằng pq</title><desc id="desc">Tam giác ABC vuông tại A, AH vuông góc BC, H nằm giữa B và C; AH bình phương bằng BH nhân HC. p là BH, q là HC, h là AH.</desc>
<style>.edge{stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}.aux{stroke:#c62828;stroke-width:2.2;stroke-linecap:round;fill:none}.mark{stroke:#1f2937;stroke-width:1.7;fill:none}.label{fill:#111827;font:19px Arial,Helvetica,sans-serif}.small{fill:#111827;font:17px Arial,Helvetica,sans-serif}.focus{fill:#c62828;font:19px Arial,Helvetica,sans-serif}.blue{fill:#1565c0;font:19px Arial,Helvetica,sans-serif}.note{fill:#374151;font:17px Arial,Helvetica,sans-serif}</style>
<path class="edge" d="M100 300 L244 108 L500 300 Z"/><path class="aux" d="M244 108 V300"/><path class="mark" d="M235 120 L247 129 L256 117"/><path class="mark" d="M244 282 H262 V300"/>
<circle cx="100" cy="300" r="3" fill="#111827"/><circle cx="244" cy="108" r="3" fill="#111827"/><circle cx="500" cy="300" r="3" fill="#111827"/><circle cx="244" cy="300" r="3" fill="#111827"/>
<text class="label" x="238" y="88">A</text><text class="label" x="79" y="322">B</text><text class="label" x="505" y="322">C</text><text class="label" x="235" y="325">H</text><text class="blue" x="165" y="329" text-anchor="middle">p = BH</text><text class="blue" x="374" y="329" text-anchor="middle">q = HC</text><text class="focus" x="262" y="213">h = AH</text><text class="label" x="320" y="381" text-anchor="middle">AH² = BH × HC = p × q</text>
</svg>
