<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 552" width="1040" height="552" role="img" aria-labelledby="title desc">
<title id="title">Góc học tập màu pastel</title><desc id="desc">Căn phòng học dễ thương có cửa sổ nắng, giá sách, bảng nhỏ, bàn và quyển vở mở. Nền nhẹ để nhân vật được nổi bật.</desc>
<defs>
