  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#cfeafa"/><stop offset="1" stop-color="#fff8e1"/></linearGradient>
  <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#f5dbb8"/><stop offset="1" stop-color="#dba98e"/></linearGradient>
  <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f1e9df"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#9c8d9c" flood-opacity=".22"/></filter>
