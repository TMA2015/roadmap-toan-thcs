<title id="title">FIG-G11-B03-04: Đồ thị y = cot x</title><desc id="desc">Hàm cot không xác định tại x=kπ, chu kỳ π, giảm trên mỗi khoảng (kπ,(k+1)π); nét đứt tại 0 và π là tiệm cận đứng.</desc>
