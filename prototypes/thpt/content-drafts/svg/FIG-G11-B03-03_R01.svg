<title id="title">FIG-G11-B03-03: Đồ thị y = tan x</title><desc id="desc">Hàm tan xác định trừ x=π/2+kπ, chu kỳ π, tăng trên từng nhánh; hai đường nét đứt là tiệm cận đứng x=±π/2. Các nhánh không nối qua tiệm cận.</desc>
