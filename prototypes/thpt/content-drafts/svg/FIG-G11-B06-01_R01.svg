<text x="85.0" y="201.0" fill="#1d4ed8" text-anchor="middle" font-size="14">u1=3</text>
<text x="85.0" y="296.0" fill="#334155" text-anchor="middle" font-size="12">1</text>
<circle cx="212.0" cy="180.7" r="6" fill="#2563eb"/>
