<title id="title">FIG-G11-B03-02: Đồ thị y = cos x</title><desc id="desc">Hàm cos liên tục có chu kỳ 2π; đạt 1 ở x=0,2π, đạt -1 ở x=π, cắt trục x tại π/2 và 3π/2.</desc>
