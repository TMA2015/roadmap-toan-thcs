<title id="title">FIG-G11-B03-01: Đồ thị y = sin x</title><desc id="desc">Hàm sin liên tục có chu kỳ 2π, tập giá trị từ -1 đến 1; đi qua 0 tại x=0, π, 2π, đạt 1 ở π/2 và -1 ở 3π/2.</desc>
