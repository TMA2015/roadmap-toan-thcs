<line x1="605" y1="379" x2="741" y2="379" stroke="#008c86" stroke-width="11" stroke-linecap="round"/>
<circle cx="605" cy="379" r="8" fill="#fff" stroke="#008c86" stroke-width="3"/>
<circle cx="741" cy="379" r="8" fill="#fff" stroke="#008c86" stroke-width="3"/>
</g><g><text class="rowlabel" x="30" y="502">A <tspan font-family="DejaVu Sans">∪</tspan> B = [-2, 5]</text><line x1="245" y1="496" x2="969" y2="496" stroke="#94a3b8" stroke-width="2"/>
<path d="M 969 496 l -10 -7 v 14 z" fill="#94a3b8"/><line x1="265" y1="489" x2="265" y2="503" stroke="#64748b" stroke-width="1.8"/><text x="265" y="523" text-anchor="middle" class="tick">-4</text><line x1="333" y1="489" x2="333" y2="503" stroke="#64748b" stroke-width="1.8"/><text x="333" y="523" text-anchor="middle" class="tick">-3</text><line x1="401" y1="489" x2="401" y2="503" stroke="#64748b" stroke-width="1.8"/><text x="401" y="523" text-anchor="middle" class="tick">-2</text><line x1="469" y1="489" x2="469" y2="503" stroke="#64748b" stroke-width="1.8"/><text x="469" y="523" text-anchor="middle" class="tick">-1</text><line x1="537" y1="489" x2="537" y2="503" stroke="#64748b" stroke-width="1.8"/><text x="537" y="523" text-anchor="middle" class="tick">0</text><line x1="605" y1="489" x2="605" y2="503" stroke="#64748b" stroke-width="1.8"/><text x="605" y="523" text-anchor="middle" class="tick">1</text><line x1="673" y1="489" x2="673" y2="503" stroke="#64748b" stroke-width="1.8"/><text x="673" y="523" text-anchor="middle" class="tick">2</text><line x1="741" y1="489" x2="741" y2="503" stroke="#64748b" stroke-width="1.8"/><text x="741" y="523" text-anchor="middle" class="tick">3</text><line x1="809" y1="489" x2="809" y2="503" stroke="#64748b" stroke-width="1.8"/><text x="809" y="523" text-anchor="middle" class="tick">4</text><line x1="877" y1="489" x2="877" y2="503" stroke="#64748b" stroke-width="1.8"/><text x="877" y="523" text-anchor="middle" class="tick">5</text><line x1="945" y1="489" x2="945" y2="503" stroke="#64748b" stroke-width="1.8"/><text x="945" y="523" text-anchor="middle" class="tick">6</text>
