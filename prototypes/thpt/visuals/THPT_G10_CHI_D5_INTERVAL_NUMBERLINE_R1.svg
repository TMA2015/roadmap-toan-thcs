<line x1="605" y1="262" x2="877" y2="262" stroke="#008c86" stroke-width="11" stroke-linecap="round"/>
<circle cx="605" cy="262" r="8" fill="#fff" stroke="#008c86" stroke-width="3"/>
<circle cx="877" cy="262" r="8" fill="#008c86" stroke="#008c86" stroke-width="3"/>
</g><g><text class="rowlabel" x="30" y="385">A ∩ B = (1, 3)</text><line x1="245" y1="379" x2="969" y2="379" stroke="#94a3b8" stroke-width="2"/>
