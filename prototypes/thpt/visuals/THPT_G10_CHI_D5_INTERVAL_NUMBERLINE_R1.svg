<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="790" viewBox="0 0 1150 790" role="img" aria-labelledby="title desc">
<title id="title">Trục số: khoảng, đoạn và hợp giao hiệu của hai tập A và B</title>
<desc id="desc">A là đoạn từ âm hai đóng đến ba mở; B là khoảng từ một mở đến năm đóng. Giao là khoảng một đến ba mở hai đầu. Hợp là đoạn âm hai đến năm đóng hai đầu. Hiệu A trừ B là đoạn âm hai đến một đóng cả hai đầu. Chấm đặc biểu thị đầu mút thuộc tập, chấm rỗng biểu thị đầu mút không thuộc tập.</desc>
<style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#17243c}.title{font-size:28px;font-weight:bold}.caption{font-size:17px;fill:#64748b}.rowlabel{font-size:21px;font-weight:600}.tick{font-size:15px;fill:#475569}</style>
<rect width="1150" height="790" fill="#f8fafc"/><text x="30" y="46" class="title">Khoảng và đoạn trên trục số</text><text x="30" y="79" class="caption">Ví dụ nhất quán: A = [-2,3), B = (1,5]. Chấm đặc: lấy đầu mút; chấm rỗng: không lấy đầu mút.</text>
<g><text class="rowlabel" x="30" y="151">A = [-2, 3)</text><line x1="245" y1="145" x2="969" y2="145" stroke="#94a3b8" stroke-width="2"/>
<path d="M 969 145 l -10 -7 v 14 z" fill="#94a3b8"/><line x1="265" y1="138" x2="265" y2="152" stroke="#64748b" stroke-width="1.8"/><text x="265" y="172" text-anchor="middle" class="tick">-4</text><line x1="333" y1="138" x2="333" y2="152" stroke="#64748b" stroke-width="1.8"/><text x="333" y="172" text-anchor="middle" class="tick">-3</text><line x1="401" y1="138" x2="401" y2="152" stroke="#64748b" stroke-width="1.8"/><text x="401" y="172" text-anchor="middle" class="tick">-2</text><line x1="469" y1="138" x2="469" y2="152" stroke="#64748b" stroke-width="1.8"/><text x="469" y="172" text-anchor="middle" class="tick">-1</text><line x1="537" y1="138" x2="537" y2="152" stroke="#64748b" stroke-width="1.8"/><text x="537" y="172" text-anchor="middle" class="tick">0</text><line x1="605" y1="138" x2="605" y2="152" stroke="#64748b" stroke-width="1.8"/><text x="605" y="172" text-anchor="middle" class="tick">1</text><line x1="673" y1="138" x2="673" y2="152" stroke="#64748b" stroke-width="1.8"/><text x="673" y="172" text-anchor="middle" class="tick">2</text><line x1="741" y1="138" x2="741" y2="152" stroke="#64748b" stroke-width="1.8"/><text x="741" y="172" text-anchor="middle" class="tick">3</text><line x1="809" y1="138" x2="809" y2="152" stroke="#64748b" stroke-width="1.8"/><text x="809" y="172" text-anchor="middle" class="tick">4</text><line x1="877" y1="138" x2="877" y2="152" stroke="#64748b" stroke-width="1.8"/><text x="877" y="172" text-anchor="middle" class="tick">5</text><line x1="945" y1="138" x2="945" y2="152" stroke="#64748b" stroke-width="1.8"/><text x="945" y="172" text-anchor="middle" class="tick">6</text>
<line x1="401" y1="145" x2="741" y2="145" stroke="#008c86" stroke-width="11" stroke-linecap="round"/>
<circle cx="401" cy="145" r="8" fill="#008c86" stroke="#008c86" stroke-width="3"/>
<circle cx="741" cy="145" r="8" fill="#fff" stroke="#008c86" stroke-width="3"/>
</g><g><text class="rowlabel" x="30" y="268">B = (1, 5]</text><line x1="245" y1="262" x2="969" y2="262" stroke="#94a3b8" stroke-width="2"/>
