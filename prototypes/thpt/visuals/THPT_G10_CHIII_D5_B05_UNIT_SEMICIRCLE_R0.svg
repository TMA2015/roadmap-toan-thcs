<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="d5title d5desc"><title id="d5title">Bài 5: nửa đường tròn đơn vị, dấu giá trị lượng giác và góc bù</title><desc id="d5desc">Nửa đường tròn đơn vị tâm O, M ứng với góc 120 độ có cos âm một phần hai, sin căn ba trên hai. Bảng xác định tan cot tại 0, 90, 120 và 180 độ, cùng quan hệ góc bù.</desc><rect width="1500" height="820" fill="#f2f6fa"/>
