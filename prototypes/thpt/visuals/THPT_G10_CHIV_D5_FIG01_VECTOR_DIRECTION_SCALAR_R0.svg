<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="760" version="1.1" viewBox="0 0 1240 760" width="1240" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><title>FIG-CHIV-01 · Vectơ và phép nhân với số</title><desc>Hai mảng minh họa cùng hướng, ngược hướng và vectơ bằng nhau khi chuyển điểm đặt; biểu diễn a, 2a, -1/2 a và 0a là vectơ-không.</desc><rect fill="#f2f6fa" height="760" width="1240" x="0" y="0" /><rect fill="#11857e" height="8" width="1240" x="0" y="0" /><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="38" y="49">FIG-CHIV-01 · Vectơ và phép nhân với số</text><text fill="#667c90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="39" y="83">B07: cùng hướng, ngược hướng, vectơ bằng nhau · B09: k·a và vectơ-không</text><rect fill="#ffffff" height="574" rx="16" ry="16" stroke="#d5e3ee" stroke-width="1.5" width="566" x="34" y="112" /><rect fill="#ffffff" height="574" rx="16" ry="16" stroke="#d5e3ee" stroke-width="1.5" width="566" x="640" y="112" /><text fill="#667c90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="38" y="725">SGK Toán 10 KNTT · Chương IV — Vectơ · D5</text><text fill="#667c90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end" x="1204" y="725">G Learning · Learn · Grow · Go</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="60" y="158">B07 · Cùng hướng và bằng nhau</text><text fill="#667c90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="60" y="186">Dịch chuyển điểm đặt không đổi vectơ</text><line stroke="#11857e" stroke-linecap="round" stroke-width="5" x1="110" x2="317.0" y1="250" y2="250.0" /><polygon fill="#11857e" points="330,250 317.0,242.46 317.0,257.54" /><circle cx="110" cy="250" fill="#17344c" r="4" /><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="99" y="275">A</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="328" y="275">B</text><text fill="#11857e" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="210" y="236">AB</text><line stroke="#11857e" stroke-linecap="round" stroke-width="5" x1="150" x2="357.0" y1="355" y2="355.0" /><polygon fill="#11857e" points="370,355 357.0,347.46 357.0,362.54" /><circle cx="150" cy="355" fill="#17344c" r="4" /><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="141" y="381">C</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="369" y="381">D</text><text fill="#11857e" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="250" y="340">CD</text><line stroke="#d87832" stroke-linecap="round" stroke-width="5" x1="370" x2="163.0" y1="463" y2="463.0" /><polygon fill="#d87832" points="150,463 163.0,470.54 163.0,455.46" /><circle cx="370" cy="463" fill="#17344c" r="4" /><text fill="#d87832" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="245" y="447">−AB</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" x="64" y="538">AB = CD  (cùng hướng, cùng độ dài)</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="64" y="568">−AB: ngược hướng, độ dài không đổi</text><text fill="#667c90" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="64" y="619">Vectơ bằng nhau không cần chung điểm đặt.</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="666" y="158">B09 · Độ dài và hướng của k·a</text><text fill="#667c90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="666" y="186">Giả sử |a| = 2 đơn vị, a hướng Đông</text><line stroke="#11857e" stroke-linecap="round" stroke-width="5" x1="805" x2="962.0" y1="259" y2="259.0" /><polygon fill="#11857e" points="975,259 962.0,251.46 962.0,266.54" /><text fill="#11857e" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="885" y="244">a  (2)</text><line stroke="#3486ad" stroke-linecap="round" stroke-width="5" x1="758" x2="1085.0" y1="363" y2="363.0" /><polygon fill="#3486ad" points="1098,363 1085.0,355.46 1085.0,370.54" /><text fill="#3486ad" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="905" y="347">2a  (4)</text><line stroke="#d87832" stroke-linecap="round" stroke-width="5" x1="947" x2="875.0" y1="465" y2="465.0" /><polygon fill="#d87832" points="862,465 875.0,472.54 875.0,457.46" /><text fill="#d87832" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="863" y="444">−½a  (1)</text><circle cx="906" cy="558" fill="#8767bb" r="6" /><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="667" y="608">0a = 0⃗  (độ dài bằng 0)</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="666" y="539">|k·a| = |k| · |a|</text><text fill="#667c90" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="666" y="639">k &gt; 0: cùng hướng    k &lt; 0: ngược hướng</text></svg>