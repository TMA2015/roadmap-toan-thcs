<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tt dd" width="1370" height="765" viewBox="0 0 1370 765">
<title id="tt">Bài 4: Miền nghiệm của hệ bất phương trình — tam giác, tứ giác và giá trị lớn nhất</title>
<desc id="dd">Đồ thị trái miền tam giác kín O(0,0), A(8,0), B(0,4) theo x lớn hơn hoặc bằng 0, y lớn hơn hoặc bằng 0, x cộng 2y nhỏ hơn hoặc bằng 8. Đồ thị phải miền tứ giác kín O(0,0), A(3,0), B(2,2), C(0,4) theo x, y không âm, 2x cộng y không vượt 6, x cộng y không vượt 4; hàm G=x+3y đạt cực đại bằng 12 tại C(0,4).</desc>
<rect width="1370" height="765" fill="#f1f5f8"/>
<text x="43" y="54" text-anchor="start" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="30" font-weight="760" fill="#173456" >BÀI 4 · MIỀN NGHIỆM HỆ VÀ CỰC TRỊ</text>
<text x="43" y="86" text-anchor="start" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-size="18" font-weight="420" fill="#52677c" >Miền nghiệm = giao các nửa mặt phẳng. Đa giác kín: xét giá trị hàm tuyến tính tại các đỉnh.</text>
