<text x="255" y="667" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#d97736" >A</text>
<text x="83" y="776" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#107c75" >cos A = 3/5   ·   sin A = 4/5</text>
<text x="83" y="806" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#107c75" >a² = 41   ·   S = 16 (đv²)</text>
