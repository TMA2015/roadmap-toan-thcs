<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="d5title d5desc"><title id="d5title">Bài 6: Định lý côsin, diện tích tam giác, công thức Hê-rông và các bán kính</title><desc id="d5desc">Tam giác A B C với A=(0,0), B=(8,0), C=(3,4), b=5,c=8,a=căn 41, diện tích 16. Tam giác cân cạnh 5 5 6 có p=8,S=12, r=3/2,R=25/8, vẽ đường tròn nội tiếp và ngoại tiếp.</desc><rect width="1500" height="900" fill="#f2f6fa"/>
<text x="52" y="66" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#17324b" >BÀI 6  •  HỆ THỨC LƯỢNG TRONG TAM GIÁC</text>
<text x="52" y="100" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#60788d" >Định lý côsin  ·  diện tích  ·  Hê-rông  ·  bán kính nội tiếp, ngoại tiếp</text>
<rect x="47" y="132" width="690" height="711" rx="18" fill="#ffffff" stroke="#d7e2eb" stroke-width="1.5"/>
<rect x="757" y="132" width="694" height="711" rx="18" fill="#ffffff" stroke="#d7e2eb" stroke-width="1.5"/>
<text x="75" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#17324b" >01   CÔSIN &amp; DIỆN TÍCH</text>
<text x="785" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#17324b" >02   HÊ-RÔNG &amp; CÁC BÁN KÍNH</text>
<text x="83" y="231" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#107c75" >a² = b² + c² − 2bc · cos A</text>
<text x="83" y="266" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#107c75" >S = 1/2 · bc · sin A</text>
<text x="83" y="304" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#107c75" >a/sin A = b/sin B = c/sin C = 2R</text>
<text x="790" y="232" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#107c75" >p = (a+b+c)/2   ·   S = √[p(p−a)(p−b)(p−c)]</text>
<text x="790" y="266" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#107c75" >r = S/p   ·   R = abc/(4S)</text>
