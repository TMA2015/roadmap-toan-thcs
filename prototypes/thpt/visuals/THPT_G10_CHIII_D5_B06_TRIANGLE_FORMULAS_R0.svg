<circle cx="1111.00" cy="611.12" r="4.5" fill="#8471b1" stroke="#ffffff" stroke-width="2"/>
<text x="1127" y="563.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#d97736" >I</text>
<text x="1096" y="637.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#8471b1" >O</text>
<text x="1006" y="702" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#17324b" >a = 6</text>
<text x="945" y="550" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#17324b" >c = 5</text>
<text x="1274" y="550" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#17324b" >b = 5</text>
<text x="790" y="314" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#107c75" >p = 8   ·   S = √[8·2·3·3] = 12</text>
<text x="790" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#107c75" >r = 3/2   ·   R = 25/8</text>
