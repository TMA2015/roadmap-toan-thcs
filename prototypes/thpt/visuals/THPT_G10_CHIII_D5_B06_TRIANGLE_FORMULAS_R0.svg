<text x="199.0" y="563.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#17324b" >b = 5</text>
<text x="509.0" y="559.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#17324b" >a = √41</text>
<text x="362" y="570" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#d97736" >h = 4</text>
