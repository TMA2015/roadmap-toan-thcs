<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="760" version="1.1" viewBox="0 0 1240 760" width="1240" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><title>FIG-CHIV-03 · Vectơ trong mặt phẳng Oxy</title><desc>Trong hệ tọa độ Oxy, A=(-2,1), B=(3,4), AB=(5,3), độ dài căn 34, trung điểm I=(1/2,5/2). Vectơ đơn vị i và j minh họa.</desc><rect fill="#f2f6fa" height="760" width="1240" x="0" y="0" /><rect fill="#11857e" height="8" width="1240" x="0" y="0" /><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="38" y="49">FIG-CHIV-03 · Vectơ trong mặt phẳng Oxy</text><text fill="#667c90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="39" y="83">B10: tọa độ điểm, tọa độ vectơ AB, độ dài và trung điểm</text><rect fill="#ffffff" height="574" rx="16" ry="16" stroke="#d5e3ee" stroke-width="1.5" width="566" x="34" y="112" /><rect fill="#ffffff" height="574" rx="16" ry="16" stroke="#d5e3ee" stroke-width="1.5" width="566" x="640" y="112" /><text fill="#667c90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="38" y="725">SGK Toán 10 KNTT · Chương IV — Vectơ · D5</text><text fill="#667c90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end" x="1204" y="725">G Learning · Learn · Grow · Go</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="60" y="155">B10 · Từ hai điểm đến tọa độ vectơ</text><line stroke="#e2ebf2" stroke-linecap="round" stroke-width="1" x1="98" x2="98" y1="230" y2="646" /><line stroke="#e2ebf2" stroke-linecap="round" stroke-width="1" x1="150" x2="150" y1="230" y2="646" /><line stroke="#e2ebf2" stroke-linecap="round" stroke-width="1" x1="202" x2="202" y1="230" y2="646" /><line stroke="#e2ebf2" stroke-li