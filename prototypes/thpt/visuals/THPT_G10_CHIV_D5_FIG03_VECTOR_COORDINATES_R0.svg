ily="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="318" y="216">y</text><text fill="#667c90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="285" y="459">O</text><line stroke="#11857e" stroke-linecap="round" stroke-width="5" x1="202" x2="450.8525919657369" y1="386" y2="236.68844482055783" /><polygon fill="#11857e" points="462,230 446.97329396981337,230.22294816068526 454.73188996166044,243.1539414804304" /><circle cx="202" cy="386" fill="#11857e" r="5" /><circle cx="462" cy="230" fill="#11857e" r="5" /><circle cx="332.0" cy="308.0" fill="#d87832" r="5" /><line stroke="#d87832" stroke-dasharray="6,5" stroke-linecap="round" stroke-width="2" x1="202" x2="462" y1="386" y2="386" /><line stroke="#d87832" stroke-dasharray="6,5" stroke-linecap="round" stroke-width="2" x1="462" x2="462" y1="386" y2="230" /><text fill="#11857e" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="191" y="413">A(-2; 1)</text><text fill="#11857e" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="458" y="217">B(3; 4)</text><text fill="#d87832" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="341.0" y="298.0">I</text><text fill="#d87832" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="356" y="402">Δx = 5</text><text fill="#d87832" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="474" y="331">Δy = 3</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" x="58" y="618">AB = (3−(−2); 4−1) = (5; 3)</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="58" y="652">|AB| = √(5² + 3²) = √34</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="666" y="155">B10 · Công thức nền tảng</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="672" y="223">i = (1; 0)     j = (0; 1)</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="672" y="278">a = x·i + y·j ⇔ a = (x; y)</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="672" y="333">AB = (xB − xA; yB − yA)</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="672" y="388">|a| = √(a₁² + a₂²)</text><line stroke="#e2ebf2" stroke-linecap="round" stroke-width="2" x1="666" x2="1177" y1="433" y2="433" /><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="666" y="476">Trung điểm I của AB</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="671" y="533">I = ((−2+3)/2; (1+4)/2)</text><text fill="#d87832" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="671" y="577">I = (1/2; 5/2)</text><text fill="#667c90" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="671" y="640">Điểm A(−2; 1) khác vectơ a = (−2; 1).</text></svg>