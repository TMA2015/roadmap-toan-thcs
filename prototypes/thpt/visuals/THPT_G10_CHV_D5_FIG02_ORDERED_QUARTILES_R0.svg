<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">Trung vị và tứ phân vị</title><desc id="svgDesc">n lẻ: bỏ trung vị Q2 trước khi xác định Q1 và Q3; dữ liệu 1, 3, 4, 6, 8, 10, 12.</desc><rect x="0" y="0" width="1240" height="760" rx="0" fill="#f6f9fc" stroke="#f6f9fc" stroke-width="0"/><rect x="36" y="30" width="1168" height="107" rx="20" fill="#ffffff" stroke="#d9e1eb" stroke-width="1"/><text x="65" y="76" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#183153">Trung vị và tứ phân vị</text><text x="65" y="112" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#586a7f">n lẻ: bỏ trung vị Q2 trước khi xác định Q1 và Q3; dữ liệu 1, 3, 4, 6, 8, 10, 12.</text><rect x="1010" y="54" width="135" height="32" rx="10" fill="#087e83" stroke="#087e83" stroke-width="0"/><text x="1077" y="77" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">BÀI 13</text><rect x="36" y="159" width="1168" height="540" rx="18" fill="#ffffff" stroke="#d9e1eb" stroke-width="2"/><text x="76" y="209" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#183153">Dãy đã sắp xếp (n = 7)</text><rect x="114" y="265" width="126" height="105" rx="18" fill="#ffffff" stroke="#d9e1eb" stroke-width="1"/><text x="177" y="332" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" fill="#182a42">1</text><text x="177" y="394" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#d9e1eb"></text><rect x="267" y="265" width="126" height="105" rx="18" fill="#087e83" stroke="#087e83" stroke-width="3"/><text x="330" y="332" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" fill="#ffffff">3</text><text x="330" y="394" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#087e83">Q₁</text><rect x="420" y="265" width="126" height="105" rx="18" fill="#ffffff" stroke="#d9e1eb" stroke-width="1"/><text x="483" y="332" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" fill="#182a42">4</text><text x="483" y="394" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#d9e1eb"></text><rect x="573" y="265" width="126" height="105" rx="18" fill="#6846a9" stroke="#6846a9" stroke-width="3"/><text x="636" y="332" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" fill="#ffffff">6</text><text x="636" y="394" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#6846a9">Q₂</text><rect x="726" y="265" width="126" height="105" rx="18" fill="#ffffff" stroke="#d9e1eb" stroke-width="1"/><text x="789" y="332" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" fill="#182a42">8</text><text x="789" y="394" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#d9e1eb"></text><rect x="879" y="265" width="126" height="105" rx="18" fill="#087e83" stroke="#087e83" stroke-width="3"/><text x="942" y="332" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" fill="#ffffff">10</text><text x="942" y="394" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#087e83">Q₃</text><rect x="1032" y="265" width="126" height="105" rx="18" fill="#ffffff" stroke="#d9e1eb" stroke-width="1"/><text x="1095" y="332" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" fill="#182a42">12</text><text x="1095" y="394" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#d9e1eb"></text><text x="80" y="459" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#087e83">Nửa dưới: 1, 3, 4</text><text x="470" y="459" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#6846a9">Q₂ = 6 (loại khi n lẻ)</text><text x="840" y="459" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#087e83">Nửa trên: 8, 10, 12</text><line x1="140" y1="488" x2="400" y2="488" stroke="#087e83" stroke-width="3" stroke-linecap="round"/><line x1="520" y1="488" x2="765" y2="488" stroke="#6846a9" stroke-width="3" stroke-linecap="round"/><line x1="858" y1="488" x2="1120" y2="488" stroke="#087e83" stroke-width="3" stroke-linecap="round"/><rect x="78" y="520" width="1084" height="117" rx="15" fill="#edf4fd" stroke="#c7d9f0" stroke-width="1"/><text x="111" y="560" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#183153">Q₁ = 3     Q₂ = 6     Q₃ = 10     Khoảng tứ phân vị = 7</text><text x="111" y="602" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#586a7f">Số trung bình = 44/7 ≈ 6,29; trung vị = 6.</text></svg>
