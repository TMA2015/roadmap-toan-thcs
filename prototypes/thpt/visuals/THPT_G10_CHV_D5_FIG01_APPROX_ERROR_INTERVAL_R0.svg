aVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#586a7f">12,8</text><line x1="1118.0" y1="404" x2="1118.0" y2="424" stroke="#d9e1eb" stroke-width="2" stroke-linecap="round"/><rect x="327.6" y="365" width="592.8000000000001" height="33" rx="10" fill="#d7f1ee" stroke="#d7f1ee" stroke-width="0"/><line x1="327.6" y1="379" x2="920.4000000000001" y2="379" stroke="#087e83" stroke-width="6" stroke-linecap="round"/><line x1="327.6" y1="350" x2="327.6" y2="423" stroke="#087e83" stroke-width="4" stroke-linecap="round"/><line x1="920.4000000000001" y1="350" x2="920.4000000000001" y2="423" stroke="#087e83" stroke-width="4" stroke-linecap="round"/><circle cx="624.0" cy="414" r="12" fill="#3266c9" stroke="#ffffff" stroke-width="2"/><text x="327.6" y="332" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#087e83">a − d = 12,1</text><text x="920.4000000000001" y="332" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#087e83">a + d = 12,7</text><text x="624.0" y="399" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#3266c9">a = 12,4</text><rect x="78" y="510" width="1084" height="116" rx="15" fill="#fffaeb" stroke="#e4d3a8" stroke-width="1"/><text x="108" y="547" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#183153">d là cận trên sai số tuyệt đối, không nhất thiết là sai số thực.</text><text x="108" y="584" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#182a42">Sai số tương đối tối đa: d/|a| = 0,3/12,4 ≈ 2,42% (a ≠ 0).</text></svg>
