<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="760" version="1.1" viewBox="0 0 1240 760" width="1240" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><title>FIG-CHIV-04 · Tích vô hướng và góc</title><desc>Ví dụ vectơ a=(4,0), b=(-2,2) tạo góc 135 độ nên tích vô hướng -8. Vectơ u=(2,1), v=(-1,2) vuông góc vì tích 0. Công của lực F=(3,4)N s=(5,0)m là 15 J.</desc><rect fill="#f2f6fa" height="760" width="1240" x="0" y="0" /><rect fill="#11857e" height="8" width="1240" x="0" y="0" /><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="38" y="49">FIG-CHIV-04 · Tích vô hướng và góc</text><text fill="#667c90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="39" y="83">B11: dấu tích vô hướng, góc giữa vectơ, vuông góc và công của lực</text><rect fill="#ffffff" height="574" rx="16" ry="16" stroke="#d5e3ee" stroke-width="1.5" width="566" x="34" y="112" /><rect fill="#ffffff" height="574" rx="16" ry="16" stroke="#d5e3ee" stroke-width="1.5" width="566" x="640" y="112" /><text fill="#667c90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="38" y="725">SGK Toán 10 KNTT · Chương IV — Vectơ · D5</text><text fill="#667c90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end" x="1204" y="725">G Learning · Learn · Grow · Go</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="60" y="157">B11 · Góc tù ⇒ tích vô hướng âm</text><line stroke="#e2ebf2" stroke-linecap="round" stroke-width="2" x1="80" x2="552" y1="440" y2="440" /><line stroke="#e2ebf2" stroke-linecap="round" stroke-width="2" x1="310" x2="310" y1="570" y2="213" /><line stroke="#11857e" stroke-linecap="round" stroke-width="5" x1="310" x2="504.0" y1="440" y2="440.0" /><polygon fill="#11857e" points="518,440 504.0,431.88 504.0,448.12" /><line stroke="#d87832" stroke-linecap="round" stroke-width="5" x1="310" x2="199.89949493661166" y1="440" y2="329.8994949366117" /><polygon fill="#d87832" points="190,320 194.1577878733769,335.64120199984643 205.64120199984643,324.15778787337695" /><circle cx="310" cy="440" fill="#17344c" r="4" /><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="290" y="462">O</text><text fill="#11857e" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="404" y="419">a = (4;0)</text><text fill="#d87832" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="90" y="304">b = (−2;2)</text><path d="M 373.0,440.0 A 63,63 0 0 0 265.5,395.5" fill="none" stroke="#8767bb" stroke-width="2.4" /><text fill="#8767bb" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="322" y="372">135°</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="59" y="543">a · b = 4(−2) + 0(2) = −8</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="59" y="583">cos(a,b) = −1/√2  ⇒  góc = 135°</text><text fill="#667c90" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="59" y="637">Tích vô hướng là số thực, không phải vectơ.</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="668" y="157">B11 · Trực giao và công của lực</text><line stroke="#11857e" stroke-linecap="round" stroke-width="4.5" x1="903" x2="1014.266873708001" y1="399" y2="343.3665631459995" /><polygon fill="#11857e" points="1025,338 1011.1542670833212,337.1413498966401 1017.3794803326807,349.5917763953589" /><line stroke="#3486ad" stroke-linecap="round" stroke-width="4.5" x1="903" x2="848.2958358656297" y1="399" y2="287.7681995934469" /><polygon fill="#3486ad" points="843,277 842.0502801014304,290.83978439551214 854.5413916298289,284.6966147913817" /><circle cx="903" cy="399" fill="#17344c" r="4" /><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="914" y="416">O</text><text fill="#11857e" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="1028" y="340">u = (2;1)</text><text fill="#3486ad" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="712" y="268">v = (−1;2)</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="669" y="467">u · v = 2(−1) + 1(2) = 0</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="669" y="504">u ≠ 0⃗, v ≠ 0⃗  ⇒  u ⟂ v</text><line stroke="#e2ebf2" stroke-linecap="round" stroke-width="2" x1="669" x2="1174" y1="528" y2="528" /><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="669" y="571">Công của lực: W = F · s</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="669" y="609">F = (3;4) N,    s = (5;0) m</text><text fill="#8767bb" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="669" y="648">W = 3×5 + 4×0 = 15 J</text></svg>