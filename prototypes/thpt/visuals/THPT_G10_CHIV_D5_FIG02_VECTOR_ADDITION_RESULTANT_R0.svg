<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="760" version="1.1" viewBox="0 0 1240 760" width="1240" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><title>FIG-CHIV-02 · Cộng vectơ và hợp lực</title><desc>Hình bình hành ABCD với AB=4, AD=3 và AC=5: tổng AB cộng BC hay AB cộng AD bằng AC. Biểu diễn vận tốc Đông 4, Bắc 3, tổng hợp 5.</desc><rect fill="#f2f6fa" height="760" width="1240" x="0" y="0" /><rect fill="#11857e" height="8" width="1240" x="0" y="0" /><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" x="38" y="49">FIG-CHIV-02 · Cộng vectơ và hợp lực</text><text fill="#667c90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="39" y="83">B08: quy tắc ba điểm, hình bình hành và độ lớn tổng hai vectơ vuông góc</text><rect fill="#ffffff" height="574" rx="16" ry="16" stroke="#d5e3ee" stroke-width="1.5" width="566" x="34" y="112" /><rect fill="#ffffff" height="574" rx="16" ry="16" stroke="#d5e3ee" stroke-width="1.5" width="566" x="640" y="112" /><text fill="#667c90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="38" y="725">SGK Toán 10 KNTT · Chương IV — Vectơ · D5</text><text fill="#667c90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end" x="1204" y="725">G Learning · Learn · Grow · Go</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="58" y="155">B08 · Quy tắc 3 điểm / hình bình hành</text><line stroke="#e2ebf2" stroke-linecap="round" stroke-width="2" x1="164" x2="414" y1="493" y2="493" /><line stroke="#e2ebf2" stroke-linecap="round" stroke-width="2" x1="414" x2="414" y1="493" y2="303" /><line stroke="#e2ebf2" stroke-linecap="round" stroke-width="2" x1="414" x2="164" y1="303" y2="303" /><line stroke="#e2ebf2" stroke-linecap="round" stroke-width="2" x1="164" x2="164" y1="303" y2="493" /><line stroke="#11857e" stroke-linecap="round" stroke-width="5" x1="164" x2="401.0" y1="493" y2="493.0" /><polygon fill="#11857e" points="414,493 401.0,485.46 401.0,500.54" /><line stroke="#d87832" stroke-linecap="round" stroke-width="5" x1="414" x2="414.0" y1="493" y2="316.0" /><polygon fill="#d87832" points="414,303 406.46,316.0 421.54,316.0" /><line stroke="#3486ad" stroke-linecap="round" stroke-width="4" x1="164" x2="164.0" y1="493" y2="315.0" /><polygon fill="#3486ad" points="164,303 157.04,315.0 170.96,315.0" /><line stroke="#8767bb" stroke-linecap="round" stroke-width="5" x1="164" x2="402.85372928227656" y1="493" y2="311.4711657454698" /><polygon fill="#8767bb" points="414,303 397.94045314990404,305.0063287291902 407.7670054146491,317.9360027617494" /><circle cx="164" cy="493" fill="#17344c" r="4" /><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="145" y="513">A</text><circle cx="414" cy="493" fill="#17344c" r="4" /><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="421" y="516">B</text><circle cx="164" cy="303" fill="#17344c" r="4" /><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="142" y="291">D</text><circle cx="414" cy="303" fill="#17344c" r="4" /><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="423" y="294">C</text><text fill="#11857e" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="240" y="519">AB = 4</text><text fill="#d87832" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="432" y="410">BC = 3</text><text fill="#8767bb" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="259" y="376">AC = 5</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="58" y="571">AB + BC = AC</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="58" y="607">AB + AD = AC</text><text fill="#667c90" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="58" y="647">(độ dài theo đơn vị tùy chọn)</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" x="667" y="155">B08 · Vận tốc tổng hợp vuông góc</text><line stroke="#11857e" stroke-linecap="round" stroke-width="5" x1="762" x2="1025.0" y1="486" y2="486.0" /><polygon fill="#11857e" points="1038,486 1025.0,478.46 1025.0,493.54" /><line stroke="#d87832" stroke-linecap="round" stroke-width="5" x1="1038" x2="1038.0" y1="486" y2="292.0" /><polygon fill="#d87832" points="1038,279 1030.46,292.0 1045.54,292.0" /><line stroke="#8767bb" stroke-linecap="round" stroke-width="5" x1="762" x2="1027.6" y1="486" y2="286.8" /><polygon fill="#8767bb" points="1038,279 1023.0759999999999,280.76800000000003 1032.1239999999998,292.832" /><circle cx="762" cy="486" fill="#17344c" r="4" /><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="743" y="507">O</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="1046" y="504">P</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="1050" y="267">Q</text><text fill="#11857e" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="850" y="515">4 m/s · Đông</text><text fill="#d87832" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="1050" y="374">3 m/s · Bắc</text><text fill="#8767bb" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start" x="876" y="365">5 m/s</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" x="668" y="572">|v| = √(4² + 3²) = 5 m/s</text><text fill="#17344c" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="668" y="606">Góc với Đông: arctan(3/4) ≈ 36,87°</text><text fill="#667c90" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="668" y="647">Chú ý: vectơ tổng ≠ 4 + 3 (m/s).</text></svg>