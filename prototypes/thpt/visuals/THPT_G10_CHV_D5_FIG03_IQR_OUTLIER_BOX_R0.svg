<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">Tứ phân vị, hàng rào và ngoại lệ</title><desc id="svgDesc">Minh họa dạng hộp: Q1 = 3,5; trung vị 7; Q3 = 10,5; hàng rào -7 và 21; 23 ngoại lệ.</desc><rect x="0" y="0" width="1240" height="760" rx="0" fill="#f6f9fc" stroke="#f6f9fc" stroke-width="0"/><rect x="36" y="30" width="1168" height="107" rx="20" fill="#ffffff" stroke="#d9e1eb" stroke-width="1"/><text x="65" y="76" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#183153">Tứ phân vị, hàng rào và ngoại lệ</text><text x="65" y="112" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#586a7f">Minh họa dạng hộp: Q1 = 3,5; trung vị 7; Q3 = 10,5; hàng rào -7 và 21; 23 ngoại lệ.</text><rect x="1010" y="54" width="135" height="32" rx="10" fill="#087e83" stroke="#087e83" stroke-width="0"/><text x="1077" y="77" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">BÀI 14</text><rect x="36" y="159" width="1168" height="540" rx="18" fill="#ffffff" stroke="#d9e1eb" stroke-width="2"/><text x="78" y="210" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#183153">Mẫu: 2, 3, 4, 5, 7, 8, 9, 12, 23</text><text x="78" y="246" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#586a7f">Q₁ = 3,5    Q₂ = 7    Q₃ = 10,5    IQR = 7</text><line x1="118" y1="402" x2="1124" y2="402" stroke="#183153" stroke-width="3" stroke-linecap="round"/><line x1="118.0" y1="391" x2="118.0" y2="413" stroke="#183153" stroke-width="2" stroke-linecap="round"/><text x="118.0" y="446" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#586a7f">-8</text><line x1="243.75" y1="391" x2="243.75" y2="413" stroke="#183153" stroke-width="2" stroke-linecap="round"/><text x="243.75" y="446" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#586a7f">-4</text><line x1="369.5" y1="391" x2="369.5" y2="413" stroke="#183153" stroke-width="2" stroke-linecap="round"/><text x="369.5" y="446" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#586a7f">0</text><line x1="495.25" y1="391" x2="495.25" y2="413" stroke="#183153" stroke-width="2" stroke-linecap="round"/><text x="495.25" y="446" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#586a7f">4</text><line x1="621.0" y1="391" x2="621.0" y2="413" stroke="#183153" stroke-width="2" stroke-linecap="round"/><text x="621.0" y="446" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#586a7f">8</text><line x1="746.75" y1="391" x2="746.75" y2="413" stroke="#183153" stroke-width="2" stroke-linecap="round"/><text x="746.75" y="446" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#586a7f">12</text><line x1="872.5" y1="391" x2="872.5" y2="413" stroke="#183153" stroke-width="2" stroke-linecap="round"/><text x="872.5" y="446" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#586a7f">16</text><line x1="998.25" y1="391" x2="998.25" y2="413" stroke="#183153" stroke-width="2" stroke-linecap="round"/><text x="998.25" y="446" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#586a7f">20</text><line x1="1124.0" y1="391" x2="1124.0" y2="413" stroke="#183153" stroke-width="2" stroke-linecap="round"/><text x="1124.0" y="446" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#586a7f">24</text><line x1="149.4375" y1="285" x2="149.4375" y2="409" stroke="#b5621d" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/><text x="149.4375" y="280" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#b5621d">L = −7</text><line x1="1029.6875" y1="285" x2="1029.6875" y2="409" stroke="#b5621d" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/><text x="1029.6875" y="280" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#b5621d">U = 21</text><line x1="432.375" y1="344" x2="746.75" y2="344" stroke="#087e83" stroke-width="4" stroke-linecap="round"/><line x1="432.375" y1="327" x2="432.375" y2="362" stroke="#087e83" stroke-width="3" stroke-linecap="round"/><line x1="746.75" y1="327" x2="746.75" y2="362" stroke="#087e83" stroke-width="3" stroke-linecap="round"/><rect x="479.53125" y="302" width="220.0625" height="85" rx="0" fill="#cfede6" stroke="#087e83" stroke-width="3"/><line x1="589.5625" y1="302" x2="589.5625" y2="387" stroke="#6846a9" stroke-width="4" stroke-linecap="round"/><circle cx="1092.5625" cy="344" r="11" fill="#b9434c" stroke="#ffffff" stroke-width="2"/><text x="479.53125" y="286" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#087e83">Q₁</text><text x="589.5625" y="286" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#6846a9">Q₂</text><text x="699.59375" y="286" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#087e83">Q₃</text><text x="1092.5625" y="312" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#b9434c">23 ngoại lệ</text><rect x="78" y="535" width="1084" height="112" rx="15" fill="#fffaeb" stroke="#e4d3a8" stroke-width="1"/><text x="108" y="576" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#183153">Ngưỡng dưới: 3,5 − 1,5 × 7 = −7; ngưỡng trên: 10,5 + 1,5 × 7 = 21.</text><text x="108" y="614" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#182a42">Chỉ 23 vượt hàng rào trên; giá trị bằng đúng hàng rào không là ngoại lệ.</text></svg>
