<text x="777" y="258" font-size="25" text-anchor="middle" font-family="Arial,sans-serif" font-weight="400" fill="#0f172a">(N,5)</text>
<rect x="853" y="185" width="139" height="128" rx="13" fill="#ecfdf5" stroke="#047857" stroke-width="4"/>
