<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img" aria-labelledby="title desc">
<title id="title">Bài 21: Tiếp tuyến đường tròn</title><desc id="desc">Đường tròn tâm I(1,-1), bán kính 2; đường thẳng x=3 tiếp xúc tại H(3,-1). Khoảng cách từ tâm tới tiếp tuyến bằng bán kính.</desc>
<rect width="680" height="450" rx="14" fill="#fff"/>

<line x1="70" y1="200" x2="605" y2="200" stroke="#475569" stroke-width="2"/><line x1="270" y1="408" x2="270" y2="32" stroke="#475569" stroke-width="2"/>
<path d="M605 200 l-10 -6 v12 z M270 32 l-6 10 h12 z" fill="#475569"/>
<circle cx="330" cy="260" r="120" fill="#dbeafe" fill-opacity=".32" stroke="#2563eb" stroke-width="4"/>
<line x1="450" y1="48" x2="450" y2="400" stroke="#d97706" stroke-width="4"/>
<line x1="330" y1="260" x2="450" y2="260" stroke="#0f766e" stroke-width="3"/>
<circle cx="330" cy="260" r="5" fill="#0f172a"/><circle cx="450" cy="260" r="6" fill="#0f172a"/>
<path d="M438 260 v-12 h12" fill="none" stroke="#0f766e" stroke-width="2"/>
<text x="293" y="287" font-size="18" fill="#0f172a">I(1; -1)</text><text x="459" y="276" font-size="18" fill="#0f172a">H(3; -1)</text>
<text x="360" y="248" font-size="17" fill="#0f766e">R = 2</text>
<text x="461" y="71" font-size="18" fill="#d97706">d: x = 3</text>
<text x="103" y="92" font-size="18" fill="#2563eb">C: (x-1)² + (y+1)² = 4</text>
<text x="612" y="207" font-size="17" fill="#334155">x</text><text x="261" y="25" font-size="17" fill="#334155">y</text>
<text x="250" y="220" font-size="16" fill="#334155">O</text>
</svg>
