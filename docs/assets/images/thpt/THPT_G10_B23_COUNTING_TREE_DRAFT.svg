<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Bài 23: Cây quy tắc nhân</title><desc id="desc">Ba lựa chọn áo A1 A2 A3; với mỗi áo có hai lựa chọn quần B1 B2; tổng cộng 3 nhân 2 bằng 6 bộ khác nhau.</desc>
<rect width="960" height="540" rx="14" fill="#fff"/>

<text x="38" y="39" font-size="24" fill="#0f172a" font-weight="bold">3 áo × 2 quần = 6 bộ</text>
<line x1="110" y1="270" x2="355" y2="100" stroke="#64748b" stroke-width="2.5"/><line x1="355" y1="100" x2="690" y2="60" stroke="#0f766e" stroke-width="2.5"/><line x1="355" y1="100" x2="690" y2="140" stroke="#0f766e" stroke-width="2.5"/><line x1="110" y1="270" x2="355" y2="270" stroke="#64748b" stroke-width="2.5"/><line x1="355" y1="270" x2="690" y2="230" stroke="#0f766e" stroke-width="2.5"/><line x1="355" y1="270" x2="690" y2="310" stroke="#0f766e" stroke-width="2.5"/><line x1="110" y1="270" x2="355" y2="440" stroke="#64748b" stroke-width="2.5"/><line x1="355" y1="440" x2="690" y2="400" stroke="#0f766e" stroke-width="2.5"/><line x1="355" y1="440" x2="690" y2="480" stroke="#0f766e" stroke-width="2.5"/>
<circle cx="110" cy="270" r="39" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="110" y="277" font-size="20" text-anchor="middle" fill="#92400e">Chọn</text>
<circle cx="355" cy="100" r="29" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="355" y="106" font-size="19" fill="#1e40af" text-anchor="middle">A₁</text><circle cx="690" cy="60" r="10" fill="#0f766e"/><text x="711" y="66" font-size="18" fill="#0f172a">A₁ + B1</text><circle cx="690" cy="140" r="10" fill="#0f766e"/><text x="711" y="146" font-size="18" fill="#0f172a">A₁ + B2</text><circle cx="355" cy="270" r="29" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="355" y="276" font-size="19" fill="#1e40af" text-anchor="middle">A₂</text><circle cx="690" cy="230" r="10" fill="#0f766e"/><text x="711" y="236" font-size="18" fill="#0f172a">A₂ + B1</text><circle cx="690" cy="310" r="10" fill="#0f766e"/><text x="711" y="316" font-size="18" fill="#0f172a">A₂ + B2</text><circle cx="355" cy="440" r="29" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="355" y="446" font-size="19" fill="#1e40af" text-anchor="middle">A₃</text><circle cx="690" cy="400" r="10" fill="#0f766e"/><text x="711" y="406" font-size="18" fill="#0f172a">A₃ + B1</text><circle cx="690" cy="480" r="10" fill="#0f766e"/><text x="711" y="486" font-size="18" fill="#0f172a">A₃ + B2</text>
<text x="286" y="35" font-size="18" fill="#2563eb">Bước 1: Áo</text>
<text x="670" y="35" font-size="18" fill="#0f766e">Bước 2: Quần</text>
