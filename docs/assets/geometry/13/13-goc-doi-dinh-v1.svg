<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Hai góc đối đỉnh</title><desc id="desc">Hai đường thẳng AC và BD cắt nhau tại O; góc AOD và góc BOC là hai góc đối đỉnh và có số đo bằng nhau.</desc><style>.g{fill:none;stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:#1565c0;stroke-width:1.9;stroke-linecap:round}.f{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round}.d{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.p{fill:#111827}.t{font:19px Arial,Helvetica,sans-serif;fill:#111827}.s{font:16px Arial,Helvetica,sans-serif;fill:#374151}.b{font:18px Arial,Helvetica,sans-serif;fill:#1565c0}.r{font:18px Arial,Helvetica,sans-serif;fill:#c62828}</style><path class="g" d="M135 88 L505 332 M135 332 L505 88"/><path class="f" d="M289 191 A37 37 0 0 1 351 191"/><path class="a" d="M289 229 A37 37 0 0 0 351 229"/><circle class="p" cx="135" cy="88" r="3"/><text class="t" x="111" y="80">A</text><circle class="p" cx="135" cy="332" r="3"/><text class="t" x="111" y="348">B</text><circle class="p" cx="505" cy="332" r="3"/><text class="t" x="515" y="348">C</text><circle class="p" cx="505" cy="88" r="3"/><text class="t" x="515" y="80">D</text><circle class="p" cx="320" cy="210" r="3"/><text class="t" x="328" y="202">O</text><text class="s" x="320" y="394" text-anchor="middle">∠AOD = ∠BOC (hai góc đối đỉnh).</text></svg>
