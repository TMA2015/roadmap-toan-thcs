<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468 365" role="img" aria-labelledby="title desc">
<title id="title">Sân hình chữ L được khoét góc trên bên phải</title>
<desc id="desc">Sân gốc dài 24 m, rộng 18 m; phần khoét 8 m ngang và 6 m dọc ở góc trên phải. Hình chỉ thể hiện dữ kiện, không ghi diện tích hoặc chu vi.</desc>
<style>.shape{fill:#e8f4ec;stroke:#277153;stroke-width:3;stroke-linejoin:round}.dim{stroke:#576771;stroke-width:1.4;fill:none}.txt{font:16px system-ui,sans-serif;fill:#263746}.small{font:13px system-ui,sans-serif;fill:#526571}.dash{stroke:#92a3ab;stroke-width:1.5;stroke-dasharray:5 5;fill:none}</style>
<path class="dash" d="M70 54 H358 V270"/>
<path class="shape" d="M70 54 H262 V126 H358 V270 H70 Z"/>
<text class="small" x="290" y="77">Phần khoét</text>
<text class="txt" x="181" y="304">24 m</text>
<text class="txt" x="21" y="167">18 m</text>
<text class="txt" x="151" y="42">16 m</text>
<text class="txt" x="289" y="115">8 m</text>
<text class="txt" x="270" y="97">6 m</text>
<text class="txt" x="364" y="204">12 m</text>
<text class="small" x="75" y="342">Phác họa — không theo đơn vị đo thực tế</text>
</svg>