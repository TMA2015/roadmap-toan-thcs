<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Ba tam giác vuông đồng dạng tạo bởi đường cao</title><desc id="desc">Tam giác ABC vuông tại A, đường cao AH hạ xuống cạnh huyền BC. Ba tam giác ABC, HBA và HAC đồng dạng với thứ tự đỉnh tương ứng.</desc><style>.g{fill:none;stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.aux{fill:none;stroke:#1565c0;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.focus{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.pt{fill:#111827}.t{fill:#111827;font:19px Arial,Helvetica,sans-serif}.n{fill:#374151;font:16px Arial,Helvetica,sans-serif}.r{fill:#c62828;font:18px Arial,Helvetica,sans-serif}.b{fill:#1565c0;font:18px Arial,Helvetica,sans-serif}</style><path class="g" d="M100 300 L244 108 L500 300 Z"/><path class="focus" d="M244 108 V300"/><path class="aux" d="M235 120 L247 129 L256 117 M244 282 H262 V300"/><circle class="pt" cx="100" cy="300" r="3"/><text class="t" x="76" y="318">B</text><circle class="pt" cx="244" cy="108" r="3"/><text class="t" x="239" y="95">A</text><circle class="pt" cx="500" cy="300" r="3"/><text class="t" x="509" y="318">C</text><circle class="pt" cx="244" cy="300" r="3"/><text class="t" x="237" y="324">H</text><text class="n" x="320" y="393" text-anchor="middle">△ABC ∼ △HBA ∼ △HAC.</text></svg>
