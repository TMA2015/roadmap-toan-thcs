<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="ttl desc">
<title id="ttl">Hai đường cao BE và CF của tam giác nhọn ABC cắt nhau tại trực tâm H</title>
<desc id="desc">A trên, B trái dưới, C phải dưới. E là chân đường cao từ B trên AC, F là chân đường cao từ C trên AB, H là giao điểm BE và CF. Các tứ giác BECF và AEHF nội tiếp các đường tròn đường kính BC và AH.</desc>
<rect width="640" height="400" rx="18" fill="#f4f8ff"/>
<path d="M310 75L95 315H520Z" fill="#e9efff" stroke="#2f438f" stroke-width="3.3" stroke-linejoin="round"/>
<circle cx="307.5" cy="315" r="212.5" fill="none" stroke="#8aaacf" stroke-width="2" stroke-dasharray="8 6"/>
<circle cx="310" cy="100.94" r="25.94" fill="none" stroke="#b69ed0" stroke-width="2" stroke-dasharray="4 5"/>
<path d="M95 315L335.708 104.381M520 315L284.219 103.779" stroke="#cf702a" stroke-width="2.8" stroke-dasharray="9 5"/>
<path d="M310 75V315" stroke="#5993ab" stroke-width="1.8" stroke-dasharray="6 7"/>
<path d="M328.49 96.13L320.25 103.34L327.47 111.57" stroke="#cf702a" stroke-width="2.2" fill="none"/>
<path d="M291.52 95.64L299.75 103.34L292.05 111.57" stroke="#cf702a" stroke-width="2.2" fill="none"/>
<g fill="#213a86"><circle cx="310" cy="75" r="4.5"/><circle cx="95" cy="315" r="4.5"/><circle cx="520" cy="315" r="4.5"/><circle cx="335.708" cy="104.381" r="4.5"/><circle cx="284.219" cy="103.779" r="4.5"/><circle cx="310" cy="126.875" r="4.5"/></g>
<g font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#182b50"><text x="304" y="58">A</text><text x="74" y="340">B</text><text x="526" y="340">C</text><text x="344" y="98">E</text><text x="260" y="98">F</text><text x="316" y="143">H</text></g>
<g font-family="Arial,sans-serif" font-size="14" fill="#52627d"><text x="24" y="374">Nét cam: hai đường cao</text><text x="323" y="374">Nét chấm: hai đường tròn phụ</text></g>
</svg>