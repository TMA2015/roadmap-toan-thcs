<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Hình thang ABCD</title><desc id="desc">Tứ giác ABCD có hai cạnh đáy AB và CD song song; hai cạnh bên AD và BC.</desc><style>.g{fill:none;stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:#1565c0;stroke-width:1.9;stroke-linecap:round}.f{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round}.d{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.p{fill:#111827}.t{font:19px Arial,Helvetica,sans-serif;fill:#111827}.s{font:16px Arial,Helvetica,sans-serif;fill:#374151}.b{font:18px Arial,Helvetica,sans-serif;fill:#1565c0}.r{font:18px Arial,Helvetica,sans-serif;fill:#c62828}</style><path class="g" d="M220 110 L420 110 L520 300 L120 300 Z"/><circle class="p" cx="220" cy="110" r="3"/><text class="t" x="195" y="98">A</text><circle class="p" cx="420" cy="110" r="3"/><text class="t" x="430" y="98">B</text><circle class="p" cx="520" cy="300" r="3"/><text class="t" x="530" y="320">C</text><circle class="p" cx="120" cy="300" r="3"/><text class="t" x="95" y="320">D</text><path class="a" d="M220 104 H420 M120 306 H520"/><text class="s" x="320" y="394" text-anchor="middle">AB ∥ CD.</text></svg>
