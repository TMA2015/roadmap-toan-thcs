<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Tiếp tuyến và cát tuyến từ điểm ngoài</title><desc id="desc">Từ điểm ngoài P của đường tròn tâm O, PT là tiếp tuyến tại T, cát tuyến qua B và A. B nằm giữa P và A. PT bình phương bằng PB nhân PA.</desc><style>.g{fill:none;stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.aux{fill:none;stroke:#1565c0;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.focus{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.pt{fill:#111827}.t{fill:#111827;font:19px Arial,Helvetica,sans-serif}.n{fill:#374151;font:16px Arial,Helvetica,sans-serif}.r{fill:#c62828;font:18px Arial,Helvetica,sans-serif}.b{fill:#1565c0;font:18px Arial,Helvetica,sans-serif}</style><circle class="g" cx="320" cy="210" r="150"/><path class="aux" d="M320 210 L410 90"/><path class="focus" d="M570 210 L410 90"/><path class="g" d="M170 210 H570"/><path class="g" d="M402 96 L412 109 L425 101"/><circle class="pt" cx="320" cy="210" r="3"/><text class="t" x="296" y="198">O</text><circle class="pt" cx="410" cy="90" r="3"/><text class="t" x="402" y="76">T</text><circle class="pt" cx="170" cy="210" r="3"/><text class="t" x="150" y="202">A</text><circle class="pt" cx="470" cy="210" r="3"/><text class="t" x="470" y="234">B</text><circle class="pt" cx="570" cy="210" r="3"/><text class="t" x="579" y="202">P</text><text class="n" x="330" y="399" text-anchor="middle">PT² = PB × PA; PT ⟂ OT.</text></svg>
