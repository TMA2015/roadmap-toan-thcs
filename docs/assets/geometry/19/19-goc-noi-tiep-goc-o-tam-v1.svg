<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Góc ở tâm và góc nội tiếp</title><desc id="desc">Đường tròn tâm O. Góc ở tâm AOB và góc nội tiếp ACB cùng chắn cung AB không chứa C. Số đo góc nội tiếp bằng một nửa góc ở tâm.</desc><style>.g{fill:none;stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.aux{fill:none;stroke:#1565c0;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.focus{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.pt{fill:#111827}.t{fill:#111827;font:19px Arial,Helvetica,sans-serif}.n{fill:#374151;font:16px Arial,Helvetica,sans-serif}.r{fill:#c62828;font:18px Arial,Helvetica,sans-serif}.b{fill:#1565c0;font:18px Arial,Helvetica,sans-serif}</style><circle class="g" cx="320" cy="210" r="150"/><path class="aux" d="M320 210 L320 60 M320 210 L170 210"/><path class="focus" d="M470 210 L320 60 L170 210"/><path class="g" d="M470 210 L170 210"/><path class="aux" d="M320 180 A30 30 0 0 0 290 210"/><path class="focus" d="M449 210 A21 21 0 0 0 455 194"/><circle class="pt" cx="320" cy="210" r="3"/><text class="t" x="293" y="237">O</text><circle class="pt" cx="320" cy="60" r="3"/><text class="t" x="313" y="48">A</text><circle class="pt" cx="170" cy="210" r="3"/><text class="t" x="146" y="216">B</text><circle class="pt" cx="470" cy="210" r="3"/><text class="t" x="479" y="217">C</text><text class="n" x="320" y="395" text-anchor="middle">∠ACB = ½ ∠AOB (cùng chắn cung AB).</text></svg>
