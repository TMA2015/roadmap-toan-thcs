<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Hai dây cắt nhau bên trong đường tròn</title><desc id="desc">Đường tròn tâm O. Hai dây AB và CD cắt nhau tại P nằm trong đường tròn. Các điểm A, P, B thẳng hàng và C, P, D thẳng hàng.</desc><style>.g{fill:none;stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.aux{fill:none;stroke:#1565c0;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.focus{fill:none;stroke:#c62828;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.pt{fill:#111827}.t{fill:#111827;font:19px Arial,Helvetica,sans-serif}.n{fill:#374151;font:16px Arial,Helvetica,sans-serif}.r{fill:#c62828;font:18px Arial,Helvetica,sans-serif}.b{fill:#1565c0;font:18px Arial,Helvetica,sans-serif}</style><circle class="g" cx="320" cy="210" r="150"/><path class="focus" d="M170 210 H470"/><path class="aux" d="M320 60 V360"/><circle class="pt" cx="170" cy="210" r="3"/><text class="t" x="148" y="201">A</text><circle class="pt" cx="470" cy="210" r="3"/><text class="t" x="479" y="201">B</text><circle class="pt" cx="320" cy="60" r="3"/><text class="t" x="328" y="48">C</text><circle class="pt" cx="320" cy="360" r="3"/><text class="t" x="329" y="380">D</text><circle class="pt" cx="320" cy="210" r="3"/><text class="t" x="330" y="200">P</text><text class="n" x="320" y="400" text-anchor="middle">PA × PB = PC × PD.</text></svg>
