<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Góc nâng và khoảng cách ngang</title><desc id="desc">Người quan sát O nhìn lên đỉnh T của vật, F là chân vật. OF là khoảng cách ngang d, FT là chiều cao h, góc nâng alpha nằm tại O giữa phương ngang OF và tia nhìn OT.</desc>
<style>.edge{stroke:#1f2937;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}.aux{stroke:#c62828;stroke-width:2.2;stroke-linecap:round;fill:none}.mark{stroke:#1f2937;stroke-width:1.7;fill:none}.label{fill:#111827;font:19px Arial,Helvetica,sans-serif}.small{fill:#111827;font:17px Arial,Helvetica,sans-serif}.focus{fill:#c62828;font:19px Arial,Helvetica,sans-serif}.blue{fill:#1565c0;font:19px Arial,Helvetica,sans-serif}.note{fill:#374151;font:17px Arial,Helvetica,sans-serif}</style>
<path class="edge" d="M110 310 H510 V130"/><path class="aux" d="M110 310 L510 130"/><path class="mark" d="M490 310 V290 H510"/><path class="mark" d="M153 310 Q150 293 149 292"/>
<circle cx="110" cy="310" r="3" fill="#111827"/><circle cx="510" cy="310" r="3" fill="#111827"/><circle cx="510" cy="130" r="3" fill="#111827"/>
<text class="label" x="85" y="334">O</text><text class="label" x="515" y="335">F</text><text class="label" x="514" y="119">T</text><text class="focus" x="157" y="293">α</text><text class="blue" x="314" y="335" text-anchor="middle">d (ngang)</text><text class="blue" x="531" y="230">h</text><text class="note" x="305" y="190" text-anchor="middle">Tia nhìn lên</text><text class="note" x="320" y="380" text-anchor="middle">tan α = h / d (bỏ qua chiều cao mắt).</text>
</svg>
