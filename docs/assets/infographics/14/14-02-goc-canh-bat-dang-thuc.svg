<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>Chuyên đề 14 – Góc, cạnh và bất đẳng thức tam giác</title><desc>Infographic tóm tắt quan hệ góc, cạnh đối diện và bất đẳng thức tam giác.</desc><rect width="1200" height="1500" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#111" stroke="#111" stroke-width="2"><text x="600" y="80" text-anchor="middle" font-size="40" font-weight="700" stroke="none">TAM GIÁC – GÓC, CẠNH &amp; BẤT ĐẲNG THỨC</text><text x="600" y="125" text-anchor="middle" font-size="25" stroke="none">Infographic 2 – Quan hệ cốt lõi</text><rect x="70" y="180" width="1060" height="220" rx="18" fill="none"/><text x="100" y="230" font-size="28" font-weight="700" stroke="none">1. Tổng ba góc</text><text x="120" y="290" font-size="28" stroke="none">∠A + ∠B + ∠C = 180°</text><text x="120" y="340" font-size="23" stroke="none">Biết hai góc → góc còn lại = 180° − tổng hai góc đã biết.</text><rect x="70" y="450" width="1060" height="220" rx="18" fill="none"/><text x="100" y="500" font-size="28" font-weight="700" stroke="none">2. Góc ngoài</text><text x="120" y="560" font-size="25" stroke="none">Góc ngoài tại một đỉnh = tổng hai góc trong không kề.</text><text x="120" y="610" font-size="23" stroke="none">Suy ra: góc ngoài lớn hơn từng góc trong không kề với nó.</text><rect x="70" y="720" width="500" height="300" rx="18" fill="none"/><text x="100" y="770" font-size="28" font-weight="700" stroke="none">3. Góc ↔ cạnh đối diện</text><text x="110" y="830" font-size="24" stroke="none">∠A &gt; ∠B  ⇔  BC &gt; AC</text><text x="110" y="885" font-size="23" stroke="none">Luôn ghép đúng:</text><text x="110" y="930" font-size="23" stroke="none">• BC đối diện ∠A</text><text x="110" y="970" font-size="23" stroke="none">• CA đối diện ∠B</text><rect x="630" y="720" width="500" height="300" rx="18" fill="none"/><text x="660" y="770" font-size="28" font-weight="700" stroke="none">4. Bất đẳng thức tam giác</text><text x="665" y="830" font-size="24" stroke="none">a + b &gt; c</text><text x="665" y="875" font-size="24" stroke="none">a + c &gt; b</text><text x="665" y="920" font-size="24" stroke="none">b + c &gt; a</text><text x="665" y="970" font-size="23" stroke="none">Dạng gọn: |a − b| &lt; c &lt; a + b</text><rect x="70" y="1070" width="1060" height="260" rx="18" fill="none"/><text x="100" y="1120" font-size="28" font-weight="700" stroke="none">Quy trình kiểm tra ba đoạn có tạo thành tam giác?</text><text x="120" y="1180" font-size="24" stroke="none">1. Sắp xếp a ≤ b ≤ c.</text><text x="120" y="1225" font-size="24" stroke="none">2. Chỉ cần kiểm tra a + b &gt; c.</text><text x="120" y="1270" font-size="24" stroke="none">3. Nếu không thỏa → không tồn tại tam giác.</text><text x="600" y="1420" text-anchor="middle" font-size="22" stroke="none">Lỗi hay gặp: so sánh nhầm cạnh với góc không đối diện.</text></g></svg>