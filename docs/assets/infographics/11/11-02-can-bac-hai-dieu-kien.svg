<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <rect width="1200" height="1600" fill="#fff"/>
  <style>.t{font:700 44px Arial,sans-serif;fill:#111}.s{font:600 27px Arial,sans-serif;fill:#222}.h{font:700 30px Arial,sans-serif;fill:#111}.b{font:24px Arial,sans-serif;fill:#222}.box{fill:#fff;stroke:#333;stroke-width:2}.muted{fill:#f5f5f5}.small{font:21px Arial,sans-serif;fill:#333}.warn{font:700 25px Arial,sans-serif;fill:#111}</style>
  <text x="600" y="80" text-anchor="middle" class="t">CĂN BẬC HAI &amp; ĐIỀU KIỆN</text>
  <text x="600" y="125" text-anchor="middle" class="s">Chuyên đề 11 – Kiến thức cốt lõi</text>

  <rect x="70" y="175" width="1060" height="210" rx="18" class="box muted"/>
  <text x="100" y="225" class="h">1. Căn bậc hai số học</text>
  <text x="100" y="275" class="b">Với a ≥ 0, √a là số không âm có bình phương bằng a.</text>
  <text x="100" y="325" class="b">√9 = 3  •  √25 = 5  •  √0 = 0</text>
  <text x="100" y="365" class="warn">Không viết: √9 = ±3</text>

  <rect x="70" y="430" width="500" height="330" rx="18" class="box"/>
  <text x="100" y="480" class="h">2. Điều kiện xác định</text>
  <text x="100" y="535" class="b">√A có nghĩa khi A ≥ 0</text>
  <text x="100" y="585" class="small">Ví dụ: √(x−2) ⇒ x ≥ 2</text>
  <text x="100" y="650" class="b">1/√A cần A &gt; 0</text>
  <text x="100" y="700" class="small">Ví dụ: 1/√(x−1) ⇒ x &gt; 1</text>

  <rect x="630" y="430" width="500" height="330" rx="18" class="box"/>
  <text x="660" y="480" class="h">3. Công thức bắt buộc nhớ</text>
  <text x="660" y="545" class="s">√(A²) = |A|</text>
  <text x="660" y="605" class="b">Ví dụ: √((x−3)²)=|x−3|</text>
  <text x="660" y="665" class="small" font-size="19">Chỉ khi biết x ≥ 3 mới được viết |x−3|=x−3.</text>
  <text x="660" y="715" class="warn">Đừng bỏ dấu giá trị tuyệt đối.</text>

  <rect x="70" y="810" width="1060" height="300" rx="18" class="box muted"/>
  <text x="100" y="860" class="h">4. Cách kiểm tra dấu trước khi bỏ | |</text>
  <text x="100" y="920" class="b">A ≥ 0  →  |A| = A</text>
  <text x="100" y="975" class="b">A &lt; 0  →  |A| = −A</text>
  <text x="100" y="1035" class="b">Không biết dấu của A → giữ nguyên |A|</text>

  <rect x="70" y="1160" width="1060" height="270" rx="18" class="box"/>
  <text x="100" y="1210" class="h">5. Lỗi thường gặp</text>
  <text x="100" y="1260" class="b">• Quên điều kiện A ≥ 0</text>
  <text x="100" y="1305" class="b">• Nhầm √a với nghiệm của phương trình x²=a</text>
  <text x="100" y="1350" class="b">• Viết √(A²)=A khi A có thể âm</text>
  <text x="100" y="1395" class="b">• Với căn ở mẫu, dùng ≥ 0 thay vì &gt; 0</text>

  <rect x="70" y="1470" width="1060" height="75" rx="14" class="box muted"/>
  <text x="600" y="1518" text-anchor="middle" class="s">Viết điều kiện ngay từ đầu bài</text>
</svg>