<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <rect width="1200" height="1600" fill="#fff"/>
  <style>
    .t{font:700 46px Arial,sans-serif;fill:#111}.s{font:600 27px Arial,sans-serif;fill:#222}.h{font:700 30px Arial,sans-serif;fill:#111}.b{font:24px Arial,sans-serif;fill:#222}.box{fill:#fff;stroke:#333;stroke-width:2}.muted{fill:#f5f5f5}.line{stroke:#555;stroke-width:3;fill:none}.small{font:21px Arial,sans-serif;fill:#333}
  </style>
  <text x="600" y="80" text-anchor="middle" class="t">CHUYÊN ĐỀ 11 – CĂN THỨC</text>
  <text x="600" y="125" text-anchor="middle" class="s">Tổng quan chuyên đề</text>
  <rect x="70" y="170" width="1060" height="170" rx="18" class="box muted"/>
  <text x="100" y="215" class="h">Học gì?</text>
  <text x="100" y="260" class="b">• Căn bậc hai và điều kiện xác định</text>
  <text x="100" y="300" class="b">• √(A²)=|A| • Biến đổi căn • Phép tính • Trục căn ở mẫu</text>

  <rect x="70" y="385" width="500" height="310" rx="18" class="box"/>
  <text x="100" y="435" class="h">1. Nền tảng</text>
  <text x="100" y="485" class="b">√A có nghĩa khi A ≥ 0</text>
  <text x="100" y="530" class="b">1/√A cần A &gt; 0</text>
  <text x="100" y="575" class="b">√(A²)=|A|</text>
  <text x="100" y="620" class="small">Không viết √(A²)=A nếu chưa biết dấu của A.</text>

  <rect x="630" y="385" width="500" height="310" rx="18" class="box"/>
  <text x="660" y="435" class="h">2. Biến đổi</text>
  <text x="660" y="485" class="b">√(AB)=√A·√B</text>
  <text x="660" y="530" class="b">√(A/B)=√A/√B</text>
  <text x="660" y="575" class="b">Đưa thừa số ra / vào dấu căn</text>
  <text x="660" y="620" class="small">Luôn kiểm tra điều kiện của công thức.</text>

  <rect x="70" y="745" width="500" height="310" rx="18" class="box"/>
  <text x="100" y="795" class="h">3. Phép tính</text>
  <text x="100" y="845" class="b">• Rút gọn căn trước</text>
  <text x="100" y="890" class="b">• Cộng / trừ căn đồng dạng</text>
  <text x="100" y="935" class="b">• Nhân / chia đúng điều kiện</text>
  <text x="100" y="980" class="small">Ví dụ: √12+√27 = 2√3+3√3 = 5√3</text>

  <rect x="630" y="745" width="500" height="310" rx="18" class="box"/>
  <text x="660" y="795" class="h">4. Trục căn ở mẫu</text>
  <text x="660" y="845" class="b">Mẫu √a → nhân √a</text>
  <text x="660" y="890" class="b">Mẫu a+√b → nhân liên hợp a−√b</text>
  <text x="660" y="935" class="b">Dùng hiệu hai bình phương</text>
  <text x="660" y="980" class="small">Liên hệ trực tiếp với hằng đẳng thức.</text>

  <rect x="70" y="1105" width="1060" height="270" rx="18" class="box muted"/>
  <text x="100" y="1155" class="h">Mạch tư duy khi làm bài</text>
  <text x="100" y="1210" class="b">Điều kiện → Rút gọn căn → Biến đổi từng phần → Trục căn → Thu gọn → Kiểm tra</text>
  <text x="100" y="1270" class="h">Vị trí trong Roadmap</text>
  <text x="100" y="1320" class="b">04 Biểu thức → 05 Hằng đẳng thức → 11 Căn thức → 12 Phương trình bậc hai</text>

  <rect x="70" y="1425" width="1060" height="95" rx="16" class="box"/>
  <text x="600" y="1485" text-anchor="middle" class="s">Học bài → Luyện tập → Tự kiểm tra → đạt ≥ 80%</text>
</svg>