<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><title>Chuyên đề 25 - Tổng quan ôn thi vào 10</title><desc>Bản đồ bốn mạch kiến thức và chu trình ôn tập.</desc><rect width="1200" height="1500" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="black" stroke="black"><text x="600" y="90" text-anchor="middle" font-size="42" font-weight="700" stroke="none">CHUYÊN ĐỀ 25 • TỔNG QUAN ÔN THI VÀO 10</text><text x="600" y="140" text-anchor="middle" font-size="24" stroke="none">Hệ thống hóa → ưu tiên → luyện → chữa lỗi → quay lại điểm yếu</text><rect x="90" y="210" width="1020" height="160" rx="20" fill="white" stroke-width="3"/><text x="600" y="260" text-anchor="middle" font-size="30" font-weight="700" stroke="none">4 MẠCH KIẾN THỨC</text><text x="160" y="320" font-size="24" stroke="none">① Số &amp; Đại số</text><text x="420" y="320" font-size="24" stroke="none">② Hình học</text><text x="670" y="320" font-size="24" stroke="none">③ Thống kê &amp; Xác suất</text><text x="965" y="320" text-anchor="middle" font-size="24" stroke="none">④ Thực tế</text><rect x="90" y="420" width="490" height="320" rx="20" fill="white" stroke-width="3"/><text x="335" y="475" text-anchor="middle" font-size="30" font-weight="700" stroke="none">SỐ &amp; ĐẠI SỐ</text><text x="130" y="530" font-size="24" stroke="none">• Biểu thức • Hằng đẳng thức</text><text x="130" y="580" font-size="24" stroke="none">• Phương trình • Bất phương trình</text><text x="130" y="630" font-size="24" stroke="none">• Hệ phương trình</text><text x="130" y="680" font-size="24" stroke="none">• Hàm số • Đồ thị</text><rect x="620" y="420" width="490" height="320" rx="20" fill="white" stroke-width="3"/><text x="865" y="475" text-anchor="middle" font-size="30" font-weight="700" stroke="none">HÌNH HỌC</text><text x="660" y="530" font-size="24" stroke="none">• Góc • Tam giác • Tứ giác</text><text x="660" y="580" font-size="24" stroke="none">• Thales • Đồng dạng</text><text x="660" y="630" font-size="24" stroke="none">• Hệ thức lượng • Đường tròn</text><text x="660" y="680" font-size="24" stroke="none">• Hình học tổng hợp</text><rect x="90" y="790" width="490" height="260" rx="20" fill="white" stroke-width="3"/><text x="335" y="845" text-anchor="middle" font-size="30" font-weight="700" stroke="none">THỐNG KÊ &amp; XÁC SUẤT</text><text x="130" y="905" font-size="24" stroke="none">• Bảng • Biểu đồ</text><text x="130" y="955" font-size="24" stroke="none">• Trung bình • Trung vị • Mốt</text><text x="130" y="1005" font-size="24" stroke="none">• Không gian mẫu • Xác suất</text><rect x="620" y="790" width="490" height="260" rx="20" fill="white" stroke-width="3"/><text x="865" y="845" text-anchor="middle" font-size="30" font-weight="700" stroke="none">BÀI TOÁN THỰC TẾ</text><text x="660" y="905" font-size="24" stroke="none">• Đọc dữ kiện • Đặt ẩn</text><text x="660" y="955" font-size="24" stroke="none">• Chọn mô hình • Giải</text><text x="660" y="1005" font-size="24" stroke="none">• Kiểm tra • Kết luận</text><rect x="90" y="1100" width="1020" height="260" rx="20" fill="white" stroke-width="3"/><text x="600" y="1155" text-anchor="middle" font-size="30" font-weight="700" stroke="none">CHU TRÌNH ÔN TẬP</text><text x="600" y="1225" text-anchor="middle" font-size="26" stroke="none">Học chắc → luyện đúng dạng → luyện đề có bấm giờ</text><text x="600" y="1275" text-anchor="middle" font-size="26" stroke="none">→ phân tích lỗi → quay lại chuyên đề yếu → làm lại</text><text x="600" y="1330" text-anchor="middle" font-size="22" stroke="none">Ưu tiên cuối cùng phải theo đề minh họa / đề chính thức địa phương.</text></g></svg>