<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="white"/><g fill="none" stroke="#111" stroke-width="3"><rect x="24" y="24" width="1152" height="852" rx="18"/><rect x="180" y="135" width="840" height="90" rx="14"/><rect x="180" y="270" width="840" height="90" rx="14"/><rect x="180" y="405" width="840" height="90" rx="14"/><rect x="180" y="540" width="840" height="90" rx="14"/><rect x="180" y="675" width="840" height="90" rx="14"/><path d="M600 225v45M600 360v45M600 495v45M600 630v45"/><path d="M585 255l15 15 15-15M585 390l15 15 15-15M585 525l15 15 15-15M585 660l15 15 15-15"/></g><g font-family="Arial, sans-serif" fill="#111"><text x="600" y="72" text-anchor="middle" font-size="38" font-weight="700">SƠ ĐỒ CHỌN PHƯƠNG PHÁP</text><text x="600" y="110" text-anchor="middle" font-size="22">Phân tích đa thức thành nhân tử</text><text x="600" y="170" text-anchor="middle" font-size="25" font-weight="700">BƯỚC 1 · Có nhân tử chung?</text><text x="600" y="202" text-anchor="middle" font-size="21">Có → đặt ra ngoài ngoặc trước.</text><text x="600" y="305" text-anchor="middle" font-size="25" font-weight="700">BƯỚC 2 · Có dạng hằng đẳng thức?</text><text x="600" y="337" text-anchor="middle" font-size="21">Nhìn bình phương, lập phương, hiệu hai bình phương.</text><text x="600" y="440" text-anchor="middle" font-size="25" font-weight="700">BƯỚC 3 · Có thể nhóm hạng tử?</text><text x="600" y="472" text-anchor="middle" font-size="21">Thử đổi thứ tự để tạo cùng một nhân tử.</text><text x="600" y="575" text-anchor="middle" font-size="25" font-weight="700">BƯỚC 4 · Phối hợp nhiều phương pháp</text><text x="600" y="607" text-anchor="middle" font-size="21">Ví dụ: đặt chung rồi tiếp tục dùng HĐT.</text><text x="600" y="710" text-anchor="middle" font-size="25" font-weight="700">BƯỚC 5 · Kiểm tra đã phân tích hết chưa?</text><text x="600" y="742" text-anchor="middle" font-size="19">Nhân ngược để kiểm tra và xem từng nhân tử còn phân tích tiếp được không.</text><text x="600" y="825" text-anchor="middle" font-size="22" font-weight="700">Mẹo: đừng hỏi “dùng công thức nào?” trước khi nhìn cấu trúc biểu thức.</text><text x="600" y="858" text-anchor="middle" font-size="18">Roadmap Toán THCS · Chuyên đề 06</text></g></svg>