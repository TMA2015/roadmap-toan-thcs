<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-labelledby="title desc">
<title id="title">Vì sao bình phương một tổng có hạng tử 2ab</title>
<desc id="desc">Hình vuông cạnh a cộng b được phân thành bốn phần: hình vuông diện tích a bình phương, hai hình chữ nhật diện tích ab, và hình vuông diện tích b bình phương. Với a,b dương: tổng diện tích bằng a bình phương cộng 2ab cộng b bình phương. Đẳng thức đại số đúng với mọi số thực a,b.</desc>
<rect x="1" y="1" width="838" height="398" rx="22" fill="#f8fbff" stroke="#dce5f3" stroke-width="2"/>
<g font-family="Arial, sans-serif" fill="#14213d">
<text x="26" y="41" font-size="24" font-weight="700">Vì sao (a + b)² có 2ab?</text>
<text x="26" y="68" font-size="16" fill="#506079">Mô hình diện tích: a &gt; 0, b &gt; 0</text>
</g>
<!-- left square: a=190 px, b=80 px; geometric area proportions are exact -->
<g transform="translate(72 100)">
<rect x="0" y="0" width="190" height="190" fill="#dbe8ff" stroke="#243c9c" stroke-width="2"/>
<rect x="190" y="0" width="80" height="190" fill="#bde7e2" stroke="#243c9c" stroke-width="2"/>
<rect x="0" y="190" width="190" height="80" fill="#bde7e2" stroke="#243c9c" stroke-width="2"/>
<rect x="190" y="190" width="80" height="80" fill="#f8dfb7" stroke="#243c9c" stroke-width="2"/>
<g font-family="Arial, sans-serif" fill="#182b4b" font-weight="700" text-anchor="middle">
<text x="95" y="101" font-size="26">a²</text>
<text x="230" y="99" font-size="24">ab</text>
<text x="95" y="236" font-size="24">ab</text>
<text x="230" y="236" font-size="23">b²</text>
</g>
<g font-family="Arial, sans-serif" text-anchor="middle" font-size="19" fill="#172a48">
<text x="95" y="-11">a</text><text x="230" y="-11">b</text>
<text x="-15" y="98" transform="rotate(-90 -15 98)">a</text>
<text x="-15" y="235" transform="rotate(-90 -15 235)">b</text>
</g>
</g>
<g font-family="Arial, sans-serif" fill="#1c304d">
<text x="410" y="126" font-size="19" font-weight="700">Diện tích toàn hình vuông</text>
<text x="410" y="163" font-size="26" font-weight="700">(a + b)²</text>
<text x="410" y="210" font-size="19">= a² + ab + ab + b²</text>
<text x="410" y="257" font-size="28" font-weight="700" fill="#2746b1">= a² + 2ab + b²</text>
<text x="410" y="308" font-size="17">Hai hình chữ nhật tạo ra 2ab.</text>
<text x="410" y="338" font-size="15" fill="#52627a">Mô hình chỉ dùng a, b dương để dễ nhìn.</text>
<text x="410" y="360" font-size="15" fill="#52627a">Đẳng thức vẫn đúng với mọi a, b thực.</text>
</g>
</svg>