<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450" role="img" aria-labelledby="t d"><title id="t">Chuyên đề 05 – Nhóm lập phương</title><desc id="d">Bốn hằng đẳng thức nhóm lập phương, cách nhớ dấu và nhận dạng.</desc><rect width="1200" height="1450" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif" fill="#111" stroke="#111"><text x="600" y="70" text-anchor="middle" font-size="38" font-weight="700" stroke="none">CHUYÊN ĐỀ 05</text><text x="600" y="120" text-anchor="middle" font-size="34" font-weight="700" stroke="none">NHÓM LẬP PHƯƠNG</text><text x="600" y="158" text-anchor="middle" font-size="22" stroke="none">4 công thức — nhớ hệ số và kiểm soát dấu</text><rect x="60" y="205" width="1080" height="245" rx="18" fill="none" stroke-width="3"/><text x="90" y="250" font-size="25" font-weight="700" stroke="none">1. Lập phương của một tổng</text><text x="600" y="315" text-anchor="middle" font-size="29" font-weight="700" stroke="none">(A+B)³ = A³ + 3A²B + 3AB² + B³</text><text x="90" y="380" font-size="21" stroke="none">Hệ số: 1 – 3 – 3 – 1. Tất cả dấu đều dương.</text><rect x="60" y="485" width="1080" height="245" rx="18" fill="none" stroke-width="3"/><text x="90" y="530" font-size="25" font-weight="700" stroke="none">2. Lập phương của một hiệu</text><text x="600" y="595" text-anchor="middle" font-size="28" font-weight="700" stroke="none">(A−B)³ = A³ − 3A²B + 3AB² − B³</text><text x="90" y="660" font-size="21" stroke="none">Dấu: +  −  +  −. Hệ số vẫn là 1 – 3 – 3 – 1.</text><rect x="60" y="765" width="520" height="260" rx="18" fill="none" stroke-width="3"/><text x="90" y="810" font-size="24" font-weight="700" stroke="none">3. Tổng hai lập phương</text><text x="320" y="875" text-anchor="middle" font-size="25" font-weight="700" stroke="none">A³+B³</text><text x="320" y="925" text-anchor="middle" font-size="22" stroke="none">=(A+B)(A²−AB+B²)</text><text x="90" y="985" font-size="19" stroke="none">Ngoài cùng cùng dấu +, trong ngoặc đổi dấu.</text><rect x="620" y="765" width="520" height="260" rx="18" fill="none" stroke-width="3"/><text x="650" y="810" font-size="24" font-weight="700" stroke="none">4. Hiệu hai lập phương</text><text x="880" y="875" text-anchor="middle" font-size="25" font-weight="700" stroke="none">A³−B³</text><text x="880" y="925" text-anchor="middle" font-size="22" stroke="none">=(A−B)(A²+AB+B²)</text><text x="650" y="985" font-size="19" stroke="none">Ngoài cùng cùng dấu −, trong ngoặc đổi dấu.</text><rect x="60" y="1065" width="1080" height="230" rx="18" fill="none" stroke-width="3"/><text x="90" y="1110" font-size="25" font-weight="700" stroke="none">5. Mẹo nhận dạng</text><text x="90" y="1160" font-size="21" stroke="none">• Hai hạng tử → nghĩ tới A³±B³.</text><text x="90" y="1200" font-size="21" stroke="none">• Bốn hạng tử theo mẫu 1–3–3–1 → nghĩ tới (A±B)³.</text><text x="90" y="1240" font-size="21" stroke="none">• Luôn kiểm tra A và B có thật sự là lập phương hay không.</text><text x="600" y="1385" text-anchor="middle" font-size="20" font-weight="700" stroke="none">Roadmap Toán THCS</text></g></svg>