<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Chuyên đề 03 – Kiến thức cốt lõi</title><desc id="desc">Tỉ số, tỉ lệ thức, dãy tỉ số bằng nhau, tỉ lệ thuận và nghịch.</desc><rect width="1200" height="1500" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif" fill="#111" stroke="#111"><text x="600" y="72" text-anchor="middle" font-size="38" font-weight="700" stroke="none">CHUYÊN ĐỀ 03</text><text x="600" y="120" text-anchor="middle" font-size="34" font-weight="700" stroke="none">TỈ LỆ – TỈ LỆ THỨC</text><text x="600" y="158" text-anchor="middle" font-size="22" stroke="none">Kiến thức cốt lõi cần nhớ</text>
<text x="75" y="225" font-size="28" font-weight="700" stroke="none">1. Tỉ số và tỉ lệ thức</text><rect x="75" y="260" width="1050" height="220" rx="18" fill="none" stroke-width="3"/><g stroke="none"><text x="120" y="310" font-size="23" font-weight="700">Tỉ số</text><text x="120" y="355" font-size="22">a : b = a/b, b ≠ 0</text><text x="120" y="400" font-size="19">So sánh đại lượng cùng loại → đổi về cùng đơn vị.</text><text x="620" y="310" font-size="23" font-weight="700">Tỉ lệ thức</text><text x="620" y="355" font-size="22">a/b = c/d ⇔ ad = bc</text><text x="620" y="400" font-size="19">Dùng tích chéo để kiểm tra hoặc tìm số chưa biết.</text></g>
<text x="75" y="550" font-size="28" font-weight="700" stroke="none">2. Dãy tỉ số bằng nhau</text><rect x="75" y="585" width="1050" height="200" rx="18" fill="none" stroke-width="3"/><g stroke="none"><text x="600" y="640" text-anchor="middle" font-size="24">x/a = y/b = z/c = k</text><text x="600" y="685" text-anchor="middle" font-size="22">⇒ x = ak, y = bk, z = ck</text><text x="600" y="730" text-anchor="middle" font-size="20">Nếu x + y + z = S thì k = S/(a+b+c)</text></g>
<text x="75" y="860" font-size="28" font-weight="700" stroke="none">3. Tỉ lệ thuận và tỉ lệ nghịch</text><g fill="none" stroke-width="3"><rect x="75" y="900" width="500" height="300" rx="18"/><rect x="625" y="900" width="500" height="300" rx="18"/></g><g stroke="none"><text x="325" y="950" text-anchor="middle" font-size="25" font-weight="700">TỈ LỆ THUẬN</text><text x="325" y="1000" text-anchor="middle" font-size="25">y = kx</text><text x="115" y="1050" font-size="20">• y/x = k không đổi</text><text x="115" y="1090" font-size="20">• x gấp m lần → y gấp m lần</text><text x="115" y="1130" font-size="20">• Ví dụ: số lượng ↔ tiền</text><text x="875" y="950" text-anchor="middle" font-size="25" font-weight="700">TỈ LỆ NGHỊCH</text><text x="875" y="1000" text-anchor="middle" font-size="25">xy = a</text><text x="665" y="1050" font-size="20">• x·y = a không đổi</text><text x="665" y="1090" font-size="20">• x gấp m lần → y giảm m lần</text><text x="665" y="1130" font-size="20">• Ví dụ: người ↔ thời gian</text></g>
<text x="75" y="1280" font-size="28" font-weight="700" stroke="none">4. Hai công thức thực tế hay dùng</text><rect x="75" y="1315" width="1050" height="120" rx="18" fill="none" stroke-width="3"/><g stroke="none" text-anchor="middle"><text x="350" y="1365" font-size="22">Tỉ số phần trăm = A/B × 100%</text><text x="850" y="1365" font-size="22">Bản đồ 1:n → 1 đơn vị ứng với n đơn vị thật</text><text x="600" y="1410" font-size="18" font-weight="700">Kiểm tra điều kiện mẫu khác 0 trước khi biến đổi.</text></g></g></svg>