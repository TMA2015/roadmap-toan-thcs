<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
<title id="title">Chuyên đề 03 – Tỉ lệ, tỉ lệ thức – Tổng quan</title><desc id="desc">Tổng quan tỉ số, tỉ lệ thức, đại lượng tỉ lệ thuận nghịch và ứng dụng thực tế.</desc>
<rect width="1200" height="1500" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif" fill="#111" stroke="#111">
<text x="600" y="70" text-anchor="middle" font-size="38" font-weight="700" stroke="none">CHUYÊN ĐỀ 03</text><text x="600" y="120" text-anchor="middle" font-size="34" font-weight="700" stroke="none">TỈ LỆ – TỈ LỆ THỨC – ĐẠI LƯỢNG TỈ LỆ</text><text x="600" y="158" text-anchor="middle" font-size="22" stroke="none">Tổng quan chuyên đề</text>
<rect x="70" y="205" width="1060" height="105" rx="16" fill="none" stroke-width="3"/><text x="600" y="248" text-anchor="middle" font-size="25" font-weight="700" stroke="none">CẦU NỐI TỪ SỐ HỌC → ĐẠI SỐ → BÀI TOÁN THỰC TẾ</text><text x="600" y="286" text-anchor="middle" font-size="20" stroke="none">02. Số và phép tính → 03. Tỉ lệ → 10. Hàm số / 24. Mô hình hóa</text>
<text x="80" y="365" font-size="28" font-weight="700" stroke="none">1. Chuyên đề này học gì?</text>
<g fill="none" stroke-width="3"><rect x="75" y="400" width="245" height="210" rx="16"/><rect x="345" y="400" width="245" height="210" rx="16"/><rect x="615" y="400" width="245" height="210" rx="16"/><rect x="885" y="400" width="245" height="210" rx="16"/></g>
<g stroke="none" text-anchor="middle"><text x="198" y="448" font-size="24" font-weight="700">TỈ SỐ</text><text x="198" y="490" font-size="19">So sánh hai đại lượng</text><text x="198" y="526" font-size="19">Phần trăm</text><text x="198" y="562" font-size="19">Tỉ lệ bản đồ</text><text x="468" y="448" font-size="24" font-weight="700">TỈ LỆ THỨC</text><text x="468" y="490" font-size="20">a/b = c/d</text><text x="468" y="526" font-size="20">ad = bc</text><text x="468" y="562" font-size="19">Tìm số chưa biết</text><text x="738" y="448" font-size="24" font-weight="700">TỈ LỆ THUẬN</text><text x="738" y="492" font-size="22">y = kx</text><text x="738" y="530" font-size="19">y/x không đổi</text><text x="738" y="568" font-size="19">Cùng tăng / cùng giảm</text><text x="1008" y="448" font-size="24" font-weight="700">TỈ LỆ NGHỊCH</text><text x="1008" y="492" font-size="22">xy = a</text><text x="1008" y="530" font-size="19">Tích không đổi</text><text x="1008" y="568" font-size="19">Một tăng – một giảm</text></g>
<text x="80" y="685" font-size="28" font-weight="700" stroke="none">2. Nhận biết nhanh</text><rect x="80" y="720" width="1040" height="260" rx="18" fill="none" stroke-width="3"/><g stroke="none"><text x="120" y="775" font-size="23" font-weight="700">Tỉ lệ thuận</text><text x="120" y="815" font-size="20">• Gấp x lên m lần → y cũng gấp m lần</text><text x="120" y="855" font-size="20">• Kiểm tra y/x có không đổi không</text><text x="120" y="895" font-size="20">• Ví dụ: số lượng hàng ↔ số tiền (đơn giá cố định)</text><text x="620" y="775" font-size="23" font-weight="700">Tỉ lệ nghịch</text><text x="620" y="815" font-size="20">• Gấp x lên m lần → y giảm m lần</text><text x="620" y="855" font-size="20">• Kiểm tra x·y có không đổi không</text><text x="620" y="895" font-size="20">• Ví dụ: số người ↔ thời gian (cùng khối lượng việc)</text></g>
<text x="80" y="1055" font-size="28" font-weight="700" stroke="none">3. Học xong dùng để làm gì?</text><g fill="none" stroke-width="3"><rect x="80" y="1090" width="310" height="145" rx="16"/><rect x="445" y="1090" width="310" height="145" rx="16"/><rect x="810" y="1090" width="310" height="145" rx="16"/></g><g stroke="none" text-anchor="middle"><text x="235" y="1140" font-size="22" font-weight="700">CHIA THEO TỈ LỆ</text><text x="235" y="1180" font-size="18">Tỉ lệ 2 : 3 : 5</text><text x="600" y="1140" font-size="22" font-weight="700">CHUYỂN ĐỘNG – NĂNG SUẤT</text><text x="600" y="1180" font-size="18">Nhận dạng thuận / nghịch</text><text x="965" y="1140" font-size="22" font-weight="700">BẢN ĐỒ – PHẦN TRĂM</text><text x="965" y="1180" font-size="18">Đổi đơn vị trước khi tính</text></g>
<rect x="130" y="1305" width="940" height="90" rx="16" fill="none" stroke-width="3"/><text x="600" y="1345" text-anchor="middle" font-size="21" font-weight="700" stroke="none">MẸO: trước khi lập tỉ số giữa hai đại lượng cùng loại, luôn đưa về cùng đơn vị.</text><text x="600" y="1380" text-anchor="middle" font-size="19" stroke="none">Học bài → Luyện tập → Tự kiểm tra ≥ 80%</text></g></svg>