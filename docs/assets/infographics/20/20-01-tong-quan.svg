<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1414" viewBox="0 0 1000 1414"><title>Chuyên đề 20 - Hình học tổng hợp</title><desc>Tổng quan công cụ và mạch suy luận hình học tổng hợp.</desc><rect width="1000" height="1414" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#111"><text x="60" y="80" font-size="38" font-weight="700">CHUYÊN ĐỀ 20 · HÌNH HỌC TỔNG HỢP</text><text x="60" y="125" font-size="22">Nhận dạng cấu hình → chọn công cụ → tạo kết quả trung gian → kết luận</text><g stroke="#111" fill="none" stroke-width="2"><rect x="60" y="175" width="880" height="175" rx="18"/><rect x="60" y="385" width="420" height="220" rx="18"/><rect x="520" y="385" width="420" height="220" rx="18"/><rect x="60" y="640" width="420" height="220" rx="18"/><rect x="520" y="640" width="420" height="220" rx="18"/><rect x="60" y="895" width="880" height="200" rx="18"/><rect x="60" y="1130" width="880" height="210" rx="18"/></g><text x="90" y="220" font-size="26" font-weight="700">MẠCH TƯ DUY</text><text x="90" y="265" font-size="22">Giả thiết → đánh dấu góc / song song / vuông góc / trung điểm</text><text x="90" y="305" font-size="22">→ tìm cấu hình quen thuộc → tạo cầu nối → nối chuỗi suy luận</text><text x="90" y="430" font-size="25" font-weight="700">GÓC &amp; ĐƯỜNG THẲNG</text><text x="90" y="475" font-size="21">• Song song → góc bằng nhau</text><text x="90" y="515" font-size="21">• Vuông góc → góc 90°</text><text x="90" y="555" font-size="21">• Thales khi có song song</text><text x="550" y="430" font-size="25" font-weight="700">TAM GIÁC</text><text x="550" y="475" font-size="21">• Bằng nhau / đồng dạng</text><text x="550" y="515" font-size="21">• Đường đặc biệt</text><text x="550" y="555" font-size="21">• Tỉ số → hệ thức độ dài</text><text x="90" y="685" font-size="25" font-weight="700">ĐƯỜNG TRÒN</text><text x="90" y="730" font-size="21">• Nội tiếp → góc</text><text x="90" y="770" font-size="21">• Tiếp tuyến → vuông góc</text><text x="90" y="810" font-size="21">• Tích đoạn thẳng</text><text x="550" y="685" font-size="25" font-weight="700">TAM GIÁC VUÔNG</text><text x="550" y="730" font-size="21">• Pythagore</text><text x="550" y="770" font-size="21">• Hệ thức lượng</text><text x="550" y="810" font-size="21">• sin · cos · tan</text><text x="90" y="940" font-size="25" font-weight="700">CẦU NỐI QUAN TRỌNG</text><text x="90" y="985" font-size="21">Song song → góc bằng nhau → đồng dạng → tỉ số</text><text x="90" y="1025" font-size="21">Hai góc vuông → nội tiếp → góc nội tiếp → đồng dạng</text><text x="90" y="1065" font-size="21">Đồng dạng → tỉ số → hệ thức tích → độ dài</text><text x="90" y="1175" font-size="25" font-weight="700">NGUYÊN TẮC VÀNG</text><text x="90" y="1220" font-size="21">1. Không lao thẳng vào kết luận cuối.</text><text x="90" y="1260" font-size="21">2. Mỗi bước phải có lý do và tận dụng kết quả đã chứng minh.</text><text x="90" y="1300" font-size="21">3. Viết đúng thứ tự đỉnh khi dùng tam giác đồng dạng.</text></g></svg>