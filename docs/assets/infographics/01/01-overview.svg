<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Chuyên đề 01 – Bản đồ chương trình Toán THCS</title>
  <desc id="desc">Infographic tổng quan bốn mạch kiến thức Toán THCS, quan hệ học trước sau và chu trình học một chuyên đề.</desc>
  <rect width="1200" height="1500" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <text x="600" y="72" text-anchor="middle" font-size="42" font-weight="700">CHUYÊN ĐỀ 01</text>
    <text x="600" y="120" text-anchor="middle" font-size="34" font-weight="700">BẢN ĐỒ CHƯƠNG TRÌNH TOÁN THCS</text>
    <text x="600" y="158" text-anchor="middle" font-size="22">Nhìn toàn cảnh • Biết học gì trước • Biết đi đâu tiếp</text>

    <rect x="70" y="205" width="1060" height="90" rx="18" fill="none" stroke="#111111" stroke-width="3"/>
    <text x="600" y="244" text-anchor="middle" font-size="28" font-weight="700">TOÁN THCS</text>
    <text x="600" y="278" text-anchor="middle" font-size="20">25 chuyên đề • 4 mạch lớn • 1 lộ trình liên kết</text>

    <line x1="600" y1="295" x2="600" y2="350" stroke="#111111" stroke-width="3"/>
    <line x1="210" y1="350" x2="990" y2="350" stroke="#111111" stroke-width="3"/>
    <line x1="210" y1="350" x2="210" y2="395" stroke="#111111" stroke-width="3"/>
    <line x1="470" y1="350" x2="470" y2="395" stroke="#111111" stroke-width="3"/>
    <line x1="730" y1="350" x2="730" y2="395" stroke="#111111" stroke-width="3"/>
    <line x1="990" y1="350" x2="990" y2="395" stroke="#111111" stroke-width="3"/>

    <rect x="90" y="395" width="240" height="230" rx="18" fill="none" stroke="#111111" stroke-width="3"/>
    <text x="210" y="438" text-anchor="middle" font-size="24" font-weight="700">SỐ &amp; ĐẠI SỐ</text>
    <text x="210" y="474" text-anchor="middle" font-size="21">Topic 02–12</text>
    <text x="115" y="516" font-size="18">• Số, tỉ lệ</text>
    <text x="115" y="550" font-size="18">• Biểu thức</text>
    <text x="115" y="584" font-size="18">• PT, hệ, hàm số</text>
    <text x="115" y="618" font-size="18">• Căn, bậc hai</text>

    <rect x="350" y="395" width="240" height="230" rx="18" fill="none" stroke="#111111" stroke-width="3"/>
    <text x="470" y="438" text-anchor="middle" font-size="24" font-weight="700">HÌNH HỌC</text>
    <text x="470" y="474" text-anchor="middle" font-size="21">Topic 13–20</text>
    <text x="375" y="516" font-size="18">• Góc, tam giác</text>
    <text x="375" y="550" font-size="18">• Tứ giác</text>
    <text x="375" y="584" font-size="18">• Đồng dạng</text>
    <text x="375" y="618" font-size="18">• Lượng giác, tròn</text>

    <rect x="610" y="395" width="240" height="230" rx="18" fill="none" stroke="#111111" stroke-width="3"/>
    <text x="730" y="432" text-anchor="middle" font-size="22" font-weight="700">THỐNG KÊ</text>
    <text x="730" y="461" text-anchor="middle" font-size="22" font-weight="700">&amp; XÁC SUẤT</text>
    <text x="730" y="498" text-anchor="middle" font-size="21">Topic 21–23</text>
    <text x="635" y="540" font-size="18">• Dữ liệu</text>
    <text x="635" y="574" font-size="18">• Biểu đồ</text>
    <text x="635" y="608" font-size="18">• Đặc trưng, xác suất</text>

    <rect x="870" y="395" width="240" height="230" rx="18" fill="none" stroke="#111111" stroke-width="3"/>
    <text x="990" y="432" text-anchor="middle" font-size="22" font-weight="700">VẬN DỤNG</text>
    <text x="990" y="461" text-anchor="middle" font-size="22" font-weight="700">&amp; ÔN THI</text>
    <text x="990" y="498" text-anchor="middle" font-size="21">Topic 24–25</text>
    <text x="895" y="540" font-size="18">• Mô hình hóa</text>
    <text x="895" y="574" font-size="18">• Tổng hợp</text>
    <text x="895" y="608" font-size="18">• Chiến lược vào 10</text>

    <text x="600" y="690" text-anchor="middle" font-size="29" font-weight="700">MẠCH PHÁT TRIỂN KIẾN THỨC</text>
    <rect x="110" y="730" width="980" height="315" rx="18" fill="none" stroke="#111111" stroke-width="3"/>
    <text x="600" y="780" text-anchor="middle" font-size="22">Nền số học</text>
    <text x="600" y="820" text-anchor="middle" font-size="24">↓</text>
    <text x="600" y="858" text-anchor="middle" font-size="22">Biểu thức &amp; biến đổi đại số → Phương trình • Hệ • Hàm số</text>
    <text x="600" y="898" text-anchor="middle" font-size="24">↓</text>
    <text x="600" y="936" text-anchor="middle" font-size="22">Hình học nền → Đồng dạng • Lượng giác • Đường tròn</text>
    <text x="600" y="976" text-anchor="middle" font-size="24">↓</text>
    <text x="600" y="1014" text-anchor="middle" font-size="22">Thống kê • Xác suất → Mô hình hóa → Tổng hợp ôn thi</text>

    <text x="600" y="1115" text-anchor="middle" font-size="29" font-weight="700">CÁCH HỌC MỘT CHUYÊN ĐỀ</text>

    <rect x="80" y="1160" width="200" height="95" rx="16" fill="none" stroke="#111111" stroke-width="3"/>
    <text x="180" y="1200" text-anchor="middle" font-size="22" font-weight="700">1. HỌC BÀI</text>
    <text x="180" y="1232" text-anchor="middle" font-size="17">Hiểu ý chính</text>

    <text x="310" y="1217" font-size="30">→</text>
    <rect x="350" y="1160" width="200" height="95" rx="16" fill="none" stroke="#111111" stroke-width="3"/>
    <text x="450" y="1200" text-anchor="middle" font-size="22" font-weight="700">2. LUYỆN TẬP</text>
    <text x="450" y="1232" text-anchor="middle" font-size="17">Mức 1 → 4</text>

    <text x="580" y="1217" font-size="30">→</text>
    <rect x="620" y="1160" width="200" height="95" rx="16" fill="none" stroke="#111111" stroke-width="3"/>
    <text x="720" y="1200" text-anchor="middle" font-size="22" font-weight="700">3. TỰ KIỂM TRA</text>
    <text x="720" y="1232" text-anchor="middle" font-size="17">Không xem lời giải</text>

    <text x="850" y="1217" font-size="30">→</text>
    <rect x="890" y="1160" width="230" height="95" rx="16" fill="none" stroke="#111111" stroke-width="3"/>
    <text x="1005" y="1200" text-anchor="middle" font-size="22" font-weight="700">4. QUYẾT ĐỊNH</text>
    <text x="1005" y="1232" text-anchor="middle" font-size="17">Đạt ≥ 80% → đi tiếp</text>

    <path d="M1005 1255 C1005 1330 450 1345 450 1280" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="10 8"/>
    <polygon points="442,1285 458,1285 450,1270" fill="#111111"/>
    <text x="760" y="1360" text-anchor="middle" font-size="20" font-weight="700">Chưa đạt → tìm lỗ hổng → quay lại đúng chuyên đề nền</text>

    <rect x="130" y="1400" width="940" height="55" rx="14" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="600" y="1435" text-anchor="middle" font-size="20" font-weight="700">MỤC TIÊU: không học 25 bài rời rạc — học một hệ thống có liên kết.</text>
  </g>
</svg>