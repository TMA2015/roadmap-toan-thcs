<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760"><style>.t{font:700 42px Arial;fill:#111}.h{font:700 28px Arial;fill:#111}.b{font:22px Arial;fill:#111}.s{fill:#fff;stroke:#111;stroke-width:2}.l{stroke:#111;stroke-width:2;fill:none}</style><rect width="1200" height="760" fill="#fff"/><text x="600" y="60" text-anchor="middle" class="t">07. PHÂN THỨC ĐẠI SỐ — TỔNG QUAN</text><rect x="50" y="100" width="1100" height="560" rx="16" class="s"/><text x="90" y="150" class="h">Mạch học chính</text><rect x="90" y="190" width="190" height="90" rx="12" class="s"/><text x="185" y="225" text-anchor="middle" class="h">1. ĐKXĐ</text><text x="185" y="257" text-anchor="middle" class="b">Mẫu ≠ 0</text><rect x="330" y="190" width="190" height="90" rx="12" class="s"/><text x="425" y="225" text-anchor="middle" class="h">2. Rút gọn</text><text x="425" y="257" text-anchor="middle" class="b">Phân tích nhân tử</text><rect x="570" y="190" width="190" height="90" rx="12" class="s"/><text x="665" y="225" text-anchor="middle" class="h">3. Quy đồng</text><text x="665" y="257" text-anchor="middle" class="b">Chọn MTC</text><rect x="810" y="190" width="250" height="90" rx="12" class="s"/><text x="935" y="225" text-anchor="middle" class="h">4. Phép tính</text><text x="935" y="257" text-anchor="middle" class="b">+, −, ×, :</text><path d="M280 235H330M520 235H570M760 235H810" class="l"/><text x="90" y="340" class="h">Tư duy cốt lõi</text><text x="110" y="385" class="b">• Điều kiện xác định phải được giữ từ đầu đến cuối.</text><text x="110" y="425" class="b">• Chỉ rút gọn nhân tử chung, không rút qua dấu cộng/trừ.</text><text x="110" y="465" class="b">• Phân tích mẫu trước khi quy đồng để chọn mẫu thức chung gọn.</text><text x="110" y="505" class="b">• Khi chia, nhân với nghịch đảo và kiểm tra số chia khác 0.</text><text x="90" y="570" class="h">Liên kết Roadmap</text><text x="110" y="615" class="b">06. Phân tích đa thức → 07. Phân thức đại số → 08. Phương trình & bất phương trình</text><text x="600" y="715" text-anchor="middle" class="b">Học bài → Luyện tập → Tự kiểm tra → Đạt ≥ 80%</text></svg>